[tool:pytest]
# Pytest configuration for csv_to_mongo test suite

# Test discovery
testpaths = .
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    --verbose
    --tb=short
    --strict-markers
    --strict-config
    --disable-warnings

# Custom markers for test categorization
markers =
    basic: Basic functionality tests
    comprehensive: Comprehensive parametrized tests using all test cases
    edge_cases: Edge case and boundary condition tests
    performance: Performance and batch processing tests
    unicode: Unicode and special character handling tests
    numeric: Numeric data type and format tests
    dates: Date parsing and format tests
    slow: Tests that take longer to run

# Minimum version requirements
minversion = 6.0

# Collect ignore patterns
collect_ignore = [
    "setup.py",
]

# Test timeout (in seconds)
timeout = 300

# Coverage options (if pytest-cov is installed)
# addopts = --cov=csv_to_mongo --cov-report=html --cov-report=term-missing
