[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bdge-csv-utils"
version = "0.2526.0"
description = "Support scripts to use schemas with CSV files and Databases"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["bdge_csv_utils*"]

[tool.pytest.ini_options]
pythonpath = ["."]
