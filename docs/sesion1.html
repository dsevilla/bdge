<h1 id="exploraci%C3%B3n-de-datos-en-stack-exchange-data-explorer">Exploración de datos en Stack Exchange Data Explorer</h1>
<p><img src="img/stackoverflow.png" alt="" style="height:460px;" /></p>
<footer>BDGE · Sesión 1 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-footer="BDGE · Sesión 1 · Curso 2026/2027" data-lang="es" data-theme="qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9" lang="es" data-marpit-pagination="30" style="--paginate:true;--footer:BDGE · Sesión 1 · Curso 2026/2027;--lang:es;--theme:qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9;" data-marpit-pagination-total="66" data-size="16:9">
<h1 id="esquema-de-stack-overflow">Esquema de Stack Overflow</h1>
<ul>
<li><strong>Posts</strong>: preguntas y respuestas; <code>PostTypeId</code> distingue ambos tipos y <code>ParentId</code> enlaza una respuesta con su pregunta</li>
<li><strong>Users</strong>: usuarios y reputación</li>
<li><strong>Comments</strong> y <strong>Votes</strong>: actividad relacionada con un <em>post</em> y, cuando procede, un usuario</li>
<li><strong>Tags</strong> y <strong>PostTags</strong>: relación muchos-a-muchos entre preguntas y etiquetas</li>
<li>En algunas instantáneas existe además una columna de etiquetas textual por motivos de rendimiento: es un ejemplo de desnormalización</li>
</ul>
<footer>BDGE · Sesión 1 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-footer="BDGE · Sesión 1 · Curso 2026/2027" data-class="figure-only" data-lang="es" data-theme="qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9" lang="es" class="figure-only" data-marpit-pagination="31" style="--paginate:true;--footer:BDGE · Sesión 1 · Curso 2026/2027;--class:figure-only;--lang:es;--theme:qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9;" data-marpit-pagination-total="66" data-size="16:9">
<h1 id="diagrama-del-esquema">Diagrama del esquema</h1>
<p><img src="img/stackoverflow_diagram.png" alt="" style="height:500px;" /></p>
<footer>BDGE · Sesión 1 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-footer="BDGE · Sesión 1 · Curso 2026/2027" data-class="figure-only long-title" data-lang="es" data-theme="qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9" lang="es" class="figure-only long-title" data-marpit-pagination="32" style="--paginate:true;--footer:BDGE · Sesión 1 · Curso 2026/2027;--class:figure-only long-title;--lang:es;--theme:qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9;" data-marpit-pagination-total="66" data-size="16:9">
<h1 id="el-esquema-completo-de-stack-exchange">El esquema completo de Stack Exchange</h1>
<p>SEDE incluye muchas más tablas que las cinco que usaremos en prácticas. Fuente: <a href="https://meta.stackexchange.com/a/326361">«The Schema Visualized»</a>.</p>
<p><a href="img/stackexchange-sede-erd.png"><img src="img/stackexchange-sede-erd.png" alt="" style="height:400px;" /></a></p>
<footer>BDGE · Sesión 1 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-footer="BDGE · Sesión 1 · Curso 2026/2027" data-class="figure-only long-title" data-lang="es" data-theme="qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9" lang="es" class="figure-only long-title" data-marpit-pagination="33" style="--paginate:true;--footer:BDGE · Sesión 1 · Curso 2026/2027;--class:figure-only long-title;--lang:es;--theme:qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9;" data-marpit-pagination-total="66" data-size="16:9">
<h1 id="el-subconjunto-que-usaremos-en-pr%C3%A1cticas">El subconjunto que usaremos en prácticas</h1>
<p>Las cinco tablas publicadas, con sus claves ajenas reales.</p>
<p><img src="img/stackoverflow-er.png" alt="" style="height:420px;" /></p>
<footer>BDGE · Sesión 1 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-footer="BDGE · Sesión 1 · Curso 2026/2027" data-class="compact" data-lang="es" data-theme="qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9" lang="es" class="compact" data-marpit-pagination="34" style="--paginate:true;--footer:BDGE · Sesión 1 · Curso 2026/2027;--class:compact;--lang:es;--theme:qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9;" data-marpit-pagination-total="66" data-size="16:9">
<h1 id="lo-que-el-diagrama-no-dice">Lo que el diagrama no dice</h1>
<ul>
<li><code>Posts</code> se referencia a sí misma dos veces: <code>ParentId</code> enlaza una respuesta con su pregunta y <code>AcceptedAnswerId</code> la pregunta con su respuesta aceptada. Aparecen como claves ajenas, pero no se dibujan para no enredar el diagrama</li>
<li>Casi todas las claves ajenas son <strong>opcionales</strong>: un <em>post</em> puede no tener usuario propietario porque la cuenta se borró, y un voto puede ser anónimo</li>
<li><strong>Que una clave ajena esté declarada no significa que se cumpla</strong>: este <em>dump</em> contiene votos y comentarios que apuntan a publicaciones ya borradas. Habrá que decidir explícitamente qué hacer con ellos antes de activar las restricciones</li>
<li>El diagrama no está dibujado a mano: se genera a partir de los metadatos del propio esquema Parquet, los mismos que en la sesión 0 generaban el <code>CREATE TABLE</code></li>
</ul>
<footer>BDGE · Sesión 1 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-footer="BDGE · Sesión 1 · Curso 2026/2027" data-lang="es" data-theme="qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9" lang="es" data-marpit-pagination="35" style="--paginate:true;--footer:BDGE · Sesión 1 · Curso 2026/2027;--lang:es;--theme:qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9;" data-marpit-pagination-total="66" data-size="16:9">
<h1 id="select-forma-general"><code>SELECT</code>: forma general</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> lista_de_columnas
<span class="hljs-keyword">FROM</span> lista_de_tablas
<span class="hljs-keyword">WHERE</span> condicion;
</code></pre>
<p>Primero se seleccionan las filas que cumplen la condición y después se proyectan las columnas solicitadas.</p>
<footer>BDGE · Sesión 1 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-footer="BDGE · Sesión 1 · Curso 2026/2027" data-lang="es" data-theme="qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9" lang="es" data-marpit-pagination="36" style="--paginate:true;--footer:BDGE · Sesión 1 · Curso 2026/2027;--lang:es;--theme:qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9;" data-marpit-pagination-total="66" data-size="16:9">
<h1 id="elegir-columnas">Elegir columnas</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> <span class="hljs-operator">*</span> <span class="hljs-keyword">FROM</span> Tags;

<span class="hljs-keyword">SELECT</span> Id, Title <span class="hljs-keyword">FROM</span> Posts;
</code></pre>
<ul>
<li><code>*</code> es útil para explorar, pero en consultas reales conviene pedir solo las columnas necesarias</li>
<li>Las comillas de identificadores no son portables: evitamos depender de ellas usando nombres sencillos y sin palabras reservadas</li>
</ul>
<footer>BDGE · Sesión 1 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-footer="BDGE · Sesión 1 · Curso 2026/2027" data-lang="es" data-theme="qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9" lang="es" data-marpit-pagination="37" style="--paginate:true;--footer:BDGE · Sesión 1 · Curso 2026/2027;--lang:es;--theme:qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9;" data-marpit-pagination-total="66" data-size="16:9">
<h1 id="distinct-alias-y-limit"><code>DISTINCT</code>, alias y <code>LIMIT</code></h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> <span class="hljs-keyword">DISTINCT</span> PostTypeId <span class="hljs-keyword">FROM</span> Posts;

<span class="hljs-keyword">SELECT</span> DisplayName <span class="hljs-keyword">AS</span> nombre <span class="hljs-keyword">FROM</span> Users;

<span class="hljs-keyword">SELECT</span> DisplayName <span class="hljs-keyword">FROM</span> Users LIMIT <span class="hljs-number">2</span>;
</code></pre>
<ul>
<li><code>DISTINCT</code> elimina duplicados del resultado</li>
<li><code>AS</code> nombra columnas o expresiones</li>
<li><code>LIMIT</code> facilita la exploración; no sustituye a un orden explícito</li>
</ul>
<footer>BDGE · Sesión 1 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-footer="BDGE · Sesión 1 · Curso 2026/2027" data-lang="es" data-theme="qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9" lang="es" data-marpit-pagination="38" style="--paginate:true;--footer:BDGE · Sesión 1 · Curso 2026/2027;--lang:es;--theme:qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9;" data-marpit-pagination-total="66" data-size="16:9">
<h1 id="ordenar-resultados">Ordenar resultados</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> Id, DisplayName, Reputation
<span class="hljs-keyword">FROM</span> Users
<span class="hljs-keyword">ORDER</span> <span class="hljs-keyword">BY</span> Reputation <span class="hljs-keyword">DESC</span>, Id <span class="hljs-keyword">ASC</span>;
</code></pre>
<p>Sin <code>ORDER BY</code>, SQL <strong>no garantiza</strong> ningún orden de salida.</p>
<footer>BDGE · Sesión 1 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-footer="BDGE · Sesión 1 · Curso 2026/2027" data-lang="es" data-theme="qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9" lang="es" data-marpit-pagination="39" style="--paginate:true;--footer:BDGE · Sesión 1 · Curso 2026/2027;--lang:es;--theme:qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9;" data-marpit-pagination-total="66" data-size="16:9">
<h1 id="selecci%C3%B3n-y-proyecci%C3%B3n">Selección y proyección</h1>
<table>
<thead>
<tr>
<th>Álgebra relacional</th>
<th>SQL</th>
</tr>
</thead>
<tbody>
<tr>
<td>Selección de filas: <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>σ</mi><mi>c</mi></msub><mo stretchy="false">(</mo><mi>R</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\sigma_c(R)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0359em;">σ</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.1514em;"><span style="top:-2.55em;margin-left:-0.0359em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">c</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mopen">(</span><span class="mord mathnormal" style="margin-right:0.0077em;">R</span><span class="mclose">)</span></span></span></span></td>
<td><code>SELECT * FROM R WHERE c</code></td>
</tr>
<tr>
<td>Proyección de columnas: <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi mathvariant="normal">Π</mi><mrow><mi>a</mi><mo separator="true">,</mo><mi>b</mi></mrow></msub><mo stretchy="false">(</mo><mi>R</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\Pi_{a,b}(R)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1.0361em;vertical-align:-0.2861em;"></span><span class="mord"><span class="mord">Π</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3361em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight">a</span><span class="mpunct mtight">,</span><span class="mord mathnormal mtight">b</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.2861em;"><span></span></span></span></span></span></span><span class="mopen">(</span><span class="mord mathnormal" style="margin-right:0.0077em;">R</span><span class="mclose">)</span></span></span></span></td>
<td><code>SELECT a, b FROM R</code></td>
</tr>
</tbody>
</table>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> Id, DisplayName
<span class="hljs-keyword">FROM</span> Users
<span class="hljs-keyword">WHERE</span> Reputation <span class="hljs-operator">&gt;</span> <span class="hljs-number">100</span>;
</code></pre>
<p>El optimizador puede adelantar proyecciones, pero debe conservar las columnas necesarias para evaluar los filtros y las uniones.</p>
<footer>BDGE · Sesión 1 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-footer="BDGE · Sesión 1 · Curso 2026/2027" data-lang="es" data-theme="qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9" lang="es" data-marpit-pagination="40" style="--paginate:true;--footer:BDGE · Sesión 1 · Curso 2026/2027;--lang:es;--theme:qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9;" data-marpit-pagination-total="66" data-size="16:9">
<h1 id="filtrar-con-where">Filtrar con <code>WHERE</code></h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> Id, DisplayName, Reputation
<span class="hljs-keyword">FROM</span> Users
<span class="hljs-keyword">WHERE</span> DisplayName <span class="hljs-operator">=</span> <span class="hljs-string">&#x27;Elenasys&#x27;</span>;
</code></pre>
<table>
<thead>
<tr>
<th>Operador</th>
<th>Uso</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>=</code>, <code>&lt;&gt;</code>, <code>&lt;</code>, <code>&gt;=</code></td>
<td>Comparaciones</td>
</tr>
<tr>
<td><code>BETWEEN ... AND ...</code></td>
<td>Rango inclusivo</td>
</tr>
<tr>
<td><code>IN (...)</code></td>
<td>Pertenencia a una lista</td>
</tr>
<tr>
<td><code>LIKE</code></td>
<td>Patrón de texto</td>
</tr>
<tr>
<td><code>NOT</code>, <code>AND</code>, <code>OR</code></td>
<td>Composición lógica</td>
</tr>
</tbody>
</table>
<footer>BDGE · Sesión 1 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-footer="BDGE · Sesión 1 · Curso 2026/2027" data-lang="es" data-theme="qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9" lang="es" data-marpit-pagination="41" style="--paginate:true;--footer:BDGE · Sesión 1 · Curso 2026/2027;--lang:es;--theme:qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9;" data-marpit-pagination-total="66" data-size="16:9">
<h1 id="patrones-y-condiciones-compuestas">Patrones y condiciones compuestas</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> DisplayName
<span class="hljs-keyword">FROM</span> Users
<span class="hljs-keyword">WHERE</span> Reputation <span class="hljs-operator">&gt;</span> <span class="hljs-number">100</span>
  <span class="hljs-keyword">AND</span> Location <span class="hljs-keyword">LIKE</span> <span class="hljs-string">&#x27;%Spain%&#x27;</span>;
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> DisplayName
<span class="hljs-keyword">FROM</span> Users
<span class="hljs-keyword">WHERE</span> DisplayName <span class="hljs-keyword">LIKE</span> <span class="hljs-string">&#x27;%sys%&#x27;</span>;
</code></pre>
<p><code>AND</code> tiene mayor prioridad que <code>OR</code>; usar paréntesis hace la intención inequívoca.</p>
<footer>BDGE · Sesión 1 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-footer="BDGE · Sesión 1 · Curso 2026/2027" data-lang="es" data-theme="qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9" lang="es" data-marpit-pagination="42" style="--paginate:true;--footer:BDGE · Sesión 1 · Curso 2026/2027;--lang:es;--theme:qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9;" data-marpit-pagination-total="66" data-size="16:9">
<h1 id="expresiones-y-alias">Expresiones y alias</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> DisplayName,
       UpVotes <span class="hljs-operator">+</span> DownVotes <span class="hljs-keyword">AS</span> votos_totales
<span class="hljs-keyword">FROM</span> Users
<span class="hljs-keyword">WHERE</span> UpVotes <span class="hljs-operator">+</span> DownVotes <span class="hljs-operator">&gt;</span> <span class="hljs-number">10</span>;
</code></pre>
<p>El alias de <code>SELECT</code> no se puede usar de forma portable en <code>WHERE</code>: en esta fase de la consulta todavía no existe. Para reutilizarlo, se usa una subconsulta, una CTE o se repite la expresión.</p>
<footer>BDGE · Sesión 1 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-footer="BDGE · Sesión 1 · Curso 2026/2027" data-lang="es" data-theme="qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9" lang="es" data-marpit-pagination="43" style="--paginate:true;--footer:BDGE · Sesión 1 · Curso 2026/2027;--lang:es;--theme:qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9;" data-marpit-pagination-total="66" data-size="16:9">
<h1 id="null-no-es-un-valor-ordinario"><code>NULL</code> no es un valor ordinario</h1>
<ul>
<li><code>NULL</code> significa desconocido, ausente o no aplicable; no equivale a <code>0</code> ni a una cadena vacía</li>
<li><code>col = NULL</code> no encuentra filas: se usa <code>col IS NULL</code> o <code>col IS NOT NULL</code></li>
<li>Las comparaciones con <code>NULL</code> producen «desconocido», que <code>WHERE</code> no conserva</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> Id, ParentId
<span class="hljs-keyword">FROM</span> Posts
<span class="hljs-keyword">WHERE</span> ParentId <span class="hljs-keyword">IS</span> <span class="hljs-keyword">NULL</span>;
</code></pre>
<footer>BDGE · Sesión 1 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-footer="BDGE · Sesión 1 · Curso 2026/2027" data-lang="es" data-theme="qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9" lang="es" data-marpit-pagination="44" style="--paginate:true;--footer:BDGE · Sesión 1 · Curso 2026/2027;--lang:es;--theme:qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9;" data-marpit-pagination-total="66" data-size="16:9">
<h1 id="funciones-de-agregaci%C3%B3n">Funciones de agregación</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> <span class="hljs-built_in">AVG</span>(Score) <span class="hljs-keyword">AS</span> puntuacion_media,
       <span class="hljs-built_in">MAX</span>(Score) <span class="hljs-keyword">AS</span> puntuacion_maxima,
       <span class="hljs-built_in">COUNT</span>(<span class="hljs-operator">*</span>) <span class="hljs-keyword">AS</span> numero_posts
<span class="hljs-keyword">FROM</span> Posts;
</code></pre>
<ul>
<li><code>COUNT(*)</code> cuenta filas; <code>COUNT(columna)</code> solo cuenta valores no nulos</li>
<li><code>AVG</code>, <code>SUM</code>, <code>MIN</code> y <code>MAX</code> ignoran los valores nulos</li>
<li><code>COUNT(DISTINCT OwnerUserId)</code> cuenta valores distintos no nulos</li>
</ul>
<footer>BDGE · Sesión 1 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-footer="BDGE · Sesión 1 · Curso 2026/2027" data-lang="es" data-theme="qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9" lang="es" data-marpit-pagination="45" style="--paginate:true;--footer:BDGE · Sesión 1 · Curso 2026/2027;--lang:es;--theme:qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9;" data-marpit-pagination-total="66" data-size="16:9">
<h1 id="funciones-n%C3%BAcleo-y-dialectos">Funciones: núcleo y dialectos</h1>
<table>
<thead>
<tr>
<th>Familia</th>
<th>Ejemplos portables o frecuentes</th>
</tr>
</thead>
<tbody>
<tr>
<td>Numéricas</td>
<td><code>ABS</code>, <code>CEIL</code>, <code>POWER</code>, <code>SQRT</code></td>
</tr>
<tr>
<td>Cadenas</td>
<td><code>LOWER</code>, <code>UPPER</code>, <code>TRIM</code>, <code>SUBSTR</code>, <code>REPLACE</code></td>
</tr>
<tr>
<td>Control de nulos</td>
<td><code>COALESCE</code>, <code>NULLIF</code></td>
</tr>
<tr>
<td>Condicionales</td>
<td><code>CASE WHEN ... THEN ... ELSE ... END</code></td>
</tr>
<tr>
<td>Tipos</td>
<td><code>CAST(expr AS tipo)</code></td>
</tr>
</tbody>
</table>
<p><code>CONCAT</code>, funciones de desviación típica, aleatoriedad y fechas presentan diferencias entre motores; el notebook especifica las variantes necesarias.</p>
<footer>BDGE · Sesión 1 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-footer="BDGE · Sesión 1 · Curso 2026/2027" data-lang="es" data-theme="qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9" lang="es" data-marpit-pagination="46" style="--paginate:true;--footer:BDGE · Sesión 1 · Curso 2026/2027;--lang:es;--theme:qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9;" data-marpit-pagination-total="66" data-size="16:9">
<h1 id="case-y-coalesce"><code>CASE</code> y <code>COALESCE</code></h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> DisplayName,
       <span class="hljs-keyword">CASE</span>
         <span class="hljs-keyword">WHEN</span> Reputation <span class="hljs-operator">&gt;</span> <span class="hljs-number">100</span> <span class="hljs-keyword">THEN</span> <span class="hljs-string">&#x27;Veterano&#x27;</span>
         <span class="hljs-keyword">ELSE</span> <span class="hljs-string">&#x27;Rookie&#x27;</span>
       <span class="hljs-keyword">END</span> <span class="hljs-keyword">AS</span> tipo,
       <span class="hljs-built_in">COALESCE</span>(UpVotes, <span class="hljs-number">0</span>) <span class="hljs-keyword">AS</span> votos_positivos
<span class="hljs-keyword">FROM</span> Users;
</code></pre>
<p><code>COALESCE(a, b, ...)</code> devuelve el primer argumento que no es nulo.</p>
<footer>BDGE · Sesión 1 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-footer="BDGE · Sesión 1 · Curso 2026/2027" data-lang="es" data-theme="qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9" lang="es" data-marpit-pagination="47" style="--paginate:true;--footer:BDGE · Sesión 1 · Curso 2026/2027;--lang:es;--theme:qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9;" data-marpit-pagination-total="66" data-size="16:9">
<h1 id="fechas-filtrar-sin-perder-el-%C3%ADndice">Fechas: filtrar sin perder el índice</h1>
<p>Evitar, cuando se busca rendimiento:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">WHERE</span> <span class="hljs-keyword">YEAR</span>(CreationDate) <span class="hljs-operator">=</span> <span class="hljs-number">2025</span>
</code></pre>
<p>Preferir un rango semicerrado:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">WHERE</span> CreationDate <span class="hljs-operator">&gt;=</span> <span class="hljs-string">&#x27;2025-01-01&#x27;</span>
  <span class="hljs-keyword">AND</span> CreationDate <span class="hljs-operator">&lt;</span>  <span class="hljs-string">&#x27;2026-01-01&#x27;</span>
</code></pre>
<p>Las funciones y literales de fechas dependen del motor; el principio de no envolver la columna del filtro es general.</p>
<footer>BDGE · Sesión 1 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-paginate="true" data-footer="BDGE · Sesión 1 · Curso 2026/2027" data-class="section-divider" data-lang="es" data-theme="qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9" lang="es" class="section-divider" data-marpit-pagination="48" style="--paginate:true;--footer:BDGE · Sesión 1 · Curso 2026/2027;--class:section-divider;--lang:es;--theme:qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9;" data-marpit-pagination-total="66" data-size="16:9">
<h1 id="consultar-varias-tablas">Consultar varias tablas</h1>
<p>Producto cartesiano, <code>JOIN</code>, agrupación y subconsultas.</p>
<footer>BDGE · Sesión 1 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-footer="BDGE · Sesión 1 · Curso 2026/2027" data-lang="es" data-theme="qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9" lang="es" data-marpit-pagination="49" style="--paginate:true;--footer:BDGE · Sesión 1 · Curso 2026/2027;--lang:es;--theme:qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9;" data-marpit-pagination-total="66" data-size="16:9">
<h1 id="producto-cartesiano-y-equi-join">Producto cartesiano y equi-join</h1>
<p>El producto cartesiano combina cada fila de <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>R</mi><mn>1</mn></msub></mrow><annotation encoding="application/x-tex">R_1</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0077em;">R</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.0077em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">1</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span> con cada fila de <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>R</mi><mn>2</mn></msub></mrow><annotation encoding="application/x-tex">R_2</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0077em;">R</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.0077em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span>. Rara vez es el resultado final deseado.</p>
<p><span is="marp-span" data-auto-scaling="downscale-only" class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>R</mi><mn>1</mn></msub><msub><mo>⋈</mo><mrow><mtext>Uid_r</mtext><mo>=</mo><mtext>Uid</mtext></mrow></msub><msub><mi>R</mi><mn>2</mn></msub><mo>=</mo><msub><mi>σ</mi><mrow><mtext>Uid_r</mtext><mo>=</mo><mtext>Uid</mtext></mrow></msub><mo stretchy="false">(</mo><msub><mi>R</mi><mn>1</mn></msub><mo>×</mo><msub><mi>R</mi><mn>2</mn></msub><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">R_1 \bowtie_{\text{Uid\_r}=\text{Uid}} R_2 = \sigma_{\text{Uid\_r}=\text{Uid}}(R_1 \times R_2)
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1.0503em;vertical-align:-0.367em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0077em;">R</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.0077em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">1</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel"><span class="mrel">⋈</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3361em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord text mtight"><span class="mord mtight">Uid_r</span></span><span class="mrel mtight">=</span><span class="mord text mtight"><span class="mord mtight">Uid</span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.367em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0077em;">R</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.0077em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1.117em;vertical-align:-0.367em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0359em;">σ</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3361em;"><span style="top:-2.55em;margin-left:-0.0359em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord text mtight"><span class="mord mtight">Uid_r</span></span><span class="mrel mtight">=</span><span class="mord text mtight"><span class="mord mtight">Uid</span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.367em;"><span></span></span></span></span></span></span><span class="mopen">(</span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0077em;">R</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.0077em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">1</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0077em;">R</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.0077em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mclose">)</span></span></span></span></span></p><p>Un <strong>equi-join</strong> conserva las combinaciones cuyas claves relacionadas coinciden.</p>
<footer>BDGE · Sesión 1 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-paginate="true" data-footer="BDGE · Sesión 1 · Curso 2026/2027" data-lang="es" data-theme="qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9" lang="es" data-marpit-pagination="50" style="--paginate:true;--footer:BDGE · Sesión 1 · Curso 2026/2027;--lang:es;--theme:qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9;" data-marpit-pagination-total="66" data-size="16:9">
<h1 id="join-expl%C3%ADcito"><code>JOIN</code> explícito</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> c.Id, p.Title
<span class="hljs-keyword">FROM</span> Comments <span class="hljs-keyword">AS</span> c
<span class="hljs-keyword">JOIN</span> Posts <span class="hljs-keyword">AS</span> p <span class="hljs-keyword">ON</span> p.Id <span class="hljs-operator">=</span> c.PostId
<span class="hljs-keyword">WHERE</span> p.Score <span class="hljs-operator">&gt;</span> <span class="hljs-number">10</span>;
</code></pre>
<ul>
<li>El <code>JOIN ... ON</code> hace visible la condición de unión</li>
<li>Evitamos la sintaxis antigua con tablas separadas por comas: es más fácil olvidar una condición y crear un producto cartesiano accidental</li>
</ul>
<footer>BDGE · Sesión 1 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-paginate="true" data-footer="BDGE · Sesión 1 · Curso 2026/2027" data-lang="es" data-theme="qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9" lang="es" data-marpit-pagination="51" style="--paginate:true;--footer:BDGE · Sesión 1 · Curso 2026/2027;--lang:es;--theme:qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9;" data-marpit-pagination-total="66" data-size="16:9">
<h1 id="using-cuando-la-columna-se-llama-igual"><code>USING</code>: cuando la columna se llama igual</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> PostId, c.UserId, v.VoteTypeId
<span class="hljs-keyword">FROM</span> Comments <span class="hljs-keyword">AS</span> c
<span class="hljs-keyword">JOIN</span> Votes <span class="hljs-keyword">AS</span> v <span class="hljs-keyword">USING</span> (PostId);
</code></pre>
<ul>
<li><code>USING (col)</code> abrevia <code>ON a.col = b.col</code>, y sólo vale si la columna <strong>se llama igual</strong> en las dos tablas</li>
<li>La columna aparece <strong>una vez</strong> en el resultado y se cita sin cualificar; con <code>ON</code> saldría dos veces y <code>SELECT PostId</code> sería ambiguo</li>
<li>Si los nombres difieren, como <code>Posts.Id</code> frente a <code>Comments.PostId</code>, hay que seguir usando <code>ON</code></li>
</ul>
<blockquote>
<p>Es la misma reunión, escrita sin repetir el nombre de la clave</p>
</blockquote>
<footer>BDGE · Sesión 1 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-paginate="true" data-footer="BDGE · Sesión 1 · Curso 2026/2027" data-lang="es" data-theme="qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9" lang="es" data-marpit-pagination="52" style="--paginate:true;--footer:BDGE · Sesión 1 · Curso 2026/2027;--lang:es;--theme:qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9;" data-marpit-pagination-total="66" data-size="16:9">
<h1 id="preguntas-y-quien-las-hizo">Preguntas y quien las hizo</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> u.DisplayName, p.Title
<span class="hljs-keyword">FROM</span> Posts <span class="hljs-keyword">AS</span> p
<span class="hljs-keyword">JOIN</span> Users <span class="hljs-keyword">AS</span> u <span class="hljs-keyword">ON</span> u.Id <span class="hljs-operator">=</span> p.OwnerUserId
<span class="hljs-keyword">WHERE</span> p.PostTypeId <span class="hljs-operator">=</span> <span class="hljs-number">1</span>;
</code></pre>
<p>La misma idea se reutiliza para enlazar comentarios, votos, etiquetas y el historial con los <em>posts</em>.</p>
<footer>BDGE · Sesión 1 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-paginate="true" data-footer="BDGE · Sesión 1 · Curso 2026/2027" data-lang="es" data-theme="qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9" lang="es" data-marpit-pagination="53" style="--paginate:true;--footer:BDGE · Sesión 1 · Curso 2026/2027;--lang:es;--theme:qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9;" data-marpit-pagination-total="66" data-size="16:9">
<h1 id="left-join-conservar-filas-sin-coincidencia"><code>LEFT JOIN</code>: conservar filas sin coincidencia</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> p.Id, <span class="hljs-built_in">COUNT</span>(a.Id) <span class="hljs-keyword">AS</span> respuestas
<span class="hljs-keyword">FROM</span> Posts <span class="hljs-keyword">AS</span> p
<span class="hljs-keyword">LEFT</span> <span class="hljs-keyword">JOIN</span> Posts <span class="hljs-keyword">AS</span> a
  <span class="hljs-keyword">ON</span> a.ParentId <span class="hljs-operator">=</span> p.Id
 <span class="hljs-keyword">AND</span> a.PostTypeId <span class="hljs-operator">=</span> <span class="hljs-number">2</span>
<span class="hljs-keyword">WHERE</span> p.PostTypeId <span class="hljs-operator">=</span> <span class="hljs-number">1</span>
<span class="hljs-keyword">GROUP</span> <span class="hljs-keyword">BY</span> p.Id;
</code></pre>
<p>Las preguntas sin respuestas siguen apareciendo, con <code>0</code> respuestas. Con un <code>JOIN</code> normal desaparecerían.</p>
<footer>BDGE · Sesión 1 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-paginate="true" data-footer="BDGE · Sesión 1 · Curso 2026/2027" data-lang="es" data-theme="qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9" lang="es" data-marpit-pagination="54" style="--paginate:true;--footer:BDGE · Sesión 1 · Curso 2026/2027;--lang:es;--theme:qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9;" data-marpit-pagination-total="66" data-size="16:9">
<h1 id="group-by-y-having"><code>GROUP BY</code> y <code>HAVING</code></h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> OwnerUserId, PostTypeId, <span class="hljs-built_in">COUNT</span>(<span class="hljs-operator">*</span>) <span class="hljs-keyword">AS</span> numero_posts
<span class="hljs-keyword">FROM</span> Posts
<span class="hljs-keyword">GROUP</span> <span class="hljs-keyword">BY</span> OwnerUserId, PostTypeId
<span class="hljs-keyword">HAVING</span> <span class="hljs-built_in">COUNT</span>(<span class="hljs-operator">*</span>) <span class="hljs-operator">&gt;</span> <span class="hljs-number">10</span>
<span class="hljs-keyword">ORDER</span> <span class="hljs-keyword">BY</span> OwnerUserId <span class="hljs-keyword">ASC</span>, numero_posts <span class="hljs-keyword">DESC</span>;
</code></pre>
<ul>
<li><code>WHERE</code> filtra filas <strong>antes</strong> de agrupar</li>
<li><code>HAVING</code> filtra grupos <strong>después</strong> de agregar</li>
<li>En SQL estricto, cada expresión seleccionada debe estar agrupada, agregada o ser funcionalmente dependiente de las columnas agrupadas</li>
</ul>
<footer>BDGE · Sesión 1 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-paginate="true" data-footer="BDGE · Sesión 1 · Curso 2026/2027" data-lang="es" data-theme="qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9" lang="es" data-marpit-pagination="55" style="--paginate:true;--footer:BDGE · Sesión 1 · Curso 2026/2027;--lang:es;--theme:qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9;" data-marpit-pagination-total="66" data-size="16:9">
<h1 id="agregaci%C3%B3n-con-nombres">Agregación con nombres</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> u.DisplayName, <span class="hljs-built_in">COUNT</span>(<span class="hljs-operator">*</span>) <span class="hljs-keyword">AS</span> respuestas
<span class="hljs-keyword">FROM</span> Posts <span class="hljs-keyword">AS</span> p
<span class="hljs-keyword">JOIN</span> Users <span class="hljs-keyword">AS</span> u <span class="hljs-keyword">ON</span> u.Id <span class="hljs-operator">=</span> p.OwnerUserId
<span class="hljs-keyword">WHERE</span> p.PostTypeId <span class="hljs-operator">=</span> <span class="hljs-number">2</span>
<span class="hljs-keyword">GROUP</span> <span class="hljs-keyword">BY</span> u.Id, u.DisplayName
<span class="hljs-keyword">HAVING</span> <span class="hljs-built_in">COUNT</span>(<span class="hljs-operator">*</span>) <span class="hljs-operator">&gt;</span> <span class="hljs-number">100</span>
<span class="hljs-keyword">ORDER</span> <span class="hljs-keyword">BY</span> respuestas <span class="hljs-keyword">DESC</span>;
</code></pre>
<p>La consulta explica una pregunta concreta: «¿qué usuarios han aportado muchas respuestas?».</p>
<ul>
<li><code>u.DisplayName</code> no añade un criterio de agrupación: depende funcionalmente de<br />
<code>u.Id</code>, clave primaria, y hay un único nombre por usuario</li>
<li>MySQL 8 detecta esa dependencia y acepta <code>GROUP BY u.Id</code> a secas; listar la columna<br />
es la forma portable y la que exige SQL estricto cuando no se agrupa por una clave</li>
</ul>
<footer>BDGE · Sesión 1 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="56" data-paginate="true" data-footer="BDGE · Sesión 1 · Curso 2026/2027" data-lang="es" data-theme="qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9" lang="es" data-marpit-pagination="56" style="--paginate:true;--footer:BDGE · Sesión 1 · Curso 2026/2027;--lang:es;--theme:qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9;" data-marpit-pagination-total="66" data-size="16:9">
<h1 id="tablas-como-conjuntos">Tablas como conjuntos</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> UserId <span class="hljs-keyword">FROM</span> Comments
<span class="hljs-keyword">UNION</span>
<span class="hljs-keyword">SELECT</span> OwnerUserId <span class="hljs-keyword">FROM</span> Posts;
</code></pre>
<ul>
<li><code>UNION</code> elimina duplicados; <code>UNION ALL</code> los conserva</li>
<li><code>INTERSECT</code> y <code>EXCEPT</code> están disponibles en muchos motores, con diferencias de versión</li>
<li><code>IN</code> expresa pertenencia a un conjunto; con <code>NULL</code> hay que revisar cuidadosamente su semántica</li>
</ul>
<footer>BDGE · Sesión 1 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" data-paginate="true" data-footer="BDGE · Sesión 1 · Curso 2026/2027" data-lang="es" data-theme="qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9" lang="es" data-marpit-pagination="57" style="--paginate:true;--footer:BDGE · Sesión 1 · Curso 2026/2027;--lang:es;--theme:qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9;" data-marpit-pagination-total="66" data-size="16:9">
<h1 id="union-all-apilar-hechos-no-deduplicarlos"><code>UNION ALL</code>: apilar hechos, no deduplicarlos</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> <span class="hljs-string">&#x27;pregunta&#x27;</span> <span class="hljs-keyword">AS</span> Tipo, Id, OwnerUserId, CreationDate
<span class="hljs-keyword">FROM</span> Posts <span class="hljs-keyword">WHERE</span> PostTypeId <span class="hljs-operator">=</span> <span class="hljs-number">1</span>
<span class="hljs-keyword">UNION</span> <span class="hljs-keyword">ALL</span>
<span class="hljs-keyword">SELECT</span> <span class="hljs-string">&#x27;respuesta&#x27;</span>, Id, OwnerUserId, CreationDate
<span class="hljs-keyword">FROM</span> Posts <span class="hljs-keyword">WHERE</span> PostTypeId <span class="hljs-operator">=</span> <span class="hljs-number">2</span>;
</code></pre>
<ul>
<li><code>UNION</code> tiene que ordenar o construir una estructura auxiliar para descartar duplicados; <code>UNION ALL</code> no</li>
<li>Cuando las ramas son disjuntas por construcción, <code>UNION ALL</code> es a la vez lo correcto y lo barato</li>
<li>Todas las ramas necesitan el mismo número de columnas y tipos compatibles; los nombres los pone la primera</li>
<li>Cada rama aporta su tipo como columna constante: eso es lo que distingue después a cada fila</li>
</ul>
<footer>BDGE · Sesión 1 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" data-paginate="true" data-footer="BDGE · Sesión 1 · Curso 2026/2027" data-lang="es" data-theme="qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9" lang="es" data-marpit-pagination="58" style="--paginate:true;--footer:BDGE · Sesión 1 · Curso 2026/2027;--lang:es;--theme:qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9;" data-marpit-pagination-total="66" data-size="16:9">
<h1 id="el-riesgo-identificadores-que-chocan">El riesgo: identificadores que chocan</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> <span class="hljs-string">&#x27;alta_usuario&#x27;</span> <span class="hljs-keyword">AS</span> Tipo, Id <span class="hljs-keyword">FROM</span> Users
<span class="hljs-keyword">UNION</span> <span class="hljs-keyword">ALL</span>
<span class="hljs-keyword">SELECT</span> <span class="hljs-string">&#x27;pregunta&#x27;</span>, Id <span class="hljs-keyword">FROM</span> Posts <span class="hljs-keyword">WHERE</span> PostTypeId <span class="hljs-operator">=</span> <span class="hljs-number">1</span>;
</code></pre>
<ul>
<li><code>Users.Id</code> y <code>Posts.Id</code> son espacios de identificadores independientes, y ambos empiezan en 1</li>
<li>El usuario 5 y la pregunta 5 son hechos distintos que comparten el valor de <code>Id</code></li>
<li><code>PRIMARY KEY (Id)</code> fallaría: la clave tiene que ser <code>(Tipo, Id)</code></li>
<li>Preguntas y respuestas, en cambio, salen ambas de <code>Posts</code> y nunca chocan entre sí</li>
</ul>
<footer>BDGE · Sesión 1 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="59" data-paginate="true" data-footer="BDGE · Sesión 1 · Curso 2026/2027" data-lang="es" data-theme="qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9" lang="es" data-marpit-pagination="59" style="--paginate:true;--footer:BDGE · Sesión 1 · Curso 2026/2027;--lang:es;--theme:qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9;" data-marpit-pagination-total="66" data-size="16:9">
<h1 id="una-tabla-de-hechos-con-union-all">Una tabla de hechos con <code>UNION ALL</code></h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">INSERT INTO</span> Hechos (Tipo, EntidadId, UserId, CreationDate)
<span class="hljs-keyword">SELECT</span> <span class="hljs-string">&#x27;alta_usuario&#x27;</span>, Id, Id, CreationDate <span class="hljs-keyword">FROM</span> Users
<span class="hljs-keyword">UNION</span> <span class="hljs-keyword">ALL</span>
<span class="hljs-keyword">SELECT</span> <span class="hljs-string">&#x27;pregunta&#x27;</span>, Id, OwnerUserId, CreationDate
<span class="hljs-keyword">FROM</span> Posts <span class="hljs-keyword">WHERE</span> PostTypeId <span class="hljs-operator">=</span> <span class="hljs-number">1</span>
<span class="hljs-keyword">UNION</span> <span class="hljs-keyword">ALL</span>
<span class="hljs-keyword">SELECT</span> <span class="hljs-string">&#x27;respuesta&#x27;</span>, Id, OwnerUserId, CreationDate
<span class="hljs-keyword">FROM</span> Posts <span class="hljs-keyword">WHERE</span> PostTypeId <span class="hljs-operator">=</span> <span class="hljs-number">2</span>;
</code></pre>
<ul>
<li>Una tabla de hechos reúne en una sola línea de tiempo eventos de origen distinto</li>
<li><code>PRIMARY KEY (Tipo, EntidadId)</code> es lo que impide que el alta del usuario 5 y la pregunta 5 colisionen</li>
<li>Ordenar por <code>CreationDate</code> responde preguntas que ninguna tabla de origen contesta por sí sola</li>
</ul>
<footer>BDGE · Sesión 1 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="60" data-paginate="true" data-footer="BDGE · Sesión 1 · Curso 2026/2027" data-lang="es" data-theme="qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9" lang="es" data-marpit-pagination="60" style="--paginate:true;--footer:BDGE · Sesión 1 · Curso 2026/2027;--lang:es;--theme:qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9;" data-marpit-pagination-total="66" data-size="16:9">
<h1 id="subconsultas-y-tablas-derivadas">Subconsultas y tablas derivadas</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> u.DisplayName, c.numero_comentarios
<span class="hljs-keyword">FROM</span> Users <span class="hljs-keyword">AS</span> u
<span class="hljs-keyword">JOIN</span> (
  <span class="hljs-keyword">SELECT</span> UserId, <span class="hljs-built_in">COUNT</span>(<span class="hljs-operator">*</span>) <span class="hljs-keyword">AS</span> numero_comentarios
  <span class="hljs-keyword">FROM</span> Comments
  <span class="hljs-keyword">GROUP</span> <span class="hljs-keyword">BY</span> UserId
) <span class="hljs-keyword">AS</span> c <span class="hljs-keyword">ON</span> c.UserId <span class="hljs-operator">=</span> u.Id;
</code></pre>
<p>Una subconsulta en <code>FROM</code> produce una tabla derivada que se puede unir y consultar como las demás.</p>
<footer>BDGE · Sesión 1 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="61" data-paginate="true" data-footer="BDGE · Sesión 1 · Curso 2026/2027" data-lang="es" data-theme="qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9" lang="es" data-marpit-pagination="61" style="--paginate:true;--footer:BDGE · Sesión 1 · Curso 2026/2027;--lang:es;--theme:qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9;" data-marpit-pagination-total="66" data-size="16:9">
<h1 id="consultas-correlacionadas">Consultas correlacionadas</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> u.Id, u.DisplayName
<span class="hljs-keyword">FROM</span> Users <span class="hljs-keyword">AS</span> u
<span class="hljs-keyword">WHERE</span> <span class="hljs-number">100</span> <span class="hljs-operator">&lt;</span> (
  <span class="hljs-keyword">SELECT</span> <span class="hljs-built_in">COUNT</span>(<span class="hljs-operator">*</span>)
  <span class="hljs-keyword">FROM</span> Posts <span class="hljs-keyword">AS</span> p
  <span class="hljs-keyword">WHERE</span> p.OwnerUserId <span class="hljs-operator">=</span> u.Id
    <span class="hljs-keyword">AND</span> p.PostTypeId <span class="hljs-operator">=</span> <span class="hljs-number">1</span>
);
</code></pre>
<p>La subconsulta depende de la fila externa. Un optimizador puede transformarla, pero debemos comprobar el plan y los índices antes de asumir que tendrá un buen coste.</p>
<footer>BDGE · Sesión 1 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="62" data-paginate="true" data-footer="BDGE · Sesión 1 · Curso 2026/2027" data-lang="es" data-theme="qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9" lang="es" data-marpit-pagination="62" style="--paginate:true;--footer:BDGE · Sesión 1 · Curso 2026/2027;--lang:es;--theme:qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9;" data-marpit-pagination-total="66" data-size="16:9">
<h1 id="promedio-de-respuestas-una-sutileza-de-null">Promedio de respuestas: una sutileza de <code>NULL</code></h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> <span class="hljs-built_in">AVG</span>(<span class="hljs-built_in">COALESCE</span>(a.respuestas, <span class="hljs-number">0</span>)) <span class="hljs-keyword">AS</span> media_respuestas
<span class="hljs-keyword">FROM</span> Posts <span class="hljs-keyword">AS</span> p
<span class="hljs-keyword">LEFT</span> <span class="hljs-keyword">JOIN</span> (
  <span class="hljs-keyword">SELECT</span> ParentId, <span class="hljs-built_in">COUNT</span>(<span class="hljs-operator">*</span>) <span class="hljs-keyword">AS</span> respuestas
  <span class="hljs-keyword">FROM</span> Posts
  <span class="hljs-keyword">WHERE</span> PostTypeId <span class="hljs-operator">=</span> <span class="hljs-number">2</span>
  <span class="hljs-keyword">GROUP</span> <span class="hljs-keyword">BY</span> ParentId
) <span class="hljs-keyword">AS</span> a <span class="hljs-keyword">ON</span> a.ParentId <span class="hljs-operator">=</span> p.Id
<span class="hljs-keyword">WHERE</span> p.PostTypeId <span class="hljs-operator">=</span> <span class="hljs-number">1</span>;
</code></pre>
<p>Sin <code>COALESCE</code>, <code>AVG</code> ignora las preguntas sin respuesta y la media queda sesgada al alza.</p>
<footer>BDGE · Sesión 1 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="63" data-paginate="true" data-footer="BDGE · Sesión 1 · Curso 2026/2027" data-class="section-divider" data-lang="es" data-theme="qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9" lang="es" class="section-divider" data-marpit-pagination="63" style="--paginate:true;--footer:BDGE · Sesión 1 · Curso 2026/2027;--class:section-divider;--lang:es;--theme:qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9;" data-marpit-pagination-total="66" data-size="16:9">
<h1 id="consultas-correctas-y-eficientes">Consultas correctas y eficientes</h1>
<p>El mismo resultado lógico puede requerir cantidades de trabajo muy distintas.</p>
<footer>BDGE · Sesión 1 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="64" data-paginate="true" data-footer="BDGE · Sesión 1 · Curso 2026/2027" data-lang="es" data-theme="qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9" lang="es" data-marpit-pagination="64" style="--paginate:true;--footer:BDGE · Sesión 1 · Curso 2026/2027;--lang:es;--theme:qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9;" data-marpit-pagination-total="66" data-size="16:9">
<h1 id="leer-un-plan-de-mysql">Leer un plan de MySQL</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql">EXPLAIN
<span class="hljs-keyword">SELECT</span> PostId
<span class="hljs-keyword">FROM</span> Votes
<span class="hljs-keyword">WHERE</span> PostId <span class="hljs-keyword">NOT</span> <span class="hljs-keyword">IN</span> (<span class="hljs-keyword">SELECT</span> Id <span class="hljs-keyword">FROM</span> Posts);
</code></pre>
<p>Empezaremos por preguntas simples:</p>
<ul>
<li>¿Se recorre toda la tabla o se usa un índice?</li>
<li>¿Cuántas filas estima el optimizador?</li>
<li>¿Qué unión y qué orden de acceso ha elegido?</li>
</ul>
<p><code>EXPLAIN ANALYZE</code> añade medidas reales y ejecuta la consulta.</p>
<footer>BDGE · Sesión 1 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="65" data-paginate="true" data-footer="BDGE · Sesión 1 · Curso 2026/2027" data-lang="es" data-theme="qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9" lang="es" data-marpit-pagination="65" style="--paginate:true;--footer:BDGE · Sesión 1 · Curso 2026/2027;--lang:es;--theme:qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9;" data-marpit-pagination-total="66" data-size="16:9">
<h1 id="ideas-que-conectan-con-bdge">Ideas que conectan con BDGE</h1>
<ul>
<li>Elegir solo las columnas necesarias evita transferencia y lectura innecesarias</li>
<li>Filtrar pronto permite <em>predicate pushdown</em> en motores columnares y ficheros Parquet</li>
<li>Los índices aceleran ciertos accesos, pero aumentan el coste de inserciones y actualizaciones</li>
<li>Las estadísticas, la distribución de los datos y la cardinalidad determinan el plan elegido</li>
<li>La desnormalización puede acelerar lecturas, a cambio de consistencia y coste de actualización</li>
</ul>
<footer>BDGE · Sesión 1 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="66" data-paginate="true" data-footer="BDGE · Sesión 1 · Curso 2026/2027" data-lang="es" data-theme="qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9" lang="es" data-marpit-pagination="66" style="--paginate:true;--footer:BDGE · Sesión 1 · Curso 2026/2027;--lang:es;--theme:qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9;" data-marpit-pagination-total="66" data-size="16:9">
<h1 id="para-continuar">Para continuar</h1>
<ul>
<li>Definir esquemas con DDL y restricciones</li>
<li>Insertar, actualizar y borrar datos de forma segura</li>
<li>Diseñar índices y contrastar planes con <code>EXPLAIN</code></li>
<li>Trabajar con JSON y decidir qué parte debe seguir siendo relacional</li>
</ul>
