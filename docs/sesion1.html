</div>
<p>También pares clave/valor, registros, <em>streams</em> y formatos columnares. Llegan sin claves ni tipos garantizados: la estructura no está en los datos, <strong>la imponemos nosotros</strong>.</p>
<p><img src="img/KeyValueStore.png" alt="" style="height:125px;" /></p>
<footer>BDGE · Sesión 1 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-footer="BDGE · Sesión 1 · Curso 2026/2027" data-lang="es" data-theme="qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9" lang="es" data-marpit-pagination="4" style="--paginate:true;--footer:BDGE · Sesión 1 · Curso 2026/2027;--lang:es;--theme:qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9;" data-marpit-pagination-total="66" data-size="16:9">
<h1 id="tres-hechos-y-ninguna-tabla">Tres hechos y ninguna tabla</h1>
<blockquote>
<p>El 3 de marzo, Ana preguntó cómo ordenar resultados por fecha. Luis respondió al día siguiente y su respuesta recibió 12 votos. Ana la marcó como aceptada.</p>
</blockquote>
<ul>
<li>¿Cuántas <strong>entidades</strong> hay aquí? ¿Dos, tres, cinco?</li>
<li>¿«Aceptada» es propiedad de la respuesta, de la pregunta o de la relación entre ambas?</li>
<li>¿Qué ocurre con la pregunta si Ana borra su cuenta?</li>
<li>Modelar es decidir esto <strong>antes</strong> de escribir la primera consulta</li>
</ul>
<footer>BDGE · Sesión 1 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-footer="BDGE · Sesión 1 · Curso 2026/2027" data-lang="es" data-theme="qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9" lang="es" data-marpit-pagination="5" style="--paginate:true;--footer:BDGE · Sesión 1 · Curso 2026/2027;--lang:es;--theme:qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9;" data-marpit-pagination-total="66" data-size="16:9">
<h1 id="%C2%BFqu%C3%A9-es-un-modelo-de-datos">¿Qué es un modelo de datos?</h1>
<p>Todo modelo de datos define tres componentes:</p>
<ol>
<li><strong>Estructuras</strong> para albergar los datos</li>
<li><strong>Restricciones</strong> que deben cumplir</li>
<li><strong>Operaciones</strong> que se pueden realizar</li>
</ol>
<footer>BDGE · Sesión 1 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-footer="BDGE · Sesión 1 · Curso 2026/2027" data-lang="es" data-theme="qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9" lang="es" data-marpit-pagination="6" style="--paginate:true;--footer:BDGE · Sesión 1 · Curso 2026/2027;--lang:es;--theme:qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9;" data-marpit-pagination-total="66" data-size="16:9">
<h1 id="ejemplos-de-los-tres-componentes">Ejemplos de los tres componentes</h1>
<table>
<thead>
<tr>
<th>Componente</th>
<th>Preguntas que responde</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Estructuras</strong></td>
<td>¿Filas y columnas? ¿Vértices y aristas? ¿Pares clave/valor? ¿Una secuencia de bytes?</td>
</tr>
<tr>
<td><strong>Restricciones</strong></td>
<td>¿Todas las filas tienen las mismas columnas? ¿Qué valores admite un atributo? ¿Puede un archivo tener dos padres?</td>
</tr>
<tr>
<td><strong>Operaciones</strong></td>
<td>¿Cuál es el valor de la clave <code>x</code>? ¿Qué filas contienen «plaza»? ¿Cuáles son los siguientes <em>N</em> registros?</td>
</tr>
</tbody>
</table>
<p>Haremos estas tres preguntas a cada sistema del curso.</p>
<footer>BDGE · Sesión 1 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-footer="BDGE · Sesión 1 · Curso 2026/2027" data-class="dense" data-lang="es" data-theme="qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9" lang="es" class="dense" data-marpit-pagination="7" style="--paginate:true;--footer:BDGE · Sesión 1 · Curso 2026/2027;--class:dense;--lang:es;--theme:qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9;" data-marpit-pagination-total="66" data-size="16:9">
<h1 id="los-mismos-hechos-cuatro-modelos">Los mismos hechos, cuatro modelos</h1>
<table>
<thead>
<tr>
<th>Modelo · sesión</th>
<th>Cómo guarda los hechos</th>
<th>Consultas optimizadas</th>
<th>Consultas costosas</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Relacional</strong> · 1‑2</td>
<td><code>Users</code>, <code>Posts</code> y una clave ajena</td>
<td>Cualquier pregunta no prevista al diseñar</td>
<td>Reunir una pregunta con todo lo suyo: varios <code>JOIN</code></td>
</tr>
<tr>
<td><strong>Documentos</strong> · 3‑4</td>
<td>La pregunta, con sus respuestas dentro</td>
<td>Mostrar una pregunta completa de una vez</td>
<td>«¿Qué ha respondido Luis?», salvo duplicar</td>
</tr>
<tr>
<td><strong>Familia de columnas</strong> · 5‑6</td>
<td>Una tabla por consulta; la clave decide dónde vive cada fila</td>
<td>La consulta prevista, a gran escala</td>
<td>Cualquier consulta no prevista</td>
</tr>
<tr>
<td><strong>Grafo</strong> · 7</td>
<td>Nodos y aristas: <code>Usuario</code>, <code>Pregunta</code>, <code>Respuesta</code></td>
<td>Recorridos: quién responde a quién</td>
<td>Agregados sobre todo el conjunto</td>
</tr>
</tbody>
</table>
<p>Ninguno es «el correcto». Guardar junto (<strong>agregar</strong>) o guardar aparte y enlazar (<strong>referenciar</strong>) es la decisión que volverá en la sesión 4.</p>
<footer>BDGE · Sesión 1 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-footer="BDGE · Sesión 1 · Curso 2026/2027" data-lang="es" data-theme="qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9" lang="es" data-marpit-pagination="8" style="--paginate:true;--footer:BDGE · Sesión 1 · Curso 2026/2027;--lang:es;--theme:qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9;" data-marpit-pagination-total="66" data-size="16:9">
<h1 id="%C2%BFpor-qu%C3%A9-modelar">¿Por qué modelar?</h1>
<ul>
<li>Describe el problema en el <strong>nivel de abstracción adecuado</strong> y descarta lo accesorio</li>
<li>Decide qué consultas quedan <strong>optimizadas</strong> y cuáles resultan <strong>costosas</strong>: es una decisión de rendimiento, no sólo de orden</li>
<li>Hace explícitas las reglas del dominio para que el sistema <strong>impida</strong> los estados imposibles</li>
<li>Permite que varias aplicaciones usen los mismos datos sin negociar cada consulta</li>
<li>Los datos <strong>sobreviven</strong> a las aplicaciones que los crearon: el modelo es lo que queda cuando cambian el lenguaje, el producto y la moda</li>
</ul>
<footer>BDGE · Sesión 1 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-footer="BDGE · Sesión 1 · Curso 2026/2027" data-class="figure-only figure-row" data-lang="es" data-theme="qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9" lang="es" class="figure-only figure-row" data-marpit-pagination="9" style="--paginate:true;--footer:BDGE · Sesión 1 · Curso 2026/2027;--class:figure-only figure-row;--lang:es;--theme:qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9;" data-marpit-pagination-total="66" data-size="16:9">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-footer="BDGE · Sesión 1 · Curso 2026/2027" data-lang="es" data-theme="qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9" lang="es" data-marpit-pagination="12" style="--paginate:true;--footer:BDGE · Sesión 1 · Curso 2026/2027;--lang:es;--theme:qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9;" data-marpit-pagination-total="66" data-size="16:9">
<blockquote>
<p>«Show me your flowcharts and conceal your tables, and I shall continue to be mystified. Show me your tables, and I won't usually need your flowcharts; they'll be obvious.»</p>
<p>— Fred Brooks, <em>The Mythical Man-Month</em>, 1975</p>
</blockquote>
<p>Cincuenta años después sigue siendo el mejor resumen de por qué empezamos por el modelo.</p>

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-footer="BDGE · Sesión 1 · Curso 2026/2027" data-lang="es" data-theme="qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9" lang="es" data-marpit-pagination="13" style="--paginate:true;--footer:BDGE · Sesión 1 · Curso 2026/2027;--lang:es;--theme:qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9;" data-marpit-pagination-total="66" data-size="16:9">
<h1 id="el-modelo-es-lo-que-no-se-puede-delegar">El modelo es lo que no se puede delegar</h1>
<ul>
<li>Una IA escribe hoy SQL, <em>pipelines</em> de agregación o Cypher con soltura, y recuerda la sintaxis mejor que nosotros</li>
<li>No puede decidir qué es una <strong>entidad</strong>, cuándo dos filas son <strong>la misma cosa</strong>, qué debe ser <strong>cierto siempre</strong> ni qué consultas deben quedar <strong>optimizadas</strong></li>
<li>Puede proponer un esquema; sólo quien conoce el dominio sabe si es el correcto</li>
<li>Saber modelar es lo que permite <strong>dirigir</strong> y <strong>criticar</strong> la herramienta en lugar de aceptar su primera respuesta</li>
</ul>
<footer>BDGE · Sesión 1 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-footer="BDGE · Sesión 1 · Curso 2026/2027" data-lang="es" data-theme="qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9" lang="es" data-marpit-pagination="14" style="--paginate:true;--footer:BDGE · Sesión 1 · Curso 2026/2027;--lang:es;--theme:qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9;" data-marpit-pagination-total="66" data-size="16:9">
<h1 id="el-esquema-es-el-contexto">El esquema es el contexto</h1>
<ul>
<li>Sobre un esquema que se explica a sí mismo —nombres, tipos, claves, restricciones— una IA acierta casi siempre</li>
<li>Sobre un <code>JSON</code> sin esquema ni documentación produce consultas <strong>verosímiles</strong>: se ejecutan y devuelven filas</li>
<li>Lo que no puede saber si no está escrito: que <code>OwnerUserId</code> es nulo porque se borró la cuenta, o que hay votos que apuntan a publicaciones que ya no existen</li>
<li><strong>Un resultado con filas no es un resultado correcto</strong>: verificaremos lo que devuelve una consulta y lo que cuesta</li>
</ul>
<footer>BDGE · Sesión 1 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-footer="BDGE · Sesión 1 · Curso 2026/2027" data-class="section-divider" data-lang="es" data-theme="qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9" lang="es" class="section-divider" data-marpit-pagination="15" style="--paginate:true;--footer:BDGE · Sesión 1 · Curso 2026/2027;--class:section-divider;--lang:es;--theme:qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9;" data-marpit-pagination-total="66" data-size="16:9">
<h1 id="modelo-relacional">Modelo relacional</h1>
<p>Tablas, claves, restricciones y álgebra para consultar sin depender de cómo se almacenan físicamente los datos.</p>
<footer>BDGE · Sesión 1 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-footer="BDGE · Sesión 1 · Curso 2026/2027" data-lang="es" data-theme="qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9" lang="es" data-marpit-pagination="16" style="--paginate:true;--footer:BDGE · Sesión 1 · Curso 2026/2027;--lang:es;--theme:qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9;" data-marpit-pagination-total="66" data-size="16:9">
<h1 id="modelo-relacional-1">Modelo relacional</h1>
<ul>
<li>Propuesto por <strong>E. F. Codd en 1970</strong></li>
<li>Modela los datos mediante <strong>relaciones</strong>, habitualmente representadas como tablas</li>
<li>Se apoya en teoría de conjuntos, lógica de predicados y álgebra relacional</li>
<li>Su fuerza es la independencia entre los datos y las aplicaciones que los usan: permite formular consultas no previstas al diseñar la base de datos</li>
</ul>
<footer>BDGE · Sesión 1 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-footer="BDGE · Sesión 1 · Curso 2026/2027" data-lang="es" data-theme="qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9" lang="es" data-marpit-pagination="17" style="--paginate:true;--footer:BDGE · Sesión 1 · Curso 2026/2027;--lang:es;--theme:qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9;" data-marpit-pagination-total="66" data-size="16:9">
<h1 id="conceptos-esenciales">Conceptos esenciales</h1>
<ul>
<li>Una relación tiene un <strong>esquema</strong>: atributos con nombre y dominio</li>
<li>Cada fila o <strong>tupla</strong> sigue ese mismo esquema; cada atributo tiene su propio tipo o dominio</li>
<li>Una <strong>clave primaria</strong> identifica de forma única cada fila y no admite <code>NULL</code></li>
<li>Una <strong>clave ajena</strong> expresa una referencia a una fila de otra tabla</li>
<li>La normalización busca evitar redundancias y anomalías; la desnormalización es una decisión física posterior y consciente, a la que volveremos en la sesión 4</li>
</ul>
<footer>BDGE · Sesión 1 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-footer="BDGE · Sesión 1 · Curso 2026/2027" data-lang="es" data-theme="qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9" lang="es" data-marpit-pagination="18" style="--paginate:true;--footer:BDGE · Sesión 1 · Curso 2026/2027;--lang:es;--theme:qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9;" data-marpit-pagination-total="66" data-size="16:9">
<h1 id="clave-primaria-y-clave-ajena">Clave primaria y clave ajena</h1>
<p><img src="img/fk-users-posts-tablas.png" alt="" style="width:1100px;" /></p>
<p><code>Posts.UserId</code> referencia <code>Users.UserId</code>: no debería existir un <em>post</em> cuyo usuario no exista.</p>
<footer>BDGE · Sesión 1 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-footer="BDGE · Sesión 1 · Curso 2026/2027" data-lang="es" data-theme="qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9" lang="es" data-marpit-pagination="19" style="--paginate:true;--footer:BDGE · Sesión 1 · Curso 2026/2027;--lang:es;--theme:qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9;" data-marpit-pagination-total="66" data-size="16:9">
<h1 id="restricciones-de-integridad">Restricciones de integridad</h1>
<table>
<thead>
<tr>
<th>Restricción</th>
<th>Regla</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Clave / entidad</strong></td>
<td>No hay dos filas con la misma clave primaria; su valor no es nulo.</td>
</tr>
<tr>
<td><strong>Dominio</strong></td>
<td>Cada atributo solo contiene valores de su tipo y reglas asociadas.</td>
</tr>
<tr>
<td><strong>Referencial</strong></td>
<td>Una clave ajena apunta a una fila existente, salvo que se permita <code>NULL</code>.</td>
</tr>
<tr>
<td><strong>De negocio</strong></td>
<td>Reglas propias del dominio: importe positivo, fecha de fin posterior al inicio, etc.</td>
</tr>
</tbody>
</table>
<footer>BDGE · Sesión 1 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-footer="BDGE · Sesión 1 · Curso 2026/2027" data-lang="es" data-theme="qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9" lang="es" data-marpit-pagination="20" style="--paginate:true;--footer:BDGE · Sesión 1 · Curso 2026/2027;--lang:es;--theme:qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9;" data-marpit-pagination-total="66" data-size="16:9">
<h1 id="%C3%A1lgebra-relacional">Álgebra relacional</h1>
<ul>
<li>Nos permite abstraernos de la representación física</li>
<li>Las operaciones producen nuevas relaciones: se pueden componer y optimizar</li>
<li>Operaciones que veremos en SQL: selección, proyección, producto cartesiano, unión y reunión (<em>join</em>)</li>
</ul>
<footer>BDGE · Sesión 1 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-footer="BDGE · Sesión 1 · Curso 2026/2027" data-class="figure-only" data-lang="es" data-theme="qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9" lang="es" class="figure-only" data-marpit-pagination="21" style="--paginate:true;--footer:BDGE · Sesión 1 · Curso 2026/2027;--class:figure-only;--lang:es;--theme:qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9;" data-marpit-pagination-total="66" data-size="16:9">
<h1 id="%C3%A1lgebra-relacional-1">Álgebra relacional</h1>
<p><img src="img/rel-algebra.png" alt="" style="height:480px;" /></p>
<footer>BDGE · Sesión 1 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-footer="BDGE · Sesión 1 · Curso 2026/2027" data-lang="es" data-theme="qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9" lang="es" data-marpit-pagination="22" style="--paginate:true;--footer:BDGE · Sesión 1 · Curso 2026/2027;--lang:es;--theme:qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9;" data-marpit-pagination-total="66" data-size="16:9">
<h1 id="consultas-equivalentes-costes-diferentes">Consultas equivalentes, costes diferentes</h1>
<p>El optimizador puede reordenar operaciones equivalentes para reducir el volumen de datos intermedio.</p>

<h1 id="sql-y-sus-dialectos">SQL y sus dialectos</h1>
<ul>
<li>SQL es un estándar ANSI/ISO; SQL:2023 incorpora, entre otras extensiones, consultas de grafos de propiedades</li>
<li><strong>DML</strong>: consulta y modificación de datos. <strong>DDL</strong>: definición del esquema</li>
<li>SQL trabaja con tablas, columnas y filas; a diferencia del álgebra relacional, una consulta puede devolver duplicados (<em>bag semantics</em>)</li>
<li>En esta sesión usamos el núcleo común de SQL. Cuando aparezca una diferencia, se indicará el motor: <strong>SQLite</strong>, <strong>MySQL</strong> o <strong>DuckDB</strong></li>
</ul>
<footer>BDGE · Sesión 1 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-footer="BDGE · Sesión 1 · Curso 2026/2027" data-lang="es" data-theme="qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9" lang="es" data-marpit-pagination="25" style="--paginate:true;--footer:BDGE · Sesión 1 · Curso 2026/2027;--lang:es;--theme:qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9;" data-marpit-pagination-total="66" data-size="16:9">
<h1 id="herramientas-de-la-asignatura">Herramientas de la asignatura</h1>
<table>
<thead>
<tr>
<th>Herramienta</th>
<th>Papel</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>SQLite</strong></td>
<td>Primer contacto: un único fichero, consola sencilla y sin servidor.</td>

<h1 id="modo-de-trabajo">Modo de trabajo</h1>
<ul>
<li>El objetivo es manejar SQL con comodidad, no memorizar un catálogo de funciones</li>
<li>Trabajaremos sobre una instantánea de datos de Stack Overflow cargada por los notebooks de la asignatura</li>
<li>El mismo conjunto permite estudiar esquema, consultas, calidad de datos, relaciones, agregación y rendimiento</li>
<li>El cuaderno prepara los datos desde Parquet; DuckDB puede consultarlos directamente y MySQL permite estudiarlos como base de datos de servidor</li>
</ul>
<footer>BDGE · Sesión 1 · Curso 2026/2027</footer>

<h1 id="primer-contacto-con-sqlite">Primer contacto con SQLite</h1>
<p>SQLite almacena una base de datos relacional en un fichero y añade comandos de administración al intérprete:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-console"><span class="hljs-meta prompt_">$ </span><span class="language-bash">sqlite3 ejemplo.db</span>
<span class="hljs-meta prompt_">sqlite&gt; </span><span class="language-bash">.tables</span>
<span class="hljs-meta prompt_">sqlite&gt; </span><span class="language-bash">.schema Posts</span>
<span class="hljs-meta prompt_">sqlite&gt; </span><span class="language-bash">.open otro-fichero.db</span>
<span class="hljs-meta prompt_">sqlite&gt; </span><span class="language-bash">.<span class="hljs-built_in">help</span></span>
</code></pre>
<p>Estos comandos no son SQL: son ayudas de la consola de SQLite.</p>
<footer>BDGE · Sesión 1 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-footer="BDGE · Sesión 1 · Curso 2026/2027" data-class="figure-only" data-lang="es" data-theme="qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9" lang="es" class="figure-only" data-marpit-pagination="28" style="--paginate:true;--footer:BDGE · Sesión 1 · Curso 2026/2027;--class:figure-only;--lang:es;--theme:qn1tgnujpnlbmnid7lduprwetlria8xooouyig17nc9;" data-marpit-pagination-total="66" data-size="16:9">
