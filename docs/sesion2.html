</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="section-divider" data-theme="bdge" data-lang="es" lang="es" class="section-divider" data-marpit-pagination="2" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:section-divider;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="sql-ii-ddl">SQL (ii): DDL</h1>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-theme="bdge" data-lang="es" lang="es" data-marpit-pagination="3" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="introducci%C3%B3n">Introducción</h1>
<ul>
<li>SQL se divide lógicamente en dos sublenguajes:
<ul>
<li><strong>DML</strong> (<em>Data Manipulation Language</em>), visto en la sesión anterior</li>
<li><strong>DDL</strong> (<em>Data Definition Language</em>), el sublenguaje de definición del esquema de los datos</li>
</ul>
</li>
<li>En esta sesión veremos también la parte de actualización, modificación y borrado de datos de DML</li>
<li>Veremos cómo usar JSON en SQL</li>
<li>Finalmente, una guía de diseño de esquemas orientados a la eficiencia</li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-theme="bdge" data-lang="es" lang="es" data-marpit-pagination="4" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="data-definition-language-ddl">Data Definition Language (DDL)</h1>
<ul>
<li>Permite describir los metadatos (tablas y relaciones entre ellas) de la base de datos</li>
<li>Tablas, dominios de los atributos y restricciones de integridad</li>
<li>Al conjunto de especificaciones se le conoce como <strong>esquema</strong> de la base de datos</li>
<li>Por lo tanto, define también la sintaxis de las operaciones de inserción (<code>INSERT</code>) y actualización (<code>UPDATE</code>)</li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-theme="bdge" data-lang="es" lang="es" data-marpit-pagination="5" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="create-table"><code>CREATE TABLE</code></h1>
<ul>
<li>La construcción principal de SQL para la creación del esquema es la sentencia <code>CREATE TABLE</code></li>
<li>Para cada tabla, especifica sus columnas, dominios de columna y restricciones</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">CREATE TABLE</span> nombre (
  att1 tipo1 [[<span class="hljs-keyword">NOT</span>] <span class="hljs-keyword">NULL</span>] [<span class="hljs-keyword">UNIQUE</span>] [<span class="hljs-keyword">DEFAULT</span> x],
  att2 tipo2,
  ...
  <span class="hljs-keyword">PRIMARY KEY</span>(...),
  <span class="hljs-keyword">FOREIGN KEY</span> attx <span class="hljs-keyword">REFERENCES</span> Tabla(atty)
    <span class="hljs-keyword">ON</span> <span class="hljs-keyword">DELETE</span> opción
    <span class="hljs-keyword">ON</span> <span class="hljs-keyword">UPDATE</span> opción,
  ...
);
</code></pre>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-theme="bdge" data-lang="es" lang="es" data-marpit-pagination="6" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="create-table-columnas"><code>CREATE TABLE</code>: columnas</h1>
<ul>
<li>Cada campo lista su tipo (se ven a continuación)</li>
<li>Opcionalmente se puede especificar si la columna admite valores nulos (<code>NULL</code>) o no (<code>NOT NULL</code>)</li>
<li>También se puede indicar que la columna contiene valores que no se repetirán, con <code>UNIQUE</code></li>
<li>Se le puede asignar un valor por defecto al insertar datos, con <code>DEFAULT x</code></li>
<li>No se muestra en el ejemplo, pero a un atributo también se le puede añadir <code>PRIMARY KEY</code></li>
<li>La clave primaria puede ser un dato del dominio o un número generado por la base de datos (a continuación)</li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="compact" data-theme="bdge" data-lang="es" lang="es" class="compact" data-marpit-pagination="7" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:compact;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="clave-natural-y-clave-subrogada">Clave natural y clave subrogada</h1>
<p>¿Qúe elemento se utiliza para identificar a cada entidad?</p>
<ul>
<li>Clave <strong>natural</strong>: un dato con significado en el dominio (correo, DNI, ISBN)
<ul>
<li>Puede cambiar, faltar o ser larga, y cada clave ajena la copia</li>
</ul>
</li>
<li>Clave <strong>subrogada</strong>: un número sin significado, generado al insertar, que nunca cambia
<ul>
<li>En MySQL, con <code>AUTO_INCREMENT</code>; así podrían ser los <code>Id</code> de Stack Overflow</li>
</ul>
</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">CREATE TABLE</span> Users (
  Id          <span class="hljs-type">INT</span> AUTO_INCREMENT <span class="hljs-keyword">PRIMARY KEY</span>,  <span class="hljs-comment">-- subrogada</span>
  Email       <span class="hljs-type">VARCHAR</span>(<span class="hljs-number">255</span>) <span class="hljs-keyword">NOT NULL</span> <span class="hljs-keyword">UNIQUE</span>,    <span class="hljs-comment">-- natural, sigue siendo única</span>
  DisplayName <span class="hljs-type">VARCHAR</span>(<span class="hljs-number">40</span>) <span class="hljs-keyword">NOT NULL</span>
);

<span class="hljs-keyword">INSERT INTO</span> Users (Email, DisplayName) <span class="hljs-keyword">VALUES</span> (<span class="hljs-string">&#x27;ana@example.com&#x27;</span>, <span class="hljs-string">&#x27;Ana&#x27;</span>);
<span class="hljs-comment">-- No se indica Id: MySQL le asigna 1, a la siguiente fila 2...</span>
</code></pre>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-theme="bdge" data-lang="es" lang="es" data-marpit-pagination="8" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="create-table-claves-ajenas"><code>CREATE TABLE</code>: claves ajenas</h1>
<ul>
<li>Opcionalmente, se pueden añadir restricciones de integridad con <code>FOREIGN KEY</code>
<ul>
<li>Lista un conjunto de atributos de la tabla (<em><strong>clave ajena</strong></em>)</li>
<li>Que hace referencia a otro conjunto de atributos de otra tabla (<em><strong>clave</strong></em>)</li>
<li>Opcionalmente se puede especificar qué sucede cuando el elemento referenciado se elimina (<code>ON DELETE</code>) o se le cambia el valor (<code>ON UPDATE</code>)</li>
<li>Se estudian las opciones con detalle a continuación</li>
</ul>
</li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-theme="bdge" data-lang="es" lang="es" data-marpit-pagination="9" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="creaci%C3%B3n-de-tablas-a-partir-de-consultas">Creación de tablas a partir de consultas</h1>
<ul>
<li>La construcción <code>CREATE TABLE</code> también permite crear tablas a partir de consultas</li>
<li>La sintaxis es <code>CREATE TABLE t AS SELECT ...</code>:</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">CREATE TABLE</span> T <span class="hljs-keyword">AS</span> <span class="hljs-keyword">SELECT</span> Id,Title <span class="hljs-keyword">FROM</span> Posts;
</code></pre>
<ul>
<li>Copia columnas y filas, pero no la clave primaria, los índices ni las claves ajenas</li>
<li>La alternativa habitual en los cuadernos es crear la tabla con su DDL completo y rellenarla con <code>INSERT ... AS SELECT</code></li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="compact" data-theme="bdge" data-lang="es" lang="es" class="compact" data-marpit-pagination="10" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:compact;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="juego-de-caracteres-e-intercalaci%C3%B3n">Juego de caracteres e intercalación</h1>
<ul>
<li>El <strong>juego de caracteres</strong> decide qué caracteres se pueden almacenar; la <strong>intercalación</strong> (<em>collation</em>), cómo se comparan y ordenan</li>
<li>Se fijan para la base, la tabla o la columna:</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">CREATE</span> DATABASE stackoverflow
  <span class="hljs-keyword">CHARACTER SET</span> utf8mb4 <span class="hljs-keyword">COLLATE</span> utf8mb4_0900_as_ci;
</code></pre>
<ul>
<li><code>utf8mb4</code> admite todo Unicode (el antiguo <code>utf8</code> de MySQL no)</li>
<li><code>_as_ci</code>: distingue acentos (<em>accent sensitive</em>) e ignora mayúsculas (<em>case insensitive</em>): <code>'ánimo' = 'animo'</code> es falso y <code>'Ánimo' = 'ánimo'</code> es cierto</li>
<li>La intercalación afecta a <code>WHERE</code>, <code>ORDER BY</code>, <code>GROUP BY</code>, <code>UNIQUE</code> y a los índices: es una decisión de modelado, no un detalle de instalación</li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="dense" data-theme="bdge" data-lang="es" lang="es" class="dense" data-marpit-pagination="11" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:dense;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="tipos-de-datos-caracteres-y-enteros">Tipos de datos: caracteres y enteros</h1>
<ul>
<li>Caracteres:
<ul>
<li><code>char(n)</code> un conjunto de <code>n</code> caracteres exactamente</li>
<li><code>varchar(n)</code> un conjunto variable de como máximo <code>n</code> caracteres</li>
<li><code>text</code> un conjunto de caracteres sin límite; no es parte del estándar SQL, pero lo soportan casi todos los SGBDR</li>
</ul>
</li>
<li>Números enteros: <code>integer</code>, <code>smallint</code>, <code>bigint</code></li>
</ul>
<table>
<thead>
<tr>
<th>Tipo</th>
<th>Tamaño</th>
<th>Rango</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>smallint</code></td>
<td>2 bytes</td>
<td>−32 768 a +32 767</td>
</tr>
<tr>
<td><code>integer</code></td>
<td>4 bytes</td>
<td>−2 147 483 648 a +2 147 483 647</td>
</tr>
<tr>
<td><code>bigint</code></td>
<td>8 bytes</td>
<td>−9 223 372 036 854 775 808 a +9 223 372 036 854 775 807</td>
</tr>
</tbody>
</table>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="dense" data-theme="bdge" data-lang="es" lang="es" class="dense" data-marpit-pagination="12" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:dense;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="tipos-de-datos-n%C3%BAmeros-mapas-de-bits-y-fechas">Tipos de datos: números, mapas de bits y fechas</h1>
<ul>
<li>Números de coma flotante (aproximados): <code>FLOAT</code> (4 bytes) y <code>DOUBLE</code>/<code>DOUBLE PRECISION</code> (8 bytes)
<ul>
<li>En MySQL, <code>REAL</code> es sinónimo de <code>DOUBLE</code> (salvo con el modo <code>REAL_AS_FLOAT</code>)</li>
<li>La forma <code>FLOAT(m,d)</code>/<code>DOUBLE(m,d)</code> es una extensión de MySQL obsoleta desde 8.0.17: no conviene usarla</li>
</ul>
</li>
<li>Números exactos: <code>DECIMAL(m,d)</code>/<code>NUMERIC(m,d)</code>, donde <code>m</code> es el número total de dígitos y <code>d</code> el de decimales; es el tipo adecuado para importes</li>
<li>Mapas de bits: <code>BIT(n)</code></li>
<li>Fechas: <code>DATE</code>, <code>TIME</code>, <code>DATETIME</code>, <code>TIMESTAMP</code>, <code>YEAR</code> — se ven en detalle a continuación; <code>INTERVAL</code> no es un tipo de columna en MySQL, sino parte de la aritmética de fechas</li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-theme="bdge" data-lang="es" lang="es" data-marpit-pagination="13" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="fechas">Fechas</h1>
<ul>
<li>La gestión de fechas cambia de un SGBDR a otro; la vemos para MySQL</li>
<li>Para ver los valores, podemos fijarnos en su «valor cero»:</li>
</ul>
<table>
<thead>
<tr>
<th>Tipo de dato</th>
<th>Valor cero</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>DATE</code></td>
<td><code>'0000-00-00'</code></td>
</tr>
<tr>
<td><code>TIME</code></td>
<td><code>'00:00:00'</code></td>
</tr>
<tr>
<td><code>DATETIME</code></td>
<td><code>'0000-00-00 00:00:00'</code></td>
</tr>
<tr>
<td><code>TIMESTAMP</code></td>
<td><code>'0000-00-00 00:00:00'</code></td>
</tr>
<tr>
<td><code>YEAR</code></td>
<td><code>0000</code></td>
</tr>
</tbody>
</table>
<p><code>TIMESTAMP</code> contiene una fecha compacta en el rango <code>'1970-01-01 00:00:01'</code> UTC a <code>'2038-01-19 03:14:07'</code> UTC</p>
<p>Las fechas cero sólo se aceptan si el <code>sql_mode</code> lo permite: en MySQL 8 el modo por defecto (estricto, con <code>NO_ZERO_DATE</code> y <code>NO_ZERO_IN_DATE</code>) las rechaza</p>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-theme="bdge" data-lang="es" lang="es" data-marpit-pagination="14" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="fechas-funciones">Fechas: funciones</h1>
<ul>
<li>MySQL ofrece funciones <code>YEAR()</code>, <code>MONTH()</code>, etc. para extraer datos particulares</li>
<li>Funciones de búsqueda con intervalos (similares a ANSI-SQL): <code>INTERVAL</code>, <code>BETWEEN</code>, etc.</li>
<li><code>CURRENT_DATE()</code>, <code>CURRENT_TIME()</code>, <code>CURRENT_TIMESTAMP()</code>, etc. devuelven el tiempo actual con el tipo correspondiente</li>
</ul>
<p>Posts desde hace una semana:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> <span class="hljs-operator">*</span> <span class="hljs-keyword">FROM</span> Posts <span class="hljs-keyword">WHERE</span> CreationDate <span class="hljs-operator">&gt;=</span> <span class="hljs-built_in">CURRENT_DATE</span>() <span class="hljs-operator">-</span> <span class="hljs-type">INTERVAL</span> <span class="hljs-number">1</span> WEEK;
</code></pre>
<p>(se puede usar <code>WEEK</code>, <code>DAY</code>, <code>HOUR</code>, etc.)</p>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-theme="bdge" data-lang="es" lang="es" data-marpit-pagination="15" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="fechas-rangos">Fechas: rangos</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> <span class="hljs-operator">*</span> <span class="hljs-keyword">FROM</span> Posts <span class="hljs-keyword">WHERE</span> CreationDate
    <span class="hljs-keyword">BETWEEN</span> <span class="hljs-built_in">CURRENT_DATE</span>() <span class="hljs-operator">-</span> <span class="hljs-type">INTERVAL</span> <span class="hljs-number">1</span> <span class="hljs-keyword">MONTH</span>
        <span class="hljs-keyword">AND</span> <span class="hljs-built_in">CURRENT_DATE</span>() <span class="hljs-operator">-</span> <span class="hljs-type">INTERVAL</span> <span class="hljs-number">1</span> WEEK;
</code></pre>
<p>Entre fechas específicas: las cuatro semanas anteriores, sin contar la última</p>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-theme="bdge" data-lang="es" lang="es" data-marpit-pagination="16" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="el-operador-cast">El operador <code>CAST()</code></h1>
<ul>
<li>SQL permite cambiar el tipo de una expresión con <code>CAST()</code></li>
<li>Los tipos permitidos son los vistos, aunque hay cierta variación</li>
<li>Por ejemplo, para un <code>INTEGER</code> siempre hay que decir si es <code>SIGNED</code> o <code>UNSIGNED</code></li>
<li>También se permite el tipo <code>CHAR</code>:</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-operator">&gt;</span> <span class="hljs-keyword">SELECT</span> CONCAT(<span class="hljs-string">&#x27;ABC&#x27;</span>,<span class="hljs-built_in">CAST</span>(<span class="hljs-number">1.1</span> <span class="hljs-keyword">AS</span> <span class="hljs-type">CHAR</span>(<span class="hljs-number">200</span>))) <span class="hljs-keyword">as</span> ABC;
ABC1<span class="hljs-number">.1</span>
<span class="hljs-operator">&gt;</span> <span class="hljs-keyword">SELECT</span> <span class="hljs-built_in">CAST</span>(<span class="hljs-string">&#x27;1.1&#x27;</span> <span class="hljs-keyword">as</span> UNSIGNED) <span class="hljs-keyword">AS</span> C;   <span class="hljs-comment">-- entero: trunca y avisa</span>
<span class="hljs-number">1</span>
<span class="hljs-operator">&gt;</span> <span class="hljs-keyword">SELECT</span> <span class="hljs-built_in">CAST</span>(<span class="hljs-string">&#x27;1.1&#x27;</span> <span class="hljs-keyword">as</span> <span class="hljs-type">DECIMAL</span>(<span class="hljs-number">10</span>,<span class="hljs-number">5</span>)) <span class="hljs-keyword">AS</span> C;
<span class="hljs-number">1.10000</span>
</code></pre>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-theme="bdge" data-lang="es" lang="es" data-marpit-pagination="17" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="aseguramiento-de-la-integridad">Aseguramiento de la integridad</h1>
<ul>
<li>Las partículas <code>FOREIGN KEY</code> de <code>CREATE TABLE</code> sirven para especificar las restricciones de integridad
<ul>
<li><strong>Integridad referencial</strong>: no se puede insertar un valor en una clave ajena que no exista en la tabla referenciada</li>
</ul>
</li>
<li>En cada tipo de modificación (<code>UPDATE</code> y <code>DELETE</code>) hay una posibilidad de trasladar cambios en cascada</li>
<li>Estas modificaciones se refieren a la eliminación o actualización de <strong>una fila que referencia a una fila eliminada o actualizada</strong></li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">FOREIGN KEY</span> attx <span class="hljs-keyword">REFERENCES</span> Tabla(atty)
    <span class="hljs-keyword">ON</span> <span class="hljs-keyword">DELETE</span> <span class="hljs-operator">&lt;</span>acción<span class="hljs-operator">&gt;</span>
    <span class="hljs-keyword">ON</span> <span class="hljs-keyword">UPDATE</span> <span class="hljs-operator">&lt;</span>acción<span class="hljs-operator">&gt;</span>
</code></pre>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-theme="bdge" data-lang="es" lang="es" data-marpit-pagination="18" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="aseguramiento-de-la-integridad-opciones">Aseguramiento de la integridad: opciones</h1>
<ul>
<li><code>NO ACTION</code> (por defecto) o <code>RESTRICT</code>. No permite la modificación: el gestor lanza un error y no deja hacer el cambio, para mantener la consistencia/integridad. En InnoDB ambas son equivalentes (se comprueban de inmediato)</li>
<li><code>CASCADE</code>. Elimina (o actualiza) todas las filas que referencian a la fila modificada (las que tienen su clave ajena apuntando a esta fila)</li>
<li><code>SET NULL</code>. Pone a nulo la clave ajena de las filas que la referencian (la columna debe admitir <code>NULL</code>)</li>
<li><code>SET DEFAULT</code>. Definida en el estándar: pone el valor por defecto. MySQL la reconoce, pero InnoDB rechaza la tabla que la usa</li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-theme="bdge" data-lang="es" lang="es" data-marpit-pagination="19" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="ejemplo-de-cascada">Ejemplo de cascada</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-operator">&gt;</span> <span class="hljs-keyword">CREATE TABLE</span> Factura
  (Id <span class="hljs-type">INT</span> <span class="hljs-keyword">PRIMARY KEY</span>, Cliente TEXT, Total <span class="hljs-type">DECIMAL</span>(<span class="hljs-number">10</span>,<span class="hljs-number">2</span>));
<span class="hljs-operator">&gt;</span> <span class="hljs-keyword">CREATE TABLE</span> ItemFactura
  (Id <span class="hljs-type">INT</span> , FactId <span class="hljs-type">INT</span>, Nombre TEXT,
   Cantidad <span class="hljs-type">INT</span>, Precio <span class="hljs-type">DECIMAL</span>(<span class="hljs-number">10</span>,<span class="hljs-number">2</span>),
     <span class="hljs-keyword">PRIMARY KEY</span>(Id,FactId),
     <span class="hljs-keyword">FOREIGN KEY</span> (FactId) <span class="hljs-keyword">REFERENCES</span> Factura(Id)
       <span class="hljs-keyword">ON</span> <span class="hljs-keyword">DELETE</span> CASCADE);

<span class="hljs-operator">&gt;</span> <span class="hljs-keyword">INSERT INTO</span> Factura <span class="hljs-keyword">VALUES</span> (<span class="hljs-number">5</span>, <span class="hljs-string">&#x27;Pedro&#x27;</span>, <span class="hljs-number">200.0</span>);
<span class="hljs-operator">&gt;</span> <span class="hljs-keyword">INSERT INTO</span> ItemFactura <span class="hljs-keyword">VALUES</span> (<span class="hljs-number">1</span>, <span class="hljs-number">5</span>, <span class="hljs-string">&#x27;Tuerca&#x27;</span>, <span class="hljs-number">2</span>, <span class="hljs-number">100</span>);
</code></pre>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="code" data-theme="bdge" data-lang="es" lang="es" class="code" data-marpit-pagination="20" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:code;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="ejemplo-de-cascada-efecto-del-delete">Ejemplo de cascada: efecto del <code>DELETE</code></h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-console"><span class="hljs-meta prompt_">&gt; </span><span class="language-bash">SELECT * FROM Factura;</span>
Id    Cliente        Total
----  -------------  ------
5     Pedro          200.00
<span class="hljs-meta prompt_">&gt; </span><span class="language-bash">SELECT * FROM ItemFactura;</span>
Id    FactId  Nombre  Cantidad  Precio
----  ------  ------  --------  ------
1     5       Tuerca  2         100.00
<span class="hljs-meta prompt_">
&gt; </span><span class="language-bash">DELETE FROM Factura WHERE Id = 5;</span>
<span class="hljs-meta prompt_">&gt; </span><span class="language-bash">SELECT COUNT(*) FROM ItemFactura;</span>
0
</code></pre>
<p>Al borrar la factura, <code>ON DELETE CASCADE</code> arrastra sus líneas</p>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-theme="bdge" data-lang="es" lang="es" data-marpit-pagination="21" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="alteraci%C3%B3n-del-esquema">Alteración del esquema</h1>
<ul>
<li>Una vez creada la tabla se puede alterar: añadir columnas, restricciones, etc.</li>
<li>Esto tiene un impacto en la base de datos (consultas en ejecución, bloqueos, recálculos como en el caso de añadir o modificar índices, etc.)</li>
<li>Algunos cambios obligan a reconstruir la tabla entera: en una tabla grande es una operación costosa, igual que crear un índice o reparticionar</li>
</ul>
<p>Añadir columnas:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">ALTER TABLE</span> tabla <span class="hljs-keyword">ADD</span> columna tipo [<span class="hljs-keyword">DEFAULT</span> valor];
</code></pre>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-theme="bdge" data-lang="es" lang="es" data-marpit-pagination="22" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="alteraci%C3%B3n-del-esquema-columnas">Alteración del esquema: columnas</h1>
<p>Eliminar columnas:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">ALTER TABLE</span> tabla <span class="hljs-keyword">DROP</span> columna;
</code></pre>
<p>Modificar una columna:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">ALTER TABLE</span> tabla MODIFY columna tipo;
</code></pre>
<p>Cambiar el nombre y definición de una columna:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">ALTER TABLE</span> tabla CHANGE columna_anterior columna_nueva tipo;
</code></pre>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-theme="bdge" data-lang="es" lang="es" data-marpit-pagination="23" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="alteraci%C3%B3n-del-esquema-restricciones">Alteración del esquema: restricciones</h1>
<p>Añadir una clave primaria:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">ALTER TABLE</span> tabla <span class="hljs-keyword">ADD</span> <span class="hljs-keyword">PRIMARY KEY</span> (columna);
</code></pre>
<p>Añadir una clave ajena:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">ALTER TABLE</span> tabla <span class="hljs-keyword">ADD</span> <span class="hljs-keyword">FOREIGN KEY</span> (columna) <span class="hljs-keyword">REFERENCES</span> tabla_(columna_);
</code></pre>
<p>Eliminar una tabla:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">DROP</span> <span class="hljs-keyword">TABLE</span> tabla;
</code></pre>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="compact" data-theme="bdge" data-lang="es" lang="es" class="compact" data-marpit-pagination="24" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:compact;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="alteraci%C3%B3n-del-esquema-columnas-calculadas">Alteración del esquema: columnas calculadas</h1>
<p>También se pueden añadir campos calculados (también en <code>CREATE TABLE</code>):</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">ALTER TABLE</span> tabla <span class="hljs-keyword">ADD</span> columna <span class="hljs-operator">&lt;</span>tipo<span class="hljs-operator">&gt;</span>
  GENERATED ALWAYS <span class="hljs-keyword">AS</span> (<span class="hljs-operator">&lt;</span>expresión<span class="hljs-operator">&gt;</span>) VIRTUAL <span class="hljs-operator">|</span> STORED;
</code></pre>
<ul>
<li><code>VIRTUAL</code> (por defecto) indica que el valor se calcula al leer la fila y no ocupa espacio en la tabla</li>
<li><code>STORED</code> indica que se calcula al insertar o actualizar la fila, por lo que ocupa espacio en disco</li>
<li>En InnoDB ambas admiten índices secundarios (el índice sobre una <code>VIRTUAL</code> sí guarda el valor); sólo una <code>STORED</code> puede formar parte de la clave primaria</li>
<li>La expresión debe ser determinista: no puede usar <code>NOW()</code>, <code>RAND()</code> ni consultas</li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-theme="bdge" data-lang="es" lang="es" data-marpit-pagination="25" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="columnas-calculadas-ejemplo">Columnas calculadas: ejemplo</h1>
<p>Generar los <em>tags</em> separados por comas:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">ALTER TABLE</span> Posts <span class="hljs-keyword">ADD</span> <span class="hljs-keyword">COLUMN</span> tags_csv TEXT GENERATED ALWAYS <span class="hljs-keyword">AS</span>
  (REPLACE(REPLACE(REPLACE(Tags, <span class="hljs-string">&#x27;&gt;&lt;&#x27;</span>, <span class="hljs-string">&#x27;,&#x27;</span>),<span class="hljs-string">&#x27;&lt;&#x27;</span>,<span class="hljs-string">&#x27;&#x27;</span>),<span class="hljs-string">&#x27;&gt;&#x27;</span>,<span class="hljs-string">&#x27;&#x27;</span>)) VIRTUAL;
</code></pre>
<p>O, como se verá más tarde, como un <em>array</em> JSON:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">ALTER TABLE</span> Posts <span class="hljs-keyword">ADD</span> <span class="hljs-keyword">COLUMN</span> tags_array JSON GENERATED ALWAYS <span class="hljs-keyword">AS</span>
  (<span class="hljs-built_in">CAST</span>(CONCAT(<span class="hljs-string">&#x27;[&#x27;</span>,
               REPLACE(REPLACE(REPLACE(Tags, <span class="hljs-string">&#x27;&gt;&lt;&#x27;</span>, <span class="hljs-string">&#x27;&quot;,&quot;&#x27;</span>),<span class="hljs-string">&#x27;&lt;&#x27;</span>,<span class="hljs-string">&#x27;&quot;&#x27;</span>),<span class="hljs-string">&#x27;&gt;&#x27;</span>,<span class="hljs-string">&#x27;&quot;&#x27;</span>),
               <span class="hljs-string">&#x27;]&#x27;</span>)
       <span class="hljs-keyword">AS</span> JSON)
  ) STORED;
</code></pre>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-theme="bdge" data-lang="es" lang="es" data-marpit-pagination="26" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="ejemplo-stack-overflow">Ejemplo Stack Overflow</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">CREATE TABLE</span> Posts (
  Id <span class="hljs-type">INT</span>,
  PostTypeId <span class="hljs-type">INT</span>,
  AcceptedAnswerId <span class="hljs-type">INT</span>,
  ParentId <span class="hljs-type">INT</span>,
  ...
  OwnerUserId <span class="hljs-type">INT</span>,
  ...
  <span class="hljs-keyword">PRIMARY KEY</span>(Id),
  <span class="hljs-keyword">FOREIGN KEY</span> (ParentId) <span class="hljs-keyword">REFERENCES</span> Posts(Id),
  <span class="hljs-keyword">FOREIGN KEY</span> (OwnerUserId) <span class="hljs-keyword">REFERENCES</span> Users(Id)
);
</code></pre>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-theme="bdge" data-lang="es" lang="es" data-marpit-pagination="27" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="ejemplo-stack-overflow-ii">Ejemplo Stack Overflow (ii)</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">CREATE TABLE</span> Comments (
  Id <span class="hljs-type">INT</span>,
  PostId <span class="hljs-type">INT</span>,
  ...
  UserId <span class="hljs-type">INT</span>,
  <span class="hljs-keyword">PRIMARY KEY</span>(Id),
  <span class="hljs-keyword">FOREIGN KEY</span> (PostId) <span class="hljs-keyword">REFERENCES</span> Posts(Id),
  <span class="hljs-keyword">FOREIGN KEY</span> (UserId) <span class="hljs-keyword">REFERENCES</span> Users(Id)
);
</code></pre>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-theme="bdge" data-lang="es" lang="es" data-marpit-pagination="28" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="vistas">Vistas</h1>
<ul>
<li>Las vistas son consultas parciales que se pueden reutilizar después</li>
<li>Representan patrones que se pueden sustituir en la consulta donde se usan</li>
<li>Es decir, donde se usa la vista se podría sustituir por su definición</li>
<li>Se crean con <code>CREATE OR REPLACE VIEW v AS SELECT ...</code></li>
<li>Dependiendo del SGBDR se generan vistas persistentes (guardadas en disco) o en memoria</li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-theme="bdge" data-lang="es" lang="es" data-marpit-pagination="29" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="vistas-ejemplo">Vistas: ejemplo</h1>
<p>Sólo preguntas (o sólo respuestas):</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">CREATE</span> <span class="hljs-keyword">OR</span> REPLACE <span class="hljs-keyword">VIEW</span> Questions <span class="hljs-keyword">AS</span> <span class="hljs-keyword">SELECT</span> <span class="hljs-operator">*</span> <span class="hljs-keyword">FROM</span> Posts <span class="hljs-keyword">WHERE</span> PostTypeId <span class="hljs-operator">=</span> <span class="hljs-number">1</span>;
</code></pre>
<p>Después se puede utilizar como si fuera una tabla:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> <span class="hljs-operator">*</span> <span class="hljs-keyword">FROM</span> Questions <span class="hljs-keyword">WHERE</span> Title <span class="hljs-keyword">LIKE</span> <span class="hljs-string">&#x27;%Java%&#x27;</span>;
</code></pre>
<p>Las vistas se pueden utilizar para eliminar y para insertar valores, siempre que no estén formadas por más de una tabla con <code>JOIN</code></p>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="compact" data-theme="bdge" data-lang="es" lang="es" class="compact" data-marpit-pagination="30" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:compact;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="expresiones-de-tabla-comunes-cte">Expresiones de tabla comunes (CTE)</h1>
<p>Una CTE (<em>Common Table Expression</em>) da nombre al resultado de una consulta<br />
durante una sola sentencia:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">WITH</span> PreguntasPorAutor <span class="hljs-keyword">AS</span> (
  <span class="hljs-keyword">SELECT</span> OwnerUserId, <span class="hljs-built_in">COUNT</span>(<span class="hljs-operator">*</span>) <span class="hljs-keyword">AS</span> NumPreguntas
  <span class="hljs-keyword">FROM</span> Posts
  <span class="hljs-keyword">WHERE</span> PostTypeId <span class="hljs-operator">=</span> <span class="hljs-number">1</span>
  <span class="hljs-keyword">GROUP</span> <span class="hljs-keyword">BY</span> OwnerUserId
)
<span class="hljs-keyword">SELECT</span> <span class="hljs-operator">*</span> <span class="hljs-keyword">FROM</span> PreguntasPorAutor <span class="hljs-keyword">WHERE</span> NumPreguntas <span class="hljs-operator">&gt;=</span> <span class="hljs-number">10</span>;
</code></pre>
<ul>
<li>Permite dividir una consulta compleja en pasos legibles</li>
<li>Se pueden definir varias CTE separadas por comas y hacer que unas usen otras</li>
<li>No crea una tabla ni una vista persistente</li>
<li>El nombre no implica que el motor materialice el resultado: lo decide el optimizador</li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-theme="bdge" data-lang="es" lang="es" data-marpit-pagination="31" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="varias-cte-en-una-consulta">Varias CTE en una consulta</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">WITH</span> Preguntas <span class="hljs-keyword">AS</span> (
  <span class="hljs-keyword">SELECT</span> Id, OwnerUserId <span class="hljs-keyword">FROM</span> Posts <span class="hljs-keyword">WHERE</span> PostTypeId <span class="hljs-operator">=</span> <span class="hljs-number">1</span>
), Respuestas <span class="hljs-keyword">AS</span> (
  <span class="hljs-keyword">SELECT</span> ParentId, <span class="hljs-built_in">COUNT</span>(<span class="hljs-operator">*</span>) <span class="hljs-keyword">AS</span> NumRespuestas
  <span class="hljs-keyword">FROM</span> Posts <span class="hljs-keyword">WHERE</span> PostTypeId <span class="hljs-operator">=</span> <span class="hljs-number">2</span>
  <span class="hljs-keyword">GROUP</span> <span class="hljs-keyword">BY</span> ParentId
)
<span class="hljs-keyword">SELECT</span> p.Id, p.OwnerUserId, <span class="hljs-built_in">COALESCE</span>(r.NumRespuestas, <span class="hljs-number">0</span>)
<span class="hljs-keyword">FROM</span> Preguntas <span class="hljs-keyword">AS</span> p
<span class="hljs-keyword">LEFT</span> <span class="hljs-keyword">JOIN</span> Respuestas <span class="hljs-keyword">AS</span> r <span class="hljs-keyword">ON</span> r.ParentId <span class="hljs-operator">=</span> p.Id;
</code></pre>
<p>Cada CTE debe tener una granularidad clara. Aquí <code>Respuestas</code> produce como  máximo una fila por pregunta antes de realizar la unión</p>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="compact" data-theme="bdge" data-lang="es" lang="es" class="compact" data-marpit-pagination="32" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:compact;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="cte-recursivas-with-recursive">CTE recursivas: <code>WITH RECURSIVE</code></h1>
<p>Una CTE recursiva une dos partes con <code>UNION ALL</code>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">WITH</span> <span class="hljs-keyword">RECURSIVE</span> Nombre <span class="hljs-keyword">AS</span> (
  <span class="hljs-keyword">SELECT</span> ...                      <span class="hljs-comment">-- miembro ancla: una sola vez</span>
  <span class="hljs-keyword">UNION</span> <span class="hljs-keyword">ALL</span>
  <span class="hljs-keyword">SELECT</span> ...
  <span class="hljs-keyword">FROM</span> Origen <span class="hljs-keyword">JOIN</span> Nombre <span class="hljs-keyword">ON</span> ...  <span class="hljs-comment">-- miembro recursivo</span>
)
<span class="hljs-keyword">SELECT</span> <span class="hljs-operator">*</span> <span class="hljs-keyword">FROM</span> Nombre;
</code></pre>
<ul>
<li>El <strong>ancla</strong> aporta las filas de partida</li>
<li>El <strong>miembro recursivo</strong> vuelve a nombrar la propia CTE y se reevalúa hasta que una vuelta no añade filas nuevas</li>
<li>Sirve para recorrer jerarquías (árboles, hilos, categorías) y necesita una condición que acote la recursión: el límite <code>cte_max_recursion_depth</code> (1000) es una red de seguridad, no la parada</li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="code" data-theme="bdge" data-lang="es" lang="es" class="code" data-marpit-pagination="33" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:code;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="cte-recursiva-el-hilo-de-una-pregunta">CTE recursiva: el hilo de una pregunta</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">WITH</span> <span class="hljs-keyword">RECURSIVE</span> PostThread <span class="hljs-keyword">AS</span> (
  <span class="hljs-keyword">SELECT</span> Id, ParentId, Id <span class="hljs-keyword">AS</span> RootId, <span class="hljs-number">0</span> <span class="hljs-keyword">AS</span> Depth
  <span class="hljs-keyword">FROM</span> Posts
  <span class="hljs-keyword">WHERE</span> Id <span class="hljs-operator">=</span> <span class="hljs-number">12345</span>            <span class="hljs-comment">-- la pregunta de partida</span>

  <span class="hljs-keyword">UNION</span> <span class="hljs-keyword">ALL</span>

  <span class="hljs-keyword">SELECT</span> p.Id, p.ParentId, t.RootId, t.Depth <span class="hljs-operator">+</span> <span class="hljs-number">1</span>
  <span class="hljs-keyword">FROM</span> Posts p
  <span class="hljs-keyword">JOIN</span> PostThread t <span class="hljs-keyword">ON</span> p.ParentId <span class="hljs-operator">=</span> t.Id
  <span class="hljs-keyword">WHERE</span> t.Depth <span class="hljs-operator">&lt;</span> <span class="hljs-number">2</span>           <span class="hljs-comment">-- guarda de terminación</span>
)
<span class="hljs-keyword">SELECT</span> <span class="hljs-operator">*</span> <span class="hljs-keyword">FROM</span> PostThread <span class="hljs-keyword">ORDER</span> <span class="hljs-keyword">BY</span> Depth, Id;
</code></pre>
<p><code>Depth 0</code> es la pregunta de partida; cada vuelta añade las respuestas cuyo <code>ParentId</code> apunta a una fila ya encontrada. En este <em>dataset</em> sólo hay dos niveles. El ejemplo completo está en el cuaderno de la sesión</p>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="section-divider" data-theme="bdge" data-lang="es" lang="es" class="section-divider" data-marpit-pagination="34" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:section-divider;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="data-manipulation-language">Data Manipulation Language</h1>
<h2 id="modificaci%C3%B3n-de-estado">Modificación de estado</h2>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-theme="bdge" data-lang="es" lang="es" data-marpit-pagination="35" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="insert"><code>INSERT</code></h1>
<ul>
<li>Permite insertar filas en las tablas</li>
<li>Puede opcionalmente especificar las columnas sobre las que actúa</li>
<li>También, opcionalmente, pueden obtenerse los valores de una consulta</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">INSERT INTO</span> tabla[(col1,col2, ...)] <span class="hljs-keyword">VALUES</span> (val1, val2, ...), ...;
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">INSERT INTO</span> tabla[(col1,col2, ...)] <span class="hljs-keyword">SELECT</span> ...;
</code></pre>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-theme="bdge" data-lang="es" lang="es" data-marpit-pagination="36" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="update"><code>UPDATE</code></h1>
<ul>
<li>Actualiza filas de una tabla</li>
<li>La cláusula <code>SET</code> especifica qué columnas se modifican y los nuevos valores</li>
<li>La cláusula <code>WHERE</code> selecciona las filas</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">UPDATE</span> tabla <span class="hljs-keyword">SET</span> att1 <span class="hljs-operator">=</span> valor1, att2 <span class="hljs-operator">=</span> valor2, ...
<span class="hljs-keyword">WHERE</span> ...;
</code></pre>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-theme="bdge" data-lang="es" lang="es" data-marpit-pagination="37" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="update-valores-antiguos-y-join"><code>UPDATE</code>: valores antiguos y <code>JOIN</code></h1>
<p>Se puede utilizar el valor antiguo de los campos en la cláusula <code>SET</code>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">UPDATE</span> tabla <span class="hljs-keyword">SET</span> att1 <span class="hljs-operator">=</span> att1 <span class="hljs-operator">+</span> <span class="hljs-number">1</span>, att2 <span class="hljs-operator">=</span> ...
<span class="hljs-keyword">WHERE</span> ...;
</code></pre>
<p>También se puede utilizar otra tabla como fuente, con un <code>INNER JOIN</code> (sintaxis de MySQL; PostgreSQL, por ejemplo, usa <code>UPDATE ... FROM</code>):</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">UPDATE</span> tabla
<span class="hljs-keyword">JOIN</span> otra <span class="hljs-keyword">ON</span> tabla.val <span class="hljs-operator">=</span> otra.otroval
<span class="hljs-keyword">SET</span> tabla.att1 <span class="hljs-operator">=</span> otra.otroatt1, ...
<span class="hljs-keyword">WHERE</span> ...;
</code></pre>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-theme="bdge" data-lang="es" lang="es" data-marpit-pagination="38" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="delete"><code>DELETE</code></h1>
<ul>
<li>Elimina filas de una tabla</li>
<li>Similar a <code>SELECT</code>, con una sola tabla en <code>FROM</code></li>
<li>La cláusula <code>WHERE</code> selecciona las filas</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">DELETE</span> <span class="hljs-keyword">FROM</span> tabla <span class="hljs-keyword">WHERE</span> condición;
</code></pre>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="section-divider" data-theme="bdge" data-lang="es" lang="es" class="section-divider" data-marpit-pagination="39" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:section-divider;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="gesti%C3%B3n-de-json-en-sql">Gestión de JSON en SQL</h1>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="compact" data-theme="bdge" data-lang="es" lang="es" class="compact" data-marpit-pagination="40" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:compact;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="introducci%C3%B3n-1">Introducción</h1>
<ul>
<li>Los SGBDR actuales permiten la integración con JSON, lo cual compararemos con las bases de datos documentales que veremos después</li>
<li>Las tablas pueden tener columnas de tipo JSON</li>
<li>Los documentos JSON pueden tener estructuras complejas</li>
<li>Se pueden hacer consultas sobre los documentos JSON y sus campos</li>
<li>Se pueden crear índices para acelerar las búsquedas usando campos de tipo JSON</li>
<li>El estándar SQL incluye funciones SQL/JSON desde SQL:2016 y un tipo <code>JSON</code> desde SQL:2023, pero cada SGBDR tiene su propia sintaxis</li>
<li>El soporte de MySQL es propio del producto: el tipo <code>JSON</code> y los operadores <code>-&gt;</code>/<code>-&gt;&gt;</code> no son la interfaz del estándar ni se trasladan tal cual a otro gestor</li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-theme="bdge" data-lang="es" lang="es" data-marpit-pagination="41" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="esquema-m%C3%ADnimo-mysql">Esquema mínimo (MySQL)</h1>
<p>Columna tipo JSON y columnas generadas:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">CREATE TABLE</span> Posts (
  Id <span class="hljs-type">BIGINT</span> <span class="hljs-keyword">PRIMARY KEY</span>,
  CreationDate <span class="hljs-type">TIMESTAMP</span>,
  Score <span class="hljs-type">INT</span>,
  doc JSON <span class="hljs-comment">-- documento completo</span>
);
<span class="hljs-keyword">CREATE TABLE</span> Users (
  Id <span class="hljs-type">BIGINT</span> <span class="hljs-keyword">PRIMARY KEY</span>,
  doc JSON
);
<span class="hljs-comment">-- Columna generada para indexar OwnerUserId</span>
<span class="hljs-keyword">ALTER TABLE</span> Posts <span class="hljs-keyword">ADD</span> <span class="hljs-keyword">COLUMN</span> OwnerUserId <span class="hljs-type">BIGINT</span>
  GENERATED ALWAYS <span class="hljs-keyword">AS</span> (JSON_EXTRACT(doc, <span class="hljs-string">&#x27;$.OwnerUserId&#x27;</span>)) STORED;
<span class="hljs-keyword">CREATE</span> INDEX idx_posts_owner <span class="hljs-keyword">ON</span> Posts(OwnerUserId);
</code></pre>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="compact small-table" data-theme="bdge" data-lang="es" lang="es" class="compact small-table" data-marpit-pagination="42" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:compact small-table;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="inserci%C3%B3n-json">Inserción JSON</h1>
<p>MySQL:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">INSERT INTO</span> Posts (Id, CreationDate, Score, doc) <span class="hljs-keyword">VALUES</span> (
  <span class="hljs-number">1</span>, NOW(), <span class="hljs-number">10</span>,
  <span class="hljs-built_in">JSON_OBJECT</span>(<span class="hljs-string">&#x27;Title&#x27;</span>,<span class="hljs-string">&#x27;How to X?&#x27;</span>,<span class="hljs-string">&#x27;Body&#x27;</span>,<span class="hljs-string">&#x27;...&#x27;</span>,<span class="hljs-string">&#x27;OwnerUserId&#x27;</span>,<span class="hljs-number">42</span>,<span class="hljs-string">&#x27;Tags&#x27;</span>,<span class="hljs-built_in">JSON_ARRAY</span>(<span class="hljs-string">&#x27;sql&#x27;</span>,<span class="hljs-string">&#x27;json&#x27;</span>))
);
</code></pre>
<p>Y así queda la fila en la tabla (<code>SELECT * FROM Posts</code>):</p>
<table>
<thead>
<tr>
<th>Id</th>
<th>CreationDate</th>
<th>Score</th>
<th>doc</th>
<th>OwnerUserId</th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td>2026-10-07 10:15:00</td>
<td>10</td>
<td><code>{&quot;Body&quot;: &quot;...&quot;, &quot;Tags&quot;: [&quot;sql&quot;, &quot;json&quot;], &quot;Title&quot;: &quot;How to X?&quot;, &quot;OwnerUserId&quot;: 42}</code></td>
<td>42</td>
</tr>
</tbody>
</table>
<p>MySQL guarda el JSON en formato binario y reordena las claves (primero las más cortas); <code>OwnerUserId</code> se rellena sola por ser columna generada</p>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-theme="bdge" data-lang="es" lang="es" data-marpit-pagination="43" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="operadores---y---mysql">Operadores <code>-&gt;</code> y <code>-&gt;&gt;</code> (MySQL)</h1>
<ul>
<li><code>doc -&gt; 'key'</code> devuelve JSON (tipo <code>JSON</code>)</li>
<li><code>doc -&gt;&gt; 'key'</code> devuelve texto (tipo <code>TEXT</code>)</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-comment">-- JSON_EXTRACT devuelve JSON; JSON_UNQUOTE(JSON_EXTRACT) devuelve texto</span>
<span class="hljs-keyword">SELECT</span> JSON_EXTRACT(doc, <span class="hljs-string">&#x27;$.Title&#x27;</span>) <span class="hljs-keyword">FROM</span> Posts <span class="hljs-keyword">WHERE</span> id <span class="hljs-operator">=</span> <span class="hljs-number">1</span>;
<span class="hljs-keyword">SELECT</span> JSON_UNQUOTE(JSON_EXTRACT(doc, <span class="hljs-string">&#x27;$.Title&#x27;</span>)) <span class="hljs-keyword">AS</span> Title <span class="hljs-keyword">FROM</span> Posts <span class="hljs-keyword">WHERE</span> id <span class="hljs-operator">=</span> <span class="hljs-number">1</span>;
<span class="hljs-comment">-- En MySQL se pueden usar los operadores (-&gt;, -&gt;&gt;)</span>
<span class="hljs-keyword">SELECT</span> doc<span class="hljs-operator">-</span><span class="hljs-operator">&gt;</span><span class="hljs-string">&#x27;$.Title&#x27;</span>, doc<span class="hljs-operator">-</span><span class="hljs-operator">&gt;&gt;</span><span class="hljs-string">&#x27;$.Title&#x27;</span> <span class="hljs-keyword">FROM</span> Posts <span class="hljs-keyword">WHERE</span> id <span class="hljs-operator">=</span> <span class="hljs-number">1</span>;
<span class="hljs-operator">&gt;&gt;</span><span class="hljs-operator">&gt;</span> &quot;How to X?&quot;,How <span class="hljs-keyword">to</span> X?
</code></pre>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-theme="bdge" data-lang="es" lang="es" data-marpit-pagination="44" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="m%C3%A1s-ejemplos">Más ejemplos</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> JSON_EXTRACT(doc, <span class="hljs-string">&#x27;$.Title&#x27;</span>) <span class="hljs-keyword">AS</span> title_text <span class="hljs-keyword">FROM</span> Posts <span class="hljs-keyword">WHERE</span> id <span class="hljs-operator">=</span> <span class="hljs-number">1</span>;

<span class="hljs-comment">-- Propiedad anidada (si doc contiene {&quot;owner&quot;: {&quot;id&quot;: 42}})</span>
<span class="hljs-keyword">SELECT</span> JSON_EXTRACT(doc, <span class="hljs-string">&#x27;$.owner.id&#x27;</span>) <span class="hljs-keyword">FROM</span> Posts <span class="hljs-keyword">WHERE</span> id <span class="hljs-operator">=</span> <span class="hljs-number">1</span>;

<span class="hljs-comment">-- O incluso</span>
<span class="hljs-keyword">SELECT</span> JSON_EXTRACT(JSON_EXTRACT(doc, <span class="hljs-string">&#x27;$.owner&#x27;</span>), <span class="hljs-string">&#x27;$.id&#x27;</span>) <span class="hljs-keyword">FROM</span> Posts <span class="hljs-keyword">WHERE</span> id <span class="hljs-operator">=</span> <span class="hljs-number">1</span>;
</code></pre>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="compact small-table" data-theme="bdge" data-lang="es" lang="es" class="compact small-table" data-marpit-pagination="45" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:compact small-table;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="json_table-expande-arrays"><code>JSON_TABLE</code> expande <em>arrays</em></h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-comment">-- Expandir tags con JSON_TABLE</span>
<span class="hljs-keyword">SELECT</span> p.id, jt.tag
<span class="hljs-keyword">FROM</span> Posts p,
     <span class="hljs-built_in">JSON_TABLE</span>(p.doc, <span class="hljs-string">&#x27;$.Tags[*]&#x27;</span> COLUMNS (tag TEXT PATH <span class="hljs-string">&#x27;$&#x27;</span>)) <span class="hljs-keyword">AS</span> jt
<span class="hljs-keyword">WHERE</span> p.id <span class="hljs-operator">=</span> <span class="hljs-number">1</span>;
</code></pre>
<div class="columns top">
<div class="column">
<p><code>jt</code> por sí misma: una fila por elemento de <code>$.Tags</code></p>
<table>
<thead>
<tr>
<th>tag</th>
</tr>
</thead>
<tbody>
<tr>
<td>sql</td>
</tr>
<tr>
<td>json</td>
</tr>
</tbody>
</table>
</div>
<div class="column">
<p>Resultado: la fila de <code>Posts</code> se repite con cada fila de <code>jt</code></p>
<table>
<thead>
<tr>
<th>id</th>
<th>tag</th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td>sql</td>
</tr>
<tr>
<td>1</td>
<td>json</td>
</tr>
</tbody>
</table>
</div>
</div>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-theme="bdge" data-lang="es" lang="es" data-marpit-pagination="46" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="b%C3%BAsquedas-operador-de-contenci%C3%B3n-mysql">Búsquedas: operador de contención (MySQL)</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-comment">-- Buscar OwnerUserId</span>
<span class="hljs-keyword">SELECT</span> <span class="hljs-operator">*</span> <span class="hljs-keyword">FROM</span> Posts <span class="hljs-keyword">WHERE</span> JSON_UNQUOTE(JSON_EXTRACT(doc, <span class="hljs-string">&#x27;$.OwnerUserId&#x27;</span>)) <span class="hljs-operator">=</span> <span class="hljs-string">&#x27;42&#x27;</span>;

<span class="hljs-comment">-- Buscar tag dentro de array (JSON_CONTAINS)</span>
<span class="hljs-keyword">SELECT</span> <span class="hljs-operator">*</span> <span class="hljs-keyword">FROM</span> Posts <span class="hljs-keyword">WHERE</span> JSON_CONTAINS(doc, <span class="hljs-string">&#x27;&quot;sql&quot;&#x27;</span>, <span class="hljs-string">&#x27;$.Tags&#x27;</span>);
</code></pre>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="compact small-table" data-theme="bdge" data-lang="es" lang="es" class="compact small-table" data-marpit-pagination="47" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:compact small-table;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="json_table-mysql"><code>JSON_TABLE</code> (MySQL)</h1>
<p>MySQL tiene <code>JSON_TABLE</code>, que mapea JSON a columnas:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> <span class="hljs-operator">*</span>
<span class="hljs-keyword">FROM</span> Posts,
     <span class="hljs-built_in">JSON_TABLE</span>(doc, <span class="hljs-string">&#x27;$&#x27;</span> COLUMNS (
       Title <span class="hljs-type">VARCHAR</span>(<span class="hljs-number">200</span>) PATH <span class="hljs-string">&#x27;$.Title&#x27;</span>,
       Body TEXT PATH <span class="hljs-string">&#x27;$.Body&#x27;</span>,
       OwnerUserId <span class="hljs-type">BIGINT</span> PATH <span class="hljs-string">&#x27;$.OwnerUserId&#x27;</span>
     )) <span class="hljs-keyword">AS</span> jt;
</code></pre>
<p><code>jt</code> por sí misma, para el <code>doc</code> de la fila con <code>Id</code> 1: una fila (la ruta <code>'$'</code> es el documento entero) con una columna por cada <code>PATH</code></p>
<table>
<thead>
<tr>
<th>Title</th>
<th>Body</th>
<th>OwnerUserId</th>
</tr>
</thead>
<tbody>
<tr>
<td>How to X?</td>
<td>...</td>
<td>42</td>
</tr>
</tbody>
</table>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="compact small-table" data-theme="bdge" data-lang="es" lang="es" class="compact small-table" data-marpit-pagination="48" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:compact small-table;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="json_table-mysql-resultado"><code>JSON_TABLE</code> (MySQL): resultado</h1>
<p>Cada fila de <code>Posts</code> se une con las filas que genera <code>JSON_TABLE</code> a partir de su <code>doc</code>; <code>SELECT *</code> devuelve las columnas de <code>Posts</code> seguidas de las de <code>jt</code></p>
<table>
<thead>
<tr>
<th>Id</th>
<th>CreationDate</th>
<th>Score</th>
<th>doc</th>
<th>OwnerUserId</th>
<th>Title</th>
<th>Body</th>
<th>OwnerUserId</th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td>2026-10-07 10:15:00</td>
<td>10</td>
<td><code>{&quot;Body&quot;: &quot;...&quot;, ...}</code></td>
<td>42</td>
<td>How to X?</td>
<td>...</td>
<td>42</td>
</tr>
</tbody>
</table>
<p>La primera <code>OwnerUserId</code> es la columna generada de <code>Posts</code>; la última, la que extrae <code>jt</code> del JSON</p>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="compact small-table" data-theme="bdge" data-lang="es" lang="es" class="compact small-table" data-marpit-pagination="49" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:compact small-table;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">

<h1 id="ejemplo-posts-con-usuario-mysql">Ejemplo: Posts con usuario (MySQL)</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">INSERT INTO</span> Posts (Id, CreationDate, PostTypeId, OwnerUserId, doc)
<span class="hljs-keyword">SELECT</span>
    p.Id, p.CreationDate, p.PostTypeId, p.OwnerUserId,
    <span class="hljs-built_in">JSON_OBJECT</span>(
        <span class="hljs-string">&#x27;post&#x27;</span>, <span class="hljs-built_in">JSON_OBJECT</span>(
            <span class="hljs-string">&#x27;Title&#x27;</span>, p.Title, <span class="hljs-string">&#x27;Body&#x27;</span>, p.Body, <span class="hljs-string">&#x27;Score&#x27;</span>, p.Score, ...
        ),
        <span class="hljs-string">&#x27;user&#x27;</span>, <span class="hljs-keyword">CASE</span>
            <span class="hljs-keyword">WHEN</span> u.Id <span class="hljs-keyword">IS</span> <span class="hljs-keyword">NOT NULL</span> <span class="hljs-keyword">THEN</span> <span class="hljs-built_in">JSON_OBJECT</span>(
                <span class="hljs-string">&#x27;Id&#x27;</span>, u.Id, <span class="hljs-string">&#x27;DisplayName&#x27;</span>, u.DisplayName,
                <span class="hljs-string">&#x27;Reputation&#x27;</span>, u.Reputation, ...
                )
            <span class="hljs-keyword">ELSE</span> <span class="hljs-built_in">JSON_OBJECT</span>(<span class="hljs-string">&#x27;Id&#x27;</span>, <span class="hljs-keyword">NULL</span>, <span class="hljs-string">&#x27;DisplayName&#x27;</span>, <span class="hljs-string">&#x27;Usuario eliminado&#x27;</span>)
        <span class="hljs-keyword">END</span>
    ) <span class="hljs-keyword">as</span> doc
<span class="hljs-keyword">FROM</span> Posts p
<span class="hljs-keyword">LEFT</span> <span class="hljs-keyword">JOIN</span> Users u <span class="hljs-keyword">ON</span> p.OwnerUserId <span class="hljs-operator">=</span> u.Id;
</code></pre>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="compact small-table" data-theme="bdge" data-lang="es" lang="es" class="compact small-table" data-marpit-pagination="51" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:compact small-table;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">

<h1 id="consejos-de-modelado">Consejos de modelado</h1>
<ul>
<li>Si un campo va a usarse frecuentemente para filtrado u orden: mantenerlo como columna separada además del JSON</li>
<li>JSON es ideal para documentos semiestructurados y variantes entre registros</li>
<li>Normaliza cuando hay relaciones 1:N que se consultarán frecuentemente</li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
