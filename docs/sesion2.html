</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="section-divider" data-theme="bdge" data-lang="es" lang="es" class="section-divider" data-marpit-pagination="54" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:section-divider;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="cuestiones-de-modelado-y-eficiencia">Cuestiones de modelado y eficiencia</h1>
<h2 id="modelado-conceptual">Modelado conceptual</h2>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-theme="bdge" data-lang="es" lang="es" data-marpit-pagination="55" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="modelado-conceptual-1">Modelado conceptual</h1>
<ul>
<li>Al modelar transformamos las entidades del «mundo» en entidades del dominio de modelado</li>
<li>Existen diferentes formas de modelar; las más generalizadas:
<ul>
<li>Modelado basado en objetos</li>
<li>Modelado basado en entidades y relaciones (ER)</li>
<li>Modelado relacional</li>
</ul>
</li>
<li>Cada forma de modelado posee:
<ul>
<li>Unos <strong>conceptos</strong> (estructuras)</li>
<li>Unas <strong>restricciones</strong></li>
<li>Unas <strong>operaciones</strong> para el acceso a los datos</li>
</ul>
</li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="56" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-theme="bdge" data-lang="es" lang="es" data-marpit-pagination="56" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="modelado-conceptual-conceptos-base">Modelado conceptual: conceptos base</h1>
<p>En general, la mayoría de las técnicas de modelado de datos se basan en:</p>
<ul>
<li><strong>Entidades</strong>: elementos del dominio a modelar con entidad e identidad propia</li>
<li><strong>Relaciones</strong>: relaciones entre elementos del dominio</li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="figure-only" data-theme="bdge" data-lang="es" lang="es" class="figure-only" data-marpit-pagination="57" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:figure-only;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="modelado-basado-en-objetos">Modelado basado en objetos</h1>
<p><img src="img/posts_comments_class_diagram.jpg" alt="" style="height:240px;" /></p>
<p>En este modelo, el dominio se representa con <strong>objetos</strong> y <strong>relaciones</strong> de herencia, clientela y composición (contenido)</p>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-theme="bdge" data-lang="es" lang="es" data-marpit-pagination="58" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="modelado-basado-en-objetos-clases">Modelado basado en objetos: clases</h1>
<p>Correspondería a un código de definición de clases parecido a:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Post</span>:
    <span class="hljs-keyword">def</span> <span class="hljs-title function_">__init__</span>(<span class="hljs-params">self</span>):
        <span class="hljs-variable language_">self</span>.Title = <span class="hljs-string">&quot;&quot;</span>
        <span class="hljs-variable language_">self</span>.Body = <span class="hljs-string">&quot;&quot;</span>
        <span class="hljs-variable language_">self</span>.Comments = []

<span class="hljs-keyword">class</span> <span class="hljs-title class_">Comment</span>:
    <span class="hljs-keyword">def</span> <span class="hljs-title function_">__init__</span>(<span class="hljs-params">self</span>):
        <span class="hljs-variable language_">self</span>.Text = <span class="hljs-string">&quot;&quot;</span>
</code></pre>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="59" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-theme="bdge" data-lang="es" lang="es" data-marpit-pagination="59" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="uso-del-modelo-en-un-lenguaje-oo">Uso del modelo en un lenguaje OO</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># Base de datos de Posts</span>
stackoverflow = []

<span class="hljs-comment"># A través de la página web, nuevo Post...</span>
<span class="hljs-comment"># (request representa la petición web recibida)</span>
new_post = Post()
new_post.Title = request.Title
new_post.Body = request.Body
stackoverflow.append(new_post)

<span class="hljs-comment"># A través de la página web, nuevo comentario</span>
<span class="hljs-comment"># sobre un Post que se mostró en la web...</span>
new_comment = Comment()
new_comment.Text = request.Text
request.Post.Comments.append(new_comment)
</code></pre>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="60" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-theme="bdge" data-lang="es" lang="es" data-marpit-pagination="60" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="navegaci%C3%B3n">Navegación</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># Dado un Post, mostrar el texto</span>
<span class="hljs-comment"># de todos los comentarios</span>
<span class="hljs-keyword">for</span> comment <span class="hljs-keyword">in</span> post.Comments:
    <span class="hljs-built_in">print</span>(comment.Text)

<span class="hljs-comment"># Número medio de comentarios por Post</span>
nc = <span class="hljs-number">0</span>
<span class="hljs-keyword">for</span> post <span class="hljs-keyword">in</span> stackoverflow:
    nc = nc + <span class="hljs-built_in">len</span>(post.Comments)
<span class="hljs-built_in">print</span>(nc / <span class="hljs-built_in">len</span>(stackoverflow))

<span class="hljs-comment"># Número medio de comentarios por Post (alt)</span>
<span class="hljs-built_in">print</span>(<span class="hljs-built_in">sum</span>(<span class="hljs-built_in">len</span>(p.Comments) <span class="hljs-keyword">for</span> p <span class="hljs-keyword">in</span> stackoverflow)
      / <span class="hljs-built_in">len</span>(stackoverflow))
</code></pre>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="61" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-theme="bdge" data-lang="es" lang="es" data-marpit-pagination="61" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="modelado-basado-en-objetos-valoraci%C3%B3n">Modelado basado en objetos: valoración</h1>
<ul>
<li>El modelado es más natural (se modelan objetos que pueden corresponder con el mundo real)</li>
<li>Se incluyen relaciones de herencia, parte-de, etc.</li>
<li>Se permiten relaciones de contenido, jerárquicas</li>
<li>Se permiten colecciones de objetos</li>
<li>El tiempo de vida (<em>lifespan</em>) de una entidad se liga a las relaciones de contenido:
<ul>
<li>Entidades dependientes de un «padre»: contenido</li>
<li>Entidades con vida independiente: referencia (clientela)</li>
</ul>
</li>
<li>Es el par <strong>agregar</strong>/<strong>referenciar</strong> de la sesión 1, que volverá con el modelo documental</li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="62" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="section-divider" data-theme="bdge" data-lang="es" lang="es" class="section-divider" data-marpit-pagination="62" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:section-divider;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="modelado-relacional">Modelado relacional</h1>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="63" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="figure-only" data-theme="bdge" data-lang="es" lang="es" class="figure-only" data-marpit-pagination="63" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:figure-only;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="modelado-relacional-stack-overflow">Modelado relacional: Stack Overflow</h1>
<p><img src="img/stackoverflow_diagram.png" alt="" style="height:480px;" /></p>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="64" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-theme="bdge" data-lang="es" lang="es" data-marpit-pagination="64" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="modelado-relacional-1">Modelado relacional</h1>
<ul>
<li>Caso particular de modelado conceptual que utiliza las abstracciones del <strong>modelo relacional</strong>:
<ul>
<li>Tablas para describir entidades del dominio</li>
<li>Relaciones entre entidades (tablas)</li>
<li>Restricciones (claves ajenas, tipos básicos)</li>
</ul>
</li>
<li>El modelado también se hace en base a <strong>entidades</strong> y <strong>relaciones</strong>:
<ul>
<li>Siguiendo las restricciones vistas en la sesión anterior</li>
<li>Aplicando los conceptos del modelado de datos conceptual</li>
</ul>
</li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="65" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="compact" data-theme="bdge" data-lang="es" lang="es" class="compact" data-marpit-pagination="65" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:compact;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="relaciones-entre-entidades">Relaciones entre entidades</h1>
<div class="columns">
<div class="column">
<ul>
<li><strong>Cardinalidad</strong> y <strong>dependencia</strong></li>
<li>Cardinalidad: las relaciones pueden ser <strong>1:1</strong>, <strong>1:n</strong> o <strong>n:m</strong>, e indican el grado de relación de una entidad con el resto</li>
<li>Dependencia (tiempo de vida):
<ul>
<li><em><strong>Identifying</strong></em> (dependientes): el tiempo de vida de la entidad enlazada depende de la entidad padre</li>
<li><em><strong>Non-identifying</strong></em> (no dependientes): las entidades tienen vida propia</li>
</ul>
</li>
</ul>
</div>
<div class="column">
<p><img src="img/cardinality.png" alt="" style="width:200px;" /></p>
</div>
</div>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="66" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="compact column-figure" data-theme="bdge" data-lang="es" lang="es" class="compact column-figure" data-marpit-pagination="66" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:compact column-figure;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="relaciones-11">Relaciones 1:1</h1>
<div class="columns">
<div class="column">
<ul>
<li><strong>Conceptualmente</strong> existe un Post que hace de <em>excerpt</em> (resumen, descripción) de un Tag</li>
<li>Posts y Tags, con respecto a «Excerpt», es <strong>1:1</strong></li>
<li>En el modelado relacional equivale a una clave ajena que puede estar en una de las dos tablas o en ambas</li>
</ul>
</div>
<div class="column">
<p><img src="img/posts_tags_1_1.png" alt="" style="height:480px;" /></p>
</div>
</div>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="67" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="compact column-figure" data-theme="bdge" data-lang="es" lang="es" class="compact column-figure" data-marpit-pagination="67" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:compact column-figure;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="relaciones-1n-uno-a-muchos">Relaciones 1:n (uno a muchos)</h1>
<div class="columns">
<div class="column">
<ul>
<li><strong>Conceptualmente</strong> se pueden hacer <strong>comentarios</strong> sobre un <strong>Post</strong></li>
<li>Posts y Comments tienen una relación <strong>1:n</strong></li>
<li>Puede ser dependiente o no (se ve después)</li>
<li>En el modelado relacional equivale a una clave ajena en la clase dependiente, o bien a una tabla separada (más adelante)</li>
</ul>
</div>
<div class="column">
<p><img src="img/posts_comments_1_n.png" alt="" style="height:480px;" /></p>
</div>
</div>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="68" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="figure-only" data-theme="bdge" data-lang="es" lang="es" class="figure-only" data-marpit-pagination="68" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:figure-only;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="relaciones-nm-muchos-a-muchos">Relaciones n:m (muchos a muchos)</h1>
<p>En Stack Overflow esta relación está desnormalizada (más adelante). Sin embargo, podemos construir la relación que existe entre <strong>Posts</strong> y <strong>Tags</strong>: sería una relación <strong>n:m</strong></p>
<p><img src="img/posts_tags1.png" alt="" style="height:380px;" /></p>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="69" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-theme="bdge" data-lang="es" lang="es" data-marpit-pagination="69" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="relaciones-nm-ii">Relaciones n:m (ii)</h1>
<ul>
<li>Conceptualmente, es una relación <em><strong>n:m</strong></em></li>
<li>Un Post puede tener muchos Tags</li>
<li>Y un Tag puede aparecer en muchos Posts</li>
<li>¿Cómo se obtendría?</li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="70" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="figure-only" data-theme="bdge" data-lang="es" lang="es" class="figure-only" data-marpit-pagination="70" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:figure-only;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="71" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-theme="bdge" data-lang="es" lang="es" data-marpit-pagination="71" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="relaciones-nm-iii">Relaciones n:m (iii)</h1>
<ul>
<li><strong>Ahora bien</strong>:
<ul>
<li>El modelo relacional <strong>no permite añadir esa relación tal cual</strong></li>
<li>Requiere del uso de una <strong>entidad artificial</strong> (<em>gap</em> semántico)</li>
</ul>
</li>
<li>¿Con qué se corresponde la tabla <code>PostTags</code> en el mundo real?</li>
<li>Ahora la relación es <em><strong>identifying</strong></em> 🙂</li>
<li>El caso anterior <strong>1:n</strong> es un caso especial de éste, por lo que también se podría implementar igual</li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="72" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-theme="bdge" data-lang="es" lang="es" data-marpit-pagination="72" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="relaciones-dependientes-vs-no-dependientes">Relaciones dependientes <em>vs.</em> no dependientes</h1>
<ul>
<li>Son más comunes las <strong>no dependientes</strong></li>
<li>Generalmente las relaciones <strong>dependientes</strong> se dan en casos de relaciones <strong>1:n</strong> (p. ej. Posts/Comments)
<ul>
<li>La entidad «1» se considera la entidad «<strong>padre</strong>» (<strong>Posts</strong>)</li>
<li>Y la otra, la entidad dependiente (<strong>Comments</strong>)</li>
</ul>
</li>
<li>La entidad dependiente está supeditada a la entidad padre</li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="73" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="compact" data-theme="bdge" data-lang="es" lang="es" class="compact" data-marpit-pagination="73" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:compact;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="relaciones-dependientes-ii">Relaciones dependientes (ii)</h1>
<ul>
<li>Su tiempo de vida también está supeditado:
<ul>
<li>Cuando la entidad padre se elimina, la entidad dependiente no tiene sentido por sí misma</li>
<li>Generalmente indica una restricción de clave ajena con cascada en <em>delete</em> y <em>update</em></li>
</ul>
</li>
<li>Estrategias de implementación relacional:
<ul>
<li>Una tabla aparte (el caso <strong>1:n</strong> es un caso particular de <strong>n:m</strong>)</li>
<li>Una clave ajena en la entidad <strong>n</strong> (dependiente o no) que referencia a la entidad <strong>1</strong></li>
</ul>
</li>
<li>En las relaciones <strong>dependientes</strong>, dos alternativas:
<ol>
<li>Clave primaria independiente para la entidad dependiente + clave ajena</li>
<li>Clave primaria que incluye la clave dependiente y la clave ajena</li>
</ol>
</li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="74" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="compact column-figure" data-theme="bdge" data-lang="es" lang="es" class="compact column-figure" data-marpit-pagination="74" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:compact column-figure;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="relaciones-dependientes-1n">Relaciones dependientes (1:n)</h1>
<div class="columns">
<div class="column">
<ul>
<li>La clave primaria de <strong>Comments</strong> <strong>incluye</strong> a la clave ajena de <strong>Posts</strong></li>
<li>La clave primaria es (Id, Posts_Id)</li>
<li>La identificación de un <strong>Comment</strong> sólo tiene sentido <strong>dentro</strong> de un Post</li>
<li>Al eliminar un Post, el comentario no tiene sentido</li>
<li>P. ej.: Post 1000, Comentario 1: (clave ⟨1,1000⟩)</li>
</ul>
</div>
<div class="column">
<p><img src="img/posts_comments_1_n_2.png" alt="" style="height:480px;" /></p>
</div>
</div>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="75" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="section-divider" data-theme="bdge" data-lang="es" lang="es" class="section-divider" data-marpit-pagination="75" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:section-divider;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="76" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="figure-only" data-theme="bdge" data-lang="es" lang="es" class="figure-only" data-marpit-pagination="76" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:figure-only;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="77" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="compact" data-theme="bdge" data-lang="es" lang="es" class="compact" data-marpit-pagination="77" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:compact;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="agregar-antes-de-unir-relaciones-1n">Agregar antes de unir relaciones 1:n</h1>
<p>Una publicación puede tener varios comentarios y votos. Unir ambas relaciones<br />
directamente multiplica sus filas:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">1 publicación × 3 comentarios × 4 votos = 12 filas
</code></pre>
<p>Aplicar <code>COUNT()</code> o <code>SUM()</code> después contaría varias veces los mismos hechos.<br />
La solución es agregar cada relación por separado hasta obtener <strong>una fila por<br />
publicación</strong> y unir después esos resultados. Si la granularidad buscada fuese<br />
una fila por pregunta incluyendo sus respuestas, cada agregado tendría que<br />
reducirse primero a <code>PreguntaId</code></p>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="78" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-theme="bdge" data-lang="es" lang="es" data-marpit-pagination="78" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="agregar-antes-de-unir-relaciones-1n-consulta">Agregar antes de unir relaciones 1:n (consulta)</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">WITH</span> C <span class="hljs-keyword">AS</span> (
  <span class="hljs-keyword">SELECT</span> PostId, <span class="hljs-built_in">COUNT</span>(<span class="hljs-operator">*</span>) <span class="hljs-keyword">AS</span> NumComentarios
  <span class="hljs-keyword">FROM</span> Comments <span class="hljs-keyword">GROUP</span> <span class="hljs-keyword">BY</span> PostId
), V <span class="hljs-keyword">AS</span> (
  <span class="hljs-keyword">SELECT</span> PostId, <span class="hljs-built_in">COUNT</span>(<span class="hljs-operator">*</span>) <span class="hljs-keyword">AS</span> NumVotos
  <span class="hljs-keyword">FROM</span> Votes <span class="hljs-keyword">GROUP</span> <span class="hljs-keyword">BY</span> PostId
)
<span class="hljs-keyword">SELECT</span> p.Id, <span class="hljs-built_in">COALESCE</span>(c.NumComentarios, <span class="hljs-number">0</span>), <span class="hljs-built_in">COALESCE</span>(v.NumVotos, <span class="hljs-number">0</span>)
<span class="hljs-keyword">FROM</span> Posts <span class="hljs-keyword">AS</span> p
<span class="hljs-keyword">LEFT</span> <span class="hljs-keyword">JOIN</span> C <span class="hljs-keyword">AS</span> c <span class="hljs-keyword">ON</span> c.PostId <span class="hljs-operator">=</span> p.Id
<span class="hljs-keyword">LEFT</span> <span class="hljs-keyword">JOIN</span> V <span class="hljs-keyword">AS</span> v <span class="hljs-keyword">ON</span> v.PostId <span class="hljs-operator">=</span> p.Id;
</code></pre>
<p>Con nombres distintos (<code>Id</code> frente a <code>PostId</code>) hace falta <code>ON</code>; si cada CTE expone la clave igual, <code>USING (PostId)</code> evita repetirla en cada unión</p>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="79" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="compact" data-theme="bdge" data-lang="es" lang="es" class="compact" data-marpit-pagination="79" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:compact;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="%C3%ADndices">Índices</h1>
<ul>
<li>Sea con SQL o con datos <em>raw</em>, la búsqueda no se puede realizar secuencialmente</li>
<li>Los <em><strong>índices</strong></em> se utilizan para acelerar esta búsqueda</li>
<li>El concepto de índice está presente en casi todas las bases de datos (también es un eje principal en las NoSQL)</li>
<li>En SQL, los índices se pueden aplicar a los valores de <strong>una o más columnas</strong></li>
<li>El planificador de consultas usa los índices disponibles; es <strong>labor del usuario</strong> definir los adecuados</li>
<li>Los índices aceleran las búsquedas, pero también ocupan espacio</li>
<li>Se utiliza <code>CREATE INDEX</code>, <code>ALTER TABLE</code> o se incluyen en <code>CREATE TABLE</code></li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="80" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="code" data-theme="bdge" data-lang="es" lang="es" class="code" data-marpit-pagination="80" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:code;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="%C3%ADndices-explain">Índices: <code>EXPLAIN</code></h1>
<p><code>EXPLAIN</code> muestra si una consulta usa un índice:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-console"><span class="hljs-meta prompt_">mysql&gt; </span><span class="language-bash">explain <span class="hljs-keyword">select</span> * from Posts <span class="hljs-built_in">where</span> Id=5;</span>
+----+-------------+-------+-------+---------------+---------+...
| id | select_type | table | type  | possible_keys | key     |...
+----+-------------+-------+-------+---------------+---------+...
|  1 | SIMPLE      | Posts | const | PRIMARY       | PRIMARY |...
+----+-------------+-------+-------+---------------+---------+...
</code></pre>
<p>En general, hay tres tipos de índices: basados en árboles balanceados, basados en tablas <em>hash</em> e índices <em>full-text</em></p>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="81" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-theme="bdge" data-lang="es" lang="es" data-marpit-pagination="81" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="%C3%ADndices-de-%C3%A1rboles-balanceados">Índices de árboles balanceados</h1>
<ul>
<li>Mantienen la clave ordenada dentro de un árbol balanceado (B-Tree, B+, etc.)</li>
<li>Aceleran búsquedas con los operadores <code>=</code>, <code>&lt;</code> y <code>&gt;</code>, y rangos (<code>BETWEEN</code>)</li>
<li>También <code>LIKE</code> que no empiece con comodín</li>
<li>Puede ayudar en <code>ORDER BY</code></li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="82" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="figure-only" data-theme="bdge" data-lang="es" lang="es" class="figure-only" data-marpit-pagination="82" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:figure-only;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="%C3%ADndices-de-%C3%A1rboles-balanceados-b-tree">Índices de árboles balanceados: B-tree</h1>
<p><img src="img/fig-btree.svg" alt="" style="height:510px;" /></p>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="83" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="compact" data-theme="bdge" data-lang="es" lang="es" class="compact" data-marpit-pagination="83" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:compact;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="%C3%ADndices-compuestos-y-prefijo-izquierdo">Índices compuestos y prefijo izquierdo</h1>
<p>Un índice B-tree compuesto se ordena lexicográficamente por sus columnas:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">CREATE</span> INDEX idx_autor_fecha
<span class="hljs-keyword">ON</span> Posts (OwnerUserId, CreationDate);
</code></pre>
<p>Puede localizar eficientemente consultas por:</p>
<ul>
<li><code>OwnerUserId</code></li>
<li><code>OwnerUserId</code> y <code>CreationDate</code></li>
</ul>
<p>En general, no permite localizar directamente sólo por <code>CreationDate</code>: falta<br />
la primera columna del índice. Es la <strong>regla del prefijo izquierdo</strong></p>
<p>El orden debe elegirse a partir de los patrones de acceso, no del orden en que<br />
las columnas aparecen escritas en <code>WHERE</code></p>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="84" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="compact" data-theme="bdge" data-lang="es" lang="es" class="compact" data-marpit-pagination="84" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:compact;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="igualdades-antes-del-primer-rango">Igualdades antes del primer rango</h1>
<p>Con un índice <code>(A, B, C)</code>, el caso más favorable encadena igualdades y después<br />
un rango:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">WHERE</span> A <span class="hljs-operator">=</span> <span class="hljs-number">7</span> <span class="hljs-keyword">AND</span> B <span class="hljs-operator">=</span> <span class="hljs-number">3</span> <span class="hljs-keyword">AND</span> C <span class="hljs-operator">&gt;=</span> <span class="hljs-number">100</span>
</code></pre>
<p>El árbol puede acotar el intervalo mediante las tres columnas. En cambio:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">WHERE</span> A <span class="hljs-operator">=</span> <span class="hljs-number">7</span> <span class="hljs-keyword">AND</span> B <span class="hljs-operator">&gt;=</span> <span class="hljs-number">3</span> <span class="hljs-keyword">AND</span> C <span class="hljs-operator">=</span> <span class="hljs-number">100</span>
</code></pre>
<p>el rango sobre <code>B</code> suele ser el último que acota el recorrido. <code>C</code> todavía<br />
puede evaluarse desde el índice —por ejemplo, mediante <em>index condition<br />
pushdown</em>—, pero normalmente no reduce el intervalo que hay que recorrer</p>
<p>Por eso suelen colocarse primero las columnas comparadas por igualdad y después<br />
la columna de rango, siempre contrastándolo con las consultas reales</p>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="85" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="compact" data-theme="bdge" data-lang="es" lang="es" class="compact" data-marpit-pagination="85" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:compact;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="predicados-sargables">Predicados sargables</h1>
<p>Un predicado es <strong>sargable</strong> cuando el motor puede convertirlo en un intervalo<br />
de búsqueda sobre el valor almacenado en el índice:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-comment">-- Sargable</span>
<span class="hljs-keyword">WHERE</span> CreationDate <span class="hljs-operator">&gt;=</span> <span class="hljs-string">&#x27;2016-01-01&#x27;</span>
  <span class="hljs-keyword">AND</span> CreationDate <span class="hljs-operator">&lt;</span>  <span class="hljs-string">&#x27;2017-01-01&#x27;</span>

<span class="hljs-comment">-- Mismo criterio lógico, pero no sargable sobre CreationDate</span>
<span class="hljs-keyword">WHERE</span> <span class="hljs-keyword">YEAR</span>(CreationDate) <span class="hljs-operator">=</span> <span class="hljs-number">2016</span>
</code></pre>
<p>Envolver la columna indexada en una función obliga normalmente a calcular la<br />
función por fila. También pueden impedir el acceso eficiente conversiones de<br />
tipo implícitas, operaciones aritméticas sobre la columna o patrones<br />
<code>LIKE '%texto'</code></p>
<p>La alternativa es reescribir el predicado sobre la columna original o crear,<br />
si el patrón lo justifica, una columna generada con su propio índice</p>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="86" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="compact" data-theme="bdge" data-lang="es" lang="es" class="compact" data-marpit-pagination="86" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:compact;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="%C3%ADndice-candidato-no-significa-%C3%ADndice-eficiente">Índice candidato no significa índice eficiente</h1>
<ul>
<li>Un índice es <strong>candidato</strong> si sus columnas y operadores permiten usarlo para<br />
la consulta; aparece normalmente en <code>possible_keys</code> de <code>EXPLAIN</code></li>
<li>El optimizador puede no elegirlo si estima que recuperará gran parte de la<br />
tabla, si otro índice es más selectivo o si el acceso aleatorio costaría más<br />
que un recorrido secuencial</li>
<li>Que aparezca en <code>key</code> confirma la elección, no que el plan sea bueno</li>
<li>Un índice de cobertura puede ahorrar el acceso a las filas de la tabla, pero<br />
ocupa más espacio y encarece las escrituras</li>
<li><code>EXPLAIN ANALYZE</code> ejecuta la consulta y permite contrastar estimaciones,<br />
filas recorridas, bucles y tiempo real</li>
</ul>
<p>La decisión se justifica con el patrón de consulta, la distribución de los<br />
datos y el plan medido, no sólo con la existencia del índice</p>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="87" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="compact code" data-theme="bdge" data-lang="es" lang="es" class="compact code" data-marpit-pagination="87" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:compact code;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="explain-rows-y-filtered"><code>EXPLAIN</code>: <code>rows</code> y <code>filtered</code></h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text"> type | key  |  rows | filtered | Extra
 ALL  | NULL |  2923 |    11.11 | Using where
</code></pre>
<ul>
<li><code>rows</code>: filas que el motor <strong>estima que tendrá que leer</strong> para resolver ese paso</li>
<li><code>filtered</code>: porcentaje <strong>estimado</strong> de esas filas que cumplen las condiciones de la tabla (<code>WHERE</code>) y siguen adelante; el resto se lee y se descarta</li>
<li>Filas que pasan al siguiente paso (por ejemplo, un <code>JOIN</code>): <code>rows × filtered / 100</code>, aquí unas 325 de 2923</li>
<li><code>filtered = 100</code> significa que casi todo lo leído se aprovecha; un valor bajo, que se lee mucho para quedarse con poco, señal de que falta un índice más selectivo</li>
<li>Es una estimación a partir de estadísticas, índices e histogramas; sin ellos, el optimizador aplica porcentajes por omisión que no salen de los datos</li>
<li><code>EXPLAIN ANALYZE</code> no tiene esta columna: mide las filas reales (<code>actual rows</code>)</li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="88" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="code" data-theme="bdge" data-lang="es" lang="es" class="code" data-marpit-pagination="88" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:code;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="una-tabla-para-comparar-planes">Una tabla para comparar planes</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">CREATE TABLE</span> PostsPlanDemo <span class="hljs-keyword">AS</span>
<span class="hljs-keyword">SELECT</span> Id, CreationDate, OwnerUserId, Score, PostTypeId, AnswerCount
<span class="hljs-keyword">FROM</span> Posts
<span class="hljs-keyword">WHERE</span> CreationDate <span class="hljs-keyword">IS</span> <span class="hljs-keyword">NOT NULL</span>
<span class="hljs-keyword">ORDER</span> <span class="hljs-keyword">BY</span> Id
LIMIT <span class="hljs-number">50000</span>;

<span class="hljs-keyword">ALTER TABLE</span> PostsPlanDemo
  <span class="hljs-keyword">ADD</span> <span class="hljs-keyword">PRIMARY KEY</span> (Id),
  <span class="hljs-keyword">ADD</span> INDEX idx_owner_creation (OwnerUserId, CreationDate),
  <span class="hljs-keyword">ADD</span> INDEX idx_creation_owner (CreationDate, OwnerUserId),
  <span class="hljs-keyword">ADD</span> INDEX idx_covering (PostTypeId, CreationDate, Score);
</code></pre>
<p>Una copia de 50 000 publicaciones con tres índices compuestos. Las diapositivas siguientes lanzan consultas sobre ella y comparan los planes. Las salidas son <strong>aproximadas</strong>: los tiempos dependen de la máquina y están redondeados</p>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="89" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="compact code" data-theme="bdge" data-lang="es" lang="es" class="compact code" data-marpit-pagination="89" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:compact code;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="leer-explain-analyze">Leer <code>EXPLAIN ANALYZE</code></h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql">EXPLAIN ANALYZE <span class="hljs-keyword">SELECT</span> Id <span class="hljs-keyword">FROM</span> PostsPlanDemo FORCE INDEX (idx_owner_creation)
<span class="hljs-keyword">WHERE</span> OwnerUserId <span class="hljs-operator">=</span> <span class="hljs-number">95</span> <span class="hljs-keyword">AND</span> CreationDate <span class="hljs-operator">&gt;=</span> <span class="hljs-string">&#x27;2016-01-01&#x27;</span>;
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">-&gt; Filter: (OwnerUserId = 95 and CreationDate &gt;= &#x27;2016-01-01&#x27;)
   (cost=1.2 rows=1) (actual time=0.01..1.1 rows=1636 loops=1)
   -&gt; Covering index range scan on PostsPlanDemo using idx_owner_creation
      over (OwnerUserId = 95 AND &#x27;2016-01-01&#x27; &lt;= CreationDate)
      (cost=1.2 rows=1) (actual time=0.01..0.6 rows=1636 loops=1)
</code></pre>
<ul>
<li>Se lee de dentro afuera: cada <code>-&gt;</code> es un paso que alimenta al de arriba</li>
<li><code>rows=1</code> es la <strong>estimación</strong>; <code>actual ... rows=1636</code>, las filas <strong>reales</strong>: aquí difieren mucho, así que la estimación es pobre</li>
<li><code>loops</code>: veces que se ejecutó el paso; <code>actual time</code>: ms hasta la primera y la última fila</li>
<li><code>FORCE INDEX</code> impone un índice: sirve para <strong>experimentar</strong></li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="90" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="compact code" data-theme="bdge" data-lang="es" lang="es" class="compact code" data-marpit-pagination="90" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:compact code;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="el-orden-de-las-columnas-en-el-plan">El orden de las columnas, en el plan</h1>
<p>La misma consulta forzada sobre cada índice:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">idx_owner_creation (OwnerUserId, CreationDate)
-&gt; Covering index range scan on PostsPlanDemo
   over (OwnerUserId = 95 AND &#x27;2016-01-01&#x27; &lt;= CreationDate)
   (actual time=0.01..0.6 rows=1636 loops=1)

idx_creation_owner (CreationDate, OwnerUserId)
-&gt; Covering index range scan on PostsPlanDemo
   over (&#x27;2016-01-01&#x27; &lt;= CreationDate AND 95 &lt;= OwnerUserId)
   (actual time=0.01..20 rows=48243 loops=1)
</code></pre>
<ul>
<li>Mismo resultado (1636 filas), distinto trabajo: 1636 entradas del índice frente a 48 243</li>
<li>Con la igualdad primero, el árbol acota el intervalo; con el rango primero recorre todas las fechas desde 2016 y descarta después a los demás propietarios</li>
<li>Para «todas las publicaciones desde una fecha» sería mejor el orden contrario</li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="91" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="compact code" data-theme="bdge" data-lang="es" lang="es" class="compact code" data-marpit-pagination="91" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:compact code;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="sargable-frente-a-no-sargable-en-el-plan">Sargable frente a no sargable, en el plan</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">WHERE</span> CreationDate <span class="hljs-operator">&gt;=</span> <span class="hljs-string">&#x27;2016-06-01&#x27;</span> <span class="hljs-keyword">AND</span> CreationDate <span class="hljs-operator">&lt;</span> <span class="hljs-string">&#x27;2016-07-01&#x27;</span>
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">-&gt; Covering index range scan on PostsPlanDemo using idx_creation_owner
   over (&#x27;2016-06-01&#x27; &lt;= CreationDate &lt; &#x27;2016-07-01&#x27;)
   (actual time=0.1..0.7 rows=2551 loops=1)
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">WHERE</span> <span class="hljs-keyword">YEAR</span>(CreationDate) <span class="hljs-operator">=</span> <span class="hljs-number">2016</span> <span class="hljs-keyword">AND</span> <span class="hljs-keyword">MONTH</span>(CreationDate) <span class="hljs-operator">=</span> <span class="hljs-number">6</span>
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">-&gt; Covering index scan on PostsPlanDemo using idx_covering
   (actual time=0.5..6 rows=50000 loops=1)
</code></pre>
<ul>
<li>Mismo resultado (2551 filas): con el rango se leen 2551 entradas del índice; con las funciones, las 50 000</li>
<li>Un <code>index scan</code> sin <code>over (...)</code> recorre el índice entero: no hay intervalo que buscar</li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="92" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="compact code" data-theme="bdge" data-lang="es" lang="es" class="compact code" data-marpit-pagination="92" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:compact code;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="%C3%ADndice-de-cobertura-en-el-plan">Índice de cobertura, en el plan</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> PostTypeId, CreationDate, Score <span class="hljs-keyword">FROM</span> PostsPlanDemo
<span class="hljs-keyword">WHERE</span> PostTypeId <span class="hljs-operator">=</span> <span class="hljs-number">1</span> <span class="hljs-keyword">AND</span> CreationDate <span class="hljs-operator">&gt;=</span> <span class="hljs-string">&#x27;2016-01-01&#x27;</span>
<span class="hljs-keyword">ORDER</span> <span class="hljs-keyword">BY</span> CreationDate LIMIT <span class="hljs-number">25</span>;
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">-&gt; Covering index range scan on PostsPlanDemo using idx_covering
</code></pre>
<p>Pidiendo además <code>AnswerCount</code>, que no está en <code>idx_covering</code>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">-&gt; Index range scan on PostsPlanDemo using idx_covering
   ..., with index condition: (PostTypeId = 1 and CreationDate &gt;= ...)
</code></pre>
<ul>
<li><code>Covering</code> significa que el índice contiene todas las columnas que pide la consulta: no se lee la tabla</li>
<li>Una columna más obliga a leer la fila de la tabla por cada entrada del índice</li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="93" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-theme="bdge" data-lang="es" lang="es" data-marpit-pagination="93" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="%C3%ADndices-de-tablas-hash">Índices de tablas <em>hash</em></h1>
<ul>
<li>Sólo para consultas de igualdad (<code>=</code> o <code>&lt;=&gt;</code>, la igualdad que trata <code>NULL</code> como un valor)</li>
<li>Son muy rápidos</li>
<li>No se pueden usar para <code>ORDER BY</code> ni para rangos</li>
<li>Sólo se pueden usar con valores completos de clave (no permiten prefijos, por ejemplo)</li>
<li>En MySQL sólo existen en los motores <code>MEMORY</code> y <code>NDB</code>: InnoDB usa siempre B-tree (su <em>adaptive hash index</em> es interno y automático)</li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="94" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="figure-only" data-theme="bdge" data-lang="es" lang="es" class="figure-only" data-marpit-pagination="94" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:figure-only;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="95" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-theme="bdge" data-lang="es" lang="es" data-marpit-pagination="95" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="%C3%ADndices-full-text">Índices <em>full-text</em></h1>
<ul>
<li>Usados en búsquedas inversas sobre campos textuales</li>
<li>Dada una palabra o conjunto de palabras, encuentran la fila o filas en las que el campo indexado contiene esas palabras</li>
<li>Tienen limitaciones con <code>LIKE</code> y comodines (<code>%</code>)</li>
<li>Por ello los SGBD proveen operadores especiales (p. ej. en MySQL <code>MATCH(...) AGAINST ...</code>, se estudia en prácticas)</li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="96" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="figure-only" data-theme="bdge" data-lang="es" lang="es" class="figure-only" data-marpit-pagination="96" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:figure-only;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
