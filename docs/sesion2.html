<li>SQL se divide lógicamente en dos sublenguajes:
<ul>
<li><strong>DML</strong> (<em>Data Manipulation Language</em>), visto en la sesión anterior</li>
<li><strong>DDL</strong> (<em>Data Definition Language</em>), el sublenguaje de definición del esquema de los datos</li>
</ul>
</li>
<li>En esta sesión veremos también la parte de actualización, modificación y borrado de datos de DML</li>
<li>Veremos cómo usar JSON en SQL</li>
<li>Finalmente, una guía de diseño de esquemas orientados a la eficiencia</li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" data-marpit-pagination="4" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="data-definition-language-ddl">Data Definition Language (DDL)</h1>
<ul>
<li>Permite describir los metadatos (tablas y relaciones entre ellas) de la base de datos</li>
<li>Tablas, dominios de los atributos y restricciones de integridad</li>
<li>Al conjunto de especificaciones se le conoce como <strong>esquema</strong> de la base de datos</li>
<li>Por lo tanto, define también la sintaxis de las operaciones de inserción (<code>INSERT</code>) y actualización (<code>UPDATE</code>)</li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" data-marpit-pagination="5" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="create-table"><code>CREATE TABLE</code></h1>
<ul>
<li>La construcción principal de SQL para la creación del esquema es la sentencia <code>CREATE TABLE</code></li>
<li>Para cada tabla, especifica sus columnas, dominios de columna y restricciones</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">CREATE TABLE</span> nombre (
  att1 tipo1 [[<span class="hljs-keyword">NOT</span>] <span class="hljs-keyword">NULL</span>] [<span class="hljs-keyword">UNIQUE</span>],
  att2 tipo2,
  ...
  <span class="hljs-keyword">PRIMARY KEY</span>(...),
  <span class="hljs-keyword">FOREIGN KEY</span> attx <span class="hljs-keyword">REFERENCES</span> Tabla(atty)
    <span class="hljs-keyword">ON</span> <span class="hljs-keyword">DELETE</span> opción
    <span class="hljs-keyword">ON</span> <span class="hljs-keyword">UPDATE</span> opción,
  ...
);
</code></pre>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" data-marpit-pagination="6" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="create-table-columnas"><code>CREATE TABLE</code>: columnas</h1>
<ul>
<li>Cada campo lista su tipo (se ven a continuación)</li>
<li>Opcionalmente se puede especificar si la columna admite valores nulos (<code>NULL</code>) o no (<code>NOT NULL</code>)</li>
<li>También se puede indicar que la columna contiene valores que no se repetirán, con <code>UNIQUE</code></li>
<li>Se le puede asignar un valor por defecto al insertar datos, con <code>DEFAULT x</code></li>
<li>No se muestra en el ejemplo, pero a un atributo también se le puede añadir <code>PRIMARY KEY</code></li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" data-marpit-pagination="7" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="create-table-claves-ajenas"><code>CREATE TABLE</code>: claves ajenas</h1>
<ul>
<li>Opcionalmente, se pueden añadir restricciones de integridad con <code>FOREIGN KEY</code>
<ul>
<li>Lista un conjunto de atributos de la tabla (<em><strong>clave ajena</strong></em>)</li>
<li>Que hace referencia a otro conjunto de atributos de otra tabla (<em><strong>clave</strong></em>)</li>
<li>Opcionalmente se puede especificar qué sucede cuando el elemento referenciado se elimina (<code>ON DELETE</code>) o se le cambia el valor (<code>ON UPDATE</code>)</li>
<li>Se estudian las opciones con detalle a continuación</li>
</ul>
</li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" data-marpit-pagination="8" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="creaci%C3%B3n-de-tablas-a-partir-de-consultas">Creación de tablas a partir de consultas</h1>
<ul>
<li>La construcción <code>CREATE TABLE</code> también permite crear tablas a partir de consultas</li>
<li>La sintaxis es <code>CREATE TABLE t AS SELECT ...</code>:</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">CREATE TABLE</span> T <span class="hljs-keyword">AS</span> <span class="hljs-keyword">SELECT</span> Id,Title <span class="hljs-keyword">FROM</span> Posts;
</code></pre>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="dense" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" class="dense" data-marpit-pagination="9" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:dense;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="tipos-de-datos-caracteres-y-enteros">Tipos de datos: caracteres y enteros</h1>
<ul>
<li>Caracteres:
<ul>
<li><code>char(n)</code> un conjunto de <code>n</code> caracteres exactamente</li>
<li><code>varchar(n)</code> un conjunto variable de como máximo <code>n</code> caracteres</li>
<li><code>text</code> un conjunto de caracteres sin límite; no es parte del estándar SQL, pero lo soportan casi todos los SGBDR</li>
</ul>
</li>
<li>Números enteros: <code>integer</code>, <code>smallint</code>, <code>bigint</code></li>
</ul>
<table>
<thead>
<tr>
<th>Tipo</th>
<th>Tamaño</th>
<th>Rango</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>smallint</code></td>
<td>2 bytes</td>
<td>−32 768 a +32 767</td>
</tr>
<tr>
<td><code>integer</code></td>
<td>4 bytes</td>
<td>−2 147 483 648 a +2 147 483 647</td>
</tr>
<tr>
<td><code>bigint</code></td>
<td>8 bytes</td>
<td>−9 223 372 036 854 775 808 a +9 223 372 036 854 775 807</td>
</tr>
</tbody>
</table>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" data-marpit-pagination="10" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="tipos-de-datos-n%C3%BAmeros-mapas-de-bits-y-fechas">Tipos de datos: números, mapas de bits y fechas</h1>
<ul>
<li>Números de coma flotante:
<ul>
<li><code>REAL(m,d)</code> (4 bytes), <code>FLOAT(m,d)</code> (4 bytes), <code>DOUBLE PRECISION(m,d)</code> (8 bytes), donde <code>m</code> es el número total de dígitos y <code>d</code> el número de dígitos decimales</li>
<li>La especificación de dígitos es opcional</li>
</ul>
</li>
<li>Mapas de bits: <code>BIT(n)</code>, <code>BIT VARYING(n)</code></li>
<li>Fechas: <code>DATE</code>, <code>TIME</code>, <code>DATETIME</code>, <code>TIMESTAMP</code>, <code>INTERVAL</code>, <code>YEAR</code> — se ven en detalle a continuación</li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" data-marpit-pagination="11" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="fechas">Fechas</h1>
<ul>
<li>La gestión de fechas cambia de un SGBDR a otro; la vemos para MySQL</li>
<li>Para ver los valores, podemos fijarnos en su «valor cero»:</li>
</ul>
<table>
<thead>
<tr>
<th>Tipo de dato</th>
<th>Valor cero</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>DATE</code></td>
<td><code>'0000-00-00'</code></td>
</tr>
<tr>
<td><code>TIME</code></td>
<td><code>'00:00:00'</code></td>
</tr>
<tr>
<td><code>DATETIME</code></td>
<td><code>'0000-00-00 00:00:00'</code></td>
</tr>
<tr>
<td><code>TIMESTAMP</code></td>
<td><code>'0000-00-00 00:00:00'</code></td>
</tr>
<tr>
<td><code>YEAR</code></td>
<td><code>0000</code></td>
</tr>
</tbody>
</table>
<p><code>TIMESTAMP</code> contiene una fecha compacta en el rango <code>'1970-01-01 00:00:01'</code> UTC a <code>'2038-01-19 03:14:07'</code> UTC</p>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" data-marpit-pagination="12" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="fechas-funciones">Fechas: funciones</h1>
<ul>
<li>MySQL ofrece funciones <code>YEAR()</code>, <code>MONTH()</code>, etc. para extraer datos particulares</li>
<li>Funciones de búsqueda con intervalos (similares a ANSI-SQL): <code>INTERVAL</code>, <code>BETWEEN</code>, etc.</li>
<li><code>CURRENT_DATE()</code>, <code>CURRENT_TIME()</code>, <code>CURRENT_TIMESTAMP()</code>, etc. devuelven el tiempo actual con el tipo correspondiente</li>
</ul>
<p>Posts desde hace una semana:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> <span class="hljs-operator">*</span> <span class="hljs-keyword">FROM</span> Posts <span class="hljs-keyword">WHERE</span> CreationDate <span class="hljs-operator">&gt;=</span> <span class="hljs-built_in">CURRENT_DATE</span>() <span class="hljs-operator">-</span> <span class="hljs-type">INTERVAL</span> <span class="hljs-number">1</span> WEEK;
</code></pre>
<p>(se puede usar <code>WEEK</code>, <code>DAY</code>, <code>HOUR</code>, etc.)</p>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" data-marpit-pagination="13" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="fechas-rangos">Fechas: rangos</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> <span class="hljs-operator">*</span> <span class="hljs-keyword">FROM</span> Posts <span class="hljs-keyword">WHERE</span> CreationDate
    <span class="hljs-keyword">BETWEEN</span> <span class="hljs-built_in">CURRENT_DATE</span>() <span class="hljs-operator">-</span> <span class="hljs-type">INTERVAL</span> <span class="hljs-number">1</span> <span class="hljs-keyword">MONTH</span>
        <span class="hljs-keyword">AND</span> <span class="hljs-built_in">CURRENT_DATE</span>() <span class="hljs-operator">-</span> <span class="hljs-type">INTERVAL</span> <span class="hljs-number">1</span> WEEK;
</code></pre>
<p>Entre fechas específicas: las cuatro semanas anteriores, sin contar la última.</p>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" data-marpit-pagination="14" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="el-operador-cast">El operador <code>CAST()</code></h1>
<ul>
<li>SQL permite cambiar el tipo de una expresión con <code>CAST()</code></li>
<li>Los tipos permitidos son los vistos, aunque hay cierta variación</li>
<li>Por ejemplo, para un <code>INTEGER</code> siempre hay que decir si es <code>SIGNED</code> o <code>UNSIGNED</code></li>
<li>También se permite el tipo <code>CHAR</code>:</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-operator">&gt;</span> <span class="hljs-keyword">SELECT</span> CONCAT(<span class="hljs-string">&#x27;ABC&#x27;</span>,<span class="hljs-built_in">CAST</span>(<span class="hljs-number">1.1</span> <span class="hljs-keyword">AS</span> <span class="hljs-type">CHAR</span>(<span class="hljs-number">200</span>))) <span class="hljs-keyword">as</span> ABC;
ABC1<span class="hljs-number">.1</span>
<span class="hljs-operator">&gt;</span> <span class="hljs-keyword">SELECT</span> <span class="hljs-built_in">CAST</span>(<span class="hljs-string">&#x27;1.1&#x27;</span> <span class="hljs-keyword">as</span> UNSIGNED) <span class="hljs-keyword">AS</span> C;
<span class="hljs-number">1.1</span>
<span class="hljs-operator">&gt;</span> <span class="hljs-keyword">SELECT</span> <span class="hljs-built_in">CAST</span>(<span class="hljs-string">&#x27;1.1&#x27;</span> <span class="hljs-keyword">as</span> <span class="hljs-type">DECIMAL</span>(<span class="hljs-number">10</span>,<span class="hljs-number">5</span>)) <span class="hljs-keyword">AS</span> C;
<span class="hljs-number">1.10000</span>
</code></pre>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" data-marpit-pagination="15" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="aseguramiento-de-la-integridad">Aseguramiento de la integridad</h1>
<ul>
<li>Las partículas <code>FOREIGN KEY</code> de <code>CREATE TABLE</code> sirven para especificar las restricciones de integridad</li>
<li>En cada tipo de modificación (<code>UPDATE</code> y <code>DELETE</code>) hay una posibilidad de trasladar cambios en cascada</li>
<li>Estas modificaciones se refieren a la eliminación o actualización de <strong>una fila que referencia a una fila eliminada o actualizada</strong></li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" data-marpit-pagination="16" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="aseguramiento-de-la-integridad-opciones">Aseguramiento de la integridad: opciones</h1>
<p>Cuatro posibilidades:</p>
<ul>
<li><code>NO ACTION</code> (por defecto). No permite la modificación: el gestor lanza una excepción y no deja hacer el cambio, para mantener la consistencia/integridad</li>
<li><code>CASCADE</code>. Elimina (o actualiza) todas las filas que referencian a la fila modificada (las que tienen su clave ajena apuntando a esta fila)</li>
<li><code>SET DEFAULT</code></li>
<li><code>SET NULL</code>. Establece el valor por defecto o nulo (la columna de la clave ajena debe permitirlo) al eliminar o modificar la fila</li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" data-marpit-pagination="17" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="ejemplo-de-cascada">Ejemplo de cascada</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-operator">&gt;</span> <span class="hljs-keyword">CREATE TABLE</span> Factura
  (Id <span class="hljs-type">INT</span> <span class="hljs-keyword">PRIMARY KEY</span>, Cliente TEXT, Total NUMBER);
<span class="hljs-operator">&gt;</span> <span class="hljs-keyword">CREATE TABLE</span> ItemFactura
  (Id <span class="hljs-type">INT</span> , FactId <span class="hljs-type">INT</span>, Nombre Text,
   Cantidad <span class="hljs-type">Int</span>, Precio NUMBER,
     <span class="hljs-keyword">PRIMARY KEY</span>(Id,FactId),
     <span class="hljs-keyword">FOREIGN KEY</span> (FactId) <span class="hljs-keyword">REFERENCES</span> Factura(Id) <span class="hljs-keyword">ON</span> <span class="hljs-keyword">DELETE</span> CASCADE);

<span class="hljs-operator">&gt;</span> <span class="hljs-keyword">INSERT INTO</span> Factura <span class="hljs-keyword">VALUES</span> (<span class="hljs-number">5</span>, &quot;Pedro&quot;, <span class="hljs-number">200.0</span>);
<span class="hljs-operator">&gt;</span> <span class="hljs-keyword">INSERT INTO</span> ItemFactura <span class="hljs-keyword">VALUES</span> (<span class="hljs-number">1</span>, <span class="hljs-number">5</span>, &quot;Tuerca&quot;, <span class="hljs-number">2</span>, <span class="hljs-number">100</span>);
</code></pre>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="code" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" class="code" data-marpit-pagination="18" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:code;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="ejemplo-de-cascada-efecto-del-delete">Ejemplo de cascada: efecto del <code>DELETE</code></h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-console"><span class="hljs-meta prompt_">&gt; </span><span class="language-bash">SELECT * FROM Factura;</span>
Id    Cliente        Total
----  -------------  -----
5     Pedro          200
<span class="hljs-meta prompt_">&gt; </span><span class="language-bash">SELECT * FROM ItemFactura;</span>
Id    FactId         Nomb  Cant  Prec
----  -------------  ----  ----  ----
1     5              Tuerca  2   100
<span class="hljs-meta prompt_">
&gt; </span><span class="language-bash">DELETE FROM Factura WHERE Id = 5;</span>
<span class="hljs-meta prompt_">&gt; </span><span class="language-bash">SELECT COUNT(*) FROM ItemFactura;</span>
0
</code></pre>
<p>Al borrar la factura, <code>ON DELETE CASCADE</code> arrastra sus líneas.</p>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" data-marpit-pagination="19" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="alteraci%C3%B3n-del-esquema">Alteración del esquema</h1>
<ul>
<li>Una vez creada la tabla se puede alterar: añadir columnas, restricciones, etc.</li>
<li>Esto tiene un impacto en la base de datos (consultas en ejecución, bloqueos, recálculos como en el caso de añadir o modificar índices, etc.)</li>
</ul>
<p>Añadir columnas:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">ALTER TABLE</span> tabla <span class="hljs-keyword">ADD</span> columna tipo [<span class="hljs-keyword">DEFAULT</span> valor];
</code></pre>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" data-marpit-pagination="20" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="alteraci%C3%B3n-del-esquema-columnas">Alteración del esquema: columnas</h1>
<p>Eliminar columnas:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">ALTER TABLE</span> tabla <span class="hljs-keyword">DROP</span> columna;
</code></pre>
<p>Modificar una columna:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">ALTER TABLE</span> tabla MODIFY columna tipo;
</code></pre>
<p>Cambiar el nombre y definición de una columna:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">ALTER TABLE</span> tabla CHANGE columna_anterior columna_nueva tipo;
</code></pre>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" data-marpit-pagination="21" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="alteraci%C3%B3n-del-esquema-restricciones">Alteración del esquema: restricciones</h1>
<p>Añadir una clave primaria:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">ALTER TABLE</span> tabla <span class="hljs-keyword">ADD CONSTRAINT</span> <span class="hljs-keyword">PRIMARY KEY</span> columna;
</code></pre>
<p>Añadir una clave ajena:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">ALTER TABLE</span> tabla <span class="hljs-keyword">ADD</span> <span class="hljs-keyword">FOREIGN KEY</span> (columna) <span class="hljs-keyword">REFERENCES</span> tabla_(columna_);
</code></pre>
<p>Eliminar una tabla:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">DROP</span> <span class="hljs-keyword">TABLE</span> tabla;
</code></pre>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" data-marpit-pagination="22" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="alteraci%C3%B3n-del-esquema-columnas-calculadas">Alteración del esquema: columnas calculadas</h1>
<p>También se pueden añadir campos calculados (también en <code>CREATE TABLE</code>):</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">ALTER TABLE</span> tabla <span class="hljs-keyword">ADD</span> columna <span class="hljs-operator">&lt;</span>tipo<span class="hljs-operator">&gt;</span>
  GENERATED ALWAYS <span class="hljs-keyword">AS</span> (<span class="hljs-operator">&lt;</span>expresión<span class="hljs-operator">&gt;</span>) VIRTUAL <span class="hljs-operator">|</span> STORED;
</code></pre>
<ul>
<li><code>VIRTUAL</code> indica que el valor se calcula al acceder a la columna (en general más lento)</li>
<li><code>STORED</code> indica que se calcula al insertar o actualizar la fila, por lo que ocupa espacio en disco</li>
<li>Sólo las columnas <code>STORED</code> pueden usarse en índices</li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" data-marpit-pagination="23" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="columnas-calculadas-ejemplo">Columnas calculadas: ejemplo</h1>
<p>Generar los <em>tags</em> separados por comas:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">ALTER TABLE</span> Posts <span class="hljs-keyword">ADD</span> <span class="hljs-keyword">COLUMN</span> tags_csv TEXT GENERATED ALWAYS <span class="hljs-keyword">AS</span>
  (REPLACE(REPLACE(REPLACE(Tags, <span class="hljs-string">&#x27;&gt;&lt;&#x27;</span>, <span class="hljs-string">&#x27;,&#x27;</span>),<span class="hljs-string">&#x27;&lt;&#x27;</span>,<span class="hljs-string">&#x27;&#x27;</span>),<span class="hljs-string">&#x27;&gt;&#x27;</span>,<span class="hljs-string">&#x27;&#x27;</span>)) VIRTUAL;
</code></pre>
<p>O, como se verá más tarde, como un <em>array</em> JSON:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">ALTER TABLE</span> Posts <span class="hljs-keyword">ADD</span> <span class="hljs-keyword">COLUMN</span> tags_array JSON GENERATED ALWAYS <span class="hljs-keyword">AS</span>
  (<span class="hljs-built_in">CAST</span>(CONCAT(<span class="hljs-string">&#x27;[&#x27;</span>,
               REPLACE(REPLACE(REPLACE(Tags, <span class="hljs-string">&#x27;&gt;&lt;&#x27;</span>, <span class="hljs-string">&#x27;&quot;,&quot;&#x27;</span>),<span class="hljs-string">&#x27;&lt;&#x27;</span>,<span class="hljs-string">&#x27;&quot;&#x27;</span>),<span class="hljs-string">&#x27;&gt;&#x27;</span>,<span class="hljs-string">&#x27;&quot;&#x27;</span>),
               <span class="hljs-string">&#x27;]&#x27;</span>)
       <span class="hljs-keyword">AS</span> JSON)
  ) STORED;
</code></pre>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" data-marpit-pagination="24" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="ejemplo-stack-overflow">Ejemplo Stack Overflow</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">CREATE TABLE</span> Posts (
  Id <span class="hljs-type">INT</span>,
  PostTypeId <span class="hljs-type">INT</span>,
  AcceptedAnswerId <span class="hljs-type">INT</span>,
  ParentId <span class="hljs-type">INT</span>,
  ...
  OwnerUserId TEXT,
  ...
  <span class="hljs-keyword">PRIMARY KEY</span>(Id),
  <span class="hljs-keyword">FOREIGN KEY</span> (ParentId) <span class="hljs-keyword">REFERENCES</span> Posts(Id),
  <span class="hljs-keyword">FOREIGN KEY</span> (OwnerUserId) <span class="hljs-keyword">REFERENCES</span> Users(Id)
);
</code></pre>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" data-marpit-pagination="25" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="ejemplo-stack-overflow-ii">Ejemplo Stack Overflow (ii)</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">CREATE TABLE</span> Comments (
  Id <span class="hljs-type">INT</span>,
  PostId TEXT,
  ...
  UserId TEXT,
  <span class="hljs-keyword">PRIMARY KEY</span>(Id),
  <span class="hljs-keyword">FOREIGN KEY</span> (PostId) <span class="hljs-keyword">REFERENCES</span> Posts(Id),
  <span class="hljs-keyword">FOREIGN KEY</span> (UserId) <span class="hljs-keyword">REFERENCES</span> Users(Id)
);
</code></pre>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" data-marpit-pagination="26" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="vistas">Vistas</h1>
<ul>
<li>Las vistas son consultas parciales que se pueden reutilizar después</li>
<li>Representan patrones que se pueden sustituir en la consulta donde se usan</li>
<li>Es decir, donde se usa la vista se podría sustituir por su definición</li>
<li>Se crean con <code>CREATE OR REPLACE VIEW v AS SELECT ...</code></li>
<li>Dependiendo del SGBDR se generan vistas persistentes (guardadas en disco) o en memoria</li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" data-marpit-pagination="27" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="vistas-ejemplo">Vistas: ejemplo</h1>
<p>Sólo preguntas (o sólo respuestas):</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">CREATE</span> <span class="hljs-keyword">OR</span> REPLACE <span class="hljs-keyword">VIEW</span> Questions <span class="hljs-keyword">AS</span> <span class="hljs-keyword">SELECT</span> <span class="hljs-operator">*</span> <span class="hljs-keyword">FROM</span> Posts <span class="hljs-keyword">WHERE</span> PostTypeId <span class="hljs-operator">=</span> <span class="hljs-number">1</span>;
</code></pre>
<p>Después se puede utilizar como si fuera una tabla:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> <span class="hljs-operator">*</span> <span class="hljs-keyword">FROM</span> Questions <span class="hljs-keyword">WHERE</span> Title <span class="hljs-keyword">LIKE</span> <span class="hljs-string">&#x27;%Java%&#x27;</span>;
</code></pre>
<p>Las vistas se pueden utilizar para eliminar y para insertar valores, siempre que no estén formadas por más de una tabla con <code>JOIN</code>.</p>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="compact" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" class="compact" data-marpit-pagination="28" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:compact;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="expresiones-de-tabla-comunes-cte">Expresiones de tabla comunes (CTE)</h1>
<p>Una CTE (<em>Common Table Expression</em>) da nombre al resultado de una consulta<br />
durante una sola sentencia:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">WITH</span> PreguntasPorAutor <span class="hljs-keyword">AS</span> (
  <span class="hljs-keyword">SELECT</span> OwnerUserId, <span class="hljs-built_in">COUNT</span>(<span class="hljs-operator">*</span>) <span class="hljs-keyword">AS</span> NumPreguntas
  <span class="hljs-keyword">FROM</span> Posts
  <span class="hljs-keyword">WHERE</span> PostTypeId <span class="hljs-operator">=</span> <span class="hljs-number">1</span>
  <span class="hljs-keyword">GROUP</span> <span class="hljs-keyword">BY</span> OwnerUserId
)
<span class="hljs-keyword">SELECT</span> <span class="hljs-operator">*</span> <span class="hljs-keyword">FROM</span> PreguntasPorAutor <span class="hljs-keyword">WHERE</span> NumPreguntas <span class="hljs-operator">&gt;=</span> <span class="hljs-number">10</span>;
</code></pre>
<ul>
<li>Permite dividir una consulta compleja en pasos legibles</li>
<li>Se pueden definir varias CTE separadas por comas y hacer que unas usen otras</li>
<li>No crea una tabla ni una vista persistente</li>
<li>El nombre no implica que el motor materialice el resultado: lo decide el optimizador</li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" data-marpit-pagination="29" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="varias-cte-en-una-consulta">Varias CTE en una consulta</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">WITH</span> Preguntas <span class="hljs-keyword">AS</span> (
  <span class="hljs-keyword">SELECT</span> Id, OwnerUserId <span class="hljs-keyword">FROM</span> Posts <span class="hljs-keyword">WHERE</span> PostTypeId <span class="hljs-operator">=</span> <span class="hljs-number">1</span>
), Respuestas <span class="hljs-keyword">AS</span> (
  <span class="hljs-keyword">SELECT</span> ParentId, <span class="hljs-built_in">COUNT</span>(<span class="hljs-operator">*</span>) <span class="hljs-keyword">AS</span> NumRespuestas
  <span class="hljs-keyword">FROM</span> Posts <span class="hljs-keyword">WHERE</span> PostTypeId <span class="hljs-operator">=</span> <span class="hljs-number">2</span>
  <span class="hljs-keyword">GROUP</span> <span class="hljs-keyword">BY</span> ParentId
)
<span class="hljs-keyword">SELECT</span> p.Id, p.OwnerUserId, <span class="hljs-built_in">COALESCE</span>(r.NumRespuestas, <span class="hljs-number">0</span>)
<span class="hljs-keyword">FROM</span> Preguntas <span class="hljs-keyword">AS</span> p
<span class="hljs-keyword">LEFT</span> <span class="hljs-keyword">JOIN</span> Respuestas <span class="hljs-keyword">AS</span> r <span class="hljs-keyword">ON</span> r.ParentId <span class="hljs-operator">=</span> p.Id;
</code></pre>
<p>Cada CTE debe tener una granularidad clara. Aquí <code>Respuestas</code> produce como<br />
máximo una fila por pregunta antes de realizar la unión.</p>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="section-divider" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" class="section-divider" data-marpit-pagination="30" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:section-divider;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="data-manipulation-language">Data Manipulation Language</h1>
<h2 id="modificaci%C3%B3n-de-estado">Modificación de estado</h2>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" data-marpit-pagination="31" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="insert"><code>INSERT</code></h1>
<ul>
<li>Permite insertar filas en las tablas</li>
<li>Puede opcionalmente especificar las columnas sobre las que actúa</li>
<li>También, opcionalmente, pueden obtenerse los valores de una consulta</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">INSERT INTO</span> tabla[(col1,col2, ...)] <span class="hljs-keyword">VALUES</span> (val1, val2, ...), ...;
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">INSERT INTO</span> tabla[(col1,col2, ...)] <span class="hljs-keyword">SELECT</span> ...;
</code></pre>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" data-marpit-pagination="32" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="update"><code>UPDATE</code></h1>
<ul>
<li>Actualiza filas de una tabla</li>
<li>La cláusula <code>SET</code> especifica qué columnas se modifican y los nuevos valores</li>
<li>La cláusula <code>WHERE</code> selecciona las filas</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">UPDATE</span> tabla <span class="hljs-keyword">SET</span> att1 <span class="hljs-operator">=</span> valor1, att2 <span class="hljs-operator">=</span> valor2, ...
<span class="hljs-keyword">WHERE</span> ...;
</code></pre>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" data-marpit-pagination="33" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="update-valores-antiguos-y-join"><code>UPDATE</code>: valores antiguos y <code>JOIN</code></h1>
<p>Se puede utilizar el valor antiguo de los campos en la cláusula <code>SET</code>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">UPDATE</span> tabla <span class="hljs-keyword">SET</span> att1 <span class="hljs-operator">=</span> att1 <span class="hljs-operator">+</span> <span class="hljs-number">1</span>, att2 <span class="hljs-operator">=</span> ...
<span class="hljs-keyword">WHERE</span> ...;
</code></pre>
<p>También se puede utilizar otra tabla como fuente, con un <code>INNER JOIN</code>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">UPDATE</span> tabla
<span class="hljs-keyword">JOIN</span> otra <span class="hljs-keyword">ON</span> tabla.val <span class="hljs-operator">=</span> otra.otroval
<span class="hljs-keyword">SET</span> tabla.att1 <span class="hljs-operator">=</span> otra.otroatt1, ...
<span class="hljs-keyword">WHERE</span> ...;
</code></pre>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" data-marpit-pagination="34" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="delete"><code>DELETE</code></h1>
<ul>
<li>Elimina filas de una tabla</li>
<li>Similar a <code>SELECT</code>, con una sola tabla en <code>FROM</code></li>
<li>La cláusula <code>WHERE</code> selecciona las filas</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">DELETE</span> <span class="hljs-keyword">FROM</span> tabla <span class="hljs-keyword">WHERE</span> condición;
</code></pre>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="section-divider" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" class="section-divider" data-marpit-pagination="35" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:section-divider;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="gesti%C3%B3n-de-json-en-sql">Gestión de JSON en SQL</h1>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" data-marpit-pagination="36" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="introducci%C3%B3n-1">Introducción</h1>
<ul>
<li>Los SGBDR actuales permiten la integración con JSON, lo cual compararemos con las bases de datos documentales que veremos después</li>
<li>Las tablas pueden tener columnas de tipo JSON</li>
<li>Los documentos JSON pueden tener estructuras complejas</li>
<li>Se pueden hacer consultas sobre los documentos JSON y sus campos</li>
<li>Se pueden crear índices para acelerar las búsquedas usando campos de tipo JSON</li>
<li>La sintaxis es ligeramente diferente en distintos SGBDR, aunque el estándar SQL la incluye desde los 2020</li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" data-marpit-pagination="37" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="esquema-m%C3%ADnimo-mysql">Esquema mínimo (MySQL)</h1>
<p>Columna tipo JSON y columnas generadas:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">CREATE TABLE</span> Posts (
  Id <span class="hljs-type">BIGINT</span> <span class="hljs-keyword">PRIMARY KEY</span>,
  CreationDate <span class="hljs-type">TIMESTAMP</span>,
  Score <span class="hljs-type">INT</span>,
  doc JSON <span class="hljs-comment">-- documento completo</span>
);
<span class="hljs-keyword">CREATE TABLE</span> Users (
  Id <span class="hljs-type">BIGINT</span> <span class="hljs-keyword">PRIMARY KEY</span>,
  doc JSON
);
<span class="hljs-comment">-- Columna generada para indexar OwnerUserId</span>
<span class="hljs-keyword">ALTER TABLE</span> Posts <span class="hljs-keyword">ADD</span> <span class="hljs-keyword">COLUMN</span> OwnerUserId <span class="hljs-type">BIGINT</span>
  GENERATED ALWAYS <span class="hljs-keyword">AS</span> (JSON_EXTRACT(doc, <span class="hljs-string">&#x27;$.OwnerUserId&#x27;</span>)) STORED;
<span class="hljs-keyword">CREATE</span> INDEX idx_posts_owner <span class="hljs-keyword">ON</span> Posts(OwnerUserId);
</code></pre>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" data-marpit-pagination="38" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="inserci%C3%B3n-json">Inserción JSON</h1>
<p>MySQL:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">INSERT INTO</span> Posts (Id, CreationDate, Score, doc) <span class="hljs-keyword">VALUES</span> (
  <span class="hljs-number">1</span>, NOW(), <span class="hljs-number">10</span>,
  <span class="hljs-built_in">JSON_OBJECT</span>(<span class="hljs-string">&#x27;Title&#x27;</span>,<span class="hljs-string">&#x27;How to X?&#x27;</span>,<span class="hljs-string">&#x27;Body&#x27;</span>,<span class="hljs-string">&#x27;...&#x27;</span>,<span class="hljs-string">&#x27;OwnerUserId&#x27;</span>,<span class="hljs-number">42</span>,<span class="hljs-string">&#x27;Tags&#x27;</span>,<span class="hljs-built_in">JSON_ARRAY</span>(<span class="hljs-string">&#x27;sql&#x27;</span>,<span class="hljs-string">&#x27;json&#x27;</span>))
);
</code></pre>
<p>Equivalente en SQLite (campo <code>TEXT</code>):</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">INSERT INTO</span> Posts (Id, CreationDate, Score, doc) <span class="hljs-keyword">VALUES</span> (
  <span class="hljs-number">1</span>, datetime(<span class="hljs-string">&#x27;now&#x27;</span>), <span class="hljs-number">10</span>,
  <span class="hljs-string">&#x27;{&quot;Title&quot;:&quot;How to X?&quot;,&quot;Body&quot;:&quot;...&quot;,&quot;OwnerUserId&quot;:42,&quot;Tags&quot;:[&quot;sql&quot;,&quot;json&quot;]}&#x27;</span>
);
</code></pre>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" data-marpit-pagination="39" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="operadores---y---mysql">Operadores <code>-&gt;</code> y <code>-&gt;&gt;</code> (MySQL)</h1>
<ul>
<li><code>doc -&gt; 'key'</code> devuelve JSON (tipo <code>JSON</code>)</li>
<li><code>doc -&gt;&gt; 'key'</code> devuelve texto (tipo <code>TEXT</code>)</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-comment">-- JSON_EXTRACT devuelve JSON; JSON_UNQUOTE(JSON_EXTRACT) devuelve texto</span>
<span class="hljs-keyword">SELECT</span> JSON_EXTRACT(doc, <span class="hljs-string">&#x27;$.Title&#x27;</span>) <span class="hljs-keyword">FROM</span> Posts <span class="hljs-keyword">WHERE</span> id <span class="hljs-operator">=</span> <span class="hljs-number">1</span>;
<span class="hljs-keyword">SELECT</span> JSON_UNQUOTE(JSON_EXTRACT(doc, <span class="hljs-string">&#x27;$.Title&#x27;</span>)) <span class="hljs-keyword">AS</span> Title <span class="hljs-keyword">FROM</span> Posts <span class="hljs-keyword">WHERE</span> id <span class="hljs-operator">=</span> <span class="hljs-number">1</span>;
<span class="hljs-comment">-- En MySQL se pueden usar los operadores (-&gt;, -&gt;&gt;)</span>
<span class="hljs-keyword">SELECT</span> doc<span class="hljs-operator">-</span><span class="hljs-operator">&gt;</span><span class="hljs-string">&#x27;$.Title&#x27;</span>, doc<span class="hljs-operator">-</span><span class="hljs-operator">&gt;&gt;</span><span class="hljs-string">&#x27;$.Title&#x27;</span> <span class="hljs-keyword">FROM</span> Posts <span class="hljs-keyword">WHERE</span> id <span class="hljs-operator">=</span> <span class="hljs-number">1</span>;
<span class="hljs-operator">&gt;&gt;</span><span class="hljs-operator">&gt;</span> &quot;How to X?&quot;,How <span class="hljs-keyword">to</span> X?
</code></pre>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" data-marpit-pagination="40" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="operadores---y---sqlite">Operadores <code>-&gt;</code> y <code>-&gt;&gt;</code> (SQLite)</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> JSON_EXTRACT(doc, <span class="hljs-string">&#x27;$.Title&#x27;</span>) <span class="hljs-keyword">AS</span> title_text <span class="hljs-keyword">FROM</span> posts <span class="hljs-keyword">WHERE</span> id <span class="hljs-operator">=</span> <span class="hljs-number">1</span>;

<span class="hljs-comment">-- Propiedad anidada (si doc contiene {&quot;owner&quot;: {&quot;id&quot;: 42}})</span>
<span class="hljs-keyword">SELECT</span> doc <span class="hljs-operator">-</span><span class="hljs-operator">&gt;</span> <span class="hljs-string">&#x27;$.owner&#x27;</span> <span class="hljs-operator">-</span><span class="hljs-operator">&gt;&gt;</span> <span class="hljs-string">&#x27;$.id&#x27;</span> <span class="hljs-keyword">FROM</span> Posts <span class="hljs-keyword">WHERE</span> id <span class="hljs-operator">=</span> <span class="hljs-number">1</span>;

<span class="hljs-comment">-- O también</span>
<span class="hljs-keyword">SELECT</span> JSON_EXTRACT(doc, <span class="hljs-string">&#x27;$.owner.id&#x27;</span>) <span class="hljs-keyword">FROM</span> Posts <span class="hljs-keyword">WHERE</span> id <span class="hljs-operator">=</span> <span class="hljs-number">1</span>;

<span class="hljs-comment">-- O incluso</span>
<span class="hljs-keyword">SELECT</span> JSON_EXTRACT(JSON_EXTRACT(doc, <span class="hljs-string">&#x27;$.owner&#x27;</span>), <span class="hljs-string">&#x27;$.id&#x27;</span>) <span class="hljs-keyword">FROM</span> Posts <span class="hljs-keyword">WHERE</span> id <span class="hljs-operator">=</span> <span class="hljs-number">1</span>;
</code></pre>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" data-marpit-pagination="41" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="json_table-expande-arrays"><code>JSON_TABLE</code> expande <em>arrays</em></h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-comment">-- Expandir tags con JSON_TABLE</span>
<span class="hljs-keyword">SELECT</span> p.id, jt.tag
<span class="hljs-keyword">FROM</span> Posts p,
<span class="hljs-built_in">JSON_TABLE</span>(p.doc, <span class="hljs-string">&#x27;$.tags[*]&#x27;</span> COLUMNS (tag TEXT PATH <span class="hljs-string">&#x27;$&#x27;</span>)) <span class="hljs-keyword">AS</span> jt
<span class="hljs-keyword">WHERE</span> p.id <span class="hljs-operator">=</span> <span class="hljs-number">1</span>;
</code></pre>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" data-marpit-pagination="42" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="equivalentes-en-sqlite">Equivalentes en SQLite</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-comment">-- Propiedad anidada</span>
<span class="hljs-keyword">SELECT</span> json_extract(doc, <span class="hljs-string">&#x27;$.owner.id&#x27;</span>) <span class="hljs-keyword">FROM</span> posts <span class="hljs-keyword">WHERE</span> id <span class="hljs-operator">=</span> <span class="hljs-number">1</span>;

<span class="hljs-comment">-- Expandir tags</span>
<span class="hljs-keyword">SELECT</span> p.id, t.value <span class="hljs-keyword">AS</span> tag
<span class="hljs-keyword">FROM</span> posts p, json_each(p.doc, <span class="hljs-string">&#x27;$.tags&#x27;</span>) <span class="hljs-keyword">AS</span> t
<span class="hljs-keyword">WHERE</span> p.id <span class="hljs-operator">=</span> <span class="hljs-number">1</span>;
</code></pre>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" data-marpit-pagination="43" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="b%C3%BAsquedas-operador-de-contenci%C3%B3n-mysql">Búsquedas: operador de contención (MySQL)</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-comment">-- Buscar ownerUserId</span>
<span class="hljs-keyword">SELECT</span> <span class="hljs-operator">*</span> <span class="hljs-keyword">FROM</span> posts <span class="hljs-keyword">WHERE</span> JSON_UNQUOTE(JSON_EXTRACT(doc, <span class="hljs-string">&#x27;$.ownerUserId&#x27;</span>)) <span class="hljs-operator">=</span> <span class="hljs-string">&#x27;42&#x27;</span>;

<span class="hljs-comment">-- Buscar tag dentro de array (JSON_CONTAINS)</span>
<span class="hljs-keyword">SELECT</span> <span class="hljs-operator">*</span> <span class="hljs-keyword">FROM</span> posts <span class="hljs-keyword">WHERE</span> JSON_CONTAINS(doc, <span class="hljs-string">&#x27;&quot;sql&quot;&#x27;</span>, <span class="hljs-string">&#x27;$.tags&#x27;</span>);
</code></pre>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" data-marpit-pagination="44" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="b%C3%BAsquedas-operador-de-contenci%C3%B3n-sqlite">Búsquedas: operador de contención (SQLite)</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-comment">-- Buscar ownerUserId</span>
<span class="hljs-keyword">SELECT</span> <span class="hljs-operator">*</span> <span class="hljs-keyword">FROM</span> posts <span class="hljs-keyword">WHERE</span> json_extract(doc, <span class="hljs-string">&#x27;$.ownerUserId&#x27;</span>) <span class="hljs-operator">=</span> <span class="hljs-number">42</span>;

<span class="hljs-comment">-- Buscar tag: usar json_each para comprobar existencia</span>
<span class="hljs-keyword">SELECT</span> p.<span class="hljs-operator">*</span>
<span class="hljs-keyword">FROM</span> posts p
<span class="hljs-keyword">WHERE</span> <span class="hljs-keyword">EXISTS</span> (
  <span class="hljs-keyword">SELECT</span> <span class="hljs-number">1</span> <span class="hljs-keyword">FROM</span> json_each(p.doc, <span class="hljs-string">&#x27;$.tags&#x27;</span>) <span class="hljs-keyword">AS</span> t <span class="hljs-keyword">WHERE</span> t.value <span class="hljs-operator">=</span> <span class="hljs-string">&#x27;sql&#x27;</span>
);
</code></pre>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" data-marpit-pagination="45" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="json_table-mysql"><code>JSON_TABLE</code> (MySQL)</h1>
<p>MySQL tiene <code>JSON_TABLE</code>, que mapea JSON a columnas:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> <span class="hljs-operator">*</span>
<span class="hljs-keyword">FROM</span> posts,
<span class="hljs-built_in">JSON_TABLE</span>(doc, <span class="hljs-string">&#x27;$&#x27;</span> COLUMNS (
  Title <span class="hljs-type">VARCHAR</span>(<span class="hljs-number">200</span>) PATH <span class="hljs-string">&#x27;$.Title&#x27;</span>,
  Body TEXT PATH <span class="hljs-string">&#x27;$.Body&#x27;</span>,
  ownerUserId <span class="hljs-type">BIGINT</span> PATH <span class="hljs-string">&#x27;$.ownerUserId&#x27;</span>
)) <span class="hljs-keyword">AS</span> jt;
</code></pre>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" data-marpit-pagination="46" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="sqlite-json1">SQLite: JSON1</h1>
<p>SQLite almacena JSON como texto y provee la extensión JSON1, con funciones como <code>json_extract</code>, <code>json_each</code>, <code>json_tree</code>, <code>json_array_length</code>, etc.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-comment">-- Expandir array tags con json_each</span>
<span class="hljs-keyword">SELECT</span> p.id, t.value <span class="hljs-keyword">AS</span> tag
<span class="hljs-keyword">FROM</span> posts p, json_each(p.doc, <span class="hljs-string">&#x27;$.tags&#x27;</span>) <span class="hljs-keyword">AS</span> t
<span class="hljs-keyword">WHERE</span> p.id <span class="hljs-operator">=</span> <span class="hljs-number">1</span>;

<span class="hljs-comment">-- Extraer comentarios (json_each sobre array de objetos)</span>
<span class="hljs-keyword">SELECT</span> p.id,
       json_extract(c.value, <span class="hljs-string">&#x27;$.id&#x27;</span>) <span class="hljs-keyword">AS</span> comment_id,
       json_extract(c.value, <span class="hljs-string">&#x27;$.body&#x27;</span>) <span class="hljs-keyword">AS</span> comment_body
<span class="hljs-keyword">FROM</span> posts p, json_each(p.doc, <span class="hljs-string">&#x27;$.comments&#x27;</span>) <span class="hljs-keyword">AS</span> c
<span class="hljs-keyword">WHERE</span> p.id <span class="hljs-operator">=</span> <span class="hljs-number">1</span>;
</code></pre>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="code" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" class="code" data-marpit-pagination="47" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:code;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="ejemplo-posts-con-usuario-mysql">Ejemplo: Posts con usuario (MySQL)</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">INSERT INTO</span> Posts (Id, CreationDate, PostTypeId, OwnerUserId, doc)
<span class="hljs-keyword">SELECT</span>
    p.Id, p.CreationDate, p.PostTypeId, p.OwnerUserId,
    <span class="hljs-built_in">JSON_OBJECT</span>(
        <span class="hljs-string">&#x27;post&#x27;</span>, <span class="hljs-built_in">JSON_OBJECT</span>(
            <span class="hljs-string">&#x27;Title&#x27;</span>, p.Title, <span class="hljs-string">&#x27;Body&#x27;</span>, p.Body, <span class="hljs-string">&#x27;Score&#x27;</span>, p.Score, ...
        ),
        <span class="hljs-string">&#x27;user&#x27;</span>, <span class="hljs-keyword">CASE</span>
            <span class="hljs-keyword">WHEN</span> u.Id <span class="hljs-keyword">IS</span> <span class="hljs-keyword">NOT NULL</span> <span class="hljs-keyword">THEN</span> <span class="hljs-built_in">JSON_OBJECT</span>(
                <span class="hljs-string">&#x27;Id&#x27;</span>, u.Id, <span class="hljs-string">&#x27;DisplayName&#x27;</span>, u.DisplayName,
                <span class="hljs-string">&#x27;Reputation&#x27;</span>, u.Reputation, ...
                )
            <span class="hljs-keyword">ELSE</span> <span class="hljs-built_in">JSON_OBJECT</span>(<span class="hljs-string">&#x27;Id&#x27;</span>, <span class="hljs-keyword">NULL</span>, <span class="hljs-string">&#x27;DisplayName&#x27;</span>, <span class="hljs-string">&#x27;Usuario eliminado&#x27;</span>)
        <span class="hljs-keyword">END</span>
    ) <span class="hljs-keyword">as</span> doc
<span class="hljs-keyword">FROM</span> Posts p
<span class="hljs-keyword">LEFT</span> <span class="hljs-keyword">JOIN</span> Users u <span class="hljs-keyword">ON</span> p.OwnerUserId <span class="hljs-operator">=</span> u.Id;
</code></pre>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" data-marpit-pagination="48" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="consejos-de-modelado">Consejos de modelado</h1>
<ul>
<li>Si un campo va a usarse frecuentemente para filtrado u orden: mantenerlo como columna separada además del JSON</li>
<li>JSON es ideal para documentos semiestructurados y variantes entre registros</li>
<li>Normaliza cuando hay relaciones 1:N que se consultarán frecuentemente</li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="section-divider" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" class="section-divider" data-marpit-pagination="49" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:section-divider;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="cuestiones-de-modelado-y-eficiencia">Cuestiones de modelado y eficiencia</h1>
<h2 id="modelado-conceptual">Modelado conceptual</h2>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" data-marpit-pagination="50" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="modelado-conceptual-1">Modelado conceptual</h1>
<ul>
<li>Al modelar transformamos las entidades del «mundo» en entidades del dominio de modelado</li>
<li>Existen diferentes formas de modelar; las más generalizadas:
<ul>
<li>Modelado basado en objetos</li>
<li>Modelado basado en entidades y relaciones (ER)</li>
<li>Modelado relacional</li>
</ul>
</li>
<li>Cada forma de modelado posee:
<ul>
<li>Unos <strong>conceptos</strong> (estructuras)</li>
<li>Unas <strong>restricciones</strong></li>
<li>Unas <strong>operaciones</strong> para el acceso a los datos</li>
</ul>
</li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" data-marpit-pagination="51" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="modelado-conceptual-conceptos-base">Modelado conceptual: conceptos base</h1>
<p>En general, la mayoría de las técnicas de modelado de datos se basan en:</p>
<ul>
<li><strong>Entidades</strong>: elementos del dominio a modelar con entidad e identidad propia</li>
<li><strong>Relaciones</strong>: relaciones entre elementos del dominio</li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="figure-only" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" class="figure-only" data-marpit-pagination="52" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:figure-only;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="modelado-basado-en-objetos">Modelado basado en objetos</h1>
<p><img src="img/posts_comments_class_diagram.jpg" alt="" style="height:420px;" /></p>
<p>En este modelo, el dominio se representa con <strong>objetos</strong> y <strong>relaciones</strong> de herencia, clientela y composición (contenido).</p>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" data-marpit-pagination="53" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="modelado-basado-en-objetos-clases">Modelado basado en objetos: clases</h1>
<p>Correspondería a un código de definición de clases parecido a:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Post</span>:
    <span class="hljs-keyword">def</span> <span class="hljs-title function_">__init__</span>(<span class="hljs-params">self</span>):
        <span class="hljs-variable language_">self</span>.Title = <span class="hljs-string">&quot;&quot;</span>
        <span class="hljs-variable language_">self</span>.Body = <span class="hljs-string">&quot;&quot;</span>
        <span class="hljs-variable language_">self</span>.Comments = []

<span class="hljs-keyword">class</span> <span class="hljs-title class_">Comment</span>:
    <span class="hljs-keyword">def</span> <span class="hljs-title function_">__init__</span>(<span class="hljs-params">self</span>):
        <span class="hljs-variable language_">self</span>.Text = <span class="hljs-string">&quot;&quot;</span>
</code></pre>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" data-marpit-pagination="54" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="uso-del-modelo-en-un-lenguaje-oo">Uso del modelo en un lenguaje OO</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># Base de datos de Posts</span>
stackoverflow = []

<span class="hljs-comment"># A través de la página web, nuevo Post...</span>
new_post = new Post();
new_post.Title = request.Title
new_post.Body = request.Body
stackoverflow.append(new_post)

<span class="hljs-comment"># A través de la página web, nuevo comentario</span>
<span class="hljs-comment"># sobre un Post que se mostró en la web...</span>
new_comment = new Comment
new_comment.Text = request.Text
request.Post.Comments.append(new_comment)
</code></pre>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" data-marpit-pagination="55" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="navegaci%C3%B3n">Navegación</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># Dado un Post, mostrar el texto</span>
<span class="hljs-comment"># de todos los comentarios</span>
<span class="hljs-keyword">for</span> comment <span class="hljs-keyword">in</span> post.Comments:
    <span class="hljs-built_in">print</span> comment.Text

<span class="hljs-comment"># Número medio de comentarios por Post</span>
nc = <span class="hljs-number">0</span>
<span class="hljs-keyword">for</span> post <span class="hljs-keyword">in</span> stackoverflow:
    nc = nc + <span class="hljs-built_in">len</span>(post.Comments)
<span class="hljs-built_in">print</span> <span class="hljs-built_in">float</span>(nc) / <span class="hljs-built_in">len</span>(stackoverflow)

<span class="hljs-comment"># Número medio de comentarios por Post (alt)</span>
<span class="hljs-built_in">print</span> <span class="hljs-built_in">sum</span>(<span class="hljs-built_in">map</span>(<span class="hljs-keyword">lambda</span> p : <span class="hljs-built_in">len</span>(p.Comments),stackoverflow))
      / <span class="hljs-built_in">float</span>(<span class="hljs-built_in">len</span>(stackoverflow))
</code></pre>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="56" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" data-marpit-pagination="56" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="modelado-basado-en-objetos-valoraci%C3%B3n">Modelado basado en objetos: valoración</h1>
<ul>
<li>El modelado es más natural (se modelan objetos que pueden corresponder con el mundo real)</li>
<li>Se incluyen relaciones de herencia, parte-de, etc.</li>
<li>Se permiten relaciones de contenido, jerárquicas</li>
<li>Se permiten colecciones de objetos</li>
<li>El tiempo de vida (<em>lifespan</em>) de una entidad se liga a las relaciones de contenido:
<ul>
<li>Entidades dependientes de un «padre»: contenido</li>
<li>Entidades con vida independiente: referencia (clientela)</li>
</ul>
</li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="section-divider" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" class="section-divider" data-marpit-pagination="57" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:section-divider;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="modelado-relacional">Modelado relacional</h1>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="figure-only" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" class="figure-only" data-marpit-pagination="58" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:figure-only;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="modelado-relacional-stack-overflow">Modelado relacional: Stack Overflow</h1>
<p><img src="img/stackoverflow_diagram.png" alt="" style="height:480px;" /></p>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="59" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" data-marpit-pagination="59" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="modelado-relacional-1">Modelado relacional</h1>
<ul>
<li>Caso particular de modelado conceptual que utiliza las abstracciones del <strong>modelo relacional</strong>:
<ul>
<li>Tablas para describir entidades del dominio</li>
<li>Relaciones entre entidades (tablas)</li>
<li>Restricciones (claves ajenas, tipos básicos)</li>
</ul>
</li>
<li>El modelado también se hace en base a <strong>entidades</strong> y <strong>relaciones</strong>:
<ul>
<li>Siguiendo las restricciones vistas en la sesión anterior</li>
<li>Aplicando los conceptos del modelado de datos conceptual</li>
</ul>
</li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
