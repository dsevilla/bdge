</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="97" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-theme="bdge" data-lang="es" lang="es" data-marpit-pagination="97" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="desnormalizaci%C3%B3n">Desnormalización</h1>
<ul>
<li>El modelo relacional basa el modelado de datos en la <strong>normalización</strong>, en sus distintos niveles</li>
<li>Esto permite aplicar el principio de «sólo almacenar un dato en un sitio», lo que lleva a la eficiencia de datos</li>
<li>Pero a veces necesitamos también <strong>eficiencia de acceso</strong>, y a veces está reñida con la normalización</li>
<li>El principal escollo para la velocidad es la unión (<code>JOIN</code>) de datos de tablas</li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="98" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-theme="bdge" data-lang="es" lang="es" data-marpit-pagination="98" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="%C2%BFpor-qu%C3%A9-desnormalizar">¿Por qué desnormalizar?</h1>
<ul>
<li><strong>Mantener la historia</strong>: los datos de los clientes, por ejemplo, pueden cambiar; necesitamos almacenar sus valores, p. ej., al emitir una factura en el pasado. Para eso hay que copiar los datos del cliente en ese momento</li>
<li><strong>Mejorar la velocidad de consulta</strong>: a veces, para consultas recurrentes, tenemos que usar uniones de varias tablas. Se puede evitar la unión, por ejemplo, añadiendo claves ajenas a las tablas finales, o bien —como en <code>Posts.Tags</code>— replicando la información</li>
<li><strong>Precalcular valores necesitados de antemano</strong>: si hay datos que se necesitarán, como medias o totales, podemos calcularlos y almacenarlos de antemano</li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="99" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-theme="bdge" data-lang="es" lang="es" data-marpit-pagination="99" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="desventajas-de-desnormalizar">Desventajas de desnormalizar</h1>
<ul>
<li><strong>Espacio en disco</strong>: al igual que con los índices, la copia y duplicación de datos ocupa más espacio</li>
<li><strong>Anomalías de datos</strong>: un cambio en un dato puede requerir un cambio en más de una parte de la base de datos para mantener la consistencia. Los SGBDR no están preparados para mantener este tipo de consistencia por sí solos; hay que usar <em>triggers</em>, transacciones, etc.</li>
<li><strong>Ralentización de las actualizaciones</strong>: dependiendo del <em>ratio</em> entre actualizaciones y consultas, puede ser un punto importante</li>
<li><strong>Más código, más dependencias, más propenso a errores</strong>: al necesitar más coordinación, hay más dependencias ocultas, más errores y mayor coste de mantenimiento</li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="100" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-theme="bdge" data-lang="es" lang="es" data-marpit-pagination="100" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="desnormalizaci%C3%B3n-ejemplos-en-stack-overflow">Desnormalización: ejemplos en Stack Overflow</h1>
<ul>
<li>En la tabla <code>Posts</code> tenemos, por ejemplo, el campo <code>Tags</code>, que contiene la lista de los tags. Evita tener que hacer un <code>JOIN</code> para obtener sus nombres</li>
<li>También está el campo <code>Score</code>, que aglutina todos los votos positivos recibidos (también está en la tabla <code>Votes</code>)</li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="101" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-theme="bdge" data-lang="es" lang="es" data-marpit-pagination="101" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="particiones">Particiones</h1>
<ul>
<li>El mecanismo de partición permite partir tablas de forma <strong>lógica</strong></li>
<li>Es decir, <strong>transparente al usuario</strong></li>
<li>Las tablas partidas tienen ciertas restricciones: por ejemplo, no permiten claves únicas arbitrarias y, en InnoDB, no admiten claves ajenas</li>
<li>La tabla sigue viviendo en <strong>un único servidor</strong>: repartir datos entre máquinas es <em>sharding</em>, que veremos con Cassandra y MongoDB</li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="102" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="dense" data-theme="bdge" data-lang="es" lang="es" class="dense" data-marpit-pagination="102" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:dense;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="particionado-y-claves-%C3%BAnicas-en-mysql">Particionado y claves únicas en MySQL</h1>
<p>Todas las columnas usadas por la expresión de particionado deben pertenecer a<br />
<strong>cada clave única</strong> de la tabla, incluida la clave primaria</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">CREATE TABLE</span> PostsPorAño (
  Id <span class="hljs-type">BIGINT</span> <span class="hljs-keyword">NOT NULL</span>,
  CreationDate DATETIME <span class="hljs-keyword">NOT NULL</span>,
  Score <span class="hljs-type">INT</span>,
  <span class="hljs-keyword">PRIMARY KEY</span> (Id, CreationDate)
)
<span class="hljs-keyword">PARTITION</span> <span class="hljs-keyword">BY</span> <span class="hljs-keyword">RANGE</span> (<span class="hljs-keyword">YEAR</span>(CreationDate)) (
  <span class="hljs-keyword">PARTITION</span> p2016 <span class="hljs-keyword">VALUES</span> LESS THAN (<span class="hljs-number">2017</span>),
  <span class="hljs-keyword">PARTITION</span> p2017 <span class="hljs-keyword">VALUES</span> LESS THAN (<span class="hljs-number">2018</span>),
  <span class="hljs-keyword">PARTITION</span> p_futuro <span class="hljs-keyword">VALUES</span> LESS THAN MAXVALUE
);
</code></pre>
<p><code>PRIMARY KEY (Id)</code> no sería válida: dos particiones distintas no pueden<br />
comprobar por separado una unicidad global sobre <code>Id</code>. Esta restricción debe<br />
tenerse en cuenta antes de copiar una tabla existente y conservar sus claves</p>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="103" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-theme="bdge" data-lang="es" lang="es" data-marpit-pagination="103" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="ventajas-del-particionado">Ventajas del particionado</h1>
<ul>
<li>Aceleran las búsquedas que filtran por la columna de particionado, porque el optimizador puede descartar particiones (<em>partition pruning</em>)</li>
<li>Aceleran las búsquedas de rangos sobre esa columna</li>
<li>Permiten almacenar la información histórica de forma eficiente (queda en particiones que se usan rara vez, mientras que los datos actuales usan sólo las últimas particiones)</li>
<li>Facilitan el mantenimiento: borrar un año entero con <code>DROP PARTITION</code> es inmediato frente a un <code>DELETE</code> fila a fila</li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="104" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-theme="bdge" data-lang="es" lang="es" data-marpit-pagination="104" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="inconvenientes-del-particionado">Inconvenientes del particionado</h1>
<ul>
<li>Cada clave única debe incluir las columnas de particionado</li>
<li>Las escrituras no se aceleran: cada inserción debe calcular su partición, y los índices son locales a cada partición</li>
<li>Una consulta que no filtra por la columna de particionado recorre <strong>todas</strong> las particiones y puede resultar más costosa que sin particionar</li>
<li>Más complejidad de diseño y de mantenimiento (crear particiones nuevas a tiempo, reorganizar)</li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="105" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-theme="bdge" data-lang="es" lang="es" data-marpit-pagination="105" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="%C2%BFcu%C3%A1ndo-usar-particionado">¿Cuándo usar particionado?</h1>
<ul>
<li>Si casi siempre se hacen consultas sobre la columna de particionado</li>
<li>Si se tienen datos históricos que se quiere que no «estorben»</li>
<li>Si los índices son más grandes que la memoria RAM</li>
</ul>
<p>En MySQL se especifican en <code>CREATE TABLE</code> o <code>ALTER TABLE</code>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">CREATE TABLE</span> <span class="hljs-operator">&lt;</span>table_name<span class="hljs-operator">&gt;</span> (<span class="hljs-operator">&lt;</span>columns<span class="hljs-operator">&gt;</span>)
<span class="hljs-keyword">PARTITION</span> <span class="hljs-keyword">BY</span> <span class="hljs-operator">&lt;</span>type<span class="hljs-operator">&gt;</span> (<span class="hljs-operator">&lt;</span>partition_expression<span class="hljs-operator">&gt;</span>);
</code></pre>
<p><code>&lt;type&gt;</code> puede ser <code>RANGE</code>, <code>LIST</code>, <code>HASH</code> o <code>KEY</code>; <code>RANGE COLUMNS</code> y <code>LIST COLUMNS</code> particionan directamente sobre una o varias columnas, sin expresión</p>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="106" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-theme="bdge" data-lang="es" lang="es" data-marpit-pagination="106" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="particionado-range">Particionado <code>RANGE</code></h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">CREATE TABLE</span> ...
<span class="hljs-keyword">PARTITION</span> <span class="hljs-keyword">BY</span> <span class="hljs-keyword">RANGE</span> (att) (
<span class="hljs-keyword">PARTITION</span> p0 <span class="hljs-keyword">VALUES</span> LESS THAN (<span class="hljs-number">10000</span>),
<span class="hljs-keyword">PARTITION</span> p1 <span class="hljs-keyword">VALUES</span> LESS THAN (<span class="hljs-number">20000</span>),
<span class="hljs-keyword">PARTITION</span> p2 <span class="hljs-keyword">VALUES</span> LESS THAN (<span class="hljs-number">30000</span>),
<span class="hljs-keyword">PARTITION</span> p3 <span class="hljs-keyword">VALUES</span> LESS THAN (<span class="hljs-number">40000</span>),
<span class="hljs-keyword">PARTITION</span> p4 <span class="hljs-keyword">VALUES</span> LESS THAN MAXVALUE)
</code></pre>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="107" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-theme="bdge" data-lang="es" lang="es" data-marpit-pagination="107" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="particionado-list">Particionado <code>LIST</code></h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">CREATE TABLE</span> ...
  <span class="hljs-keyword">PARTITION</span> <span class="hljs-keyword">BY</span> LIST (store_id) (
<span class="hljs-keyword">PARTITION</span> pNorth <span class="hljs-keyword">VALUES</span> <span class="hljs-keyword">IN</span> (<span class="hljs-number">2</span>,<span class="hljs-number">8</span>,<span class="hljs-number">12</span>),
<span class="hljs-keyword">PARTITION</span> pEast <span class="hljs-keyword">VALUES</span> <span class="hljs-keyword">IN</span> (<span class="hljs-number">1</span>,<span class="hljs-number">4</span>,<span class="hljs-number">7</span>),
<span class="hljs-keyword">PARTITION</span> pWest <span class="hljs-keyword">VALUES</span> <span class="hljs-keyword">IN</span> (<span class="hljs-number">3</span>,<span class="hljs-number">5</span>,<span class="hljs-number">6</span>,<span class="hljs-number">10</span>),
<span class="hljs-keyword">PARTITION</span> pSouth <span class="hljs-keyword">VALUES</span> <span class="hljs-keyword">IN</span> (<span class="hljs-number">9</span>,<span class="hljs-number">11</span>)
)
</code></pre>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="108" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-theme="bdge" data-lang="es" lang="es" data-marpit-pagination="108" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="particionado-hash-y-key">Particionado <code>HASH</code> y <code>KEY</code></h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">CREATE TABLE</span> ...
<span class="hljs-keyword">PARTITION</span> <span class="hljs-keyword">BY</span> HASH (att)
PARTITIONS <span class="hljs-number">4</span>;
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">CREATE TABLE</span> ...
<span class="hljs-keyword">PARTITION</span> <span class="hljs-keyword">BY</span> KEY (att)
PARTITIONS <span class="hljs-number">4</span>;
</code></pre>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="109" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-theme="bdge" data-lang="es" lang="es" data-marpit-pagination="109" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="consultar-particiones">Consultar particiones</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-comment">-- En MySQL 8, la salida normal ya incluye la columna `partitions`.</span>
EXPLAIN <span class="hljs-keyword">SELECT</span> ...
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> <span class="hljs-operator">*</span> <span class="hljs-keyword">FROM</span> Tabla <span class="hljs-keyword">PARTITION</span> (p0, p1, ...) <span class="hljs-keyword">WHERE</span> ...
</code></pre>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="110" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="compact" data-theme="bdge" data-lang="es" lang="es" class="compact" data-marpit-pagination="110" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:compact;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="partition-pruning-comprobar-no-suponer"><em>Partition pruning</em>: comprobar, no suponer</h1>
<p>El optimizador descarta particiones cuando puede deducir de <code>WHERE</code> cuáles<br />
podrían contener filas. Para particiones anuales, un rango directo suele<br />
expresar bien esa información:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql">EXPLAIN <span class="hljs-keyword">SELECT</span> <span class="hljs-built_in">COUNT</span>(<span class="hljs-operator">*</span>) <span class="hljs-keyword">FROM</span> PostsPorAño
<span class="hljs-keyword">WHERE</span> CreationDate <span class="hljs-operator">&gt;=</span> <span class="hljs-string">&#x27;2016-01-01&#x27;</span>
  <span class="hljs-keyword">AND</span> CreationDate <span class="hljs-operator">&lt;</span>  <span class="hljs-string">&#x27;2017-01-01&#x27;</span>;
</code></pre>
<p>Una transformación arbitraria puede impedir esa deducción:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql">EXPLAIN <span class="hljs-keyword">SELECT</span> <span class="hljs-built_in">COUNT</span>(<span class="hljs-operator">*</span>) <span class="hljs-keyword">FROM</span> PostsPorAño
<span class="hljs-keyword">WHERE</span> DATE_FORMAT(CreationDate, <span class="hljs-string">&#x27;%Y&#x27;</span>) <span class="hljs-operator">=</span> <span class="hljs-string">&#x27;2016&#x27;</span>;
</code></pre>
<p>Ni siquiera una función idéntica a la expresión de particionado, como<br />
<code>YEAR(CreationDate) = 2016</code>, garantiza el recorte. Por eso no basta con razonar<br />
por intuición: la columna <code>partitions</code> de <code>EXPLAIN</code> indica las particiones que<br />
realmente se leerán</p>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="111" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="compact" data-theme="bdge" data-lang="es" lang="es" class="compact" data-marpit-pagination="111" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:compact;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="partition-pruning-la-columna-partitions"><em>Partition pruning</em>: la columna <code>partitions</code></h1>
<p><code>EXPLAIN</code> sobre <code>PostsPorAño</code> (<code>p2016</code>, <code>p2017</code> y <code>p_futuro</code>), en MySQL 8.4:</p>
<table>
<thead>
<tr>
<th>Predicado</th>
<th><code>partitions</code></th>
</tr>
</thead>
<tbody>
<tr>
<td><code>CreationDate &gt;= '2016-01-01' AND CreationDate &lt; '2017-01-01'</code></td>
<td><code>p2016</code></td>
</tr>
<tr>
<td><code>DATE_FORMAT(CreationDate, '%Y') = '2016'</code></td>
<td><code>p2016,p2017,p_futuro</code></td>
</tr>
<tr>
<td><code>YEAR(CreationDate) = 2016</code></td>
<td><code>p2016,p2017,p_futuro</code></td>
</tr>
</tbody>
</table>
<ul>
<li>Sólo el rango sobre la propia columna se traduce a una partición</li>
<li>El tercero es el engañoso: coincide con la expresión de particionado y aun así se leen todas</li>
<li>Comprobarlo en <code>EXPLAIN</code> es la única forma de saberlo</li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="112" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="compact" data-theme="bdge" data-lang="es" lang="es" class="compact" data-marpit-pagination="112" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:compact;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="subparticiones">Subparticiones</h1>
<p>Se pueden combinar dos niveles: <code>RANGE</code> o <code>LIST</code> en el primero y <code>HASH</code> o<br />
<code>KEY</code> en el segundo</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">CREATE TABLE</span> PostsPart_Mixed (...)
<span class="hljs-keyword">PARTITION</span> <span class="hljs-keyword">BY</span> <span class="hljs-keyword">RANGE</span> (<span class="hljs-keyword">YEAR</span>(CreationDate))
SUBPARTITION <span class="hljs-keyword">BY</span> HASH (Id)
SUBPARTITIONS <span class="hljs-number">2</span> (
  <span class="hljs-keyword">PARTITION</span> p2014 <span class="hljs-keyword">VALUES</span> LESS THAN (<span class="hljs-number">2015</span>),
  <span class="hljs-keyword">PARTITION</span> p2015 <span class="hljs-keyword">VALUES</span> LESS THAN (<span class="hljs-number">2016</span>),
  <span class="hljs-keyword">PARTITION</span> p_futuro <span class="hljs-keyword">VALUES</span> LESS THAN MAXVALUE
);
</code></pre>
<ul>
<li>El año permite descartar particiones; el <em>hash</em> reparte cada año en trozos de tamaño parecido</li>
<li>Cada subpartición es una partición física más: 3 × 2 = 6 en el ejemplo</li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="113" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="compact" data-theme="bdge" data-lang="es" lang="es" class="compact" data-marpit-pagination="113" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:compact;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="particionar-por-mes-range-columns">Particionar por mes: <code>RANGE COLUMNS</code></h1>
<p>Con <code>PARTITION BY RANGE (YEAR(CreationDate)*100 + MONTH(CreationDate))</code>, un<br />
rango de fechas lee <strong>todas</strong> las particiones: MySQL sólo traduce rangos a<br />
particiones con la columna directa o con funciones que sabe crecientes<br />
(<code>YEAR()</code>, <code>TO_DAYS()</code>, <code>TO_SECONDS()</code>), y esta expresión no lo es</p>
<p><code>RANGE COLUMNS</code> usa la propia columna, con fechas como límites:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">PARTITION</span> <span class="hljs-keyword">BY</span> <span class="hljs-keyword">RANGE</span> COLUMNS (CreationDate) (
  ...
  <span class="hljs-keyword">PARTITION</span> p201403 <span class="hljs-keyword">VALUES</span> LESS THAN (<span class="hljs-string">&#x27;2014-04-01&#x27;</span>),
  <span class="hljs-keyword">PARTITION</span> p201404 <span class="hljs-keyword">VALUES</span> LESS THAN (<span class="hljs-string">&#x27;2014-05-01&#x27;</span>),
  ...
  <span class="hljs-keyword">PARTITION</span> p_futuro <span class="hljs-keyword">VALUES</span> LESS THAN (MAXVALUE)
);
</code></pre>
<p>Ahora <code>WHERE CreationDate &gt;= '2014-03-01' AND CreationDate &lt; '2014-05-01'</code><br />
sólo lee <code>p201403</code> y <code>p201404</code></p>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="114" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="compact" data-theme="bdge" data-lang="es" lang="es" class="compact" data-marpit-pagination="114" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:compact;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="mantenimiento-de-particiones">Mantenimiento de particiones</h1>
<p>Partir la última partición para abrir un año nuevo:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">ALTER TABLE</span> PostsPorAño
REORGANIZE <span class="hljs-keyword">PARTITION</span> p_futuro <span class="hljs-keyword">INTO</span> (
  <span class="hljs-keyword">PARTITION</span> p2018 <span class="hljs-keyword">VALUES</span> LESS THAN (<span class="hljs-number">2019</span>),
  <span class="hljs-keyword">PARTITION</span> p_futuro <span class="hljs-keyword">VALUES</span> LESS THAN MAXVALUE
);
</code></pre>
<p>Purgar un año entero y consultar los metadatos:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">ALTER TABLE</span> PostsPorAño <span class="hljs-keyword">DROP</span> <span class="hljs-keyword">PARTITION</span> p2016;

<span class="hljs-keyword">SELECT</span> PARTITION_NAME, TABLE_ROWS, PARTITION_DESCRIPTION
<span class="hljs-keyword">FROM</span> INFORMATION_SCHEMA.PARTITIONS
<span class="hljs-keyword">WHERE</span> TABLE_SCHEMA <span class="hljs-operator">=</span> DATABASE() <span class="hljs-keyword">AND</span> TABLE_NAME <span class="hljs-operator">=</span> <span class="hljs-string">&#x27;PostsPorAño&#x27;</span>;
</code></pre>
<p><code>TABLE_ROWS</code> es una estimación, no un recuento exacto</p>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="115" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="section-divider" data-theme="bdge" data-lang="es" lang="es" class="section-divider" data-marpit-pagination="115" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:section-divider;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="cuestiones-avanzadas">Cuestiones avanzadas</h1>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="116" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="compact" data-theme="bdge" data-lang="es" lang="es" class="compact" data-marpit-pagination="116" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:compact;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="transacciones">Transacciones</h1>
<ul>
<li>Una <strong>transacción</strong> agrupa modificaciones que se confirman o deshacen juntas</li>
<li>InnoDB es <strong>siempre</strong> transaccional: con <code>autocommit</code> activo (por defecto), cada sentencia es una transacción que se confirma sola</li>
<li>Para agrupar varias sentencias:</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">START</span> TRANSACTION;
<span class="hljs-keyword">UPDATE</span> Cuentas <span class="hljs-keyword">SET</span> Saldo <span class="hljs-operator">=</span> Saldo <span class="hljs-operator">-</span> <span class="hljs-number">100</span> <span class="hljs-keyword">WHERE</span> Id <span class="hljs-operator">=</span> <span class="hljs-number">1</span>;
<span class="hljs-keyword">UPDATE</span> Cuentas <span class="hljs-keyword">SET</span> Saldo <span class="hljs-operator">=</span> Saldo <span class="hljs-operator">+</span> <span class="hljs-number">100</span> <span class="hljs-keyword">WHERE</span> Id <span class="hljs-operator">=</span> <span class="hljs-number">2</span>;
<span class="hljs-keyword">COMMIT</span>;      <span class="hljs-comment">-- o ROLLBACK; para deshacer ambos</span>
</code></pre>
<ul>
<li>Las sentencias DDL (<code>CREATE</code>, <code>ALTER</code>, <code>DROP</code>) provocan un <code>COMMIT</code> implícito en MySQL: no se pueden deshacer con <code>ROLLBACK</code></li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="117" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="compact" data-theme="bdge" data-lang="es" lang="es" class="compact" data-marpit-pagination="117" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:compact;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="funciones-ventana-over">Funciones ventana: <code>OVER (...)</code></h1>
<p>Calcula un valor <strong>por fila</strong> a partir de su grupo, sin colapsarlo como <code>GROUP BY</code>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> MonthStart, OwnerUserId, NumQuestions,
       <span class="hljs-built_in">ROW_NUMBER</span>() <span class="hljs-keyword">OVER</span> (
         <span class="hljs-keyword">PARTITION</span> <span class="hljs-keyword">BY</span> MonthStart
         <span class="hljs-keyword">ORDER</span> <span class="hljs-keyword">BY</span> NumQuestions <span class="hljs-keyword">DESC</span>, OwnerUserId
       ) <span class="hljs-keyword">AS</span> rn
<span class="hljs-keyword">FROM</span> MonthlyQuestions;
</code></pre>
<ul>
<li><code>PARTITION BY</code> define los grupos (un mes); <code>ORDER BY</code>, el orden en cada uno</li>
<li><code>ROW_NUMBER()</code> numera 1, 2, 3...; <code>RANK()</code> repite el puesto en los empates y deja huecos (1, 1, 3); <code>DENSE_RANK()</code> no deja huecos (1, 1, 2)</li>
<li>Se evalúan tras <code>WHERE</code> y <code>GROUP BY</code>: para filtrar por <code>rn</code> hay que envolver la consulta en una CTE</li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="118" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="compact code" data-theme="bdge" data-lang="es" lang="es" class="compact code" data-marpit-pagination="118" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:compact code;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="cte-y-ventana-juntas-los-cinco-autores-de-cada-mes">CTE y ventana juntas: los cinco autores de cada mes</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">WITH</span> MonthlyQuestions <span class="hljs-keyword">AS</span> (
  <span class="hljs-keyword">SELECT</span> DATE_FORMAT(CreationDate, <span class="hljs-string">&#x27;%Y-%m-01&#x27;</span>) <span class="hljs-keyword">AS</span> MonthStart,
         OwnerUserId, <span class="hljs-built_in">COUNT</span>(<span class="hljs-operator">*</span>) <span class="hljs-keyword">AS</span> NumQuestions
  <span class="hljs-keyword">FROM</span> Posts
  <span class="hljs-keyword">WHERE</span> PostTypeId <span class="hljs-operator">=</span> <span class="hljs-number">1</span> <span class="hljs-keyword">AND</span> OwnerUserId <span class="hljs-keyword">IS</span> <span class="hljs-keyword">NOT NULL</span>
  <span class="hljs-keyword">GROUP</span> <span class="hljs-keyword">BY</span> MonthStart, OwnerUserId
), Ranked <span class="hljs-keyword">AS</span> (
  <span class="hljs-keyword">SELECT</span> MonthStart, OwnerUserId, NumQuestions,
         <span class="hljs-built_in">ROW_NUMBER</span>() <span class="hljs-keyword">OVER</span> (<span class="hljs-keyword">PARTITION</span> <span class="hljs-keyword">BY</span> MonthStart
           <span class="hljs-keyword">ORDER</span> <span class="hljs-keyword">BY</span> NumQuestions <span class="hljs-keyword">DESC</span>, OwnerUserId) <span class="hljs-keyword">AS</span> rn
  <span class="hljs-keyword">FROM</span> MonthlyQuestions
)
<span class="hljs-keyword">SELECT</span> <span class="hljs-operator">*</span> <span class="hljs-keyword">FROM</span> Ranked <span class="hljs-keyword">WHERE</span> rn <span class="hljs-operator">&lt;=</span> <span class="hljs-number">5</span> <span class="hljs-keyword">ORDER</span> <span class="hljs-keyword">BY</span> MonthStart, rn;
</code></pre>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="119" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="compact code" data-theme="bdge" data-lang="es" lang="es" class="compact code" data-marpit-pagination="119" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:compact code;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="cte-y-ventana-juntas-el-resultado">CTE y ventana juntas: el resultado</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">MonthStart  OwnerUserId  NumQuestions  rn
2015-10-01           23             2   1
2015-10-01           24             2   2
2015-10-01           37             2   3
2015-10-01           20             1   4
2015-10-01           21             1   5
2015-11-01           21             5   1
...
</code></pre>
<ul>
<li>La primera CTE fija la granularidad: una fila por mes y autor</li>
<li>La segunda numera dentro de cada mes, con el desempate por <code>OwnerUserId</code></li>
<li>El filtro <code>rn &lt;= 5</code> va fuera porque <code>rn</code> no existe aún en el <code>SELECT</code> que la calcula</li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="120" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="compact" data-theme="bdge" data-lang="es" lang="es" class="compact" data-marpit-pagination="120" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:compact;--theme:bdge;--lang:es;" data-marpit-pagination-total="120" data-size="16:9">
<h1 id="estad%C3%ADsticas-e-histogramas">Estadísticas e histogramas</h1>
<ul>
<li>El optimizador elige el plan a partir de <strong>estadísticas</strong>: número de filas, cardinalidad de los índices, distribución de valores</li>
<li><code>ANALYZE TABLE Posts</code> recalcula las estadísticas de los índices</li>
<li>Con una distribución <strong>sesgada</strong> (pocas etiquetas muy frecuentes, muchos usuarios con una sola pregunta) suponer valores uniformes lleva a malas estimaciones</li>
<li>Un <strong>histograma</strong> describe la distribución de una columna, aunque no esté indexada:</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql">ANALYZE <span class="hljs-keyword">TABLE</span> Posts
<span class="hljs-keyword">UPDATE</span> HISTOGRAM <span class="hljs-keyword">ON</span> PostTypeId, AnswerCount <span class="hljs-keyword">WITH</span> <span class="hljs-number">32</span> BUCKETS;
</code></pre>
<ul>
<li>No acelera nada por sí mismo: sólo mejora las estimaciones de <code>rows</code> y <code>filtered</code> y, con ello, la elección del plan</li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
