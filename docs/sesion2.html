</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="60" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="compact" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" class="compact" data-marpit-pagination="60" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:compact;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="relaciones-entre-entidades">Relaciones entre entidades</h1>
<div class="columns">
<div class="column">
<ul>
<li><strong>Cardinalidad</strong> y <strong>dependencia</strong></li>
<li>Cardinalidad: las relaciones pueden ser <strong>1:1</strong>, <strong>1:n</strong> o <strong>n:m</strong>, e indican el grado de relación de una entidad con el resto</li>
<li>Dependencia (tiempo de vida):
<ul>
<li><em><strong>Identifying</strong></em> (dependientes): el tiempo de vida de la entidad enlazada depende de la entidad padre</li>
<li><em><strong>Non-identifying</strong></em> (no dependientes): las entidades tienen vida propia</li>
</ul>
</li>
</ul>
</div>
<div class="column">
<p><img src="img/cardinality.png" alt="" style="width:200px;" /></p>
</div>
</div>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="61" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" data-marpit-pagination="61" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="relaciones-11">Relaciones 1:1</h1>
<div class="columns">
<div class="column">
<ul>
<li><strong>Conceptualmente</strong> existe un Post que hace de <em>excerpt</em> (resumen, descripción) de un Tag</li>
<li>Posts y Tags, con respecto a «Excerpt», es <strong>1:1</strong></li>
<li>En el modelado relacional equivale a una clave ajena que puede estar en una de las dos tablas o en ambas</li>
</ul>
</div>
<div class="column">
<p><img src="img/posts_tags_1_1.png" alt="" style="height:380px;" /></p>
</div>
</div>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="62" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" data-marpit-pagination="62" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="relaciones-1n-uno-a-muchos">Relaciones 1:n (uno a muchos)</h1>
<div class="columns">
<div class="column">
<ul>
<li><strong>Conceptualmente</strong> se pueden hacer <strong>comentarios</strong> sobre un <strong>Post</strong></li>
<li>Posts y Comments tienen una relación <strong>1:n</strong></li>
<li>Puede ser dependiente o no (se ve después)</li>
<li>En el modelado relacional equivale a una clave ajena en la clase dependiente, o bien a una tabla separada (más adelante)</li>
</ul>
</div>
<div class="column">
<p><img src="img/posts_comments_1_n.png" alt="" style="height:380px;" /></p>
</div>
</div>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="63" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="figure-only" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" class="figure-only" data-marpit-pagination="63" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:figure-only;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="relaciones-nm-muchos-a-muchos">Relaciones n:m (muchos a muchos)</h1>
<p>En Stack Overflow esta relación está desnormalizada (más adelante). Sin embargo, podemos construir la relación que existe entre <strong>Posts</strong> y <strong>Tags</strong>: sería una relación <strong>n:m</strong>.</p>
<p><img src="img/posts_tags1.png" alt="" style="height:380px;" /></p>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="64" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" data-marpit-pagination="64" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="relaciones-nm-ii">Relaciones n:m (ii)</h1>
<ul>
<li>Conceptualmente, es una relación <em><strong>n:m</strong></em></li>
<li>Un Post puede tener muchos Tags</li>
<li>Y un Tag puede aparecer en muchos Posts</li>
<li>¿Cómo se obtendría?</li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="65" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="figure-only" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" class="figure-only" data-marpit-pagination="65" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:figure-only;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="relaciones-n%E2%93%9C%EF%B8%8F-tabla-posttags">Relaciones n<img class="emoji" draggable="false" alt="Ⓜ️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/24c2.svg" data-marp-twemoji=""/> tabla <code>PostTags</code></h1>
<p><img src="img/posts_tags2.png" alt="" style="height:460px;" /></p>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="66" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" data-marpit-pagination="66" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="relaciones-nm-iii">Relaciones n:m (iii)</h1>
<ul>
<li><strong>Ahora bien</strong>:
<ul>
<li>El modelo relacional <strong>no permite añadir esa relación tal cual</strong></li>
<li>Requiere del uso de una <strong>entidad artificial</strong> (<em>gap</em> semántico)</li>
</ul>
</li>
<li>¿Con qué se corresponde la tabla <code>PostTags</code> en el mundo real?</li>
<li>Ahora la relación es <em><strong>identifying</strong></em> <img class="emoji" draggable="false" alt="🙂" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f642.svg" data-marp-twemoji=""/></li>
<li>El caso anterior <strong>1:n</strong> es un caso especial de éste, por lo que también se podría implementar igual</li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="67" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" data-marpit-pagination="67" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="relaciones-dependientes-vs-no-dependientes">Relaciones dependientes <em>vs.</em> no dependientes</h1>
<ul>
<li>Son más comunes las <strong>no dependientes</strong></li>
<li>Generalmente las relaciones <strong>dependientes</strong> se dan en casos de relaciones <strong>1:n</strong> (p. ej. Posts/Comments)
<ul>
<li>La entidad «1» se considera la entidad «<strong>padre</strong>» (<strong>Posts</strong>)</li>
<li>Y la otra, la entidad dependiente (<strong>Comments</strong>)</li>
</ul>
</li>
<li>La entidad dependiente está supeditada a la entidad padre</li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="68" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="compact" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" class="compact" data-marpit-pagination="68" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:compact;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="relaciones-dependientes-ii">Relaciones dependientes (ii)</h1>
<ul>
<li>Su tiempo de vida también está supeditado:
<ul>
<li>Cuando la entidad padre se elimina, la entidad dependiente no tiene sentido por sí misma</li>
<li>Generalmente indica una restricción de clave ajena con cascada en <em>delete</em> y <em>update</em></li>
</ul>
</li>
<li>Estrategias de implementación relacional:
<ul>
<li>Una tabla aparte (el caso <strong>1:n</strong> es un caso particular de <strong>n:m</strong>)</li>
<li>Una clave ajena en la entidad <strong>n</strong> (dependiente o no) que referencia a la entidad <strong>1</strong></li>
</ul>
</li>
<li>En las relaciones <strong>dependientes</strong>, dos alternativas:
<ol>
<li>Clave primaria independiente para la entidad dependiente + clave ajena</li>
<li>Clave primaria que incluye la clave dependiente y la clave ajena</li>
</ol>
</li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="69" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" data-marpit-pagination="69" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="relaciones-dependientes-1n">Relaciones dependientes (1:n)</h1>
<div class="columns">
<div class="column">
<ul>
<li>La clave primaria de <strong>Comments</strong> <strong>incluye</strong> a la clave ajena de <strong>Posts</strong></li>
<li>La clave primaria es (Id, Posts_Id)</li>
<li>La identificación de un <strong>Comment</strong> sólo tiene sentido <strong>dentro</strong> de un Post</li>
<li>Al eliminar un Post, el comentario no tiene sentido</li>
<li>P. ej.: Post 1000, Comentario 1: (clave ⟨1,1000⟩)</li>
</ul>
</div>
<div class="column">
<p><img src="img/posts_comments_1_n_2.png" alt="" style="height:320px;" /></p>
</div>
</div>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="70" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="section-divider" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" class="section-divider" data-marpit-pagination="70" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:section-divider;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="71" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="figure-only" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" class="figure-only" data-marpit-pagination="71" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:figure-only;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="72" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="compact" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" class="compact" data-marpit-pagination="72" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:compact;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="agregar-antes-de-unir-relaciones-1n">Agregar antes de unir relaciones 1:n</h1>
<p>Una publicación puede tener varios comentarios y votos. Unir ambas relaciones<br />
directamente multiplica sus filas:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">1 publicación × 3 comentarios × 4 votos = 12 filas
</code></pre>
<p>Aplicar <code>COUNT()</code> o <code>SUM()</code> después contaría varias veces los mismos hechos.<br />
La solución es agregar cada relación por separado hasta obtener <strong>una fila por<br />
publicación</strong> y unir después esos resultados. Si la granularidad buscada fuese<br />
una fila por pregunta incluyendo sus respuestas, cada agregado tendría que<br />
reducirse primero a <code>PreguntaId</code>.</p>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="73" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" data-marpit-pagination="73" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="agregar-antes-de-unir-relaciones-1n-consulta">Agregar antes de unir relaciones 1:n (consulta)</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">WITH</span> C <span class="hljs-keyword">AS</span> (
  <span class="hljs-keyword">SELECT</span> PostId, <span class="hljs-built_in">COUNT</span>(<span class="hljs-operator">*</span>) <span class="hljs-keyword">AS</span> NumComentarios
  <span class="hljs-keyword">FROM</span> Comments <span class="hljs-keyword">GROUP</span> <span class="hljs-keyword">BY</span> PostId
), V <span class="hljs-keyword">AS</span> (
  <span class="hljs-keyword">SELECT</span> PostId, <span class="hljs-built_in">COUNT</span>(<span class="hljs-operator">*</span>) <span class="hljs-keyword">AS</span> NumVotos
  <span class="hljs-keyword">FROM</span> Votes <span class="hljs-keyword">GROUP</span> <span class="hljs-keyword">BY</span> PostId
)
<span class="hljs-keyword">SELECT</span> p.Id, <span class="hljs-built_in">COALESCE</span>(c.NumComentarios, <span class="hljs-number">0</span>), <span class="hljs-built_in">COALESCE</span>(v.NumVotos, <span class="hljs-number">0</span>)
<span class="hljs-keyword">FROM</span> Posts <span class="hljs-keyword">AS</span> p
<span class="hljs-keyword">LEFT</span> <span class="hljs-keyword">JOIN</span> C <span class="hljs-keyword">AS</span> c <span class="hljs-keyword">ON</span> c.PostId <span class="hljs-operator">=</span> p.Id
<span class="hljs-keyword">LEFT</span> <span class="hljs-keyword">JOIN</span> V <span class="hljs-keyword">AS</span> v <span class="hljs-keyword">ON</span> v.PostId <span class="hljs-operator">=</span> p.Id;
</code></pre>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="74" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="compact" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" class="compact" data-marpit-pagination="74" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:compact;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="%C3%ADndices">Índices</h1>
<ul>
<li>Sea con SQL o con datos <em>raw</em>, la búsqueda no se puede realizar secuencialmente</li>
<li>Los <em><strong>índices</strong></em> se utilizan para acelerar esta búsqueda</li>
<li>El concepto de índice está presente en casi todas las bases de datos (también es un eje principal en las NoSQL)</li>
<li>En SQL, los índices se pueden aplicar a los valores de una o más columnas</li>
<li>El planificador de consultas usa los índices disponibles; es <strong>labor del usuario</strong> definir los adecuados</li>
<li>Los índices aceleran las búsquedas, pero también ocupan espacio</li>
<li>Se utiliza <code>CREATE INDEX</code>, <code>ALTER TABLE</code> o se incluyen en <code>CREATE TABLE</code></li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="75" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="code" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" class="code" data-marpit-pagination="75" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:code;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="%C3%ADndices-explain">Índices: <code>EXPLAIN</code></h1>
<p><code>EXPLAIN</code> muestra si una consulta usa un índice:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-console"><span class="hljs-meta prompt_">mysql&gt; </span><span class="language-bash">explain <span class="hljs-keyword">select</span> * from Posts <span class="hljs-built_in">where</span> Id=5;</span>
+----+-------------+-------+------+---------------+------+...
| id | select_type | table | type | possible_keys | key  |...
+----+-------------+-------+------+---------------+------+...
|  1 | SIMPLE      | Posts | ref  | Id            | Id   |...
+----+-------------+-------+------+---------------+------+...
</code></pre>
<p>En general, hay tres tipos de índices: basados en árboles balanceados, basados en tablas <em>hash</em> e índices <em>full-text</em>.</p>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="76" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" data-marpit-pagination="76" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="%C3%ADndices-de-%C3%A1rboles-balanceados">Índices de árboles balanceados</h1>
<ul>
<li>Mantienen la clave ordenada dentro de un árbol balanceado (B-Tree, B+, etc.)</li>
<li>Aceleran búsquedas con los operadores <code>=</code>, <code>&lt;</code> y <code>&gt;</code>, y rangos (<code>BETWEEN</code>)</li>
<li>También <code>LIKE</code> que no empiece con comodín</li>
<li>Puede ayudar en <code>ORDER BY</code></li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="77" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="compact" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" class="compact" data-marpit-pagination="77" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:compact;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="%C3%ADndices-compuestos-y-prefijo-izquierdo">Índices compuestos y prefijo izquierdo</h1>
<p>Un índice B-tree compuesto se ordena lexicográficamente por sus columnas:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">CREATE</span> INDEX idx_autor_fecha
<span class="hljs-keyword">ON</span> Posts (OwnerUserId, CreationDate);
</code></pre>
<p>Puede localizar eficientemente consultas por:</p>
<ul>
<li><code>OwnerUserId</code></li>
<li><code>OwnerUserId</code> y <code>CreationDate</code></li>
</ul>
<p>En general, no permite localizar directamente sólo por <code>CreationDate</code>: falta<br />
la primera columna del índice. Es la <strong>regla del prefijo izquierdo</strong>.</p>
<p>El orden debe elegirse a partir de los patrones de acceso, no del orden en que<br />
las columnas aparecen escritas en <code>WHERE</code>.</p>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="78" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="compact" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" class="compact" data-marpit-pagination="78" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:compact;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="igualdades-antes-del-primer-rango">Igualdades antes del primer rango</h1>
<p>Con un índice <code>(A, B, C)</code>, el caso más favorable encadena igualdades y después<br />
un rango:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">WHERE</span> A <span class="hljs-operator">=</span> <span class="hljs-number">7</span> <span class="hljs-keyword">AND</span> B <span class="hljs-operator">=</span> <span class="hljs-number">3</span> <span class="hljs-keyword">AND</span> C <span class="hljs-operator">&gt;=</span> <span class="hljs-number">100</span>
</code></pre>
<p>El árbol puede acotar el intervalo mediante las tres columnas. En cambio:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">WHERE</span> A <span class="hljs-operator">=</span> <span class="hljs-number">7</span> <span class="hljs-keyword">AND</span> B <span class="hljs-operator">&gt;=</span> <span class="hljs-number">3</span> <span class="hljs-keyword">AND</span> C <span class="hljs-operator">=</span> <span class="hljs-number">100</span>
</code></pre>
<p>el rango sobre <code>B</code> suele ser el último que acota el recorrido. <code>C</code> todavía<br />
puede evaluarse desde el índice —por ejemplo, mediante <em>index condition<br />
pushdown</em>—, pero normalmente no reduce el intervalo que hay que recorrer.</p>
<p>Por eso suelen colocarse primero las columnas comparadas por igualdad y después<br />
la columna de rango, siempre contrastándolo con las consultas reales.</p>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="79" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="compact" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" class="compact" data-marpit-pagination="79" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:compact;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="predicados-sargables">Predicados sargables</h1>
<p>Un predicado es <strong>sargable</strong> cuando el motor puede convertirlo en un intervalo<br />
de búsqueda sobre el valor almacenado en el índice:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-comment">-- Sargable</span>
<span class="hljs-keyword">WHERE</span> CreationDate <span class="hljs-operator">&gt;=</span> <span class="hljs-string">&#x27;2016-01-01&#x27;</span>
  <span class="hljs-keyword">AND</span> CreationDate <span class="hljs-operator">&lt;</span>  <span class="hljs-string">&#x27;2017-01-01&#x27;</span>

<span class="hljs-comment">-- Mismo criterio lógico, pero no sargable sobre CreationDate</span>
<span class="hljs-keyword">WHERE</span> <span class="hljs-keyword">YEAR</span>(CreationDate) <span class="hljs-operator">=</span> <span class="hljs-number">2016</span>
</code></pre>
<p>Envolver la columna indexada en una función obliga normalmente a calcular la<br />
función por fila. También pueden impedir el acceso eficiente conversiones de<br />
tipo implícitas, operaciones aritméticas sobre la columna o patrones<br />
<code>LIKE '%texto'</code>.</p>
<p>La alternativa es reescribir el predicado sobre la columna original o crear,<br />
si el patrón lo justifica, una columna generada con su propio índice.</p>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="80" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="compact" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" class="compact" data-marpit-pagination="80" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:compact;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="%C3%ADndice-candidato-no-significa-%C3%ADndice-eficiente">Índice candidato no significa índice eficiente</h1>
<ul>
<li>Un índice es <strong>candidato</strong> si sus columnas y operadores permiten usarlo para<br />
la consulta; aparece normalmente en <code>possible_keys</code> de <code>EXPLAIN</code></li>
<li>El optimizador puede no elegirlo si estima que recuperará gran parte de la<br />
tabla, si otro índice es más selectivo o si el acceso aleatorio costaría más<br />
que un recorrido secuencial</li>
<li>Que aparezca en <code>key</code> confirma la elección, no que el plan sea bueno</li>
<li>Un índice de cobertura puede ahorrar el acceso a las filas de la tabla, pero<br />
ocupa más espacio y encarece las escrituras</li>
<li><code>EXPLAIN ANALYZE</code> ejecuta la consulta y permite contrastar estimaciones,<br />
filas recorridas, bucles y tiempo real</li>
</ul>
<p>La decisión se justifica con el patrón de consulta, la distribución de los<br />
datos y el plan medido, no sólo con la existencia del índice.</p>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="81" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" data-marpit-pagination="81" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="%C3%ADndices-de-tablas-hash">Índices de tablas <em>hash</em></h1>
<ul>
<li>Sólo para consultas de igualdad (<code>=</code>) y desigualdad (<code>&lt;=&gt;</code>)</li>
<li>Son muy rápidos</li>
<li>No se pueden usar para <code>ORDER BY</code></li>
<li>Sólo se pueden usar con valores completos de clave (no permiten prefijos, por ejemplo)</li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="82" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" data-marpit-pagination="82" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="%C3%ADndices-full-text">Índices <em>full-text</em></h1>
<ul>
<li>Usados en búsquedas inversas sobre campos textuales</li>
<li>Dada una palabra o conjunto de palabras, encuentran la fila o filas en las que el campo indexado contiene esas palabras</li>
<li>Tienen limitaciones con <code>LIKE</code> y comodines (<code>%</code>)</li>
<li>Por ello los SGBD proveen operadores especiales (p. ej. en MySQL <code>MATCH(...) AGAINST ...</code>, se estudia en prácticas)</li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="83" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" data-marpit-pagination="83" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="desnormalizaci%C3%B3n">Desnormalización</h1>
<ul>
<li>El modelo relacional basa el modelado de datos en la <strong>normalización</strong>, en sus distintos niveles</li>
<li>Esto permite aplicar el principio de «sólo almacenar un dato en un sitio», lo que lleva a la eficiencia de datos</li>
<li>Pero a veces necesitamos también <strong>eficiencia de acceso</strong>, y a veces está reñida con la normalización</li>
<li>El principal escollo para la velocidad es la unión (<code>JOIN</code>) de datos de tablas</li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="84" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" data-marpit-pagination="84" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="%C2%BFpor-qu%C3%A9-desnormalizar">¿Por qué desnormalizar?</h1>
<ul>
<li><strong>Mantener la historia</strong>: los datos de los clientes, por ejemplo, pueden cambiar; necesitamos almacenar sus valores, p. ej., al emitir una factura en el pasado. Para eso hay que copiar los datos del cliente en ese momento</li>
<li><strong>Mejorar la velocidad de consulta</strong>: a veces, para consultas recurrentes, tenemos que usar uniones de varias tablas. Se puede evitar la unión, por ejemplo, añadiendo claves ajenas a las tablas finales, o bien —como en <code>Posts.Tags</code>— replicando la información</li>
<li><strong>Precalcular valores necesitados de antemano</strong>: si hay datos que se necesitarán, como medias o totales, podemos calcularlos y almacenarlos de antemano</li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="85" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" data-marpit-pagination="85" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="desventajas-de-desnormalizar">Desventajas de desnormalizar</h1>
<ul>
<li><strong>Espacio en disco</strong>: al igual que con los índices, la copia y duplicación de datos ocupa más espacio</li>
<li><strong>Anomalías de datos</strong>: un cambio en un dato puede requerir un cambio en más de una parte de la base de datos para mantener la consistencia. Los SGBDR no están preparados para mantener este tipo de consistencia por sí solos; hay que usar <em>triggers</em>, transacciones, etc.</li>
<li><strong>Ralentización de las actualizaciones</strong>: dependiendo del <em>ratio</em> entre actualizaciones y consultas, puede ser un punto importante</li>
<li><strong>Más código, más dependencias, más propenso a errores</strong>: al necesitar más coordinación, hay más dependencias ocultas, más errores y mayor coste de mantenimiento</li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="86" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" data-marpit-pagination="86" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="desnormalizaci%C3%B3n-ejemplos-en-stack-overflow">Desnormalización: ejemplos en Stack Overflow</h1>
<ul>
<li>En la tabla <code>Posts</code> tenemos, por ejemplo, el campo <code>Tags</code>, que contiene la lista de los tags. Evita tener que hacer un <code>JOIN</code> para obtener sus nombres</li>
<li>También está el campo <code>Score</code>, que aglutina todos los votos positivos recibidos (también está en la tabla <code>Votes</code>)</li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="87" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" data-marpit-pagination="87" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="particiones">Particiones</h1>
<ul>
<li>El mecanismo de partición permite partir tablas de forma <strong>lógica</strong></li>
<li>Es decir, <strong>transparente al usuario</strong></li>
<li>Las tablas partidas tienen ciertas restricciones: por ejemplo, no permiten índices o claves ajenas arbitrarios</li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="88" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-class="dense" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" class="dense" data-marpit-pagination="88" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--class:dense;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="particionado-y-claves-%C3%BAnicas-en-mysql">Particionado y claves únicas en MySQL</h1>
<p>Todas las columnas usadas por la expresión de particionado deben pertenecer a<br />
<strong>cada clave única</strong> de la tabla, incluida la clave primaria.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">CREATE TABLE</span> PostsPorAnio (
  Id <span class="hljs-type">BIGINT</span> <span class="hljs-keyword">NOT NULL</span>,
  CreationDate DATETIME <span class="hljs-keyword">NOT NULL</span>,
  Score <span class="hljs-type">INT</span>,
  <span class="hljs-keyword">PRIMARY KEY</span> (Id, CreationDate)
)
<span class="hljs-keyword">PARTITION</span> <span class="hljs-keyword">BY</span> <span class="hljs-keyword">RANGE</span> (<span class="hljs-keyword">YEAR</span>(CreationDate)) (
  <span class="hljs-keyword">PARTITION</span> p2016 <span class="hljs-keyword">VALUES</span> LESS THAN (<span class="hljs-number">2017</span>),
  <span class="hljs-keyword">PARTITION</span> p2017 <span class="hljs-keyword">VALUES</span> LESS THAN (<span class="hljs-number">2018</span>),
  <span class="hljs-keyword">PARTITION</span> p_futuro <span class="hljs-keyword">VALUES</span> LESS THAN MAXVALUE
);
</code></pre>
<p><code>PRIMARY KEY (Id)</code> no sería válida: dos particiones distintas no pueden<br />
comprobar por separado una unicidad global sobre <code>Id</code>. Esta restricción debe<br />
tenerse en cuenta antes de copiar una tabla existente y conservar sus claves.</p>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="89" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" data-marpit-pagination="89" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="ventajas-del-particionado">Ventajas del particionado</h1>
<ul>
<li>Aceleran las búsquedas y las inserciones (se puede restringir sobre qué particiones actúan)</li>
<li>Aceleran las búsquedas de rangos</li>
<li>Permiten almacenar la información histórica de forma eficiente (queda en particiones que se usan rara vez, mientras que los datos actuales usan sólo las últimas particiones)</li>
<li>Permiten de manera sencilla la <strong>distribución física de los datos en servidores</strong></li>
</ul>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="90" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" data-marpit-pagination="90" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="%C2%BFcu%C3%A1ndo-usar-particionado">¿Cuándo usar particionado?</h1>
<ul>
<li>Si casi siempre se hacen consultas sobre la columna de particionado</li>
<li>Si se tienen datos históricos que se quiere que no «estorben»</li>
<li>Si los índices son más grandes que la memoria RAM</li>
</ul>
<p>En MySQL se especifican en <code>CREATE TABLE</code> o <code>ALTER TABLE</code>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">CREATE TABLE</span> <span class="hljs-operator">&lt;</span>table_name<span class="hljs-operator">&gt;</span> (<span class="hljs-operator">&lt;</span>columns<span class="hljs-operator">&gt;</span>)
<span class="hljs-keyword">PARTITION</span> <span class="hljs-keyword">BY</span> <span class="hljs-operator">&lt;</span>type<span class="hljs-operator">&gt;</span> (<span class="hljs-operator">&lt;</span>partition_expression<span class="hljs-operator">&gt;</span>);
</code></pre>
<p><code>&lt;type&gt;</code> puede ser <code>RANGE</code>, <code>LIST</code>, <code>HASH</code> o <code>KEY</code>.</p>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="91" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" data-marpit-pagination="91" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="particionado-range">Particionado <code>RANGE</code></h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">CREATE TABLE</span> ...
<span class="hljs-keyword">PARTITION</span> <span class="hljs-keyword">BY</span> <span class="hljs-keyword">RANGE</span> (att) (
<span class="hljs-keyword">PARTITION</span> p0 <span class="hljs-keyword">VALUES</span> LESS THAN (<span class="hljs-number">10000</span>),
<span class="hljs-keyword">PARTITION</span> p1 <span class="hljs-keyword">VALUES</span> LESS THAN (<span class="hljs-number">20000</span>),
<span class="hljs-keyword">PARTITION</span> p2 <span class="hljs-keyword">VALUES</span> LESS THAN (<span class="hljs-number">30000</span>),
<span class="hljs-keyword">PARTITION</span> p3 <span class="hljs-keyword">VALUES</span> LESS THAN (<span class="hljs-number">40000</span>),
<span class="hljs-keyword">PARTITION</span> p4 <span class="hljs-keyword">VALUES</span> LESS THAN MAXVALUE)
</code></pre>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="92" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" data-marpit-pagination="92" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="particionado-list">Particionado <code>LIST</code></h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">CREATE TABLE</span> ...
  <span class="hljs-keyword">PARTITION</span> <span class="hljs-keyword">BY</span> LIST (store_id) (
<span class="hljs-keyword">PARTITION</span> pNorth <span class="hljs-keyword">VALUES</span> <span class="hljs-keyword">IN</span> (<span class="hljs-number">2</span>,<span class="hljs-number">8</span>,<span class="hljs-number">12</span>),
<span class="hljs-keyword">PARTITION</span> pEast <span class="hljs-keyword">VALUES</span> <span class="hljs-keyword">IN</span> (<span class="hljs-number">1</span>,<span class="hljs-number">4</span>,<span class="hljs-number">7</span>),
<span class="hljs-keyword">PARTITION</span> pWest <span class="hljs-keyword">VALUES</span> <span class="hljs-keyword">IN</span> (<span class="hljs-number">3</span>,<span class="hljs-number">5</span>,<span class="hljs-number">6</span>,<span class="hljs-number">10</span>),
<span class="hljs-keyword">PARTITION</span> pSouth <span class="hljs-keyword">VALUES</span> <span class="hljs-keyword">IN</span> (<span class="hljs-number">9</span>,<span class="hljs-number">11</span>)
)
</code></pre>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="93" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" data-marpit-pagination="93" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="particionado-hash-y-key">Particionado <code>HASH</code> y <code>KEY</code></h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">CREATE TABLE</span> ...
<span class="hljs-keyword">PARTITION</span> <span class="hljs-keyword">BY</span> HASH (att)
PARTITIONS <span class="hljs-number">4</span>;
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">CREATE TABLE</span> ...
<span class="hljs-keyword">PARTITION</span> <span class="hljs-keyword">BY</span> KEY (att)
PARTITIONS <span class="hljs-number">4</span>;
</code></pre>
<footer>BDGE · Sesión 2 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="94" data-paginate="true" data-footer="BDGE · Sesión 2 · Curso 2026/2027" data-lang="es" data-theme="40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a" lang="es" data-marpit-pagination="94" style="--paginate:true;--footer:BDGE · Sesión 2 · Curso 2026/2027;--lang:es;--theme:40osu7523rvf96nhctxeya7ywnzsrtgws0zgft5c4a;" data-marpit-pagination-total="95" data-size="16:9">
<h1 id="consultar-particiones">Consultar particiones</h1>

<h1 id="partition-pruning-comprobar-no-suponer"><em>Partition pruning</em>: comprobar, no suponer</h1>
<p>El optimizador descarta particiones cuando puede deducir de <code>WHERE</code> cuáles<br />
podrían contener filas. Para particiones anuales, un rango directo suele<br />
expresar bien esa información:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql">EXPLAIN <span class="hljs-keyword">SELECT</span> <span class="hljs-built_in">COUNT</span>(<span class="hljs-operator">*</span>) <span class="hljs-keyword">FROM</span> PostsPorAnio
<span class="hljs-keyword">WHERE</span> CreationDate <span class="hljs-operator">&gt;=</span> <span class="hljs-string">&#x27;2016-01-01&#x27;</span>
  <span class="hljs-keyword">AND</span> CreationDate <span class="hljs-operator">&lt;</span>  <span class="hljs-string">&#x27;2017-01-01&#x27;</span>;
</code></pre>
<p>Una transformación arbitraria puede impedir esa deducción:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql">EXPLAIN <span class="hljs-keyword">SELECT</span> <span class="hljs-built_in">COUNT</span>(<span class="hljs-operator">*</span>) <span class="hljs-keyword">FROM</span> PostsPorAnio
<span class="hljs-keyword">WHERE</span> DATE_FORMAT(CreationDate, <span class="hljs-string">&#x27;%Y&#x27;</span>) <span class="hljs-operator">=</span> <span class="hljs-string">&#x27;2016&#x27;</span>;
</code></pre>
<p>Algunas funciones que coinciden con la expresión de particionado sí son<br />
reconocidas por MySQL. Por eso no basta con razonar por intuición: la columna<br />
<code>partitions</code> de <code>EXPLAIN</code> indica las particiones que realmente se leerán.</p>
