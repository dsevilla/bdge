<h1 id="consistencia-en-apache-cassandra">Consistencia en Apache Cassandra</h1>
<ul>
<li>Cassandra permite ajustar disponibilidad y consistencia configurando <em>replication factor</em> y <em>consistency level</em></li>
<li>El nivel de consistencia se define por consulta, y permite ajustar cuándo se ofrece el resultado a los clientes</li>
<li>El factor de replicación asegura que las escrituras se envíen a todas las réplicas</li>
<li>Ejemplo: con consistencia 3 en un clúster con 3 nodos, se necesitaría que los 3 nodos tengan consenso para tener el dato disponible</li>
</ul>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-class="figure-only" data-lang="es" data-theme="a6b4h5hjt8pr9ed1lksq8ly3qo5n8w59sb1nbk7hdd" lang="es" class="figure-only" data-marpit-pagination="46" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--class:figure-only;--lang:es;--theme:a6b4h5hjt8pr9ed1lksq8ly3qo5n8w59sb1nbk7hdd;" data-marpit-pagination-total="73" data-size="16:9">
<h1 id="estrategias-de-replicaci%C3%B3n-simplestrategy">Estrategias de replicación: <code>SimpleStrategy</code></h1>
<p>Despliegues en un solo centro de datos; no considera la topología de la red. Sólo toma la decisión del <em>partitioner</em> y coloca las réplicas restantes en sentido horario.</p>
<p><img src="img/cassandra_simple_strategy.jpg" alt="" style="height:380px;" /></p>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-class="figure-only" data-lang="es" data-theme="a6b4h5hjt8pr9ed1lksq8ly3qo5n8w59sb1nbk7hdd" lang="es" class="figure-only" data-marpit-pagination="47" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--class:figure-only;--lang:es;--theme:a6b4h5hjt8pr9ed1lksq8ly3qo5n8w59sb1nbk7hdd;" data-marpit-pagination-total="73" data-size="16:9">
<h1 id="estrategias-de-replicaci%C3%B3n-networktopologystrategy">Estrategias de replicación: <code>NetworkTopologyStrategy</code></h1>
<p>Despliegues en múltiples centros de datos. También parte de la decisión del <em>partitioner</em>, pero tiene en cuenta la configuración de <em>racks</em> y <em>datacenters</em>.</p>
<p><img src="img/cassandra_net_topology_strategy.jpg" alt="" style="height:380px;" /></p>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-class="compact" data-lang="es" data-theme="a6b4h5hjt8pr9ed1lksq8ly3qo5n8w59sb1nbk7hdd" lang="es" class="compact" data-marpit-pagination="48" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--class:compact;--lang:es;--theme:a6b4h5hjt8pr9ed1lksq8ly3qo5n8w59sb1nbk7hdd;" data-marpit-pagination-total="73" data-size="16:9">
<h1 id="niveles-de-consistencia-de-escritura">Niveles de consistencia de escritura</h1>
<ul>
<li>Al insertar datos se puede especificar el nivel de consistencia de escritura (<code>USING CONSISTENCY</code>, o dentro de un perfil de ejecución — se ve más adelante)</li>
<li>Es el número de réplicas que deben confirmar al coordinador que su inserción local fue exitosa</li>
<li>En cuanto recibe tantos <em>acknowledgements</em> como el nivel configurado, el coordinador informa al cliente del éxito, sin esperar a las réplicas restantes</li>
<li>Niveles: <code>ANY</code>, <code>ONE</code>, <code>TWO</code>, <code>THREE</code>, <code>QUORUM</code>, <code>LOCAL_QUORUM</code>, <code>EACH_QUORUM</code>, <code>ALL</code></li>
<li><code>ONE</code> es aceptable si se necesita rendimiento muy alto y no importa perder alguna escritura; <code>QUORUM</code> asegura que la mayoría de nodos responda antes de considerar la operación exitosa</li>
</ul>
<p><img src="img/cassandra_replica_nodes.png" alt="" style="height:140px;" /></p>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-lang="es" data-theme="a6b4h5hjt8pr9ed1lksq8ly3qo5n8w59sb1nbk7hdd" lang="es" data-marpit-pagination="49" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--lang:es;--theme:a6b4h5hjt8pr9ed1lksq8ly3qo5n8w59sb1nbk7hdd;" data-marpit-pagination-total="73" data-size="16:9">
<h1 id="estrategias-de-replicaci%C3%B3n-ejemplo">Estrategias de replicación: ejemplo</h1>
<p>Escenario con <code>WRITE_CONSISTENCY_LEVEL=2</code> y 3 nodos réplica configurados. En cuanto llega la respuesta de los nodos 2 y 4, el coordinador informa al cliente de que la escritura se realizó con éxito.</p>
<p><img src="img/cassandra_write_suceess.png" alt="" style="height:380px;" /></p>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-class="compact" data-lang="es" data-theme="a6b4h5hjt8pr9ed1lksq8ly3qo5n8w59sb1nbk7hdd" lang="es" class="compact" data-marpit-pagination="50" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--class:compact;--lang:es;--theme:a6b4h5hjt8pr9ed1lksq8ly3qo5n8w59sb1nbk7hdd;" data-marpit-pagination-total="73" data-size="16:9">
<h1 id="procesamiento-de-las-escrituras">Procesamiento de las escrituras</h1>
<p>Cuando llega una solicitud de escritura a un nodo, ocurren principalmente dos cosas:</p>
<ul>
<li>Se agrega al <em><strong>commit log</strong></em> en disco: garantiza la durabilidad (sobrevive incluso ante un fallo del nodo)</li>
<li>Se envía a la <em><strong>memtable</strong></em>: cuando se llena, los datos se vuelcan a una <em><strong>SSTable</strong></em> en disco, y el <em>commit log</em> se limpia</li>
</ul>
<p><img src="img/cassandra_node_internals.png" alt="" style="height:260px;" /></p>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-lang="es" data-theme="a6b4h5hjt8pr9ed1lksq8ly3qo5n8w59sb1nbk7hdd" lang="es" data-marpit-pagination="51" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--lang:es;--theme:a6b4h5hjt8pr9ed1lksq8ly3qo5n8w59sb1nbk7hdd;" data-marpit-pagination-total="73" data-size="16:9">
<h1 id="procesamiento-de-las-lecturas">Procesamiento de las lecturas</h1>
<ul>
<li>Los filtros de Bloom identifican aproximadamente si una fila/columna existe en una SSTable</li>
<li>Se mantienen por SSTable: cada una tiene un filtro de Bloom correspondiente en memoria</li>
</ul>
<blockquote>
<p>Un filtro de Bloom es una estructura de datos genérica para verificar si un elemento está presente en un conjunto o no</p>
</blockquote>
<ul>
<li>Si la respuesta es «puede estar presente», Cassandra busca en la SSTable; si no está, continúa en otras SSTables</li>
<li>Así ahorra muchas exploraciones innecesarias, y un gran coste de E/S de disco</li>
</ul>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-lang="es" data-theme="a6b4h5hjt8pr9ed1lksq8ly3qo5n8w59sb1nbk7hdd" lang="es" data-marpit-pagination="52" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--lang:es;--theme:a6b4h5hjt8pr9ed1lksq8ly3qo5n8w59sb1nbk7hdd;" data-marpit-pagination-total="73" data-size="16:9">
<h1 id="creaci%C3%B3n-de-%C3%ADndices">Creación de índices</h1>
<ul>
<li>En Cassandra los índices secundarios son complicados de usar y pueden afectar mucho al rendimiento</li>
<li>La tabla de índices se almacena en cada nodo del clúster: una consulta con un índice secundario puede convertirse en una pesadilla de rendimiento si accede a varios nodos</li>
<li>Regla general: indexar una columna con <strong>baja cardinalidad</strong> de pocos valores</li>
<li>Actualmente este tipo de índices sufre de bajo rendimiento y alta latencia</li>
</ul>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-lang="es" data-theme="a6b4h5hjt8pr9ed1lksq8ly3qo5n8w59sb1nbk7hdd" lang="es" data-marpit-pagination="53" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--lang:es;--theme:a6b4h5hjt8pr9ed1lksq8ly3qo5n8w59sb1nbk7hdd;" data-marpit-pagination-total="73" data-size="16:9">
<h1 id="sai-storage-attached-index">SAI (<em>Storage-Attached Index</em>)</h1>
<ul>
<li>Nuevo tipo de índice en Apache Cassandra (desde 4.0), con mejor rendimiento que los índices secundarios tradicionales</li>
<li>Permite búsquedas eficientes en columnas no clave</li>
<li>Soporta igualdad, rangos y búsquedas parciales en texto</li>
</ul>
<p><strong>Ventajas</strong>: menor consumo de almacenamiento, soporte para múltiples tipos de datos, consultas más eficientes que con índices tradicionales.</p>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-lang="es" data-theme="a6b4h5hjt8pr9ed1lksq8ly3qo5n8w59sb1nbk7hdd" lang="es" data-marpit-pagination="54" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--lang:es;--theme:a6b4h5hjt8pr9ed1lksq8ly3qo5n8w59sb1nbk7hdd;" data-marpit-pagination-total="73" data-size="16:9">
<h1 id="sai-consideraciones">SAI: consideraciones</h1>
<ul>
<li>No recomendado para columnas con alta cardinalidad</li>
<li>Puede afectar el rendimiento en inserciones frecuentes</li>
</ul>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-class="dense" data-lang="es" data-theme="a6b4h5hjt8pr9ed1lksq8ly3qo5n8w59sb1nbk7hdd" lang="es" class="dense" data-marpit-pagination="55" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--class:dense;--lang:es;--theme:a6b4h5hjt8pr9ed1lksq8ly3qo5n8w59sb1nbk7hdd;" data-marpit-pagination-total="73" data-size="16:9">
<h1 id="%C3%ADndice-sai-vs-clave-de-partici%C3%B3n">Índice SAI vs. clave de partición</h1>
<table>
<thead>
<tr>
<th>Característica</th>
<th>Índice SAI</th>
<th>Clave de partición</th>
</tr>
</thead>
<tbody>
<tr>
<td>Función principal</td>
<td>Búsquedas en columnas no clave</td>
<td>Distribución de datos en nodos</td>
</tr>
<tr>
<td>Impacto en almacenamiento</td>
<td>Crea estructuras adicionales</td>
<td>Define ubicación en el clúster</td>
</tr>
<tr>
<td>Rendimiento en consultas</td>
<td>Optimiza búsquedas secundarias</td>
<td>Muy rápido en clave de partición</td>
</tr>
<tr>
<td>Eficiencia en escrituras</td>
<td>Puede ralentizar inserciones</td>
<td>Altamente eficiente</td>
</tr>
<tr>
<td>Uso recomendado</td>
<td>Igualdad, rango y texto</td>
<td>Consultas rápidas y directas</td>
</tr>
</tbody>
</table>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="56" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-lang="es" data-theme="a6b4h5hjt8pr9ed1lksq8ly3qo5n8w59sb1nbk7hdd" lang="es" data-marpit-pagination="56" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--lang:es;--theme:a6b4h5hjt8pr9ed1lksq8ly3qo5n8w59sb1nbk7hdd;" data-marpit-pagination-total="73" data-size="16:9">
<h1 id="acceso-a-la-base-de-datos">Acceso a la base de datos</h1>
<ul>
<li>Cassandra usa CQL (<em>Cassandra Query Language</em>) para interactuar con la base de datos</li>
<li>Apache Cassandra cuenta con una <em>shell</em> de línea de comandos, <code>cqlsh</code>, sobre la cual se pueden invocar las consultas CQL</li>
<li>Para el acceso desde Python contamos con la librería <code>cassandra-driver</code> (<code>pip install cassandra-driver</code>)</li>
<li>Al conectarnos a un clúster, especificamos distintos <strong>perfiles de ejecución</strong> (<code>ExecutionProfile</code>), que permiten ejecutar consultas de forma diferente en una misma sesión</li>
</ul>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-class="compact" data-lang="es" data-theme="a6b4h5hjt8pr9ed1lksq8ly3qo5n8w59sb1nbk7hdd" lang="es" class="compact" data-marpit-pagination="57" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--class:compact;--lang:es;--theme:a6b4h5hjt8pr9ed1lksq8ly3qo5n8w59sb1nbk7hdd;" data-marpit-pagination-total="73" data-size="16:9">
<h1 id="conexi%C3%B3n-al-cl%C3%BAster-puntos-de-contacto-y-perfiles">Conexión al clúster: puntos de contacto y perfiles</h1>
<p>Conectarse a Cassandra no se parece a abrir una conexión a un servidor SQL: el <em>driver</em> mantiene un <em>pool</em> de conexiones <strong>con todos los nodos que considera accesibles</strong>, y decide, consulta a consulta, a cuál se la envía.</p>
<ul>
<li><strong>Puntos de contacto</strong> (<code>contact_points</code>): sólo se usan en el arranque. El <em>driver</em> abre la <em>control connection</em> contra uno de ellos y descubre el resto por <em>gossip</em> (<code>system.local</code>/<code>system.peers</code>)</li>
<li><strong>Hosts</strong> (<code>cluster.metadata.all_hosts()</code>): cada nodo descubierto, con dirección, <em>datacenter</em>, <em>rack</em> y estado. El <em>driver</em> se conecta a la dirección que <strong>cada nodo publica</strong> (<code>rpc_address</code>/<code>broadcast_rpc_address</code>), no a la de <code>contact_points</code></li>
<li><strong>Perfiles de ejecución</strong> (<code>ExecutionProfile</code>): agrupan política de balanceo, consistencia, reintentos, <em>timeout</em> y <code>row_factory</code>; cada consulta elige uno con <code>execution_profile=</code></li>
</ul>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-class="code" data-lang="es" data-theme="a6b4h5hjt8pr9ed1lksq8ly3qo5n8w59sb1nbk7hdd" lang="es" class="code" data-marpit-pagination="58" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--class:code;--lang:es;--theme:a6b4h5hjt8pr9ed1lksq8ly3qo5n8w59sb1nbk7hdd;" data-marpit-pagination-total="73" data-size="16:9">
<h1 id="modelo-antiguo-frente-a-perfiles">Modelo antiguo frente a perfiles</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">cluster = Cluster([<span class="hljs-string">&quot;cassandra1&quot;</span>], load_balancing_policy=...)   <span class="hljs-comment"># obsoleto</span>
session.default_timeout = <span class="hljs-number">40</span>                                   <span class="hljs-comment"># obsoleto</span>
session.row_factory = dict_factory                              <span class="hljs-comment"># obsoleto</span>
</code></pre>
<p>Los dos modelos son <strong>excluyentes</strong>: en cuanto se pasa <code>execution_profiles=</code> al <code>Cluster</code>, cualquier atributo del modelo antiguo lanza un error:</p>
<ul>
<li><code>Cluster(..., load_balancing_policy=..., execution_profiles=...)</code> → <code>ValueError</code></li>
<li><code>session.default_timeout = 40</code> → <code>ValueError: usar un perfil en su lugar</code></li>
</ul>
<p>El <em>timeout</em> pasa a ser <code>request_timeout</code> <strong>dentro</strong> del perfil; lo mismo para <code>row_factory</code> y el nivel de consistencia por omisión.</p>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="59" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-class="compact" data-lang="es" data-theme="a6b4h5hjt8pr9ed1lksq8ly3qo5n8w59sb1nbk7hdd" lang="es" class="compact" data-marpit-pagination="59" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--class:compact;--lang:es;--theme:a6b4h5hjt8pr9ed1lksq8ly3qo5n8w59sb1nbk7hdd;" data-marpit-pagination-total="73" data-size="16:9">
<h1 id="pol%C3%ADticas-de-balanceo">Políticas de balanceo</h1>
<ul>
<li><code>RoundRobinPolicy</code>: reparte entre todos los nodos vivos</li>
<li><code>DCAwareRoundRobinPolicy(local_dc=...)</code>: sólo usa los nodos del <em>datacenter</em> local. Si <code>local_dc</code> no coincide <strong>exactamente</strong> con el nombre real, todos los nodos se consideran remotos y, con <code>used_hosts_per_remote_dc=0</code> (valor por omisión), el <em>driver</em> se queda sin destinos: <code>NoHostAvailable</code></li>
<li><code>TokenAwarePolicy(política_hija)</code>: con sentencias preparadas, envía la petición directamente a una <strong>réplica</strong> de la partición, ahorrando un salto de coordinación</li>
<li><code>WhiteListRoundRobinPolicy</code> / <code>HostFilterPolicy</code>: restringen el conjunto de nodos utilizables — útiles para fijar consultas a un nodo (administración, depuración), <strong>no</strong> para producción: anulan el reparto de carga y el <em>token awareness</em></li>
</ul>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="60" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-class="code" data-lang="es" data-theme="a6b4h5hjt8pr9ed1lksq8ly3qo5n8w59sb1nbk7hdd" lang="es" class="code" data-marpit-pagination="60" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--class:code;--lang:es;--theme:a6b4h5hjt8pr9ed1lksq8ly3qo5n8w59sb1nbk7hdd;" data-marpit-pagination-total="73" data-size="16:9">
<h1 id="crear-los-perfiles-y-conectar">Crear los perfiles y conectar</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">from</span> cassandra <span class="hljs-keyword">import</span> ConsistencyLevel
<span class="hljs-keyword">from</span> cassandra.cluster <span class="hljs-keyword">import</span> EXEC_PROFILE_DEFAULT, Cluster, ExecutionProfile
<span class="hljs-keyword">from</span> cassandra.policies <span class="hljs-keyword">import</span> RoundRobinPolicy, TokenAwarePolicy
<span class="hljs-keyword">from</span> cassandra.query <span class="hljs-keyword">import</span> named_tuple_factory

query_profile = ExecutionProfile(   <span class="hljs-comment"># perfil por omisión: consultas interactivas</span>
    load_balancing_policy=TokenAwarePolicy(RoundRobinPolicy()),
    consistency_level=ConsistencyLevel.ONE,
    request_timeout=<span class="hljs-number">40.0</span>,
    row_factory=named_tuple_factory,
)
load_profile = ExecutionProfile(    <span class="hljs-comment"># carga masiva: ANY sólo existe para escritura</span>
    load_balancing_policy=TokenAwarePolicy(RoundRobinPolicy()),
    consistency_level=ConsistencyLevel.ANY,
    request_timeout=<span class="hljs-number">120.0</span>,
    row_factory=named_tuple_factory,
)
cluster = Cluster(
    contact_points,
    execution_profiles={EXEC_PROFILE_DEFAULT: query_profile, <span class="hljs-string">&quot;load&quot;</span>: load_profile},
)
session = cluster.connect()
</code></pre>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="61" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-class="code" data-lang="es" data-theme="a6b4h5hjt8pr9ed1lksq8ly3qo5n8w59sb1nbk7hdd" lang="es" class="code" data-marpit-pagination="61" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--class:code;--lang:es;--theme:a6b4h5hjt8pr9ed1lksq8ly3qo5n8w59sb1nbk7hdd;" data-marpit-pagination-total="73" data-size="16:9">
<h1 id="un-perfil-de-ejecuci%C3%B3n-por-nodo">Un perfil de ejecución por nodo</h1>
<p>Se añaden <strong>después</strong> de conectar, con <code>cluster.add_execution_profile()</code>. La lista blanca se construye con <code>host.address</code> —la dirección que publica el nodo—, no con el nombre del servicio Docker:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">from</span> cassandra.policies <span class="hljs-keyword">import</span> WhiteListRoundRobinPolicy

<span class="hljs-keyword">for</span> numero, host <span class="hljs-keyword">in</span> <span class="hljs-built_in">enumerate</span>(cluster.metadata.all_hosts(), start=<span class="hljs-number">1</span>):
    cluster.add_execution_profile(
        <span class="hljs-string">f&quot;node<span class="hljs-subst">{numero}</span>&quot;</span>,
        ExecutionProfile(
            load_balancing_policy=WhiteListRoundRobinPolicy([host.address]),
            consistency_level=ConsistencyLevel.ONE,
            request_timeout=<span class="hljs-number">40.0</span>,
            row_factory=named_tuple_factory,
        ),
    )
</code></pre>
<p>Forma correcta de dirigir una consulta a un nodo concreto: no hay un parámetro «ejecuta esto aquí».</p>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="62" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-class="code" data-lang="es" data-theme="a6b4h5hjt8pr9ed1lksq8ly3qo5n8w59sb1nbk7hdd" lang="es" class="code" data-marpit-pagination="62" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--class:code;--lang:es;--theme:a6b4h5hjt8pr9ed1lksq8ly3qo5n8w59sb1nbk7hdd;" data-marpit-pagination-total="73" data-size="16:9">
<h1 id="perfil-consciente-del-datacenter">Perfil consciente del <em>datacenter</em></h1>
<p><code>DCAwareRoundRobinPolicy</code> es la política habitual en producción, junto con <code>LOCAL_ONE</code>/<code>LOCAL_QUORUM</code>: las consultas no cruzan la WAN. El nombre del DC <strong>no</strong> se codifica a mano — se toma de los metadatos ya descubiertos:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">from</span> cassandra.policies <span class="hljs-keyword">import</span> DCAwareRoundRobinPolicy

local_dc = cluster.metadata.all_hosts()[<span class="hljs-number">0</span>].datacenter  <span class="hljs-comment"># no hardcodear el nombre</span>

cluster.add_execution_profile(
    <span class="hljs-string">&quot;local_dc&quot;</span>,
    ExecutionProfile(
        load_balancing_policy=TokenAwarePolicy(DCAwareRoundRobinPolicy(local_dc=local_dc)),
        consistency_level=ConsistencyLevel.LOCAL_ONE,
        request_timeout=<span class="hljs-number">40.0</span>,
        row_factory=named_tuple_factory,
    ),
)
</code></pre>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="63" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-lang="es" data-theme="a6b4h5hjt8pr9ed1lksq8ly3qo5n8w59sb1nbk7hdd" lang="es" data-marpit-pagination="63" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--lang:es;--theme:a6b4h5hjt8pr9ed1lksq8ly3qo5n8w59sb1nbk7hdd;" data-marpit-pagination-total="73" data-size="16:9">
<h1 id="creaci%C3%B3n-de-keyspaces">Creación de <code>keyspaces</code></h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">session.execute(<span class="hljs-string">&quot;&quot;&quot;
    CREATE KEYSPACE IF NOT EXISTS mi_keyspace
    WITH replication = {&#x27;class&#x27;: &#x27;SimpleStrategy&#x27;, &#x27;replication_factor&#x27;: 1}
&quot;&quot;&quot;</span>)
</code></pre>
<p>Genera un <em>keyspace</em> con <code>SimpleStrategy</code>, replicando en un único nodo: válido para un clúster mínimo de desarrollo, pero <strong>ignora la topología</strong> del clúster.</p>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="64" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-class="code" data-lang="es" data-theme="a6b4h5hjt8pr9ed1lksq8ly3qo5n8w59sb1nbk7hdd" lang="es" class="code" data-marpit-pagination="64" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--class:code;--lang:es;--theme:a6b4h5hjt8pr9ed1lksq8ly3qo5n8w59sb1nbk7hdd;" data-marpit-pagination-total="73" data-size="16:9">
<h1 id="keyspaces-en-un-cl%C3%BAster-con-varios-dc"><code>keyspaces</code> en un clúster con varios DC</h1>
<p>Con <code>GossipingPropertyFileSnitch</code>, cada nodo declara su <em>datacenter</em>: la estrategia adecuada es <code>NetworkTopologyStrategy</code>, con un factor de replicación <strong>por DC</strong> calculado a partir de los nodos ya descubiertos:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">from</span> collections <span class="hljs-keyword">import</span> Counter

replicas_por_dc = Counter(host.datacenter <span class="hljs-keyword">for</span> host <span class="hljs-keyword">in</span> cluster.metadata.all_hosts())
factores = <span class="hljs-string">&quot;, &quot;</span>.join(<span class="hljs-string">f&quot;&#x27;<span class="hljs-subst">{dc}</span>&#x27;: <span class="hljs-subst">{<span class="hljs-built_in">min</span>(n, <span class="hljs-number">3</span>)}</span>&quot;</span> <span class="hljs-keyword">for</span> dc, n <span class="hljs-keyword">in</span> <span class="hljs-built_in">sorted</span>(replicas_por_dc.items()))

session.execute(<span class="hljs-string">f&quot;&quot;&quot;
    CREATE KEYSPACE IF NOT EXISTS stackoverflow
    WITH replication = {{&#x27;class&#x27;: &#x27;NetworkTopologyStrategy&#x27;, <span class="hljs-subst">{factores}</span>}}
&quot;&quot;&quot;</span>)
</code></pre>
<p><code>SimpleStrategy</code> queda desaconsejada en cuanto hay más de un <em>datacenter</em>.</p>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="65" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-lang="es" data-theme="a6b4h5hjt8pr9ed1lksq8ly3qo5n8w59sb1nbk7hdd" lang="es" data-marpit-pagination="65" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--lang:es;--theme:a6b4h5hjt8pr9ed1lksq8ly3qo5n8w59sb1nbk7hdd;" data-marpit-pagination-total="73" data-size="16:9">
<h1 id="creaci%C3%B3n-de-tablas">Creación de tablas</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">session.execute(<span class="hljs-string">&quot;&quot;&quot;
    CREATE TABLE IF NOT EXISTS mi_keyspace.usuarios (
        nombre TEXT,
        apellidos TEXT,
        edad INT,
        dni TEXT,
        PRIMARY KEY (dni, apellidos)
    )&quot;&quot;&quot;</span>)
</code></pre>
<p>Tabla <code>usuarios</code> dentro de <code>mi_keyspace</code>, con <code>dni</code> como clave de partición y <code>apellidos</code> como clave de agregación.</p>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="66" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-lang="es" data-theme="a6b4h5hjt8pr9ed1lksq8ly3qo5n8w59sb1nbk7hdd" lang="es" data-marpit-pagination="66" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--lang:es;--theme:a6b4h5hjt8pr9ed1lksq8ly3qo5n8w59sb1nbk7hdd;" data-marpit-pagination-total="73" data-size="16:9">
<h1 id="inserci%C3%B3n-de-datos">Inserción de datos</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">session.execute(<span class="hljs-string">&quot;&quot;&quot;
    INSERT INTO usuarios (nombre, apellidos, edad, dni)
    VALUES (&#x27;Juan&#x27;, &#x27;Perez&#x27;, 30, &#x27;11111111&#x27;);
&quot;&quot;&quot;</span>)
</code></pre>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="67" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-class="code" data-lang="es" data-theme="a6b4h5hjt8pr9ed1lksq8ly3qo5n8w59sb1nbk7hdd" lang="es" class="code" data-marpit-pagination="67" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--class:code;--lang:es;--theme:a6b4h5hjt8pr9ed1lksq8ly3qo5n8w59sb1nbk7hdd;" data-marpit-pagination-total="73" data-size="16:9">
<h1 id="consultas-de-datos">Consultas de datos</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">select_query = session.prepare(<span class="hljs-string">&quot;SELECT * FROM mi_keyspace.usuarios&quot;</span>)
rows = session.execute(select_query)
<span class="hljs-keyword">for</span> row <span class="hljs-keyword">in</span> rows:
    <span class="hljs-built_in">print</span>(row)
</code></pre>
<p>Filtrar por la clave de partición (<code>dni</code>) es directo y eficiente, y <strong>siempre</strong> debe usarse una sentencia preparada (evita inyección CQL):</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">select_por_dni = session.prepare(
    <span class="hljs-string">&quot;SELECT * FROM mi_keyspace.usuarios WHERE dni = ?&quot;</span>
)
<span class="hljs-keyword">for</span> row <span class="hljs-keyword">in</span> session.execute(select_por_dni, (<span class="hljs-string">&quot;11111111&quot;</span>,)):
    <span class="hljs-built_in">print</span>(<span class="hljs-string">f&quot;DNI: <span class="hljs-subst">{row.dni}</span>, Nombre: <span class="hljs-subst">{row.nombre}</span>, Apellidos: <span class="hljs-subst">{row.apellidos}</span>, Edad: <span class="hljs-subst">{row.edad}</span>&quot;</span>)
</code></pre>
<p>Filtrar por <code>edad</code> (que no es la clave primaria) exige un índice, como se ve a continuación, o <code>ALLOW FILTERING</code> — que recorre todo el clúster y debe evitarse en producción.</p>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="68" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-class="code" data-lang="es" data-theme="a6b4h5hjt8pr9ed1lksq8ly3qo5n8w59sb1nbk7hdd" lang="es" class="code" data-marpit-pagination="68" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--class:code;--lang:es;--theme:a6b4h5hjt8pr9ed1lksq8ly3qo5n8w59sb1nbk7hdd;" data-marpit-pagination-total="73" data-size="16:9">
<h1 id="creaci%C3%B3n-de-%C3%ADndices-sai">Creación de índices SAI</h1>
<p>Para crear índices SAI, <code>CREATE INDEX</code> junto con <code>USING 'sai'</code>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">CREATE</span> INDEX apellido_sai_idx <span class="hljs-keyword">ON</span> mi_keyspace.usuarios (apellido)
<span class="hljs-keyword">USING</span> <span class="hljs-string">&#x27;sai&#x27;</span>
<span class="hljs-keyword">WITH</span> OPTIONS <span class="hljs-operator">=</span> {<span class="hljs-string">&#x27;case_sensitive&#x27;</span>: <span class="hljs-string">&#x27;false&#x27;</span>, <span class="hljs-string">&#x27;normalize&#x27;</span>: <span class="hljs-string">&#x27;true&#x27;</span>, <span class="hljs-string">&#x27;ascii&#x27;</span>: <span class="hljs-string">&#x27;true&#x27;</span>};
</code></pre>
<ul>
<li><code>case_sensitive: false</code>: las búsquedas no distinguen mayúsculas/minúsculas</li>
<li><code>normalize: true</code>: normalización Unicode durante las búsquedas</li>
<li><code>ascii: true</code>: convierte caracteres especiales a su equivalente ASCII</li>
</ul>
<p>Más opciones: <a href="https://cassandra.apache.org/doc/latest/cassandra/reference/cql-commands/create-custom-index.html">create-custom-index</a></p>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="69" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-class="compact" data-lang="es" data-theme="a6b4h5hjt8pr9ed1lksq8ly3qo5n8w59sb1nbk7hdd" lang="es" class="compact" data-marpit-pagination="69" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--class:compact;--lang:es;--theme:a6b4h5hjt8pr9ed1lksq8ly3qo5n8w59sb1nbk7hdd;" data-marpit-pagination-total="73" data-size="16:9">
<h1 id="construcci%C3%B3n-de-%C3%ADndices-en-segundo-plano">Construcción de índices en segundo plano</h1>
<ul>
<li><code>execute_async()</code> sobre un <code>CREATE INDEX</code> sólo confirma que el cambio de esquema <strong>se propagó</strong> por el clúster, no que el índice ya esté construido</li>
<li>El <em>build</em> —recorrer las SSTables existentes y poblar el índice— es un proceso aparte, en segundo plano</li>
<li>Con varios índices construyéndose a la vez sobre tablas de tamaños distintos, un <code>time.sleep(N)</code> fijo puede terminar antes de que estén disponibles: una consulta que use el índice fallaría con <code>IndexNotAvailableException</code></li>
<li>Mejor: sondear <code>system_views.sstable_tasks</code> (equivalente CQL de <code>nodetool compactionstats</code>, desde Cassandra 4.0) hasta que no queden tareas de tipo <em>Secondary index build</em>, y confirmar con una consulta real de bajo coste</li>
</ul>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="70" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-class="code" data-lang="es" data-theme="a6b4h5hjt8pr9ed1lksq8ly3qo5n8w59sb1nbk7hdd" lang="es" class="code" data-marpit-pagination="70" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--class:code;--lang:es;--theme:a6b4h5hjt8pr9ed1lksq8ly3qo5n8w59sb1nbk7hdd;" data-marpit-pagination-total="73" data-size="16:9">
<h1 id="construcci%C3%B3n-de-%C3%ADndices-sondeo">Construcción de índices: sondeo</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">import</span> time

<span class="hljs-keyword">def</span> <span class="hljs-title function_">build_en_marcha</span>(<span class="hljs-params">session, keyspace: <span class="hljs-built_in">str</span></span>) -&gt; <span class="hljs-built_in">bool</span> | <span class="hljs-literal">None</span>:
    <span class="hljs-string">&quot;&quot;&quot;None si system_views no está disponible (plan B: reintentar la query real).&quot;&quot;&quot;</span>
    <span class="hljs-keyword">try</span>:
        filas = session.execute(
            <span class="hljs-string">&quot;SELECT kind FROM system_views.sstable_tasks WHERE keyspace_name = %s&quot;</span>,
            (keyspace,),
        )
    <span class="hljs-keyword">except</span> Exception:
        <span class="hljs-keyword">return</span> <span class="hljs-literal">None</span>
    <span class="hljs-keyword">return</span> <span class="hljs-built_in">any</span>(<span class="hljs-string">&quot;index&quot;</span> <span class="hljs-keyword">in</span> (fila.kind <span class="hljs-keyword">or</span> <span class="hljs-string">&quot;&quot;</span>).lower() <span class="hljs-keyword">for</span> fila <span class="hljs-keyword">in</span> filas)

<span class="hljs-keyword">while</span> build_en_marcha(session, <span class="hljs-string">&quot;mi_keyspace&quot;</span>):
    time.sleep(<span class="hljs-number">2</span>)
</code></pre>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="71" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-lang="es" data-theme="a6b4h5hjt8pr9ed1lksq8ly3qo5n8w59sb1nbk7hdd" lang="es" data-marpit-pagination="71" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--lang:es;--theme:a6b4h5hjt8pr9ed1lksq8ly3qo5n8w59sb1nbk7hdd;" data-marpit-pagination-total="73" data-size="16:9">
<h1 id="actualizaci%C3%B3n-y-eliminaci%C3%B3n-de-datos">Actualización y eliminación de datos</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">update_query = session.prepare(<span class="hljs-string">&quot;&quot;&quot;
    UPDATE mi_keyspace.usuarios SET edad = ? WHERE dni = ? AND apellidos = ?
&quot;&quot;&quot;</span>)
session.execute(update_query, (<span class="hljs-number">35</span>, <span class="hljs-string">&#x27;11111111&#x27;</span>, <span class="hljs-string">&#x27;Sanchez&#x27;</span>))

delete_query = session.prepare(<span class="hljs-string">&quot;&quot;&quot;
    DELETE FROM mi_keyspace.usuarios WHERE dni = ? AND apellidos = ?
&quot;&quot;&quot;</span>)
session.execute(delete_query, (<span class="hljs-string">&#x27;22222222&#x27;</span>, <span class="hljs-string">&#x27;Terroso&#x27;</span>))
</code></pre>
<p>Al terminar, es importante cerrar la conexión con la base de datos:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">session.shutdown()
</code></pre>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="72" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-class="compact" data-lang="es" data-theme="a6b4h5hjt8pr9ed1lksq8ly3qo5n8w59sb1nbk7hdd" lang="es" class="compact" data-marpit-pagination="72" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--class:compact;--lang:es;--theme:a6b4h5hjt8pr9ed1lksq8ly3qo5n8w59sb1nbk7hdd;" data-marpit-pagination-total="73" data-size="16:9">
<h1 id="casos-de-uso-y-conclusiones">Casos de uso y conclusiones</h1>
<ul>
<li>Entre las limitaciones de Apache Cassandra: no contiene funcionalidad para realizar agregaciones — si se necesitan datos agregados, hay que precomputarlos</li>
<li>La ventaja principal es su velocidad de escritura y la forma de distribuir los datos, que permite alta escalabilidad</li>
<li>Para sistemas donde la velocidad de lectura sea crítica, no resulta una solución óptima</li>
<li>Usos más comunes:
<ul>
<li><strong>Aplicaciones IoT</strong>: miles de sensores enviando información que debe sincronizarse y correlacionarse en tiempo real</li>
<li><strong>Monitorización de aplicaciones web</strong>: almacenar la actividad de los usuarios en sitios web</li>
</ul>
</li>
</ul>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="73" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-class="bibliography" data-lang="es" data-theme="a6b4h5hjt8pr9ed1lksq8ly3qo5n8w59sb1nbk7hdd" lang="es" class="bibliography" data-marpit-pagination="73" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--class:bibliography;--lang:es;--theme:a6b4h5hjt8pr9ed1lksq8ly3qo5n8w59sb1nbk7hdd;" data-marpit-pagination-total="73" data-size="16:9">
