</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-class="figure-only" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" class="figure-only" data-marpit-pagination="51" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--class:figure-only;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="cu%C3%A1ndo-responde-el-coordinador">Cuándo responde el coordinador</h1>
<p><img src="img/fig-consistencywrite.svg" alt="Con tres réplicas, ONE responde con la primera confirmación, QUORUM con la segunda y ALL con la tercera; las réplicas a las que no espera también escriben, pero después" style="height:510px;" /></p>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-class="compact small-table" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" class="compact small-table" data-marpit-pagination="52" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--class:compact small-table;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="niveles-de-consistencia-y-sus-compromisos">Niveles de consistencia y sus compromisos</h1>
<p>Cada lectura y cada escritura eligen cuántas réplicas deben responder. Con factor de replicación (RF) <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>n</mi></mrow><annotation encoding="application/x-tex">n</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal">n</span></span></span></span>:</p>
<table>
<thead>
<tr>
<th>Nivel</th>
<th>Réplicas que responden</th>
<th>Compromiso</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>ANY</code> (sólo escritura)</td>
<td>ninguna en concreto: vale una <em>pista</em> (<em>hint</em>) guardada por el coordinador</td>
<td>la escritura más rápida y disponible, pero puede tardar en ser visible</td>
</tr>
<tr>
<td><code>ONE</code> / <code>LOCAL_ONE</code></td>
<td>1</td>
<td>rápido y muy disponible, pero puede leer una réplica atrasada</td>
</tr>
<tr>
<td><code>QUORUM</code> / <code>LOCAL_QUORUM</code></td>
<td>la mayoría: <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo stretchy="false">⌊</mo><mi>n</mi><mi mathvariant="normal">/</mi><mn>2</mn><mo stretchy="false">⌋</mo><mo>+</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">\lfloor n/2 \rfloor + 1</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">⌊</span><span class="mord mathnormal">n</span><span class="mord">/2</span><span class="mclose">⌋</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">1</span></span></span></span></td>
<td>equilibrio: consistencia sin exigir que estén todas vivas</td>
</tr>
<tr>
<td><code>ALL</code></td>
<td>las <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>n</mi></mrow><annotation encoding="application/x-tex">n</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal">n</span></span></span></span></td>
<td>la máxima consistencia, pero falla en cuanto cae un solo nodo</td>
</tr>
</tbody>
</table>
<p><code>LOCAL_</code> cuenta sólo las réplicas del <em>datacenter</em> local; con un único centro de datos equivale al nivel sin prefijo</p>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-class="figure-only" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" class="figure-only" data-marpit-pagination="53" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--class:figure-only;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="r%C3%A9plicas-ca%C3%ADdas-qui%C3%A9n-sigue-respondiendo">Réplicas caídas: quién sigue respondiendo</h1>
<p><img src="img/fig-consistencyavailability.svg" alt="Con tres réplicas, ANY responde siempre, aunque sea sólo con una pista; ONE aguanta dos caídas, QUORUM una y ALL ninguna" style="height:510px;" /></p>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-class="figure-only" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" class="figure-only" data-marpit-pagination="54" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--class:figure-only;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="consistencia-con-varios-datacenters">Consistencia con varios <em>datacenters</em></h1>
<p><img src="img/fig-consistencydc.svg" alt="Con tres réplicas en cada uno de dos datacenters, LOCAL_QUORUM espera a dos réplicas locales, EACH_QUORUM a dos en cada DC y QUORUM a cuatro de seis, así que siempre a alguna remota" style="height:510px;" /></p>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-class="compact" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" class="compact" data-marpit-pagination="55" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--class:compact;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="escribir-a-one-no-espera-a-las-dem%C3%A1s-r%C3%A9plicas">Escribir a <code>ONE</code> no espera a las demás réplicas</h1>
<ul>
<li>El coordinador envía la escritura a <strong>todas</strong> las réplicas a la vez, pero responde en cuanto contestan las que exige el nivel</li>
<li>Con <code>ONE</code>, las demás la aplican un instante <strong>después</strong>: una lectura inmediata a <code>ONE</code> puede caer en una réplica atrasada y devolver el dato antiguo</li>
<li>Sólo una lectura de <strong>varias</strong> réplicas <em>reconcilia</em>: el coordinador pide los datos a una réplica y un resumen (<em>digest</em>) a las demás; si difieren, se queda con la versión de marca de tiempo más reciente y repara a las atrasadas (<em>read repair</em>)</li>
<li>La regla que garantiza ver la última escritura: <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>R</mi><mo>+</mo><mi>W</mi><mo>&gt;</mo><mi>R</mi><mi>F</mi></mrow><annotation encoding="application/x-tex">R + W &gt; RF</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.7667em;vertical-align:-0.0833em;"></span><span class="mord mathnormal" style="margin-right:0.0077em;">R</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.7224em;vertical-align:-0.0391em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">W</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">&gt;</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0077em;">R</span><span class="mord mathnormal" style="margin-right:0.1389em;">F</span></span></span></span>, donde <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>R</mi></mrow><annotation encoding="application/x-tex">R</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0077em;">R</span></span></span></span> y <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>W</mi></mrow><annotation encoding="application/x-tex">W</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">W</span></span></span></span> son las réplicas leídas y escritas, porque así comparten al menos una</li>
</ul>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="56" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-class="figure-only" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" class="figure-only" data-marpit-pagination="56" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--class:figure-only;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="lecturas-inmediatas-posibles"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>R</mi><mo>+</mo><mi>W</mi><mo>&gt;</mo><mi>R</mi><mi>F</mi></mrow><annotation encoding="application/x-tex">R + W &gt; RF</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.7667em;vertical-align:-0.0833em;"></span><span class="mord mathnormal" style="margin-right:0.0077em;">R</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.7224em;vertical-align:-0.0391em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">W</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">&gt;</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0077em;">R</span><span class="mord mathnormal" style="margin-right:0.1389em;">F</span></span></span></span>: lecturas inmediatas posibles</h1>
<p><img src="img/fig-consistencyoverlap.svg" alt="Con tres réplicas, toda lectura QUORUM tras una escritura QUORUM incluye una réplica con el valor nuevo; tras una escritura ONE, dos de las tres lecturas ONE posibles devuelven el valor antiguo" style="height:510px;" /></p>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" data-marpit-pagination="57" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="por-qu%C3%A9-local_quorum-por-omisi%C3%B3n">Por qué <code>LOCAL_QUORUM</code> por omisión</h1>
<ul>
<li>Con dos nodos (RF = 2) la mayoría es 2, luego <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>R</mi><mo>+</mo><mi>W</mi><mo>=</mo><mn>2</mn><mo>+</mo><mn>2</mn><mo>&gt;</mo><mn>2</mn></mrow><annotation encoding="application/x-tex">R + W = 2 + 2 &gt; 2</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.7667em;vertical-align:-0.0833em;"></span><span class="mord mathnormal" style="margin-right:0.0077em;">R</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">W</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.7278em;vertical-align:-0.0833em;"></span><span class="mord">2</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.6835em;vertical-align:-0.0391em;"></span><span class="mord">2</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">&gt;</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">2</span></span></span></span>: cada lectura ve lo último escrito, con independencia de qué réplica responda antes</li>
<li>El precio es la <strong>disponibilidad</strong>: con RF = 2 necesita los dos nodos, y si uno cae falla con <code>Unavailable</code>, mientras que <code>ONE</code> seguiría respondiendo</li>
<li>En producción se usa RF = 3: la mayoría (2) sigue disponible con un nodo caído</li>
<li>Con un solo nodo (RF = 1) se comporta como <code>ONE</code></li>
<li>La carga masiva usa <code>ANY</code>, porque sólo importa la velocidad; las lecturas posteriores, con <code>LOCAL_QUORUM</code>, consultan las réplicas y reconcilian</li>
</ul>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-class="compact" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" class="compact" data-marpit-pagination="58" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--class:compact;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="procesamiento-de-las-escrituras">Procesamiento de las escrituras</h1>
<p>Cuando llega una solicitud de escritura a un nodo, ocurren principalmente dos cosas:</p>
<ul>
<li>Se agrega al <em><strong>commit log</strong></em> en disco: garantiza la durabilidad (sobrevive incluso ante un fallo del nodo)</li>
<li>Se envía a la <em><strong>memtable</strong></em>: cuando se llena, los datos se vuelcan a una <em><strong>SSTable</strong></em> en disco, y el <em>commit log</em> se limpia</li>
</ul>
<p><img src="img/cassandra_node_internals.png" alt="" style="height:260px;" /></p>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="59" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" data-marpit-pagination="59" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="procesamiento-de-las-lecturas">Procesamiento de las lecturas</h1>
<ul>
<li>Los filtros de Bloom identifican aproximadamente si una fila/columna existe en una SSTable</li>
<li>Se mantienen por SSTable: cada una tiene un filtro de Bloom correspondiente en memoria</li>
</ul>
<blockquote>
<p>Un filtro de Bloom es una estructura de datos genérica para verificar si un elemento está presente en un conjunto o no</p>
</blockquote>
<ul>
<li>Si la respuesta es «puede estar presente», Cassandra busca en la SSTable; si no está, continúa en otras SSTables</li>
<li>Así ahorra muchas exploraciones innecesarias, y un gran coste de E/S de disco</li>
</ul>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="60" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" data-marpit-pagination="60" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="creaci%C3%B3n-de-%C3%ADndices">Creación de índices</h1>
<ul>
<li>En Cassandra los índices secundarios son complicados de usar y pueden afectar mucho al rendimiento</li>
<li>La tabla de índices se almacena en cada nodo del clúster: una consulta con un índice secundario puede convertirse en una pesadilla de rendimiento si accede a varios nodos</li>
<li>Regla general: indexar una columna con <strong>baja cardinalidad</strong> de pocos valores</li>
<li>Actualmente este tipo de índices sufre de bajo rendimiento y alta latencia</li>
</ul>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="61" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-class="compact" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" class="compact" data-marpit-pagination="61" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--class:compact;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="sai-storage-attached-index">SAI (<em>Storage-Attached Index</em>)</h1>
<ul>
<li>Nuevo tipo de índice en Apache Cassandra (desde 5.0), con mejor rendimiento que los índices secundarios tradicionales</li>
<li>Permite búsquedas eficientes en columnas no clave</li>
<li>Soporta igualdad, rangos y <code>CONTAINS</code> en colecciones, pero no <code>LIKE</code></li>
</ul>
<p><strong>Ventajas</strong>:</p>
<ul>
<li>Menor consumo de almacenamiento</li>
<li>Soporte para múltiples tipos de datos</li>
<li>Consultas más eficientes que con índices tradicionales</li>
</ul>
<p><strong>Consideraciones</strong>:</p>
<ul>
<li>Sigue siendo local a cada nodo: una consulta que no restringe la partición pregunta a todos</li>
<li>Puede afectar el rendimiento en inserciones frecuentes</li>
</ul>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="62" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-class="dense" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" class="dense" data-marpit-pagination="62" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--class:dense;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="%C3%ADndice-sai-vs-clave-de-partici%C3%B3n">Índice SAI vs. clave de partición</h1>
<table>
<thead>
<tr>
<th>Característica</th>
<th>Índice SAI</th>
<th>Clave de partición</th>
</tr>
</thead>
<tbody>
<tr>
<td>Función principal</td>
<td>Búsquedas en columnas no clave</td>
<td>Distribución de datos en nodos</td>
</tr>
<tr>
<td>Impacto en almacenamiento</td>
<td>Crea estructuras adicionales</td>
<td>Define ubicación en el clúster</td>
</tr>
<tr>
<td>Rendimiento en consultas</td>
<td>Optimiza búsquedas secundarias</td>
<td>Muy rápido en clave de partición</td>
</tr>
<tr>
<td>Eficiencia en escrituras</td>
<td>Puede ralentizar inserciones</td>
<td>Altamente eficiente</td>
</tr>
<tr>
<td>Uso recomendado</td>
<td>Igualdad, rango y texto</td>
<td>Consultas rápidas y directas</td>
</tr>
</tbody>
</table>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="63" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" data-marpit-pagination="63" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="acceso-a-la-base-de-datos">Acceso a la base de datos</h1>
<ul>
<li>Cassandra usa CQL (<em>Cassandra Query Language</em>) para interactuar con la base de datos</li>
<li>Apache Cassandra cuenta con una <em>shell</em> de línea de comandos, <code>cqlsh</code>, sobre la cual se pueden invocar las consultas CQL</li>
<li>Para el acceso desde Python contamos con la librería <code>cassandra-driver</code> (<code>pip install cassandra-driver</code>)</li>
<li>Al conectarnos a un clúster, especificamos distintos <strong>perfiles de ejecución</strong> (<code>ExecutionProfile</code>), que permiten ejecutar consultas de forma diferente en una misma sesión</li>
</ul>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="64" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-class="compact" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" class="compact" data-marpit-pagination="64" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--class:compact;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="conexi%C3%B3n-al-cl%C3%BAster-puntos-de-contacto-y-perfiles">Conexión al clúster: puntos de contacto y perfiles</h1>
<p>Conectarse a Cassandra no se parece a abrir una conexión a un servidor SQL: el <em>driver</em> mantiene un <em>pool</em> de conexiones <strong>con todos los nodos que considera accesibles</strong>, y decide, consulta a consulta, a cuál se la envía</p>
<ul>
<li><strong>Puntos de contacto</strong> (<code>contact_points</code>): sólo se usan en el arranque. El <em>driver</em> abre la <em>control connection</em> contra uno de ellos y descubre el resto por <em>gossip</em> (<code>system.local</code>/<code>system.peers</code>)</li>
<li><strong>Hosts</strong> (<code>cluster.metadata.all_hosts()</code>): cada nodo descubierto, con dirección, <em>datacenter</em>, <em>rack</em> y estado. El <em>driver</em> se conecta a la dirección que <strong>cada nodo publica</strong> (<code>rpc_address</code>/<code>broadcast_rpc_address</code>), no a la de <code>contact_points</code></li>
<li><strong>Perfiles de ejecución</strong> (<code>ExecutionProfile</code>): agrupan política de balanceo, consistencia, reintentos, <em>timeout</em> y <code>row_factory</code>; cada consulta elige uno con <code>execution_profile=</code></li>
</ul>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="65" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-class="figure-only" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" class="figure-only" data-marpit-pagination="65" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--class:figure-only;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="conectar-arranque-descubrimiento-y-pool">Conectar: arranque, descubrimiento y <em>pool</em></h1>
<p><img src="img/fig-cassandraconnect.svg" alt="El driver arranca con un único punto de contacto, descubre el resto de nodos con system.local y system.peers y abre conexiones con cada uno en la dirección que publica" style="height:510px;" /></p>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="66" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-class="code" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" class="code" data-marpit-pagination="66" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--class:code;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="modelo-antiguo-frente-a-perfiles">Modelo antiguo frente a perfiles</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">cluster = Cluster([<span class="hljs-string">&quot;cassandra1&quot;</span>], load_balancing_policy=...)   <span class="hljs-comment"># obsoleto</span>
session.default_timeout = <span class="hljs-number">40</span>                                   <span class="hljs-comment"># obsoleto</span>
session.row_factory = dict_factory                              <span class="hljs-comment"># obsoleto</span>
</code></pre>
<p>Los dos modelos son <strong>excluyentes</strong>: en cuanto se pasa <code>execution_profiles=</code> al <code>Cluster</code>, cualquier atributo del modelo antiguo lanza un error:</p>
<ul>
<li><code>Cluster(..., load_balancing_policy=..., execution_profiles=...)</code> → <code>ValueError</code></li>
<li><code>session.default_timeout = 40</code> → <code>ValueError: usar un perfil en su lugar</code></li>
</ul>
<p>El <em>timeout</em> pasa a ser <code>request_timeout</code> <strong>dentro</strong> del perfil; lo mismo para <code>row_factory</code> y el nivel de consistencia por omisión</p>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="67" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-class="compact" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" class="compact" data-marpit-pagination="67" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--class:compact;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="pol%C3%ADticas-de-balanceo">Políticas de balanceo</h1>
<ul>
<li><code>RoundRobinPolicy</code>: reparte entre todos los nodos vivos</li>
<li><code>DCAwareRoundRobinPolicy(local_dc=...)</code>: sólo usa los nodos del <em>datacenter</em> local. Si <code>local_dc</code> no coincide <strong>exactamente</strong> con el nombre real, todos los nodos se consideran remotos y, con <code>used_hosts_per_remote_dc=0</code> (valor por omisión), el <em>driver</em> se queda sin destinos: <code>NoHostAvailable</code></li>
<li><code>TokenAwarePolicy(política_hija)</code>: con sentencias preparadas, envía la petición directamente a una <strong>réplica</strong> de la partición, ahorrando un salto de coordinación</li>
<li><code>WhiteListRoundRobinPolicy</code> / <code>HostFilterPolicy</code>: restringen el conjunto de nodos utilizables — útiles para fijar consultas a un nodo (administración, depuración), <strong>no</strong> para producción: anulan el reparto de carga y el <em>token awareness</em></li>
</ul>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="68" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-class="figure-only" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" class="figure-only" data-marpit-pagination="68" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--class:figure-only;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="pol%C3%ADticas-de-balanceo-qui%C3%A9n-puede-coordinar">Políticas de balanceo: quién puede coordinar</h1>
<p><img src="img/fig-cassandrapolicies.svg" alt="Con cuatro nodos en dos datacenters, RoundRobinPolicy usa todos por turno, TokenAwarePolicy sólo las réplicas de la partición, DCAwareRoundRobinPolicy sólo los del DC local y WhiteListRoundRobinPolicy sólo los de la lista" style="height:510px;" /></p>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="69" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-class="code" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" class="code" data-marpit-pagination="69" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--class:code;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="crear-los-perfiles-y-conectar">Crear los perfiles y conectar</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">from</span> cassandra <span class="hljs-keyword">import</span> ConsistencyLevel
<span class="hljs-keyword">from</span> cassandra.cluster <span class="hljs-keyword">import</span> EXEC_PROFILE_DEFAULT, Cluster, ExecutionProfile
<span class="hljs-keyword">from</span> cassandra.policies <span class="hljs-keyword">import</span> RoundRobinPolicy, TokenAwarePolicy
<span class="hljs-keyword">from</span> cassandra.query <span class="hljs-keyword">import</span> named_tuple_factory

query_profile = ExecutionProfile(   <span class="hljs-comment"># perfil por omisión: consultas interactivas</span>
    load_balancing_policy=TokenAwarePolicy(RoundRobinPolicy()),
    consistency_level=ConsistencyLevel.LOCAL_QUORUM,  <span class="hljs-comment"># mayoría de réplicas; lee y reconcilia</span>
    request_timeout=<span class="hljs-number">40.0</span>,
    row_factory=named_tuple_factory,
)
load_profile = ExecutionProfile(    <span class="hljs-comment"># carga masiva: ANY sólo existe para escritura</span>
    load_balancing_policy=TokenAwarePolicy(RoundRobinPolicy()),
    consistency_level=ConsistencyLevel.ANY,
    request_timeout=<span class="hljs-number">120.0</span>,
    row_factory=named_tuple_factory,
)
cluster = Cluster(
    contact_points,
    execution_profiles={EXEC_PROFILE_DEFAULT: query_profile, <span class="hljs-string">&quot;load&quot;</span>: load_profile},
)
session = cluster.connect()
</code></pre>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="70" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-class="code" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" class="code" data-marpit-pagination="70" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--class:code;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="un-perfil-de-ejecuci%C3%B3n-por-nodo">Un perfil de ejecución por nodo</h1>
<p>Se añaden <strong>después</strong> de conectar, con <code>cluster.add_execution_profile()</code>. La lista blanca se construye con <code>host.address</code> —la dirección que publica el nodo—, no con el nombre del servicio Docker:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">from</span> cassandra.policies <span class="hljs-keyword">import</span> WhiteListRoundRobinPolicy

<span class="hljs-keyword">for</span> numero, host <span class="hljs-keyword">in</span> <span class="hljs-built_in">enumerate</span>(cluster.metadata.all_hosts(), start=<span class="hljs-number">1</span>):
    cluster.add_execution_profile(
        <span class="hljs-string">f&quot;node<span class="hljs-subst">{numero}</span>&quot;</span>,
        ExecutionProfile(
            load_balancing_policy=WhiteListRoundRobinPolicy([host.address]),
            consistency_level=ConsistencyLevel.ONE,
            request_timeout=<span class="hljs-number">40.0</span>,
            row_factory=named_tuple_factory,
        ),
    )
</code></pre>
<p>Forma correcta de dirigir una consulta a un nodo concreto: no hay un parámetro «ejecuta esto aquí»</p>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="71" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-class="code" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" class="code" data-marpit-pagination="71" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--class:code;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="perfil-consciente-del-datacenter">Perfil consciente del <em>datacenter</em></h1>
<p><code>DCAwareRoundRobinPolicy</code> es la política habitual en producción, junto con <code>LOCAL_ONE</code>/<code>LOCAL_QUORUM</code>: las consultas no cruzan la WAN. El nombre del DC <strong>no</strong> se codifica a mano — se toma de los metadatos ya descubiertos:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">from</span> cassandra.policies <span class="hljs-keyword">import</span> DCAwareRoundRobinPolicy

local_dc = cluster.metadata.all_hosts()[<span class="hljs-number">0</span>].datacenter  <span class="hljs-comment"># no hardcodear el nombre</span>

cluster.add_execution_profile(
    <span class="hljs-string">&quot;local_dc&quot;</span>,
    ExecutionProfile(
        load_balancing_policy=TokenAwarePolicy(DCAwareRoundRobinPolicy(local_dc=local_dc)),
        consistency_level=ConsistencyLevel.LOCAL_ONE,
        request_timeout=<span class="hljs-number">40.0</span>,
        row_factory=named_tuple_factory,
    ),
)
</code></pre>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="72" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-class="figure-only" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" class="figure-only" data-marpit-pagination="72" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--class:figure-only;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="una-sesi%C3%B3n-varios-perfiles">Una sesión, varios perfiles</h1>
<p><img src="img/fig-cassandraprofiles.svg" alt="Cada llamada a session.execute elige un perfil: el de omisión con LOCAL_QUORUM, el de carga con ANY, los de cada nodo con ONE y el del datacenter local con LOCAL_ONE; los dos primeros se pasan al crear el clúster y los demás se añaden tras conectar" style="height:510px;" /></p>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="73" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" data-marpit-pagination="73" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="creaci%C3%B3n-de-keyspaces">Creación de <code>keyspaces</code></h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">session.execute(<span class="hljs-string">&quot;&quot;&quot;
    CREATE KEYSPACE IF NOT EXISTS mi_keyspace
    WITH replication = {&#x27;class&#x27;: &#x27;SimpleStrategy&#x27;, &#x27;replication_factor&#x27;: 1}
&quot;&quot;&quot;</span>)
</code></pre>
<p>Genera un <em>keyspace</em> con <code>SimpleStrategy</code>, replicando en un único nodo: válido para un clúster mínimo de desarrollo, pero <strong>ignora la topología</strong> del clúster</p>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="74" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-class="code" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" class="code" data-marpit-pagination="74" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--class:code;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="keyspaces-en-un-cl%C3%BAster-con-varios-dc"><code>keyspaces</code> en un clúster con varios DC</h1>
<p>Con <code>GossipingPropertyFileSnitch</code>, cada nodo declara su <em>datacenter</em>: la estrategia adecuada es <code>NetworkTopologyStrategy</code>, con un factor de replicación <strong>por DC</strong> calculado a partir de los nodos ya descubiertos:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">from</span> collections <span class="hljs-keyword">import</span> Counter

replicas_por_dc = Counter(host.datacenter <span class="hljs-keyword">for</span> host <span class="hljs-keyword">in</span> cluster.metadata.all_hosts())
factores = <span class="hljs-string">&quot;, &quot;</span>.join(<span class="hljs-string">f&quot;&#x27;<span class="hljs-subst">{dc}</span>&#x27;: <span class="hljs-subst">{<span class="hljs-built_in">min</span>(n, <span class="hljs-number">3</span>)}</span>&quot;</span> <span class="hljs-keyword">for</span> dc, n <span class="hljs-keyword">in</span> <span class="hljs-built_in">sorted</span>(replicas_por_dc.items()))

session.execute(<span class="hljs-string">f&quot;&quot;&quot;
    CREATE KEYSPACE IF NOT EXISTS stackoverflow
    WITH replication = {{&#x27;class&#x27;: &#x27;NetworkTopologyStrategy&#x27;, <span class="hljs-subst">{factores}</span>}}
&quot;&quot;&quot;</span>)
</code></pre>
<p><code>SimpleStrategy</code> queda desaconsejada en cuanto hay más de un <em>datacenter</em></p>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="75" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" data-marpit-pagination="75" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="creaci%C3%B3n-de-tablas">Creación de tablas</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">session.execute(<span class="hljs-string">&quot;&quot;&quot;
    CREATE TABLE IF NOT EXISTS mi_keyspace.usuarios (
        nombre TEXT,
        apellidos TEXT,
        edad INT,
        dni TEXT,
        PRIMARY KEY (dni, apellidos)
    )&quot;&quot;&quot;</span>)
</code></pre>
<p>Tabla <code>usuarios</code> dentro de <code>mi_keyspace</code>, con <code>dni</code> como clave de partición y <code>apellidos</code> como columna de <em>clustering</em></p>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="76" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" data-marpit-pagination="76" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="inserci%C3%B3n-de-datos">Inserción de datos</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">session.execute(<span class="hljs-string">&quot;&quot;&quot;
    INSERT INTO mi_keyspace.usuarios (nombre, apellidos, edad, dni)
    VALUES (&#x27;Juan&#x27;, &#x27;Perez&#x27;, 30, &#x27;11111111&#x27;);
&quot;&quot;&quot;</span>)
session.execute(<span class="hljs-string">&quot;&quot;&quot;
    INSERT INTO mi_keyspace.usuarios (nombre, apellidos, edad, dni)
    VALUES (&#x27;Ana&#x27;, &#x27;Terroso&#x27;, 41, &#x27;22222222&#x27;);
&quot;&quot;&quot;</span>)
</code></pre>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="77" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-class="code" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" class="code" data-marpit-pagination="77" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--class:code;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="consultas-de-datos">Consultas de datos</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">select_query = session.prepare(<span class="hljs-string">&quot;SELECT * FROM mi_keyspace.usuarios&quot;</span>)
rows = session.execute(select_query)
<span class="hljs-keyword">for</span> row <span class="hljs-keyword">in</span> rows:
    <span class="hljs-built_in">print</span>(row)
</code></pre>
<p>Filtrar por la clave de partición (<code>dni</code>) es directo y eficiente, y <strong>siempre</strong> debe usarse una sentencia preparada (evita inyección CQL):</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">select_por_dni = session.prepare(
    <span class="hljs-string">&quot;SELECT * FROM mi_keyspace.usuarios WHERE dni = ?&quot;</span>
)
<span class="hljs-keyword">for</span> row <span class="hljs-keyword">in</span> session.execute(select_por_dni, (<span class="hljs-string">&quot;11111111&quot;</span>,)):
    <span class="hljs-built_in">print</span>(<span class="hljs-string">f&quot;DNI: <span class="hljs-subst">{row.dni}</span>, Nombre: <span class="hljs-subst">{row.nombre}</span>, Apellidos: <span class="hljs-subst">{row.apellidos}</span>, Edad: <span class="hljs-subst">{row.edad}</span>&quot;</span>)
</code></pre>
<p>Filtrar por <code>edad</code> (que no es la clave primaria) exige un índice, como se ve a continuación, o <code>ALLOW FILTERING</code> — que recorre todo el clúster y debe evitarse en producción</p>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="78" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-class="code" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" class="code" data-marpit-pagination="78" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--class:code;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="creaci%C3%B3n-de-%C3%ADndices-sai">Creación de índices SAI</h1>
<p>Para crear índices SAI, <code>CREATE INDEX</code> junto con <code>USING 'sai'</code>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">CREATE</span> INDEX apellidos_sai_idx <span class="hljs-keyword">ON</span> mi_keyspace.usuarios (apellidos)
<span class="hljs-keyword">USING</span> <span class="hljs-string">&#x27;sai&#x27;</span>
<span class="hljs-keyword">WITH</span> OPTIONS <span class="hljs-operator">=</span> {<span class="hljs-string">&#x27;case_sensitive&#x27;</span>: <span class="hljs-string">&#x27;false&#x27;</span>, <span class="hljs-string">&#x27;normalize&#x27;</span>: <span class="hljs-string">&#x27;true&#x27;</span>, <span class="hljs-string">&#x27;ascii&#x27;</span>: <span class="hljs-string">&#x27;true&#x27;</span>};
</code></pre>
<ul>
<li><code>case_sensitive: false</code>: las búsquedas no distinguen mayúsculas/minúsculas</li>
<li><code>normalize: true</code>: normalización Unicode durante las búsquedas</li>
<li><code>ascii: true</code>: convierte caracteres especiales a su equivalente ASCII</li>
</ul>
<p>Más opciones: <a href="https://cassandra.apache.org/doc/latest/cassandra/reference/cql-commands/create-custom-index.html">create-custom-index</a></p>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="79" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-class="compact" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" class="compact" data-marpit-pagination="79" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--class:compact;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="construcci%C3%B3n-de-%C3%ADndices-en-segundo-plano">Construcción de índices en segundo plano</h1>
<ul>
<li><code>execute_async()</code> sobre un <code>CREATE INDEX</code> sólo confirma que el cambio de esquema <strong>se propagó</strong> por el clúster, no que el índice ya esté construido</li>
<li>El <em>build</em> —recorrer las SSTables existentes y poblar el índice— es un proceso aparte, en segundo plano</li>
<li>Con varios índices construyéndose a la vez sobre tablas de tamaños distintos, un <code>time.sleep(N)</code> fijo puede terminar antes de que estén disponibles: una consulta que use el índice fallaría con <code>IndexNotAvailableException</code></li>
<li>Mejor: sondear <code>system_views.sstable_tasks</code> (equivalente CQL de <code>nodetool compactionstats</code>, desde Cassandra 4.0) hasta que no queden tareas de tipo <em>Secondary index build</em>, y confirmar con una consulta real de bajo coste</li>
</ul>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="80" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-class="code" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" class="code" data-marpit-pagination="80" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--class:code;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="construcci%C3%B3n-de-%C3%ADndices-sondeo">Construcción de índices: sondeo</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">import</span> time

<span class="hljs-keyword">def</span> <span class="hljs-title function_">build_en_marcha</span>(<span class="hljs-params">session, keyspace: <span class="hljs-built_in">str</span></span>) -&gt; <span class="hljs-built_in">bool</span> | <span class="hljs-literal">None</span>:
    <span class="hljs-string">&quot;&quot;&quot;None si system_views no está disponible (plan B: reintentar la query real).&quot;&quot;&quot;</span>
    <span class="hljs-keyword">try</span>:
        filas = session.execute(
            <span class="hljs-string">&quot;SELECT kind FROM system_views.sstable_tasks WHERE keyspace_name = %s&quot;</span>,
            (keyspace,),
        )
    <span class="hljs-keyword">except</span> Exception:
        <span class="hljs-keyword">return</span> <span class="hljs-literal">None</span>
    <span class="hljs-keyword">return</span> <span class="hljs-built_in">any</span>(<span class="hljs-string">&quot;index&quot;</span> <span class="hljs-keyword">in</span> (fila.kind <span class="hljs-keyword">or</span> <span class="hljs-string">&quot;&quot;</span>).lower() <span class="hljs-keyword">for</span> fila <span class="hljs-keyword">in</span> filas)

<span class="hljs-keyword">while</span> build_en_marcha(session, <span class="hljs-string">&quot;mi_keyspace&quot;</span>):
    time.sleep(<span class="hljs-number">2</span>)
</code></pre>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="81" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" data-marpit-pagination="81" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="actualizaci%C3%B3n-y-eliminaci%C3%B3n-de-datos">Actualización y eliminación de datos</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">update_query = session.prepare(<span class="hljs-string">&quot;&quot;&quot;
    UPDATE mi_keyspace.usuarios SET edad = ? WHERE dni = ? AND apellidos = ?
&quot;&quot;&quot;</span>)
session.execute(update_query, (<span class="hljs-number">35</span>, <span class="hljs-string">&#x27;11111111&#x27;</span>, <span class="hljs-string">&#x27;Perez&#x27;</span>))

delete_query = session.prepare(<span class="hljs-string">&quot;&quot;&quot;
    DELETE FROM mi_keyspace.usuarios WHERE dni = ? AND apellidos = ?
&quot;&quot;&quot;</span>)
session.execute(delete_query, (<span class="hljs-string">&#x27;22222222&#x27;</span>, <span class="hljs-string">&#x27;Terroso&#x27;</span>))
</code></pre>
<p>Al terminar, es importante cerrar la conexión con la base de datos:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">session.shutdown()
</code></pre>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="82" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-class="section-divider" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" class="section-divider" data-marpit-pagination="82" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--class:section-divider;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="escrituras-borrados-y-vistas">Escrituras, borrados y vistas</h1>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="83" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-class="compact" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" class="compact" data-marpit-pagination="83" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--class:compact;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="un-borrado-no-borra-escribe-una-l%C3%A1pida">Un borrado no borra: escribe una lápida</h1>
<ul>
<li>Las SSTables son inmutables: no se puede quitar una fila de un fichero ya escrito</li>
<li><code>DELETE</code> escribe una marca, la <em><strong>tombstone</strong></em> (lápida), con su marca de tiempo; cada lectura debe leerla y saltarse lo que tapa</li>
<li>La <strong>compactación</strong> fusiona SSTables y sólo descarta la lápida pasado <code>gc_grace_seconds</code> (10 días por omisión), para que llegue a todas las réplicas</li>
<li>También dejan lápida un <code>null</code> escrito de forma explícita, una asignación completa de una colección y un dato con TTL caducado</li>
<li>Muchas lápidas degradan las lecturas: Cassandra avisa (<code>tombstone_warn_threshold</code>) y acaba abortando la consulta (<code>tombstone_failure_threshold</code>)</li>
</ul>
<blockquote>
<p>Por eso el cargador de las prácticas no escribe los nulos (<code>UNSET_VALUE</code>) y las colecciones se rellenan con <code>col = col + ?</code></p>
</blockquote>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="84" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-class="code" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" class="code" data-marpit-pagination="84" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--class:code;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="ttl-y-marca-temporal">TTL y marca temporal</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">INSERT INTO</span> sesiones (user_id, token) <span class="hljs-keyword">VALUES</span> (<span class="hljs-number">24</span>, <span class="hljs-string">&#x27;abc&#x27;</span>) <span class="hljs-keyword">USING</span> TTL <span class="hljs-number">3600</span>;

<span class="hljs-keyword">SELECT</span> token, TTL(token), WRITETIME(token)
<span class="hljs-keyword">FROM</span> sesiones <span class="hljs-keyword">WHERE</span> user_id <span class="hljs-operator">=</span> <span class="hljs-number">24</span>;
</code></pre>
<ul>
<li><code>USING TTL n</code>: la celda caduca a los <code>n</code> segundos y pasa a ser una lápida</li>
<li>El TTL se aplica <strong>por celda</strong>: una fila puede quedar a medio caducar</li>
<li><code>WRITETIME()</code> devuelve la marca de tiempo de la escritura; <code>TTL()</code>, los segundos que le quedan</li>
<li>Cada celda lleva su marca: ante dos versiones, <strong>gana la última escrita</strong> (<em>last write wins</em>), que es lo que usa la reparación de lecturas</li>
</ul>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="85" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-class="compact" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" class="compact" data-marpit-pagination="85" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--class:compact;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="toda-escritura-es-un-upsert">Toda escritura es un <em>upsert</em></h1>
<ul>
<li><code>INSERT</code> y <code>UPDATE</code> hacen lo mismo: escriben las celdas indicadas, existiera la fila o no</li>
<li>Un <code>INSERT</code> sobre una clave que ya existe <strong>no da error</strong>: sustituye en silencio (por eso la clave de <code>Answers</code> debe ser única)</li>
<li><code>IF NOT EXISTS</code> convierte la escritura en <strong>condicional</strong> (<em>lightweight transaction</em>): sólo se aplica si la fila no existe</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">INSERT INTO</span> actividad (user_id, event_id, payload)
<span class="hljs-keyword">VALUES</span> (<span class="hljs-number">24</span>, <span class="hljs-number">7</span>f3a0c1e<span class="hljs-number">-5</span>d6b<span class="hljs-number">-4</span>c21<span class="hljs-number">-9</span>a47<span class="hljs-number">-2</span>b8e1d90a3c4, <span class="hljs-string">&#x27;primero&#x27;</span>)
IF <span class="hljs-keyword">NOT</span> <span class="hljs-keyword">EXISTS</span> <span class="hljs-keyword">USING</span> TTL <span class="hljs-number">300</span>;
<span class="hljs-comment">-- [applied] = true la primera vez, false las siguientes</span>
</code></pre>
<ul>
<li>Usa el protocolo <strong>Paxos</strong>, con varios viajes entre réplicas: es correcta, pero costosa, y no debe ser el camino normal de escritura</li>
</ul>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="86" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-class="compact small-table" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" class="compact small-table" data-marpit-pagination="86" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--class:compact small-table;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="batch-atomicidad-no-rendimiento"><code>BATCH</code>: atomicidad, no rendimiento</h1>
<p>Un <code>BATCH</code> agrupa escrituras para que se apliquen <strong>todas o ninguna</strong>, no para ir más rápido:</p>
<table>
<thead>
<tr>
<th>Escribe en</th>
<th>Qué ocurre</th>
<th>Coste</th>
</tr>
</thead>
<tbody>
<tr>
<td>Una sola partición</td>
<td>Una única mutación en sus réplicas: atómica y aislada</td>
<td>Como una escritura normal</td>
</tr>
<tr>
<td>Varias particiones (<em>logged</em>)</td>
<td>Se guarda antes en el <em>batchlog</em>, que garantiza que acabarán aplicándose; sin aislamiento</td>
<td>Más que las escrituras sueltas</td>
</tr>
</tbody>
</table>
<ul>
<li>Uso típico: mantener sincronizadas una tabla y sus copias desnormalizadas</li>
<li>Un lote con muchas particiones sobrecarga al coordinador: Cassandra avisa y rechaza lotes grandes (<code>batch_size_warn_threshold</code>)</li>
</ul>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="87" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-class="code" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" class="code" data-marpit-pagination="87" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--class:code;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="el-tipo-counter">El tipo <code>COUNTER</code></h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">CREATE TABLE</span> contador_visitas (
  post_id <span class="hljs-type">bigint</span> <span class="hljs-keyword">PRIMARY KEY</span>,
  visitas counter
);

<span class="hljs-keyword">UPDATE</span> contador_visitas <span class="hljs-keyword">SET</span> visitas <span class="hljs-operator">=</span> visitas <span class="hljs-operator">+</span> <span class="hljs-number">1</span> <span class="hljs-keyword">WHERE</span> post_id <span class="hljs-operator">=</span> <span class="hljs-number">1003</span>;
</code></pre>
<ul>
<li>Se modifica sólo con incrementos y decrementos: no hay <code>INSERT</code> de un valor</li>
<li>Una tabla con un <code>counter</code> sólo admite otras columnas <code>counter</code> además de la clave primaria</li>
<li>No es idempotente: reintentar un incremento fallido puede contarlo dos veces</li>
<li>No admite el nivel <code>ANY</code></li>
</ul>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="88" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-class="code" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" class="code" data-marpit-pagination="88" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--class:code;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="vistas-materializadas">Vistas materializadas</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">CREATE</span> MATERIALIZED <span class="hljs-keyword">VIEW</span> questions_by_author <span class="hljs-keyword">AS</span>
    <span class="hljs-keyword">SELECT</span> <span class="hljs-operator">*</span> <span class="hljs-keyword">FROM</span> Questions
    <span class="hljs-keyword">WHERE</span> OwnerUserId <span class="hljs-keyword">IS</span> <span class="hljs-keyword">NOT NULL</span> <span class="hljs-keyword">AND</span> CreationDate <span class="hljs-keyword">IS</span> <span class="hljs-keyword">NOT NULL</span> <span class="hljs-keyword">AND</span> Id <span class="hljs-keyword">IS</span> <span class="hljs-keyword">NOT NULL</span>
    <span class="hljs-keyword">PRIMARY KEY</span> (OwnerUserId, CreationDate, Id);
</code></pre>
<ul>
<li>Otra tabla, con <strong>otra clave de partición</strong>, que mantiene Cassandra cada vez que se escribe en la tabla base</li>
<li>Su clave debe contener todas las columnas de la clave de la base (<code>Id</code>, <code>CreationDate</code>) y, como mucho, una más (<code>OwnerUserId</code>)</li>
<li>Se actualiza de forma asíncrona: puede ir por detrás de la tabla base</li>
<li>Está desactivada por omisión (<code>materialized_views_enabled</code>) y se considera experimental</li>
</ul>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>

<h1 id="%C2%BFvista-materializada-o-tabla-escrita-por-la-aplicaci%C3%B3n">¿Vista materializada o tabla escrita por la aplicación?</h1>
<table>
<thead>
<tr>
<th></th>
<th>Vista materializada</th>
<th>Tabla manual</th>
</tr>
</thead>
<tbody>
<tr>
<td>Quién la mantiene</td>
<td>Cassandra</td>
<td>La aplicación (con <code>BATCH</code> o escrituras repetidas)</td>
</tr>
<tr>
<td>Forma de la clave</td>
<td>Limitada: la de la base más una columna</td>
<td>Libre</td>
</tr>
<tr>
<td>Si falla a medias</td>
<td>Poco control sobre errores y reintentos</td>
<td>Control total</td>
</tr>
<tr>
<td>Coste de escritura</td>
<td>El mismo: duplica la escritura</td>
<td>El mismo: duplica la escritura</td>
</tr>
</tbody>
</table>
<ul>
<li>En ambos casos la duplicación es deliberada: se paga en escritura y en espacio para leer de una sola partición</li>
</ul>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>

<h1 id="consultar-fuera-de-la-clave-opciones">Consultar fuera de la clave: opciones</h1>
<table>
<thead>
<tr>
<th>Mecanismo</th>
<th>Sirve para</th>
<th>Coste principal</th>
</tr>
</thead>
<tbody>
<tr>
<td>Índice secundario clásico</td>
<td>Igualdad con baja cardinalidad</td>
<td>Local: pregunta a muchos nodos</td>
</tr>
<tr>
<td>Índice SAI</td>
<td>Rangos y varias condiciones sobre una tabla</td>
<td>Local; escritura y compactación más lentas</td>
</tr>
<tr>
<td>Vista materializada</td>
<td>Otra clave de partición, mantenida por Cassandra</td>
<td>Escritura duplicada y asíncrona</td>
</tr>
<tr>
<td>Tabla dirigida por la consulta</td>
<td>La consulta conocida y frecuente</td>
<td>Escritura duplicada y a mano</td>
</tr>
<tr>
<td><code>ALLOW FILTERING</code></td>
<td>Pruebas y tablas pequeñas</td>
<td>Recorre filas para descartarlas</td>
</tr>
</tbody>
</table>
<blockquote>
<p>Un mecanismo general amplía lo que se puede consultar, pero no sustituye al modelado dirigido por consultas</p>
</blockquote>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>

<h1 id="paginaci%C3%B3n">Paginación</h1>
<ul>
<li>Una consulta grande no llega de golpe: <code>fetch_size</code> fija cuántas filas trae cada página</li>
<li>El <em>driver</em> pide la siguiente página al seguir iterando el resultado</li>
<li>Para un «ver más» entre peticiones distintas, el servidor devuelve un <code>paging_state</code> opaco que se pasa con la <strong>misma</strong> consulta para continuar</li>
<li>A diferencia de <code>OFFSET</code> en SQL, reanudar no obliga a leer y descartar las filas anteriores</li>
<li>El <code>paging_state</code> puede contener valores de la clave: no se entrega sin protección a clientes no fiables</li>
</ul>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="92" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-class="compact" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" class="compact" data-marpit-pagination="92" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--class:compact;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="casos-de-uso-y-conclusiones">Casos de uso y conclusiones</h1>
<ul>
<li>Entre sus limitaciones: no hay <code>JOIN</code>, y las agregaciones (<code>COUNT</code>, <code>AVG</code>, <code>GROUP BY</code>) sólo son razonables dentro de una partición — para agregar sobre todo el clúster hay que precomputar los datos</li>
<li>La ventaja principal es su velocidad de escritura y la forma de distribuir los datos, que permite alta escalabilidad</li>
<li>Las lecturas por clave de partición son rápidas y predecibles; las que no la conocen (índices, <code>ALLOW FILTERING</code>) no lo son, y suelen exigir otra tabla</li>
<li>Usos más comunes:
<ul>
<li><strong>Aplicaciones IoT</strong>: miles de sensores enviando información que debe sincronizarse y correlacionarse en tiempo real</li>
<li><strong>Monitorización de aplicaciones web</strong>: almacenar la actividad de los usuarios en sitios web</li>
</ul>
</li>
</ul>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
