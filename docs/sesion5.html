<h1 id="un-caso-paradigm%C3%A1tico">Un caso paradigmático</h1>
<p>BD transaccional (SQL) de una empresa. <strong>Transacciones comerciales</strong>, ~100 columnas:</p>
<table>
<thead>
<tr>
<th>TrId</th>
<th>fecha</th>
<th>hora</th>
<th>sucursal</th>
<th>cuantía</th>
<th>cliente</th>
<th>precio medio ítem</th>
<th>nítems</th>
<th>pago</th>
<th>…</th>
</tr>
</thead>
<tbody>
<tr>
<td>…</td>
<td>…</td>
<td>…</td>
<td>…</td>
<td>…</td>
<td>…</td>
<td>…</td>
<td>…</td>
<td>…</td>
<td>…</td>
</tr>
</tbody>
</table>
<p><strong>Cada poco tiempo</strong>: saldo medio de las compras de cada sucursal</p>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" data-marpit-pagination="4" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="un-caso-paradigm%C3%A1tico-ii">Un caso paradigmático (ii)</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> sucursal, <span class="hljs-built_in">AVG</span>(cuantía)
  <span class="hljs-keyword">FROM</span> Transacciones
  <span class="hljs-keyword">GROUP</span> <span class="hljs-keyword">BY</span> sucursal;
</code></pre>
<p><strong>Ojo</strong>: sólo necesitamos <code>cuantía</code> y <code>sucursal</code></p>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-class="compact" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" class="compact" data-marpit-pagination="5" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--class:compact;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="un-caso-paradigm%C3%A1tico-iii">Un caso paradigmático (iii)</h1>
<p>Cuestiones relevantes:</p>
<ol>
<li>El SGBDR almacena los elementos <strong>por filas</strong></li>
<li>⇒ un bloque de disco contiene un conjunto de filas</li>
<li>Como sólo nos interesan dos columnas, hay que desechar los otros 99 campos (lectura de bloques de disco innecesarios)</li>
</ol>
<p>¿Y si...? Almacenamiento de los datos <u><strong>por columnas</strong></u> (Vertica, MonetDB):</p>
<ul>
<li><strong>Todos los datos de una columna se almacenan contiguos en disco</strong>: se leen menos bloques</li>
<li>Favorece proyecciones, agregados y compresión en consultas analíticas</li>
</ul>
<p>Esto es <strong>columnar analítico</strong> (sesión 3). Cassandra y HBase pertenecen a otra familia: filas o particiones con celdas, que pueden ser dispersas, localizadas por su clave</p>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-class="section-divider" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" class="section-divider" data-marpit-pagination="6" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--class:section-divider;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="introducci%C3%B3n-a-cassandra">Introducción a Cassandra</h1>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" data-marpit-pagination="7" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<div>
<p><img src="img/cassandra_logo.png" alt="" style="width:170px;" /></p>
</div>
<h1 id="%C2%BFqu%C3%A9-es-apache-cassandra">¿Qué es Apache Cassandra?</h1>
<ul>
<li>Sistema gestor de bases de datos NoSQL distribuido, de almacenamiento <em>wide column</em>, gratuito y de código abierto</li>
<li>Diseñado para manejar grandes cantidades de datos en muchos servidores que no tienen que ser de alto rendimiento, con alta disponibilidad y sin un punto único de fallo</li>
<li>Sólido soporte para clústeres que abarcan múltiples centros de datos, con <em>replicación sin maestro asíncrona</em> que permite operaciones de baja latencia para todos los clientes</li>
</ul>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" data-marpit-pagination="8" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="%C2%BFqu%C3%A9-es-apache-cassandra-ii">¿Qué es Apache Cassandra? (ii)</h1>
<ul>
<li>Desarrollada por dos ingenieros de Facebook para el mecanismo de búsqueda del buzón de entrada</li>
<li>Más tarde, Facebook lo lanzó como proyecto de código abierto en Google Code, y después lo entregó a la fundación Apache</li>
<li>Utilizada por nombres importantes como Netflix, Apple, Weather Channel, eBay y muchos más</li>
</ul>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-class="figure-only" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" class="figure-only" data-marpit-pagination="9" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--class:figure-only;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">

<h1 id="modelo-de-datos-en-cassandra">Modelo de datos en Cassandra</h1>
<ul>
<li>Cassandra es similar a SQL en el sentido de que almacena <em>tablas</em> y <em>filas</em></li>
<li>El lenguaje utilizado para crear tablas y manipular datos es CQL, similar a SQL</li>
<li>Sin embargo, difiere de SQL en bastantes aspectos: al especificar el esquema de una tabla (<code>CREATE TABLE</code>), le estamos diciendo <em><strong>cómo va a distribuir los datos entre los hosts de almacenamiento</strong></em></li>
<li>La especificación <code>PRIMARY KEY</code> indica en cuál de los nodos se almacenará cada entrada: por eso se llama <em><strong>clave de partición</strong></em></li>
</ul>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" data-marpit-pagination="12" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="modelo-de-datos-ejemplo">Modelo de datos: ejemplo</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">CREATE TABLE</span> animals (
name TEXT <span class="hljs-keyword">PRIMARY KEY</span>,
species TEXT,
subspecies TEXT,
genus TEXT,
family TEXT);
</code></pre>
<p><code>name</code> especifica en qué ordenador residirá cada fila:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-console">select * from animals;
 name | family   | genus | species          | subspecies
------+----------+-------+------------------+------------------
  cat |  Felidae | Felis |         F. catus |             null
 duck | Anatidae |  Anas | A. platyrhynchos |             null
</code></pre>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-class="figure-only" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" class="figure-only" data-marpit-pagination="13" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--class:figure-only;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="modelo-de-datos-claves-de-partici%C3%B3n">Modelo de datos: claves de partición</h1>
<p><img src="img/cassandra_keys.png" alt="" style="height:480px;" /></p>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-class="compact" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" class="compact" data-marpit-pagination="14" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--class:compact;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="claves-anidadas-compuestas">Claves anidadas (compuestas)</h1>
<ul>
<li>Las claves también pueden ser <em><strong>anidadas</strong></em></li>
<li>La primera parte especifica la clave de partición, y la segunda, la clave de <em><strong>clustering</strong></em> (cómo se agrupan y ordenan las filas dentro de la partición para formar una <em>wide column</em>)</li>
<li>Todas las filas con la misma clave de partición forman, <em>de forma lógica</em>, una única fila ancha, ordenada por la clave de <em>clustering</em></li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">CREATE TABLE</span> animals (
name TEXT,
species TEXT,
subspecies TEXT,
genus TEXT,
family TEXT,
<span class="hljs-keyword">PRIMARY KEY</span> ((family, genus), name)
);
</code></pre>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" data-marpit-pagination="15" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="claves-compuestas-resultado">Claves compuestas: resultado</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-console">select * from animals;
 family   | genus | name | species          | subspecies
----------+-------+------+------------------+------------------
 Anatidae |  Anas | duck | A. platyrhynchos |             null
  Felidae | Felis |  cat |         F. catus |             null
  Canidae | Canis |  dog |         C. lupus | C. l. familiaris
  Canidae | Canis | wolf |         C. lupus |             null
</code></pre>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-class="figure-only" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" class="figure-only" data-marpit-pagination="16" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--class:figure-only;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="claves-compuestas">Claves compuestas</h1>
<p><img src="img/cassandra_compound_keys.png" alt="" style="height:480px;" /></p>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" data-marpit-pagination="17" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="modelo-de-datos-vs-sql">Modelo de datos vs. SQL</h1>
<p>Sistema que recoge eventos, en SQL:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">CREATE TABLE</span> events (
id <span class="hljs-type">INT</span> <span class="hljs-keyword">PRIMARY KEY</span>,
<span class="hljs-type">time</span> <span class="hljs-type">TIME</span>,
event_type <span class="hljs-type">INT</span> <span class="hljs-keyword">references</span> event_types(id),
data text
);
</code></pre>
<p>En Cassandra no hay claves ajenas: referenciar el tipo de evento por su <code>id</code> no es posible</p>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" data-marpit-pagination="18" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="modelo-de-datos-vs-sql-ii">Modelo de datos vs. SQL (ii)</h1>
<p>Lo que se suele hacer en NoSQL es <em><strong>desnormalizar</strong></em>: incluir la descripción del tipo de evento en la propia tabla:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">CREATE TABLE</span> events (
id UUID <span class="hljs-keyword">PRIMARY KEY</span>,
<span class="hljs-type">time</span> <span class="hljs-type">TIMESTAMP</span>,
event_type TEXT,
data text
);
</code></pre>
<p>Esto funciona y es una copia de cómo lo haríamos en SQL</p>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" data-marpit-pagination="19" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="modelo-de-datos-vs-sql-iii">Modelo de datos vs. SQL (iii)</h1>
<ul>
<li>Sin embargo, en Cassandra <strong>TAMPOCO</strong> podemos filtrar filas que no sean la clave primaria: Cassandra considera que tardaría demasiado (y de hecho es así)</li>
<li>Sería difícil encontrar eventos por otras claves que no sean su <code>id</code>, como la hora o el tipo de evento</li>
<li>¿Cómo solucionarlo?</li>
</ul>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" data-marpit-pagination="20" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="modelo-de-datos-vs-sql-iv">Modelo de datos vs. SQL (iv)</h1>
<ul>
<li><strong>Opción 1</strong>: indexar el campo <code>time</code>
<ul>
<li>Puede generar una alta carga, ya que los eventos estarán dispersos en el clúster</li>
</ul>
</li>
<li><strong>Opción 2</strong>: utilizar el campo <code>time</code> como clave de partición (<code>PRIMARY KEY</code>)
<ul>
<li>En una clave primaria con múltiples campos, la primera actúa como clave de partición</li>
<li>Los campos adicionales forman parte del nombre de la columna (una <em>wide column</em> o <em>wide row</em>)</li>
</ul>
</li>
</ul>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" data-marpit-pagination="21" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="modelo-de-datos-vs-sql-v">Modelo de datos vs. SQL (v)</h1>
<p>Veamos la opción 2:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">CREATE TABLE</span> events (
<span class="hljs-keyword">hour</span> <span class="hljs-type">TIMESTAMP</span>,
id UUID,
<span class="hljs-type">time</span> <span class="hljs-type">TIMESTAMP</span>,
event_type TEXT,
data text,
<span class="hljs-keyword">PRIMARY KEY</span>(<span class="hljs-keyword">hour</span>, id)
);
</code></pre>
<p>Con este modelo podemos consultar fácilmente todos los eventos de una misma hora: todo lo ocurrido en esa hora está en una única fila en el disco</p>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" data-marpit-pagination="22" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="modelo-de-datos-vs-sql-vi">Modelo de datos vs. SQL (vi)</h1>
<ul>
<li>Si se tienen lecturas y/o escrituras intensas, puede ser necesario segmentar la fila en varias, con una granularidad más fina</li>
<li>Un evento por fila es difícil de consultar; una fila por hora puede generar <strong>cuellos de botella</strong> y filas muy grandes (todas las lecturas/escrituras irían a los mismos archivos en disco)</li>
<li>Podemos segmentar en varias filas fáciles de leer, siempre que tengamos algo por lo que consultar: aquí, <code>event_type</code></li>
<li>Podemos mejorar el rendimiento asegurando que el orden se guarda por la hora del evento, no por el <code>id</code></li>
</ul>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" data-marpit-pagination="23" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="modelo-de-datos-vs-sql-vii">Modelo de datos vs. SQL (vii)</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">CREATE TABLE</span> events (
<span class="hljs-keyword">hour</span> <span class="hljs-type">TIMESTAMP</span>,
id UUID,
<span class="hljs-type">time</span> <span class="hljs-type">TIMESTAMP</span>,
event_type TEXT,
data text,
<span class="hljs-keyword">PRIMARY KEY</span>((<span class="hljs-keyword">hour</span>, event_type), <span class="hljs-type">time</span>)
) <span class="hljs-keyword">WITH</span> CLUSTERING <span class="hljs-keyword">ORDER</span> <span class="hljs-keyword">BY</span> (<span class="hljs-type">time</span> <span class="hljs-keyword">DESC</span>);
</code></pre>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-class="code" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" class="code" data-marpit-pagination="24" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--class:code;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="modelo-de-datos-vs-sql-viii">Modelo de datos vs. SQL (viii)</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-console">SELECT * FROM events;
hour                | event_type | time                | data      | id
--------------------+------------+---------------------+-----------+-------
2013-06-13 11:00:00 | click      | 2013-06-13 11:00:00 | some data | 3...
2013-06-13 11:00:00 | page_view  | 2013-06-13 11:00:01 | some data | 2...
2013-06-13 11:00:00 | error      | 2013-06-13 11:00:05 | some data | 0...
2013-06-13 11:00:00 | redirect   | 2013-06-13 11:00:09 | some data | 1...
</code></pre>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-class="compact small-table" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" class="compact small-table" data-marpit-pagination="25" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--class:compact small-table;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="una-tabla-por-consulta-el-foro">Una tabla por consulta: el foro</h1>
<p>Dos consultas de la aplicación, dos tablas (las de la práctica):</p>
<table>
<thead>
<tr>
<th>Consulta</th>
<th>Tabla</th>
<th>Partición</th>
<th><em>Clustering</em></th>
</tr>
</thead>
<tbody>
<tr>
<td>Una pregunta a partir de su <code>Id</code></td>
<td><code>Questions</code></td>
<td><code>Id</code></td>
<td><code>CreationDate</code></td>
</tr>
<tr>
<td>Todas las respuestas de una pregunta</td>
<td><code>Answers</code></td>
<td><code>ParentId</code></td>
<td><code>CreationDate</code></td>
</tr>
</tbody>
</table>
<ul>
<li>Con una única tabla <code>Posts</code> particionada por <code>Id</code>, las respuestas de una pregunta quedarían repartidas por todo el clúster</li>
<li>Con <code>ParentId</code> como clave de partición viven juntas y se leen con una sola consulta</li>
<li>La misma publicación se escribe en las dos tablas: la duplicación es una decisión, no un accidente</li>
<li>Se modela la consulta antes que la tabla</li>
</ul>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" data-marpit-pagination="26" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="colecciones">Colecciones</h1>
<ul>
<li>Cassandra incluye colecciones como parte de su modelo de datos</li>
<li>Pueden proporcionar flexibilidad en las consultas: <strong>conjuntos</strong>, <strong>listas</strong> y <strong>mapas</strong></li>
</ul>
<p><strong>Conjuntos</strong> (<code>SET</code>): mantienen un conjunto único de elementos sin necesidad de leer antes de escribir</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">CREATE TABLE</span> users (
email TEXT <span class="hljs-keyword">PRIMARY KEY</span>,
portfolios <span class="hljs-keyword">SET</span><span class="hljs-operator">&lt;</span>UUID<span class="hljs-operator">&gt;</span>,
tickers <span class="hljs-keyword">SET</span><span class="hljs-operator">&lt;</span>TEXT<span class="hljs-operator">&gt;</span>
);
</code></pre>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-class="code" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" class="code" data-marpit-pagination="27" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--class:code;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="conjuntos-actualizaci%C3%B3n">Conjuntos: actualización</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">UPDATE</span> users
  <span class="hljs-keyword">SET</span> portfolios <span class="hljs-operator">=</span> portfolios <span class="hljs-operator">+</span> {<span class="hljs-number">756716</span>f7<span class="hljs-number">-2e54</span><span class="hljs-number">-4715</span><span class="hljs-number">-9</span>f00<span class="hljs-number">-91</span>dcbea6cf50},
      tickers <span class="hljs-operator">=</span> tickers <span class="hljs-operator">+</span> {<span class="hljs-string">&#x27;AMZN&#x27;</span>}
<span class="hljs-keyword">WHERE</span> email <span class="hljs-operator">=</span> <span class="hljs-string">&#x27;foo@bar.com&#x27;</span>;
<span class="hljs-keyword">UPDATE</span> users
  <span class="hljs-keyword">SET</span> tickers <span class="hljs-operator">=</span> tickers <span class="hljs-operator">+</span> {<span class="hljs-string">&#x27;GOOG&#x27;</span>}
<span class="hljs-keyword">WHERE</span> email <span class="hljs-operator">=</span> <span class="hljs-string">&#x27;foo@bar.com&#x27;</span>;

email       <span class="hljs-operator">|</span> portfolios                             <span class="hljs-operator">|</span> tickers
foo<span class="hljs-variable">@bar</span>.com <span class="hljs-operator">|</span> {<span class="hljs-number">756716</span>f7<span class="hljs-number">-2e54</span><span class="hljs-number">-4715</span><span class="hljs-number">-9</span>f00<span class="hljs-number">-91</span>dcbea6cf50} <span class="hljs-operator">|</span> {<span class="hljs-string">&#x27;AMZN&#x27;</span>, <span class="hljs-string">&#x27;GOOG&#x27;</span>}
</code></pre>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-class="code" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" class="code" data-marpit-pagination="28" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--class:code;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="conjuntos-eliminar-elementos-y-borrar">Conjuntos: eliminar elementos y borrar</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">UPDATE</span> users
<span class="hljs-keyword">SET</span> tickers <span class="hljs-operator">=</span> tickers <span class="hljs-operator">-</span> {<span class="hljs-string">&#x27;AMZN&#x27;</span>}
<span class="hljs-keyword">WHERE</span> email <span class="hljs-operator">=</span>  <span class="hljs-string">&#x27;foo@bar.com&#x27;</span>;
<span class="hljs-comment">-- tickers =&gt; {&#x27;GOOG&#x27;}</span>

<span class="hljs-keyword">DELETE</span> tickers
<span class="hljs-keyword">FROM</span> users
<span class="hljs-keyword">WHERE</span> email <span class="hljs-operator">=</span> <span class="hljs-string">&#x27;foo@bar.com&#x27;</span>;
<span class="hljs-comment">-- tickers =&gt; null</span>

<h1 id="listas">Listas</h1>
<p>Cuando no se requiere unicidad y se necesita mantener el orden. Ejemplo: permitir que los usuarios especifiquen sus cinco <em>tickers</em> principales:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">ALTER TABLE</span> users <span class="hljs-keyword">ADD</span> top_tickers list<span class="hljs-operator">&lt;</span>text<span class="hljs-operator">&gt;</span>;

<span class="hljs-keyword">UPDATE</span> users <span class="hljs-keyword">SET</span> top_tickers <span class="hljs-operator">=</span> [<span class="hljs-string">&#x27;GOOG&#x27;</span>] <span class="hljs-keyword">WHERE</span> email <span class="hljs-operator">=</span> <span class="hljs-string">&#x27;foo@bar.com&#x27;</span>;
<span class="hljs-keyword">UPDATE</span> users <span class="hljs-keyword">SET</span> top_tickers <span class="hljs-operator">=</span> top_tickers <span class="hljs-operator">+</span> [<span class="hljs-string">&#x27;AMZN&#x27;</span>] <span class="hljs-keyword">WHERE</span> email <span class="hljs-operator">=</span> <span class="hljs-string">&#x27;foo@bar.com&#x27;</span>;

<span class="hljs-comment">-- top_tickers =&gt; [&#x27;GOOG&#x27;, &#x27;AMZN&#x27;]</span>
</code></pre>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" data-marpit-pagination="30" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="mapas">Mapas</h1>
<p>Objeto tipo diccionario, útil para datos tabulares dentro de una fila (ayuda a mitigar la falta de <code>JOIN</code>s). Ejemplo: fecha de actualización por <em>ticker</em>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">ALTER TABLE</span> users <span class="hljs-keyword">ADD</span> ticker_updates map<span class="hljs-operator">&lt;</span>text, <span class="hljs-type">timestamp</span><span class="hljs-operator">&gt;</span>;

<span class="hljs-keyword">UPDATE</span> users <span class="hljs-keyword">SET</span> ticker_updates <span class="hljs-operator">=</span> { <span class="hljs-string">&#x27;AMZN&#x27;</span>:<span class="hljs-string">&#x27;2013-06-13 11:42:12&#x27;</span> }
<span class="hljs-keyword">WHERE</span> email <span class="hljs-operator">=</span> <span class="hljs-string">&#x27;foo@bar.com&#x27;</span>;

<span class="hljs-keyword">UPDATE</span> users <span class="hljs-keyword">SET</span> ticker_updates[<span class="hljs-string">&#x27;GOOG&#x27;</span>] <span class="hljs-operator">=</span> <span class="hljs-string">&#x27;2013-06-13 12:51:31&#x27;</span>
<span class="hljs-keyword">WHERE</span> email <span class="hljs-operator">=</span> <span class="hljs-string">&#x27;foo@bar.com&#x27;</span>;
</code></pre>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" data-marpit-pagination="31" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="mapas-borrado">Mapas: borrado</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">DELETE</span> ticker_updates[<span class="hljs-string">&#x27;AMZN&#x27;</span>]

foo<span class="hljs-variable">@bar</span>.com <span class="hljs-operator">|</span> {<span class="hljs-number">756716</span>f7...} <span class="hljs-operator">|</span> {<span class="hljs-string">&#x27;GOOG&#x27;</span>: <span class="hljs-string">&#x27;2013-06-13 12:51:31-0400&#x27;</span>}

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" data-marpit-pagination="32" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="distribuci%C3%B3n-de-datos-en-apache-cassandra">Distribución de datos en Apache Cassandra</h1>
<ul>
<li>Para distribuir los datos, Cassandra usa un modelo <em>peer-to-peer</em> basado en claves de partición</li>
<li>Para determinar qué nodo contiene un dato, Cassandra usa <em><strong>tokens</strong></em></li>
<li>Un token es un entero de 64 bits; cada nodo del clúster tiene asignado un rango de tokens</li>
<li>Al buscar una fila, Cassandra calcula el token asociado (con una función <em>hash</em>) y determina de forma única el nodo al que pertenece</li>
<li>Cassandra usa así un conjunto de tablas <em>hash</em> distribuidas</li>
<li>Al añadir o eliminar nodos, hay que redistribuir los tokens asignados</li>
</ul>
<blockquote>
<p>¿Qué son las tablas <em>hash</em> distribuidas (THD)?</p>
</blockquote>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-class="compact" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" class="compact" data-marpit-pagination="33" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--class:compact;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="tablas-hash-distribuidas">Tablas <em>hash</em> distribuidas</h1>
<ul>
<li>Una base de datos distribuida que almacena y recupera información sobre claves en nodos que pueden unirse o abandonar en cualquier momento</li>
<li>Los nodos se coordinan sólo entre sí, sin ningún nodo central coordinador</li>
<li>Arquitectura con nodos réplica ⇒ tolerante a fallos</li>
<li>Las claves se mantienen, en general, distribuidas uniformemente entre los nodos</li>
<li>Para almacenar en múltiples nodos, se toma el <em>hash</em> módulo número de servidores</li>
<li>Si uno de los nodos falla, hay que cambiar el módulo con el nuevo número de servidores, y empezamos a perder información</li>
</ul>
<blockquote>
<p>¿Recordamos qué era el <em>Consistent Hashing</em> (CH)?</p>
</blockquote>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-class="compact" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" class="compact" data-marpit-pagination="34" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--class:compact;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="consistent-hashing"><em>Consistent Hashing</em></h1>
<ul>
<li>Similar a lo que pasaba en MySQL con <code>PARTITION</code>: las tablas se distribuyen entre distintos <em>hosts</em></li>
<li>A cada clave se le calcula un <em>hash</em>; los posibles valores se disponen en un círculo con aritmética módulo <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>K</mi></mrow><annotation encoding="application/x-tex">K</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0715em;">K</span></span></span></span></li>
<li>A cada <em>host</em> <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>h</mi><mi>i</mi></msub></mrow><annotation encoding="application/x-tex">h_i</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8444em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal">h</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3117em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">i</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span> del anillo se le calcula también un valor de <em>hash</em></li>
<li>Una fila con clave <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>k</mi></mrow><annotation encoding="application/x-tex">k</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6944em;"></span><span class="mord mathnormal" style="margin-right:0.0315em;">k</span></span></span></span> se almacena en el <em>host</em> <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>h</mi><mi>i</mi></msub></mrow><annotation encoding="application/x-tex">h_i</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8444em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal">h</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3117em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">i</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span> que cumple:</li>
</ul>
<p><span is="marp-span" data-auto-scaling="downscale-only" class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>h</mi><mi>a</mi><mi>s</mi><mi>h</mi><mo stretchy="false">(</mo><msub><mi>h</mi><mrow><mi>i</mi><mo>−</mo><mn>1</mn></mrow></msub><mo stretchy="false">)</mo><msub><mo>&lt;</mo><mrow><mi>m</mi><mi>o</mi><mi>d</mi><mtext> </mtext><mi>K</mi></mrow></msub><mi>h</mi><mi>a</mi><mi>s</mi><mi>h</mi><mo stretchy="false">(</mo><mi>k</mi><mo stretchy="false">)</mo><msub><mo>&lt;</mo><mrow><mi>m</mi><mi>o</mi><mi>d</mi><mtext> </mtext><mi>K</mi></mrow></msub><mi>h</mi><mi>a</mi><mi>s</mi><mi>h</mi><mo stretchy="false">(</mo><msub><mi>h</mi><mi>i</mi></msub><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">hash(h_{i-1}) &lt;_{mod\,K} hash(k) &lt;_{mod\,K} hash(h_i)
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal">ha</span><span class="mord mathnormal">s</span><span class="mord mathnormal">h</span><span class="mopen">(</span><span class="mord"><span class="mord mathnormal">h</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3117em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight">i</span><span class="mbin mtight">−</span><span class="mord mtight">1</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.2083em;"><span></span></span></span></span></span></span><span class="mclose">)</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel"><span class="mrel">&lt;</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3361em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight">m</span><span class="mord mathnormal mtight">o</span><span class="mord mathnormal mtight">d</span><span class="mspace mtight" style="margin-right:0.1952em;"></span><span class="mord mathnormal mtight" style="margin-right:0.0715em;">K</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal">ha</span><span class="mord mathnormal">s</span><span class="mord mathnormal">h</span><span class="mopen">(</span><span class="mord mathnormal" style="margin-right:0.0315em;">k</span><span class="mclose">)</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel"><span class="mrel">&lt;</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3361em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight">m</span><span class="mord mathnormal mtight">o</span><span class="mord mathnormal mtight">d</span><span class="mspace mtight" style="margin-right:0.1952em;"></span><span class="mord mathnormal mtight" style="margin-right:0.0715em;">K</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal">ha</span><span class="mord mathnormal">s</span><span class="mord mathnormal">h</span><span class="mopen">(</span><span class="mord"><span class="mord mathnormal">h</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3117em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">i</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mclose">)</span></span></span></span></span></p><p>(se almacena en el siguiente <em>host</em> siguiendo el círculo)</p>
<p><img src="img/consistent_hashing_002.jpg" alt="" style="height:220px;" /></p>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" data-marpit-pagination="35" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="consistent-hashing-ii"><em>Consistent Hashing</em> (ii)</h1>
<p>Para que las claves se distribuyan uniformemente entre servidores:</p>
<ul>
<li>Se asignan no una, sino muchas etiquetas (<em>angles</em>) a cada servidor: en vez de <code>A</code>, <code>B</code> y <code>C</code>, tener <code>A0</code>…<code>A9</code>, <code>B0</code>…<code>B9</code> y <code>C0</code>…<code>C9</code>, entremezcladas en el círculo</li>
<li>El factor por el que aumentar el número de etiquetas (<em>server keys</em>, o peso) depende de la situación, y puede ser diferente para cada servidor</li>
<li>Si el servidor <code>B</code> fuera el doble de potente, se le asignaría el doble de etiquetas, y terminaría manteniendo el doble de objetos en promedio</li>
</ul>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" data-marpit-pagination="36" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="consistent-hashing-iii"><em>Consistent Hashing</em> (iii)</h1>
<p>Si eliminamos un servidor (<code>C</code>)...</p>
<ul>
<li>Hay que eliminar las etiquetas <code>C0</code>…<code>C9</code> del círculo</li>
<li>Las claves antes adyacentes a esas etiquetas se reasignan aleatoriamente a <code>A</code> y <code>B</code>; el resto de claves queda intacto</li>
</ul>
<p>Si añadimos un servidor (<code>D</code>)...</p>
<ul>
<li>Hay que agregar las etiquetas <code>D0</code>…<code>D9</code></li>
<li>Aproximadamente un tercio de las claves existentes (de <code>A</code> o <code>B</code>) se reasignan a <code>D</code>; el resto permanece igual</li>
</ul>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" data-marpit-pagination="37" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="inciso-bloom-filters">Inciso: <em>Bloom Filters</em></h1>
<ul>
<li>Otra tecnología habilitadora muy famosa en sistemas distribuidos</li>
<li>Permiten descartar muy rápido si un elemento está en un conjunto:
<ul>
<li>Si la respuesta es <strong>NO</strong>, el elemento no está en el conjunto</li>
<li>En otro caso, no se sabe nada (hay que buscar dentro del conjunto)</li>
</ul>
</li>
<li>En Cassandra se mantienen por SSTable: permiten descartar un fichero entero sin leerlo (se ve al hablar de las lecturas)</li>
</ul>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" data-marpit-pagination="38" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="bloom-filters-funcionamiento"><em>Bloom Filters</em>: funcionamiento</h1>
<ul>
<li>Se construye un mapa de <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>k</mi></mrow><annotation encoding="application/x-tex">k</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6944em;"></span><span class="mord mathnormal" style="margin-right:0.0315em;">k</span></span></span></span> bits, donde <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>k</mi></mrow><annotation encoding="application/x-tex">k</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6944em;"></span><span class="mord mathnormal" style="margin-right:0.0315em;">k</span></span></span></span> es el número de bits de una función <em>hash</em></li>
<li>Cada elemento <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>e</mi></mrow><annotation encoding="application/x-tex">e</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal">e</span></span></span></span> insertado actualiza el mapa: <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>m</mi><mi>a</mi><mi>p</mi><mi>a</mi><mo>=</mo><mi>m</mi><mi>a</mi><mi>p</mi><mi>a</mi><mo mathvariant="normal" lspace="0.22em" rspace="0.22em">∣</mo><mi>h</mi><mi>a</mi><mi>s</mi><mi>h</mi><mo stretchy="false">(</mo><mi>e</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">mapa = mapa \mathbin{|} hash(e)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.625em;vertical-align:-0.1944em;"></span><span class="mord mathnormal">ma</span><span class="mord mathnormal">p</span><span class="mord mathnormal">a</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal">ma</span><span class="mord mathnormal">p</span><span class="mord mathnormal">a</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin"><span class="mord">∣</span></span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal">ha</span><span class="mord mathnormal">s</span><span class="mord mathnormal">h</span><span class="mopen">(</span><span class="mord mathnormal">e</span><span class="mclose">)</span></span></span></span> (se añaden los bits del <em>hash</em>)</li>
<li>Un elemento <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msup><mi>e</mi><mo mathvariant="normal" lspace="0em" rspace="0em">′</mo></msup></mrow><annotation encoding="application/x-tex">e&#x27;</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.7519em;"></span><span class="mord"><span class="mord mathnormal">e</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.7519em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">′</span></span></span></span></span></span></span></span></span></span></span></span> <em><strong>puede estar</strong></em> en el mapa si <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>h</mi><mi>a</mi><mi>s</mi><mi>h</mi><mo stretchy="false">(</mo><msup><mi>e</mi><mo mathvariant="normal" lspace="0em" rspace="0em">′</mo></msup><mo stretchy="false">)</mo><mo>=</mo><mi>m</mi><mi>a</mi><mi>p</mi><mi>a</mi><mo mathvariant="normal" lspace="0.22em" rspace="0.22em">&amp;</mo><mi>h</mi><mi>a</mi><mi>s</mi><mi>h</mi><mo stretchy="false">(</mo><msup><mi>e</mi><mo mathvariant="normal" lspace="0em" rspace="0em">′</mo></msup><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">hash(e&#x27;) = mapa \mathbin{\&amp;} hash(e&#x27;)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1.0019em;vertical-align:-0.25em;"></span><span class="mord mathnormal">ha</span><span class="mord mathnormal">s</span><span class="mord mathnormal">h</span><span class="mopen">(</span><span class="mord"><span class="mord mathnormal">e</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.7519em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">′</span></span></span></span></span></span></span></span></span><span class="mclose">)</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.8889em;vertical-align:-0.1944em;"></span><span class="mord mathnormal">ma</span><span class="mord mathnormal">p</span><span class="mord mathnormal">a</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin"><span class="mord">&amp;</span></span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:1.0019em;vertical-align:-0.25em;"></span><span class="mord mathnormal">ha</span><span class="mord mathnormal">s</span><span class="mord mathnormal">h</span><span class="mopen">(</span><span class="mord"><span class="mord mathnormal">e</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.7519em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">′</span></span></span></span></span></span></span></span></span><span class="mclose">)</span></span></span></span> (están todos los bits del <em>hash</em>)</li>
</ul>
<p><img src="img/bloom_filter.png" alt="" style="height:220px;" /></p>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-class="figure-only" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" class="figure-only" data-marpit-pagination="39" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--class:figure-only;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="componentes-principales">Componentes principales</h1>
<p><img src="img/cassandra_arch.jpg" alt="" style="height:480px;" /></p>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" data-marpit-pagination="40" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="componentes-principales-estructurales">Componentes principales: estructurales</h1>
<ul>
<li><strong>Nodo</strong>: componente básico de los datos, máquina donde se almacenan</li>
<li><strong>Centro de datos (<em>DataCenter</em>)</strong>: colección de nodos relacionados; puede ser físico o virtual</li>
<li><strong>Clúster</strong>: contiene uno o más centros de datos, y puede extenderse a través de ubicaciones</li>
</ul>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" data-marpit-pagination="41" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="componentes-principales-internos">Componentes principales: internos</h1>
<ul>
<li><em><strong>Commit Log</strong></em>: cada escritura se almacena primero aquí; se usa para la recuperación ante fallo</li>
<li><em><strong>Mem-Table</strong></em>: tras escribirse en el <em>commit log</em>, los datos se almacenan aquí hasta alcanzar un umbral</li>
<li><em><strong>SSTable</strong></em>: archivo en disco que almacena los datos de la <em>MemTable</em> al alcanzar el umbral; se almacenan secuencialmente y se mantienen por tabla</li>
</ul>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" data-marpit-pagination="42" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="funcionamiento-general">Funcionamiento general</h1>
<ul>
<li>Cada nodo puede realizar tanto lecturas como escrituras</li>
<li>No existe jerarquía con nodos maestros o esclavos dentro de un clúster</li>
<li>Cassandra usa el protocolo <em>Gossip</em> para mantener el clúster:
<ul>
<li>Protocolo de comunicación entre pares en el que los nodos intercambian periódicamente información sobre su estado y el de otros nodos</li>
<li>Se ejecuta cada segundo, intercambiando mensajes de estado</li>
</ul>
</li>
</ul>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" data-marpit-pagination="43" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="funcionamiento-general-ii">Funcionamiento general (ii)</h1>
<ul>
<li>Cuando un cliente envía una solicitud a un clúster Cassandra, llega primero al nodo <em><strong>coordinador</strong></em>, que actúa como proxy entre el cliente y los nodos involucrados</li>
<li>El <em>partitioner</em> es el componente responsable de determinar cómo distribuir los datos entre los nodos: calcula el <em>hash</em> de la clave de partición de una fila</li>
<li>Según la política de partición de datos (no se ve en clase), un mismo nodo podría actuar o no, al mismo tiempo, como coordinador y <em>partitioner</em></li>
</ul>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" data-marpit-pagination="44" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="ejemplo-de-nodo-coordinador">Ejemplo de nodo coordinador</h1>
<p>Un cliente quiere escribir una nueva fila cuya clave de partición es <code>jorge_acetozi</code>. El nodo 6 (coordinador) calcula que el <em>hash</em> de dicha clave toma el valor <code>-17</code></p>
<p>Por el mecanismo definido por el <em>partitioner</em> (no se muestra en la figura), esa fila debe almacenarse en el nodo 2 del clúster</p>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-class="figure-only" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" class="figure-only" data-marpit-pagination="45" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--class:figure-only;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<p><img src="img/cassandra_partitioner.png" alt="" style="height:510px;" /></p>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" data-marpit-pagination="46" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="consistencia-en-apache-cassandra">Consistencia en Apache Cassandra</h1>
<ul>
<li>Cassandra permite ajustar disponibilidad y consistencia configurando <em>replication factor</em> y <em>consistency level</em></li>
<li>El nivel de consistencia se define por consulta, y permite ajustar cuándo se ofrece el resultado a los clientes</li>
<li>El factor de replicación asegura que las escrituras se envíen a todas las réplicas</li>
<li>Ejemplo: con consistencia 3 en un clúster con 3 nodos, se necesitaría que los 3 nodos confirmen la escritura antes de darla por buena</li>
</ul>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-class="figure-only" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" class="figure-only" data-marpit-pagination="47" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--class:figure-only;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="estrategias-de-replicaci%C3%B3n-simplestrategy">Estrategias de replicación: <code>SimpleStrategy</code></h1>
<p>Despliegues en un solo centro de datos; no considera la topología de la red. Sólo toma la decisión del <em>partitioner</em> y coloca las réplicas restantes en sentido horario</p>
<p><img src="img/cassandra_simple_strategy.jpg" alt="" style="height:380px;" /></p>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-class="figure-only" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" class="figure-only" data-marpit-pagination="48" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--class:figure-only;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="estrategias-de-replicaci%C3%B3n-networktopologystrategy">Estrategias de replicación: <code>NetworkTopologyStrategy</code></h1>
<p>Despliegues en múltiples centros de datos. También parte de la decisión del <em>partitioner</em>, pero tiene en cuenta la configuración de <em>racks</em> y <em>datacenters</em></p>
<p><img src="img/cassandra_net_topology_strategy.jpg" alt="" style="height:380px;" /></p>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-class="compact" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" class="compact" data-marpit-pagination="49" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--class:compact;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="niveles-de-consistencia-de-escritura">Niveles de consistencia de escritura</h1>
<ul>
<li>El nivel de consistencia de escritura se elige con el comando <code>CONSISTENCY</code> de <code>cqlsh</code> o, en el <em>driver</em>, dentro de un perfil de ejecución (se ve más adelante): no es una cláusula del <code>INSERT</code></li>
<li>Es el número de réplicas que deben confirmar al coordinador que su inserción local fue exitosa</li>
<li>En cuanto recibe tantos <em>acknowledgements</em> como el nivel configurado, el coordinador informa al cliente del éxito, sin esperar a las réplicas restantes</li>
<li>Niveles: <code>ANY</code>, <code>ONE</code>, <code>TWO</code>, <code>THREE</code>, <code>QUORUM</code>, <code>LOCAL_QUORUM</code>, <code>EACH_QUORUM</code>, <code>ALL</code></li>
<li><code>ONE</code> es aceptable si se necesita rendimiento muy alto y no importa perder alguna escritura; <code>QUORUM</code> asegura que la mayoría de nodos responda antes de considerar la operación exitosa</li>
</ul>
<footer>BDGE · Sesión 5 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-paginate="true" data-footer="BDGE · Sesión 5 · Curso 2026/2027" data-class="figure-only" data-lang="es" data-theme="2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x" lang="es" class="figure-only" data-marpit-pagination="50" style="--paginate:true;--footer:BDGE · Sesión 5 · Curso 2026/2027;--class:figure-only;--lang:es;--theme:2tnjzszzsj9w02xaiaipl9m693vzw1qwuzt5wwha7x;" data-marpit-pagination-total="93" data-size="16:9">
<h1 id="escritura-con-tres-r%C3%A9plicas-el-coordinador-reparte-la-fila">Escritura con tres réplicas: el coordinador reparte la fila</h1>
