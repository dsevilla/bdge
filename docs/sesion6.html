<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">PROFILE
MATCH (u:User {email: $email})-[:WROTE]-&gt;(p:Post)
RETURN u, p
</code></pre>
<p>Muestra: filas procesadas en cada paso, <em>db hits</em> (accesos a disco/caché) y tiempo de ejecución.</p>
<p>Buscar: alto <em>db hits</em>, muchas filas procesadas innecesariamente.</p>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="80" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" data-marpit-pagination="80" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="operaciones-masivas-batching">Operaciones masivas: <em>batching</em></h1>
<p>Para operaciones masivas, usar transacciones por lotes; no insertar/actualizar millones de nodos en una sola transacción:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">// Cargar CSV en lotes de 1000
LOAD CSV WITH HEADERS FROM 'file:///users.csv' AS row
CALL {
  WITH row
  MERGE (u:User {id: row.id})
  SET u.nombre = row.nombre, u.email = row.email
} IN TRANSACTIONS OF 1000 ROWS
</code></pre>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="81" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" data-marpit-pagination="81" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="apoc-para-procesamiento-paralelo">APOC para procesamiento paralelo</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">CALL apoc.periodic.iterate(
  &quot;MATCH (u:User) RETURN u&quot;,
  &quot;SET u.processed = true&quot;,
  {batchSize: 1000, parallel: true}
)
</code></pre>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="82" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" data-marpit-pagination="82" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="configuraci%C3%B3n-de-memoria">Configuración de memoria</h1>
<ul>
<li><strong>Heap memory</strong>: para transacciones y consultas. Típico 8–16 GB en producción; se configura con <code>dbms.memory.heap.max_size</code> en <code>neo4j.conf</code></li>
<li><strong>Page cache</strong>: para cachear el grafo en memoria. Lo más grande posible (RAM disponible − <em>heap</em> − SO); se configura con <code>dbms.memory.pagecache.size</code>. Idealmente, todo el grafo en <em>page cache</em></li>
<li><strong>Regla general</strong>: 50 % de la RAM para <em>page cache</em>, 25 % para <em>heap</em></li>
<li><strong>Monitorizar</strong>: <code>:queries</code> en el <em>browser</em>, métricas JMX</li>
</ul>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="83" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" data-marpit-pagination="83" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="transacciones-y-concurrencia">Transacciones y concurrencia</h1>
<ul>
<li>Neo4j es <strong>ACID</strong> completo</li>
<li>Usa <em><strong>write locks</strong></em> en nodos/relaciones modificadas; los <em><strong>read locks</strong></em> no bloquean otras lecturas</li>
<li><strong>Deadlocks</strong> posibles en escrituras concurrentes: Neo4j los detecta y aborta la transacción automáticamente — hay que reintentarla</li>
<li><strong>Buenas prácticas</strong>: transacciones cortas, procesar en lotes (<em>batching</em>), usar <code>MERGE</code> con cuidado (puede causar conflictos), evitar modificar los mismos nodos desde múltiples <em>threads</em></li>
</ul>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="84" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-class="section-divider" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" class="section-divider" data-marpit-pagination="84" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--class:section-divider;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="comparaci%C3%B3n-con-sql-para-stack-overflow">Comparación con SQL para Stack Overflow</h1>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="85" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" data-marpit-pagination="85" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="modelo-de-datos-de-stack-overflow">Modelo de datos de Stack Overflow</h1>
<p><strong>Entidades principales</strong>: <code>Users</code>, <code>Posts</code> (preguntas y respuestas), <code>Tags</code>, <code>Comments</code></p>
<p><strong>Relaciones</strong>:</p>
<ul>
<li><code>User -[:WROTE]-&gt; Post</code></li>
<li><code>Post -[:ANSWERS]-&gt; Post</code> (respuesta a pregunta)</li>
<li><code>Post -[:TAGGED_WITH]-&gt; Tag</code></li>
<li><code>User -[:COMMENTED]-&gt; Comment -[:ON]-&gt; Post</code></li>
</ul>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="86" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-class="code" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" class="code" data-marpit-pagination="86" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--class:code;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="modelo-visual-de-stack-overflow">Modelo visual de Stack Overflow</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">(:User)-[:WROTE]-&gt;(:Post:Question)
                       |
                  [:TAGGED_WITH]
                       |
                       v
                    (:Tag)
                       ^
                       |
                    [:TAGS]
                       |
(:User)-[:WROTE]-&gt;(:Post:Answer)-[:ANSWERS]-&gt;(:Post:Question)
</code></pre>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="87" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" data-marpit-pagination="87" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="stack-overflow-sql">Stack Overflow, SQL</h1>
<p>RQ4, sesión 2: parejas de usuarios que se han respondido mutuamente.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">CREATE</span> <span class="hljs-keyword">VIEW</span> Pairs <span class="hljs-keyword">AS</span> <span class="hljs-keyword">SELECT</span> <span class="hljs-keyword">DISTINCT</span> Q.OwnerUserId <span class="hljs-keyword">AS</span> questioner, A.OwnerUserId <span class="hljs-keyword">AS</span> answerer
<span class="hljs-keyword">FROM</span> Posts Q <span class="hljs-keyword">JOIN</span> Posts A <span class="hljs-keyword">ON</span> Q.AcceptedAnswerId <span class="hljs-operator">=</span> A.Id
<span class="hljs-keyword">AND</span> Q.OwnerUserId <span class="hljs-operator">&lt;&gt;</span> A.OwnerUserId;

<span class="hljs-keyword">SELECT</span> P1.questioner <span class="hljs-keyword">AS</span> U1, P2.questioner <span class="hljs-keyword">AS</span> U2
<span class="hljs-keyword">FROM</span> Pairs P1, Pairs P2
<span class="hljs-keyword">WHERE</span> P1.questioner <span class="hljs-operator">=</span> P2.answerer
  <span class="hljs-keyword">AND</span> P2.questioner <span class="hljs-operator">=</span> P1.answerer
  <span class="hljs-keyword">AND</span> P1.questioner <span class="hljs-operator">&lt;</span> P2.questioner;
</code></pre>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="88" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" data-marpit-pagination="88" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="stack-overflow-sql-con-cte">Stack Overflow, SQL (con CTE)</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">WITH</span> Pairs <span class="hljs-keyword">AS</span> (
  <span class="hljs-keyword">SELECT</span> <span class="hljs-keyword">DISTINCT</span> Q.OwnerUserId <span class="hljs-keyword">AS</span> questioner, A.OwnerUserId <span class="hljs-keyword">AS</span> answerer
  <span class="hljs-keyword">FROM</span> Posts Q <span class="hljs-keyword">JOIN</span> Posts A <span class="hljs-keyword">ON</span> Q.AcceptedAnswerId <span class="hljs-operator">=</span> A.Id
  <span class="hljs-keyword">AND</span> Q.OwnerUserId <span class="hljs-operator">&lt;&gt;</span> A.OwnerUserId
)
<span class="hljs-keyword">SELECT</span> P1.questioner <span class="hljs-keyword">AS</span> U1, P2.questioner <span class="hljs-keyword">AS</span> U2
<span class="hljs-keyword">FROM</span> Pairs P1, Pairs P2
<span class="hljs-keyword">WHERE</span> P1.questioner <span class="hljs-operator">=</span> P2.answerer
  <span class="hljs-keyword">AND</span> P2.questioner <span class="hljs-operator">=</span> P1.answerer
  <span class="hljs-keyword">AND</span> P1.questioner <span class="hljs-operator">&lt;</span> P2.questioner;
</code></pre>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="89" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-class="code" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" class="code" data-marpit-pagination="89" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--class:code;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="stack-overflow-neo4j">Stack Overflow, Neo4j</h1>
<p><strong>Consulta: parejas recíprocas</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">MATCH
    (u:User)-[:WROTE]-&gt;()-[:ANSWERS]-&gt;()&lt;-[:WROTE]-(u2),
    (u2:User)-[:WROTE]-&gt;()-[:ANSWERS]-&gt;()&lt;-[:WROTE]-(u)
WHERE toInt(u.Id) &lt; toInt(u2.Id)
RETURN DISTINCT u.Id,u2.Id;
</code></pre>
<p><strong>Crear relación <code>RECIPROCATE</code></strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">MATCH
    (u:User)-[:WROTE]-&gt;()-[:ANSWERS]-&gt;()&lt;-[:WROTE]-(u2),
    (u2:User)-[:WROTE]-&gt;()-[:ANSWERS]-&gt;()&lt;-[:WROTE]-(u)
WHERE toInt(u.Id) &lt; toInt(u2.Id)
MERGE (u2)-[:RECIPROCATE]-&gt;(u)
MERGE (u)-[:RECIPROCATE]-&gt;(u2);
</code></pre>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="90" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" data-marpit-pagination="90" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="top-usuarios-por-respuestas-aceptadas">Top usuarios por respuestas aceptadas</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">MATCH (u:User)-[:WROTE]-&gt;(a:Answer)-[:ANSWERS]-&gt;(q:Question)
WHERE q.AcceptedAnswerId = a.Id
RETURN u.DisplayName, count(a) AS respuestas_aceptadas
ORDER BY respuestas_aceptadas DESC
LIMIT 10
</code></pre>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="91" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" data-marpit-pagination="91" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="preguntas-sin-respuesta">Preguntas sin respuesta</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">MATCH (q:Question)
WHERE NOT (q)&lt;-[:ANSWERS]-()
RETURN q.Title, q.CreationDate
ORDER BY q.ViewCount DESC
LIMIT 100
</code></pre>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="92" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" data-marpit-pagination="92" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="tags-m%C3%A1s-relacionados-co-ocurrencia"><em>Tags</em> más relacionados (co-ocurrencia)</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">MATCH (t1:Tag)&lt;-[:TAGGED_WITH]-(q:Question)-[:TAGGED_WITH]-&gt;(t2:Tag)
WHERE t1.Name &lt; t2.Name
RETURN t1.Name, t2.Name, count(q) AS veces
ORDER BY veces DESC
LIMIT 20
</code></pre>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="93" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" data-marpit-pagination="93" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="expertos-por-tag">Expertos por <em>tag</em></h1>
<p>Más respuestas aceptadas en un <em>tag</em>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">MATCH (u:User)-[:WROTE]-&gt;(a:Answer)-[:ANSWERS]-&gt;(q:Question)
      -[:TAGGED_WITH]-&gt;(t:Tag {Name: 'neo4j'})
WHERE q.AcceptedAnswerId = a.Id
RETURN u.DisplayName, count(a) AS respuestas
ORDER BY respuestas DESC
LIMIT 10
</code></pre>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="94" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" data-marpit-pagination="94" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="sistema-de-recomendaci%C3%B3n-simple">Sistema de recomendación simple</h1>
<p>Recomendar amigos: amigos de mis amigos que no conozco.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">MATCH (yo:User {nombre: 'Ana'})-[:AMIGO_DE]-&gt;()-[:AMIGO_DE]-&gt;(recomendado)
WHERE NOT (yo)-[:AMIGO_DE]-&gt;(recomendado) AND recomendado &lt;&gt; yo
RETURN recomendado.nombre, count(*) AS amigos_comunes
ORDER BY amigos_comunes DESC
LIMIT 10
</code></pre>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="95" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" data-marpit-pagination="95" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="recomendar-productos">Recomendar productos</h1>
<p>Basado en compras similares:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">MATCH (yo:User {id: 123})-[:COMPRO]-&gt;(p:Producto)
      &lt;-[:COMPRO]-(otro:User)-[:COMPRO]-&gt;(recomendacion:Producto)
WHERE NOT (yo)-[:COMPRO]-&gt;(recomendacion)
RETURN recomendacion.nombre, count(*) AS popularidad
ORDER BY popularidad DESC
LIMIT 10
</code></pre>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="96" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" data-marpit-pagination="96" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="recomendar-contenido">Recomendar contenido</h1>
<p>Por similitud de intereses:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">MATCH (yo:User {id: 123})-[:INTERESTED_IN]-&gt;(t:Tag)
      &lt;-[:INTERESTED_IN]-(similar:User)-[:WROTE]-&gt;(post:Post)
WHERE NOT (yo)-[:WROTE]-&gt;(post)
WITH post, count(DISTINCT similar) AS usuarios_similares
RETURN post.titulo, usuarios_similares
ORDER BY usuarios_similares DESC
LIMIT 10
</code></pre>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="97" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" data-marpit-pagination="97" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="carga-de-datos-desde-csv">Carga de datos desde CSV</h1>
<ul>
<li>Neo4j puede cargar datos directamente desde archivos CSV</li>
<li>Los archivos deben estar en <code>import/</code>, dentro del directorio de Neo4j</li>
</ul>
<p>Cargar usuarios:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">LOAD CSV WITH HEADERS FROM 'file:///users.csv' AS row
CALL {
  WITH row
  MERGE (u:User {Id: row.Id})
  SET u.DisplayName = row.DisplayName,
      u.Reputation = toInteger(row.Reputation),
      u.CreationDate = datetime(row.CreationDate)
} IN TRANSACTIONS OF 1000 ROWS
</code></pre>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="98" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-class="code" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" class="code" data-marpit-pagination="98" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--class:code;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="cargar-posts-y-relaciones">Cargar <em>posts</em> y relaciones</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">LOAD CSV WITH HEADERS FROM 'file:///posts.csv' AS row
CALL {
  WITH row
  MERGE (p:Post {Id: row.Id})
  SET p.Title = row.Title,
      p.Body = row.Body,
      p.PostTypeId = toInteger(row.PostTypeId)

  // Crear relación con usuario
  WITH p, row
  MATCH (u:User {Id: row.OwnerUserId})
  MERGE (u)-[:WROTE]-&gt;(p)

  // Si es respuesta, crear relación ANSWERS
  WITH p, row
  WHERE row.ParentId IS NOT NULL
  MATCH (q:Post {Id: row.ParentId})
  MERGE (p)-[:ANSWERS]-&gt;(q)
} IN TRANSACTIONS OF 500 ROWS
</code></pre>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="99" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" data-marpit-pagination="99" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="importaci%C3%B3n-masiva">Importación masiva</h1>
<p>Para grandes volúmenes, <code>neo4j-admin import</code>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">neo4j-admin import \
  --nodes=User=users.csv \
  --nodes=Post=posts.csv \
  --relationships=WROTE=wrote.csv \
  --relationships=ANSWERS=answers.csv
</code></pre>
<p>Mucho más rápido (millones de nodos por minuto). Requiere base de datos vacía.</p>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="100" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-class="section-divider" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" class="section-divider" data-marpit-pagination="100" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--class:section-divider;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="recursos-y-herramientas">Recursos y herramientas</h1>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="101" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" data-marpit-pagination="101" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="recursos-de-aprendizaje">Recursos de aprendizaje</h1>
<ul>
<li><strong>GraphAcademy</strong> (<a href="https://graphacademy.neo4j.com/">graphacademy.neo4j.com</a>): cursos gratuitos online interactivos y certificaciones oficiales, de básico a avanzado</li>
<li><strong>Neo4j Sandbox</strong> (<a href="https://sandbox.neo4j.com/">sandbox.neo4j.com</a>): entornos precargados para experimentar (Movie Graph, Twitter, Game of Thrones, etc.), sin instalación</li>
<li><strong>Documentación oficial</strong> (<a href="https://neo4j.com/docs/">neo4j.com/docs</a>)</li>
<li><strong>Comunidad</strong>: Neo4j Community Forum, Stack Overflow (<em>tag</em> <code>neo4j</code>)</li>
<li><strong>Canal de YouTube</strong> de Neo4j: tutoriales y casos de uso</li>
</ul>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="102" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" data-marpit-pagination="102" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="herramientas-y-extensiones">Herramientas y extensiones</h1>
<ul>
<li><strong>Neo4j Desktop</strong>: entorno de desarrollo local, gestión de varias bases de datos, <em>plugins</em> (APOC, GDS, Bloom)</li>
<li><strong>Neo4j Bloom</strong>: visualización y exploración de grafos, interfaz para usuarios no técnicos, búsqueda en lenguaje natural</li>
<li><strong>APOC</strong> (<em>Awesome Procedures On Cypher</em>): 450+ procedimientos y funciones; importación/exportación de datos; utilidades de texto, fecha, JSON</li>
<li><strong>Neoclipse</strong>: IDE Eclipse para Neo4j (descontinuado, pero útil)</li>
</ul>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
