</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" data-marpit-pagination="3" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="introducci%C3%B3n-a-las-bbdd-de-grafos">Introducción a las BBDD de grafos</h1>
<ul>
<li>Basadas en el concepto matemático de grafo</li>
<li><strong>Nodos</strong> o <strong>vértices</strong>, que contienen un identificador y un conjunto de propiedades</li>
<li>Un conjunto de <strong>arcos</strong> o <strong>aristas</strong> que conectan pares de nodos, de forma dirigida o no; los arcos pueden tener sus propios atributos</li>
<li>En el caso particular de Neo4j, los nodos también pueden tener un conjunto de etiquetas (<em><strong>label</strong></em>) y pares ⟨clave, valor⟩. La etiqueta equivale a su «tipo»</li>
<li>Incluyen un lenguaje de búsqueda de elementos y manipulación del grafo</li>
</ul>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" data-marpit-pagination="4" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="ventajas-de-las-bbdd-de-grafos">Ventajas de las BBDD de grafos</h1>
<ul>
<li><strong>Navegación eficiente</strong>: recorrido de relaciones en tiempo constante mediante <em>index-free adjacency</em></li>
<li><strong>Flexibilidad de esquema</strong>: fácil añadir nuevos tipos de nodos y relaciones sin afectar a los datos existentes</li>
<li><strong>Consultas intuitivas</strong>: el lenguaje refleja la estructura visual del grafo (<em>ASCII art</em>)</li>
<li><strong>Modelado natural</strong>: muchos dominios son inherentemente grafos (redes sociales, dependencias, rutas)</li>
<li><strong>Análisis de relaciones</strong>: algoritmos especializados para detectar patrones, comunidades, rutas óptimas</li>
</ul>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" data-marpit-pagination="5" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="desventajas-y-limitaciones">Desventajas y limitaciones</h1>
<ul>
<li><strong>Operaciones agregadas masivas</strong>: menos eficientes que los RDBMS para operaciones OLAP</li>
<li><strong>Escalado horizontal limitado</strong>: Neo4j Community sólo soporta una instancia; Enterprise usa replicación <em>master-slave</em></li>
<li><strong>Consultas globales costosas</strong>: recorrer todo el grafo puede ser ineficiente</li>
<li><strong>Curva de aprendizaje</strong>: requiere pensar de forma diferente al modelo relacional</li>
<li><strong>Tamaño de datos</strong>: mejor rendimiento cuando el grafo completo cabe en memoria</li>
</ul>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-class="compact" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" class="compact" data-marpit-pagination="6" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--class:compact;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="casos-de-uso-principales">Casos de uso principales</h1>
<ul>
<li><strong>Sistemas de recomendación</strong>: productos, contenidos, amigos (Amazon, Netflix, LinkedIn)</li>
<li><strong>Detección de fraude</strong>: patrones sospechosos en transacciones financieras (PayPal, eBay)</li>
<li><strong>Análisis de redes sociales</strong>: influencia, comunidades, propagación de información</li>
<li><strong>Gestión de identidad y acceso</strong>: permisos, roles, jerarquías organizacionales</li>
<li><strong>Análisis de dependencias</strong>: software, cadenas de suministro, infraestructura IT</li>
<li><strong>Gestión del conocimiento</strong>: <em>knowledge graphs</em>, ontologías, grafos de conceptos</li>
<li><strong>Redes de transporte</strong>: rutas óptimas, análisis de tráfico</li>
</ul>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-class="dense" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" class="dense" data-marpit-pagination="7" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--class:dense;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="comparaci%C3%B3n-con-otros-paradigmas">Comparación con otros paradigmas</h1>
<table>
<thead>
<tr>
<th></th>
<th><strong>RDBMS</strong></th>
<th><strong>Documental</strong></th>
<th><strong>Grafos</strong></th>
</tr>
</thead>
<tbody>
<tr>
<td>Relaciones</td>
<td><code>JOIN</code>s costosos</td>
<td>Referencias limitadas</td>
<td>Nativas y eficientes</td>
</tr>
<tr>
<td>Esquema</td>
<td>Rígido</td>
<td>Flexible</td>
<td>Muy flexible</td>
</tr>
<tr>
<td>Consultas</td>
<td>SQL</td>
<td><em>Query DSL</em></td>
<td>Cypher/Gremlin</td>
</tr>
<tr>
<td>Mejor para</td>
<td>OLAP, agregaciones</td>
<td>Documentos aislados</td>
<td>Datos conectados</td>
</tr>
<tr>
<td>Escalado</td>
<td>Vertical/<em>sharding</em></td>
<td>Horizontal</td>
<td>Limitado (Neo4j)</td>
</tr>
</tbody>
</table>
<p><strong>Elegir grafos cuando</strong>: las relaciones son tan importantes como los datos.</p>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" data-marpit-pagination="8" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="property-graph-vs-rdf"><em>Property Graph</em> vs. RDF</h1>
<p>Dos modelos principales de bases de datos de grafos:</p>
<ul>
<li><strong>Property Graph</strong> (Neo4j, Neptune, CosmosDB): nodos y relaciones con propiedades, relaciones con nombre y dirección, lenguajes Cypher/Gremlin — orientado a aplicaciones</li>
<li><strong>RDF</strong> (<em>Resource Description Framework</em>): tripletas sujeto-predicado-objeto, ontologías y razonamiento lógico, lenguaje SPARQL, bases de datos Blazegraph/GraphDB/Stardog — orientado a web semántica y conocimiento</li>
</ul>
<p>Neo4j es <em>Property Graph</em>.</p>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" data-marpit-pagination="9" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="tipos-de-bbdd-de-grafos">Tipos de BBDD de grafos</h1>
<p>Se pueden clasificar atendiendo a dos dimensiones:</p>
<ul>
<li><strong>Almacenamiento subyacente</strong>: nativo de grafos, o bien relacional/de otro tipo</li>
<li><strong>Motor de procesamiento</strong>: motor de grafos donde las entidades «apuntan» físicamente a otras (<em>index-free adjacency</em>), o bien se simula el procesamiento de grafos usando índices</li>
</ul>
<p><strong>Ejemplos por cuadrante</strong>: nativo/nativo — <strong>Neo4j</strong>, InfiniteGraph; no nativo/nativo — OrientDB, JanusGraph; no nativo/no nativo — GraphDB sobre RDBMS</p>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-class="figure-only" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" class="figure-only" data-marpit-pagination="10" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--class:figure-only;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" data-marpit-pagination="11" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="aplicabilidad-de-grafos">Aplicabilidad de grafos</h1>
<ul>
<li>Los grafos, conceptualmente, aparecen en casi cualquier dominio</li>
<li>Su flexibilidad hace que se puedan aplicar de diferentes formas:
<ul>
<li>Gestión de identidad y acceso (IAM): permisos, roles, herencia</li>
<li>Cadenas de suministro: proveedores, productos, rutas</li>
<li>Análisis de dependencias de software: paquetes, versiones</li>
<li>Redes de transporte: estaciones, rutas, conexiones</li>
<li>Estructuras jerárquicas recursivas: organizaciones, taxonomías</li>
</ul>
</li>
</ul>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-class="figure-only" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" class="figure-only" data-marpit-pagination="12" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--class:figure-only;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" data-marpit-pagination="15" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="flexibilidad-y-eficiencia">Flexibilidad y eficiencia</h1>
<p>Las bases de datos de grafos suplen dos carencias fundamentales:</p>
<ol>
<li>La carencia expresiva del resto de paradigmas para ciertas relaciones entre datos</li>
<li>La eficiencia del tratamiento de estos datos con algoritmos basados en grafos, frente a otros paradigmas</li>
</ol>
<p><strong>Clave de eficiencia</strong>: <em>index-free adjacency</em> — cada nodo mantiene referencias directas a nodos adyacentes, sin búsquedas en índices, tiempo constante O(1) para acceder a vecinos.</p>
<p>Ejemplo: una relación de amistad (<em>friend</em>) entre usuarios de una red social.</p>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-class="figure-only" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" class="figure-only" data-marpit-pagination="16" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--class:figure-only;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="una-posible-implementaci%C3%B3n-relacional">Una posible implementación relacional</h1>
<p><img src="img/friends_table.png" alt="" style="height:480px;" /></p>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" data-marpit-pagination="17" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="consulta-amigos-de-bob">Consulta: amigos de Bob</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> p1.Person
<span class="hljs-keyword">FROM</span> Person p1 <span class="hljs-keyword">JOIN</span> PersonFriend
<span class="hljs-keyword">ON</span> PersonFriend.FriendID <span class="hljs-operator">=</span> p1.ID
<span class="hljs-keyword">JOIN</span> Person p2
<span class="hljs-keyword">ON</span> PersonFriend.PersonID <span class="hljs-operator">=</span> p2.ID
<span class="hljs-keyword">WHERE</span> p2.Person <span class="hljs-operator">=</span> <span class="hljs-string">&#x27;Bob&#x27;</span>
</code></pre>
<p>Es sencilla y no es computacionalmente muy compleja.</p>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" data-marpit-pagination="18" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="consulta-inversa">Consulta inversa</h1>
<p>Como la relación de amistad no siempre es recíproca, a veces hay que hacer la búsqueda inversa:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> p1.Person
<span class="hljs-keyword">FROM</span> Person p1 <span class="hljs-keyword">JOIN</span> PersonFriend
<span class="hljs-keyword">ON</span> PersonFriend.PersonID <span class="hljs-operator">=</span> p1.ID
<span class="hljs-keyword">JOIN</span> Person p2
<span class="hljs-keyword">ON</span> PersonFriend.FriendID <span class="hljs-operator">=</span> p2.ID
<span class="hljs-keyword">WHERE</span> p2.Person <span class="hljs-operator">=</span> <span class="hljs-string">&#x27;Bob&#x27;</span>
</code></pre>
<p>Esta consulta es más costosa que la anterior, porque hay que recorrer todas las filas de <code>PersonFriend</code>.</p>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-class="code" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" class="code" data-marpit-pagination="19" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--class:code;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="amigos-de-los-amigos-de-alice">Amigos de los amigos de Alice</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">SELECT</span> p1.Person <span class="hljs-keyword">AS</span> PERSON, p2.Person <span class="hljs-keyword">AS</span> FRIEND_OF_FRIEND
<span class="hljs-keyword">FROM</span> PersonFriend pf1 <span class="hljs-keyword">JOIN</span> Person p1
<span class="hljs-keyword">ON</span> pf1.PersonID <span class="hljs-operator">=</span> p1.ID
<span class="hljs-keyword">JOIN</span> PersonFriend pf2
<span class="hljs-keyword">ON</span> pf2.PersonID <span class="hljs-operator">=</span> pf1.FriendID
<span class="hljs-keyword">JOIN</span> Person p2
<span class="hljs-keyword">ON</span> pf2.FriendID <span class="hljs-operator">=</span> p2.ID
<span class="hljs-keyword">WHERE</span> p1.Person <span class="hljs-operator">=</span> <span class="hljs-string">&#x27;Alice&#x27;</span> <span class="hljs-keyword">AND</span> pf2.FriendID <span class="hljs-operator">&lt;&gt;</span> p1.ID
</code></pre>
<p>Y sólo estamos bajando <strong>un</strong> nivel. Si bajáramos otro, se complicaría mucho más por los <code>JOIN</code>.</p>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" data-marpit-pagination="20" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">

<p>Partner y Vukotic compararon Neo4j y MySQL con esta tabla, buscando amigos de amigos en diferentes profundidades, en una red de 1 millón de personas con ~50 amigos cada una. (Experimento de 2014; el principio de eficiencia se mantiene en versiones modernas.)</p>
<table>
<thead>
<tr>
<th>Prof.</th>
<th>Tiempos RDBMS</th>
<th>Tiempos Neo4j</th>
<th>Resultados</th>
</tr>
</thead>
<tbody>
<tr>
<td>2</td>
<td>0,016</td>
<td>0,01</td>
<td>~2 500</td>
</tr>
<tr>
<td>3</td>
<td>30,267</td>
<td>0,168</td>

<p><strong>Nota</strong>: SQL puede ser mejor para operaciones masivas de agregación (OLAP) sobre todo el <em>dataset</em>.</p>

<h1 id="neo4j">Neo4j</h1>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" data-marpit-pagination="23" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="introducci%C3%B3n-a-neo4j">Introducción a Neo4j</h1>
<ul>
<li>Base de datos de grafos con posibilidad de extenderse a varios ordenadores (sólo uno soporta escritura, replicación <em>master-slave</em>)</li>
<li><strong>Versiones</strong>: Community (gratuita, una instancia, límites de autenticación), Enterprise (<em>clustering</em>, <em>backup</em> online, seguridad avanzada), Neo4j Aura (cloud gestionado, DBaaS)</li>
<li>Compatible con el estándar Apache TinkerPop</li>
<li>Lenguaje de creación y consulta de grafos: <strong>Cypher</strong></li>
<li><em>Browser</em> web y consola para lanzar consultas; <strong>Neo4j Desktop</strong> para desarrollo local</li>
</ul>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" data-marpit-pagination="24" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="introducci%C3%B3n-a-neo4j-ii">Introducción a Neo4j (ii)</h1>
<ul>
<li>Multitud de algoritmos de recorrido de grafos, con la posibilidad de añadir más</li>
<li><strong>APOC Library</strong>: procedimientos y funciones avanzadas, muy utilizada</li>
<li><strong>Graph Data Science (GDS)</strong>: librería de algoritmos de grafos (PageRank, comunidades, etc.)</li>
<li>Se puede usar desde Jupyter Notebook a través de una extensión</li>
<li><strong>Drivers oficiales</strong>: Python, Java, JavaScript, .NET, Go</li>
<li>Ofrece también todos sus servicios a través de un API REST</li>
</ul>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-class="compact" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" class="compact" data-marpit-pagination="25" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--class:compact;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="grafos-en-neo4j">Grafos en Neo4j</h1>
<ul>
<li>Grafos etiquetados y con propiedades, compuestos por <strong>nodos</strong>, <strong>relaciones</strong>, <strong>propiedades</strong> y <strong>etiquetas</strong></li>
<li>Los nodos contienen propiedades como pares clave-valor: las claves son cadenas, los valores tipos primitivos o <em>arrays</em></li>
<li><strong>Tipos de datos soportados</strong>: String, Integer, Float, Boolean, Point, Date, DateTime, LocalTime, Duration, y listas de primitivos</li>
<li>A los nodos se les puede etiquetar con una o más <em><strong>etiquetas</strong></em>, que los agrupan por rol dentro del grafo</li>
<li>Las relaciones conectan nodos: <strong>siempre tienen una dirección</strong> (aunque se puede ignorar en consultas), un nombre propio, un nodo de inicio y otro de fin</li>
<li>Como los nodos, las relaciones también tienen propiedades (p. ej. el peso o la calidad de un enlace), lo que además simplifica las consultas</li>
</ul>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-class="figure-only" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" class="figure-only" data-marpit-pagination="26" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--class:figure-only;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="modelo-de-datos-visual-en-neo4j">Modelo de datos visual en Neo4j</h1>
<p><img src="img/neo4j-visual-model.png" alt="" style="height:340px;" /></p>
<p>Nodos (círculos) con etiquetas y propiedades; relaciones dirigidas con tipo y propiedades opcionales.</p>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-class="code" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" class="code" data-marpit-pagination="27" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--class:code;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="acceso-desde-python">Acceso desde Python</h1>
<p>El <em>driver</em> oficial <code>neo4j</code> ofrece una API asíncrona sobre el protocolo <em>Bolt</em>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">from</span> neo4j <span class="hljs-keyword">import</span> AsyncDriver, AsyncGraphDatabase, EagerResult, basic_auth

cypher_query = <span class="hljs-string">&quot;&quot;&quot;
MATCH (n)
RETURN n AS id
LIMIT 10;
&quot;&quot;&quot;</span>

driver: AsyncDriver = AsyncGraphDatabase.driver(BOLT_URL, auth=basic_auth(<span class="hljs-string">&quot;neo4j&quot;</span>, <span class="hljs-string">&quot;&quot;</span>))

result: EagerResult = <span class="hljs-keyword">await</span> driver.execute_query(cypher_query)
<span class="hljs-keyword">for</span> record <span class="hljs-keyword">in</span> result.records:
    <span class="hljs-built_in">print</span>(record[<span class="hljs-string">&quot;id&quot;</span>])
</code></pre>
<p><code>execute_query()</code> abre, ejecuta y cierra la transacción en un solo paso; para transacciones explícitas se usa <code>driver.session()</code>.</p>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-class="section-divider" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" class="section-divider" data-marpit-pagination="28" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--class:section-divider;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="el-lenguaje-cypher">El lenguaje Cypher</h1>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" data-marpit-pagination="29" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="el-lenguaje-cypher-1">El lenguaje Cypher</h1>
<p>Lenguaje de especificación de búsquedas y modificaciones en el grafo.</p>
<p>Nodos:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">( nombre:Etiqueta { propiedad: valor, ... } )
</code></pre>
<p>Relaciones, usando <em>ASCII art</em>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">(nodo_origen)-[:RELACIÓN]-&gt;(nodo_destino)
</code></pre>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" data-marpit-pagination="30" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="cypher-relaciones">Cypher: relaciones</h1>
<p>Con propiedades:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">(n1)-[:RELACIÓN {año: 2017}]-&gt;(n2)
</code></pre>
<p>En el otro sentido:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">(nodo1)&lt;-[:RELACIÓN]-(nodo2)
</code></pre>
<p>Omitiendo relaciones y nodos intermedios:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">(nodo1)-[:RELACIÓN]-&gt;()-[:RELACIÓN2]-&gt;(nodo2)
(nodo1)--&gt;(nodo3)
</code></pre>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" data-marpit-pagination="31" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="cypher-repetici%C3%B3n-de-relaciones">Cypher: repetición de relaciones</h1>
<p>Repetida un número acotado o no acotado de veces:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">(nodo1)-[:RELACIÓN*1..10]-&gt;(nodo2)
(nodo3)-[:RELACIÓN*0..]-&gt;(nodoX)
</code></pre>
<p>Conjunto no limitado de relaciones, de forma general:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">(nodo1)-[*]-(nodo2)
</code></pre>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" data-marpit-pagination="32" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="cypher-create">Cypher: <code>CREATE</code></h1>
<p>Creación de nodos y enlaces:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">CREATE (nodo1:Etiqueta1 { propX: valorX, ... } ),
       (nodo2:Etiqueta2 { propY: valorY, ... } ),
       ...
       (nodo1)-[:RELACIONADO_CON]-&gt;(nodo2)
</code></pre>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" data-marpit-pagination="33" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="consultas-match">Consultas: <code>MATCH</code></h1>
<p>Consulta a través de ejemplos (<em>query by example</em>): especifica nodos y propiedades como ejemplo de lo que se busca.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">MATCH especificación, especificación, ...
[WHERE especificación]
[ORDER BY campo]
[LIMIT x]
RETURN [DISTINCT] nodos
</code></pre>
<p><code>MATCH</code> también se usa para seleccionar nodos a crear (<code>CREATE</code>) o borrar (<code>DELETE</code>/<code>DETACH DELETE</code>). Retorna todos los <em>posts</em>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">MATCH (n:Post) RETURN n
</code></pre>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" data-marpit-pagination="34" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="consultas-restricciones">Consultas: restricciones</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">MATCH (n { nombre: 'Diego' }) RETURN n.edad;
</code></pre>
<p>En este caso se devuelve una tabla, no un subgrafo.</p>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" data-marpit-pagination="35" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="consultas-nodos-an%C3%B3nimos-y-caminos">Consultas: nodos anónimos y caminos</h1>
<p>Todos los abuelos con sus nietos:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">MATCH (nieto), (abuelo),
   (nieto)-[:HIJO_DE]-&gt;()-[:HIJO_DE]-&gt;(abuelo)
 RETURN abuelo, nieto
</code></pre>
<p>O incluso (nótense los nodos anónimos):</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">MATCH (nieto)-[:HIJO_DE]-&gt;()-[:HIJO_DE]-&gt;(abuelo)
  RETURN abuelo, nieto
</code></pre>
<p>También:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">MATCH (nieto)-[:HIJO_DE*2]-&gt;(abuelo)
  RETURN abuelo, nieto
</code></pre>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" data-marpit-pagination="36" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="consultas-con-optional-match">Consultas con <code>OPTIONAL MATCH</code></h1>
<ul>
<li><code>OPTIONAL MATCH</code> funciona como un <code>LEFT JOIN</code> en SQL</li>
<li>Retorna <code>null</code> si no encuentra coincidencias</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">MATCH (p:Persona)
OPTIONAL MATCH (p)-[:TRABAJA_EN]-&gt;(c:Compañía)
RETURN p.nombre, c.nombre
</code></pre>
<p>Devuelve todas las personas, con su compañía si la tienen, <code>null</code> si no.</p>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" data-marpit-pagination="37" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="funciones-de-agregaci%C3%B3n">Funciones de agregación</h1>
<p>Similares a SQL:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">// Contar posts por usuario
MATCH (u:User)-[:WROTE]-&gt;(p:Post)
RETURN u.nombre, count(p) AS num_posts
ORDER BY num_posts DESC
</code></pre>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" data-marpit-pagination="38" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="funciones-de-agregaci%C3%B3n-ii">Funciones de agregación (ii)</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">// Promedio de edad de usuarios
MATCH (u:User)
RETURN avg(u.edad) AS edad_promedio
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">// Recopilar amigos en una lista
MATCH (p:Persona {nombre: 'Ana'})-[:AMIGO_DE]-&gt;(amigo)
RETURN p.nombre, collect(amigo.nombre) AS amigos
</code></pre>
<p>Otras funciones: <code>sum()</code>, <code>max()</code>, <code>min()</code>, <code>collect()</code>, <code>percentileDisc()</code>.</p>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" data-marpit-pagination="39" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="funciones-de-strings">Funciones de <em>strings</em></h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">MATCH (p:Post)
RETURN p.Title, toUpper(p.Title), toLower(p.Title)
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">MATCH (p:Post)
WHERE p.Title CONTAINS 'Neo4j'
RETURN p.Title
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">// split, substring, replace, trim
RETURN split(&quot;a,b,c&quot;, &quot;,&quot;) AS lista
</code></pre>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" data-marpit-pagination="40" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="funciones-de-listas">Funciones de listas</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">MATCH (u:User)-[:AMIGO_DE]-&gt;(amigo)
WITH u, collect(amigo) AS amigos
RETURN u.nombre, size(amigos) AS num_amigos,
       head(amigos) AS primer_amigo
</code></pre>
<p>Otras: <code>tail()</code>, <code>last()</code>, <code>range()</code>, <code>reduce()</code>.</p>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" data-marpit-pagination="41" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="unwind-descomponer-listas"><code>UNWIND</code>: descomponer listas</h1>
<p><code>UNWIND</code> convierte una lista en filas individuales:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">UNWIND [1, 2, 3] AS numero
RETURN numero
</code></pre>
<p>Útil para procesar listas de datos:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">WITH ['Alice', 'Bob', 'Charlie'] AS nombres
UNWIND nombres AS nombre
CREATE (:Persona {nombre: nombre})
</code></pre>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" data-marpit-pagination="42" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="unwind-con-collect"><code>UNWIND</code> con <code>collect</code></h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">MATCH (u:User)
WITH collect(u.email) AS emails
UNWIND emails AS email
RETURN toLower(email) AS email_normalizado
</code></pre>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" data-marpit-pagination="43" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="variables-de-caminos">Variables de caminos</h1>
<p>Se pueden asignar caminos completos a variables:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">MATCH p = (a:Persona)-[:AMIGO_DE*1..3]-&gt;(b:Persona)
WHERE a.nombre = 'Ana' AND b.nombre = 'Carlos'
RETURN p, length(p)
</code></pre>
<p>Útil para algoritmos de caminos:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">MATCH p = shortestPath(
  (a:Persona {nombre: 'Ana'})-[*]-(b:Persona {nombre: 'Carlos'})
)
RETURN p, length(p) AS distancia
</code></pre>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" data-marpit-pagination="44" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="todos-los-caminos-m%C3%A1s-cortos">Todos los caminos más cortos</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">MATCH p = allShortestPaths(
  (a:Persona {nombre: 'Ana'})-[*]-(b:Persona {nombre: 'Carlos'})
)
RETURN p
</code></pre>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" data-marpit-pagination="45" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="filtros-en-relaciones">Filtros en relaciones</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">MATCH (u:User)-[r:AMIGO_DE WHERE r.desde &gt; 2020]-&gt;(amigo)
RETURN u.nombre, amigo.nombre, r.desde
</code></pre>
<p>También en patrones de camino variable:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">MATCH (a)-[r:CONOCE*1..3 WHERE r.confianza &gt; 0.7]-&gt;(b)
RETURN a, b
</code></pre>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" data-marpit-pagination="46" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="union-combinar-resultados"><code>UNION</code>: combinar resultados</h1>
<p><code>UNION</code> elimina duplicados; <code>UNION ALL</code> los mantiene.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">// Usuarios activos: escribieron post O comentaron
MATCH (u:User)-[:WROTE]-&gt;(:Post)
RETURN u.nombre AS usuario
UNION
MATCH (u:User)-[:COMMENTED]-&gt;(:Comment)
RETURN u.nombre AS usuario
</code></pre>
<p>Las columnas devueltas deben coincidir en tipo y número.</p>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" data-marpit-pagination="47" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="union-all-mantiene-duplicados"><code>UNION ALL</code>: mantiene duplicados</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">MATCH (u:User)-[:WROTE]-&gt;(:Post)
RETURN u.nombre AS usuario, 'post' AS actividad
UNION ALL
MATCH (u:User)-[:COMMENTED]-&gt;(:Comment)
RETURN u.nombre AS usuario, 'comment' AS actividad
</code></pre>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" data-marpit-pagination="48" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="call-procedimientos"><code>CALL</code>: procedimientos</h1>
<ul>
<li><code>CALL</code> ejecuta procedimientos almacenados</li>
<li>Neo4j incluye muchos procedimientos <em>built-in</em>; APOC añade 450+ procedimientos más</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">// Listar todos los procedimientos
CALL dbms.procedures()
YIELD name, signature, description
WHERE name STARTS WITH 'apoc'
RETURN name, signature
LIMIT 10
</code></pre>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" data-marpit-pagination="49" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="call-con-y-sin-resultados"><code>CALL</code>: con y sin resultados</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">// Ejecutar procedimiento con resultados
CALL db.labels() YIELD label
RETURN label, count(*) AS count
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">// Procedimiento sin resultados (standalone)
CALL db.clearQueryCaches()
</code></pre>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" data-marpit-pagination="50" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="call-procedimientos-%C3%BAtiles"><code>CALL</code>: procedimientos útiles</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">// Ver esquema del grafo
CALL db.schema.visualization()

// Estadísticas de nodos
CALL db.stats.retrieve('NODES')

// Crear constraint dinámicamente con APOC
CALL apoc.schema.assert(
  {User: ['email']},
  {User: ['id']}
)
</code></pre>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" data-marpit-pagination="51" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="creaci%C3%B3n-de-nodos-a-partir-de-otros">Creación de nodos a partir de otros</h1>
<p>Un patrón común: crear un hijo y añadirlo a alguien.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">MATCH (padre:Persona { nombre: 'Diego' })
 CREATE (violeta:Persona {nombre: 'Violeta'}),
        (violeta)-[:HIJO_DE]-&gt;(padre)
</code></pre>
<p>(También se puede usar <code>CREATE UNIQUE</code> o <code>MERGE</code> para evitar crear nodos nuevos si ya existen.)</p>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" data-marpit-pagination="52" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="creaci%C3%B3n-de-relaciones-merge">Creación de relaciones: <code>MERGE</code></h1>
<ul>
<li>Para crear sólo relaciones y usar los nodos que ya existan se suele utilizar <code>MERGE</code></li>
<li><code>CREATE</code> no hace <em>match</em>: crea nodos conforme los necesita, y también la relación</li>
<li>En la parte <code>MATCH</code>/<code>MERGE</code> se ligan los nodos y sólo se crean las relaciones (si alguna de mis hijas existe, no se crea):</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">MATCH (padre:Persona { nombre: 'Diego' })
 MERGE (violeta:Persona {nombre: 'Violeta'}),
        (martina:Persona {nombre: 'Martina'}),
        (violeta)-[:HIJO_DE]-&gt;(padre),
        (martina)-[:HIJO_DE]-&gt;(padre)
</code></pre>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" data-marpit-pagination="53" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="creaci%C3%B3n-de-relaciones-create-tras-match">Creación de relaciones: <code>CREATE</code> tras <code>MATCH</code></h1>
<p>Si se sabe que los nodos ya existen, se incluyen en el <code>MATCH</code> y se usa <code>CREATE</code> sólo para las relaciones — mucho más rápido que <code>MERGE</code>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">MATCH (padre:Persona { nombre: 'Diego' })
      (violeta:Persona {nombre: 'Violeta'}),
      (martina:Persona {nombre: 'Martina'})
CREATE (violeta)-[:HIJO_DE]-&gt;(padre),
       (martina)-[:HIJO_DE]-&gt;(padre)
</code></pre>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" data-marpit-pagination="54" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="cl%C3%A1usula-with">Cláusula <code>WITH</code></h1>
<p>Extrae los datos a procesar posteriormente, dándoles opcionalmente un alias:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">MATCH(a:Post) WITH count(a) as c RETURN c
</code></pre>
<p>Hay que especificar <strong>todos</strong> los valores que se pasan. Error: <code>b</code> no está definido:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">MATCH(a:Post)--&gt;(b) WITH a RETURN a,b LIMIT 100
</code></pre>
<p>Correcto: nodos <em>post</em> y su título en mayúsculas:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">MATCH(a:Post) WITH a,toUpper(a.Title) AS t RETURN a,t LIMIT 100
</code></pre>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" data-marpit-pagination="55" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="%C3%ADndices">Índices</h1>
<p>Se pueden crear índices para búsquedas rápidas sobre atributos:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">CREATE INDEX post_title_idx IF NOT EXISTS
FOR (n:Etiqueta) ON (n.nombre_campo)
</code></pre>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="56" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-class="compact" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" class="compact" data-marpit-pagination="56" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--class:compact;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="%C3%ADndices-y-constraints-avanzados">Índices y <em>constraints</em> avanzados</h1>
<p><strong>Constraints de unicidad</strong>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">CREATE CONSTRAINT usuario_email_unique IF NOT EXISTS
FOR (u:Usuario) REQUIRE u.email IS UNIQUE;

CREATE CONSTRAINT post_id_unique IF NOT EXISTS
FOR (p:Post) REQUIRE p.id IS UNIQUE;
</code></pre>
<p><strong>Constraints de existencia</strong> (Enterprise):</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">CREATE CONSTRAINT usuario_id_exists IF NOT EXISTS
FOR (u:Usuario) REQUIRE u.id IS NOT NULL;
</code></pre>
<p><strong>Índices compuestos</strong> (Enterprise):</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">CREATE INDEX usuario_nombre_apellido IF NOT EXISTS
FOR (u:Usuario) ON (u.nombre, u.apellido);
</code></pre>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" data-marpit-pagination="57" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="%C3%ADndices-full-text">Índices <em>full-text</em></h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">CREATE FULLTEXT INDEX postContent IF NOT EXISTS
FOR (n:Post) ON EACH [n.title, n.body];

// Uso
CALL db.index.fulltext.queryNodes(
  'postContent', 'Neo4j AND graphs'
) YIELD node, score
RETURN node.title, score
</code></pre>
<p>Ver índices y <em>constraints</em>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">SHOW INDEXES;
SHOW CONSTRAINTS;
</code></pre>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-class="code" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" class="code" data-marpit-pagination="58" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--class:code;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="y-consultas-interesantes-en-neo4j">Y consultas interesantes en Neo4j</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">CREATE
  (NAmerica:Location {name:'North America', type:'continent'}),
  (USA:Location {name:'United States', type:'country' }),
  (Idaho:Location {name:'Idaho', type:'state' }),
  (Lucy:Person {name:'Lucy' }),
  (Idaho)-[:WITHIN]-&gt;(USA)-[:WITHIN]-&gt;(NAmerica),
  (Lucy) -[:BORN_IN]-&gt;(Idaho)
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">MATCH
(person)-[:BORN_IN]-&gt;()-[:WITHIN*0..]-&gt;(us:Location {name:'United States'}),
(person)-[:LIVES_IN]-&gt;()-[:WITHIN*0..]-&gt;(eu:Location {name:'Europe'})
RETURN person.name
</code></pre>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="59" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-class="section-divider" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" class="section-divider" data-marpit-pagination="59" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--class:section-divider;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="modelado-de-datos-en-grafos">Modelado de datos en grafos</h1>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="60" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" data-marpit-pagination="60" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="principios-de-modelado-en-grafos">Principios de modelado en grafos</h1>
<ul>
<li><strong>Empezar por las preguntas</strong>, no por los datos: ¿qué consultas necesitamos responder? Diseñar el modelo para optimizarlas</li>
<li><em><strong>Whiteboard-friendly</strong></em>: dibujar el modelo en una pizarra</li>
<li><strong>Principio</strong>: los datos conectados son tan importantes como los datos mismos</li>
<li><strong>Desnormalizar</strong>: a diferencia de RDBMS, duplicar datos puede ser beneficioso</li>
<li><strong>Evolución</strong>: el modelo puede evolucionar sin migraciones complejas</li>
</ul>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="61" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-class="compact" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" class="compact" data-marpit-pagination="61" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--class:compact;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="nodos-vs-propiedades">Nodos vs. propiedades</h1>
<p><strong>Usar nodos cuando</strong>:</p>
<ul>
<li>El elemento tiene identidad propia, hay que buscar por él o tiene relaciones con otros elementos</li>
<li>Ejemplo: Usuario, Producto, Ciudad</li>
</ul>
<p><strong>Usar propiedades cuando</strong>:</p>
<ul>
<li>Son atributos simples del nodo, sin búsquedas frecuentes ni relaciones propias</li>
<li>Ejemplo: nombre, edad, precio, fecha</li>
</ul>
<p><strong>Ejemplo</strong>: ciudad como nodo si se necesita «todas las personas en Madrid»; como propiedad si sólo se guarda el lugar de nacimiento sin más consultas.</p>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="62" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" data-marpit-pagination="62" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="relaciones-vs-propiedades">Relaciones vs. propiedades</h1>
<p><strong>Usar relaciones cuando</strong>: conectan dos entidades, la conexión tiene semántica importante, hay que navegarla, o puede tener propiedades (peso, fecha, tipo)</p>
<p><strong>Usar propiedades cuando</strong>: el valor es un dato simple del nodo, sin necesidad de navegación</p>
<p><strong>Ejemplo</strong>: «Trabaja en» como relación si se quiere «empleados de la empresa X»; como propiedad si sólo se guarda el nombre, sin navegación.</p>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="63" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-class="code" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" class="code" data-marpit-pagination="63" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--class:code;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="modelado-de-relaciones-n-arias">Modelado de relaciones n-arias</h1>
<ul>
<li>Neo4j sólo soporta relaciones binarias (entre dos nodos)</li>
<li>Para relaciones ternarias o n-arias: <strong>usar nodo intermedio</strong></li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">// Mal diseño: no se puede representar directamente
(Actor)-[:ACTUA_EN {rol: 'Batman'}]-&gt;(Pelicula)

// Buen diseño: nodo intermedio
(Actor)-[:ACTUO]-&gt;(Actuacion)-[:EN_PELICULA]-&gt;(Pelicula)
// Actuacion tiene propiedades: rol, año, caché
</code></pre>
<p>Ventaja: podemos añadir más información a la actuación.</p>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="64" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-class="code" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" class="code" data-marpit-pagination="64" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--class:code;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="modelado-temporal-time-tree-pattern">Modelado temporal: <em>Time-Tree Pattern</em></h1>
<p>Para eventos temporales, crear un árbol de tiempo permite consultas eficientes por rangos de fechas:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">// Estructura: Year -&gt; Month -&gt; Day
(y:Year {valor: 2025})-[:HAS_MONTH]-&gt;(m:Month {valor: 11})-[:HAS_DAY]-&gt;(d:Day {valor: 10})

// Eventos conectados a días
(evento:Evento)-[:OCURRIO_EN]-&gt;(d)

// Consulta: eventos en noviembre 2025
MATCH (y:Year {valor: 2025})-[:HAS_MONTH]-&gt;(m:Month {valor: 11})
       -[:HAS_DAY]-&gt;(d:Day {valor: 10}),
      (evento:Evento)-[:OCURRIO_EN]-&gt;(d)
RETURN evento
</code></pre>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="65" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" data-marpit-pagination="65" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="fan-out-y-fan-in"><em>Fan-out</em> y <em>fan-in</em></h1>
<ul>
<li><strong>Fan-out</strong>: un nodo con muchas relaciones salientes (p. ej. usuario con miles de posts) — puede ser lento al cargar el nodo</li>
<li><strong>Fan-in</strong>: un nodo con muchas relaciones entrantes (p. ej. <em>tag</em> popular en miles de posts) — problema de rendimiento similar</li>
<li><strong>Solución</strong>: usar nodos intermedios o diferentes tipos de relaciones
<ul>
<li>Agrupar por fecha, categoría, etc.</li>
<li>Ejemplo: Usuario → Año → Mes → Posts</li>
</ul>
</li>
</ul>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="66" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-class="section-divider" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" class="section-divider" data-marpit-pagination="66" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--class:section-divider;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="algoritmos-de-grafos">Algoritmos de grafos</h1>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="67" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" data-marpit-pagination="67" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="graph-data-science-library-gds">Graph Data Science Library (GDS)</h1>
<ul>
<li>Librería de Neo4j para algoritmos de grafos avanzados; se instala como <em>plugin</em> separado</li>
<li>Tres categorías principales:
<ol>
<li><strong>Pathfinding</strong>: encontrar caminos y rutas óptimas</li>
<li><strong>Centralidad</strong>: identificar nodos importantes</li>
<li><strong>Detección de comunidades</strong>: encontrar grupos conectados</li>
<li><strong>Similitud</strong>: encontrar nodos similares</li>
</ol>
</li>
<li>Operación típica: crear proyección del grafo en memoria, ejecutar el algoritmo, y escribir o analizar los resultados</li>
</ul>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="68" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" data-marpit-pagination="68" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="pathfinding-shortest-path">Pathfinding: <em>shortest path</em></h1>
<p>Camino más corto entre dos nodos:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">MATCH p = shortestPath(
  (a:Ciudad {nombre: 'Madrid'})-[*]-(b:Ciudad {nombre: 'Barcelona'})
)
RETURN p, length(p)
</code></pre>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="69" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" data-marpit-pagination="69" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="pathfinding-dijkstra">Pathfinding: Dijkstra</h1>
<p>Camino más corto con pesos:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">MATCH (a:Ciudad {nombre: 'Madrid'}), (b:Ciudad {nombre: 'Barcelona'})
CALL gds.shortestPath.dijkstra.stream({
  sourceNode: a, targetNode: b,
  relationshipWeightProperty: 'distancia'
})
YIELD path, totalCost
RETURN path, totalCost
</code></pre>
<ul>
<li><strong>A</strong>*: camino con heurística (más rápido)</li>
<li><strong>All Shortest Paths</strong>: todos los caminos más cortos</li>
</ul>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="70" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" data-marpit-pagination="70" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="algoritmos-de-centralidad">Algoritmos de centralidad</h1>
<p><strong>PageRank</strong>: importancia basada en conexiones — original de Google, identifica nodos influyentes.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">CALL gds.pageRank.stream({
  nodeProjection: 'User',
  relationshipProjection: 'FOLLOWS'
})
YIELD nodeId, score
RETURN gds.util.asNode(nodeId).nombre AS usuario, score
ORDER BY score DESC LIMIT 10
</code></pre>
<ul>
<li><strong>Betweenness Centrality</strong>: nodos que actúan como puentes</li>
<li><strong>Closeness Centrality</strong>: nodos más cerca del resto</li>
<li><strong>Degree Centrality</strong>: basado en número de conexiones</li>
</ul>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="71" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" data-marpit-pagination="71" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="algoritmos-de-comunidades">Algoritmos de comunidades</h1>
<p><strong>Louvain</strong>: detecta comunidades optimizando modularidad.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">CALL gds.louvain.stream({
  nodeProjection: 'User',
  relationshipProjection: 'FRIENDS_WITH'
})
YIELD nodeId, communityId
RETURN communityId, count(*) AS size
ORDER BY size DESC
</code></pre>
<ul>
<li><strong>Label Propagation</strong>: propagación de etiquetas para comunidades</li>
<li><strong>Weakly Connected Components</strong>: componentes conectados</li>
<li><strong>Triangle Count</strong>: detecta <em>clustering</em></li>
</ul>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="72" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" data-marpit-pagination="72" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="algoritmos-de-similitud">Algoritmos de similitud</h1>
<p><strong>Node Similarity</strong>: nodos con vecinos similares.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">CALL gds.nodeSimilarity.stream({
  nodeProjection: 'User',
  relationshipProjection: 'LIKES'
})
YIELD node1, node2, similarity
WHERE similarity &gt; 0.5
RETURN gds.util.asNode(node1).nombre,
       gds.util.asNode(node2).nombre,
       similarity
</code></pre>
<ul>
<li><strong>Jaccard Similarity</strong>: basado en intersección de vecinos</li>
<li><strong>Cosine Similarity</strong>: para vectores de propiedades — útil para sistemas de recomendación</li>
</ul>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="73" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-class="section-divider" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" class="section-divider" data-marpit-pagination="73" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--class:section-divider;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="rendimiento-y-buenas-pr%C3%A1cticas">Rendimiento y buenas prácticas</h1>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="74" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" data-marpit-pagination="74" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="evitar-productos-cartesianos">Evitar productos cartesianos</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">// MAL - Cartesian product
MATCH (u:User), (p:Post)
WHERE u.id = p.userId
RETURN u, p

// BIEN - Usar relaciones
MATCH (u:User)-[:WROTE]-&gt;(p:Post)
RETURN u, p
</code></pre>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="75" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" data-marpit-pagination="75" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="usar-%C3%ADndices">Usar índices</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">// Crear índice primero
CREATE INDEX user_email IF NOT EXISTS
FOR (u:User) ON (u.email);

// Consulta aprovecha el índice
MATCH (u:User {email: 'user@example.com'})
RETURN u
</code></pre>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="76" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" data-marpit-pagination="76" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="usar-par%C3%A1metros">Usar parámetros</h1>
<p>Para reutilización de planes:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">// Sin parámetros - nuevo plan cada vez
MATCH (u:User {email: 'user1@example.com'}) RETURN u
MATCH (u:User {email: 'user2@example.com'}) RETURN u

// Con parámetros - plan reutilizado
MATCH (u:User {email: $email}) RETURN u
</code></pre>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="77" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-class="code" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" class="code" data-marpit-pagination="77" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--class:code;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="limitar-temprano">Limitar temprano</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">// Limitar después de procesar todo
MATCH (u:User)-[:WROTE]-&gt;(p:Post)
RETURN u, count(p) AS posts
ORDER BY posts DESC
LIMIT 10

// Mejor: limitar antes si es posible
MATCH (u:User)
WITH u LIMIT 1000
MATCH (u)-[:WROTE]-&gt;(p:Post)
RETURN u, count(p) AS posts
</code></pre>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="78" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" data-marpit-pagination="78" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="analizar-rendimiento-explain">Analizar rendimiento: <code>EXPLAIN</code></h1>
<p>Muestra el plan de ejecución sin ejecutar:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cypher">EXPLAIN
MATCH (u:User {email: $email})-[:WROTE]-&gt;(p:Post)
RETURN u, p
</code></pre>
<p>Útil para ver si usa índices.</p>
<footer>BDGE · Sesión 6 · Curso 2026/2027</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="79" data-paginate="true" data-footer="BDGE · Sesión 6 · Curso 2026/2027" data-lang="es" data-theme="0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk" lang="es" data-marpit-pagination="79" style="--paginate:true;--footer:BDGE · Sesión 6 · Curso 2026/2027;--lang:es;--theme:0zpohnx1ucs8yv7oeiuo8jhgy0e66h826ozozmg34fk;" data-marpit-pagination-total="102" data-size="16:9">
<h1 id="analizar-rendimiento-profile">Analizar rendimiento: <code>PROFILE</code></h1>
<p>Ejecuta y muestra estadísticas detalladas:</p>
