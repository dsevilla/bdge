# Docker Compose configuration for Jupyter Notebook and MySQL

services:

  notebook:
    image: "quay.io/jupyter/scipy-notebook:latest"
    ports:
      - "8888:8888"
    user: root
    volumes:
      - ..:/home/jovyan/work/bdge
    environment:
      - JUPYTER_TOKEN=bdge
      - GRANT_SUDO=yes
      - DB_HOSTNAME=mysql
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8
    ports:
      - 3306:3306
    environment:
      - MYSQL_ROOT_PASSWORD=root
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 20s
      start_period: 60s
      start_interval: 10s
      timeout: 5s
      retries: 20
