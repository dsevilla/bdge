# Docker Compose configuration for Jupyter Notebook and MySQL

services:

  notebook:
    image: "quay.io/jupyter/scipy-notebook:latest"
    ports:
      - "8888:8888"
    user: root
    volumes:
      - ..:/home/jovyan/work/bdge
    environment:
      - JUPYTER_TOKEN=bdge
      - GRANT_SUDO=yes
      - DB_HOSTNAME=mysql
      # Se comprime el tráfico con `mysql` aunque esté en la misma máquina, en la red
      # virtual de Compose, para usar la misma configuración que con un servidor
      # remoto (aquí no hay enlace lento, así que sólo cuesta algo de CPU).
      - DB_COMPRESS=1
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8
    ports:
      - 3306:3306
    environment:
      - MYSQL_ROOT_PASSWORD=root
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      start_period: 30s
      timeout: 5s
      retries: 30
